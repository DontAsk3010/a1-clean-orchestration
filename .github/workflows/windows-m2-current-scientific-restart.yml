name: Windows Machine2 CURRENT Scientific Restart

on:
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/windows-m2-current-scientific-restart.yml'
      - 'v32-full-observation-behavior-requests/current.json'
      - 'governance/a1-clean-active-authority-lock.json'
      - 'governance/a1-clean-authority-bootstrap-current.json'
      - 'src/a1clean/formula_research/m2_current_execution_contract.py'
      - 'src/a1clean/formula_research/v32_current_scientific_restart.py'
      - 'src/a1clean/formula_research/machine2_current_store.py'
      - 'src/a1clean/formula_research/v32_dynamic_prestart.py'
      - 'src/a1clean/formula_research/source_universe_semantic_date_reconcile.py'
      - 'src/a1clean/pattern_discovery/source_reader.py'
      - 'tests/test_v32_current_scientific_restart.py'
      - 'tests/test_source_universe_semantic_date_reconcile.py'
      - 'tests/test_v32_dynamic_prestart.py'
      - 'tests/test_authority_bootstrap.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1-machine2-current-scientific-restart
  cancel-in-progress: false

jobs:
  restart:
    name: Machine2 CURRENT restart candidate ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B]
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 720
    env:
      PSExecutionPolicyPreference: Bypass
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 32

      - name: Route exact Machine2 runner
        id: route
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne 'PORSCHE-DESIGN') { throw "M2_CURRENT_WRONG_MACHINE:$env:COMPUTERNAME" }
          "runner_seen=$env:RUNNER_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:RUNNER_NAME -eq 'A1-WINDOWS-COMPUTE-02') {
            'is_target=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'M2_CURRENT_EXACT_RUNNER_PASS'
          } else {
            'is_target=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "M2_CURRENT_NON_TARGET_LANE_HOLD:$env:RUNNER_NAME"
            Start-Sleep -Seconds 120
          }

      - name: Hold heavy execution until request explicitly opens CURRENT restart
        id: gate
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Get-Content -LiteralPath 'v32-full-observation-behavior-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $open = ($r.enabled -eq $true -and $r.restart_authorized -eq $true)
          "open=$($open.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if (-not $open) {
            Write-Host 'M2_CURRENT_HEAVY_HOLD_REQUEST_DISABLED'
          } else {
            Write-Host 'M2_CURRENT_HEAVY_REQUEST_OPEN'
          }

      - name: Provision portable Python 3.11
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $pyRoot = Join-Path $env:RUNNER_TEMP 'a1-python-3.11.9'
          $zip = Join-Path $env:RUNNER_TEMP 'python-3.11.9-embed-amd64.zip'
          $getPip = Join-Path $env:RUNNER_TEMP 'get-pip.py'
          if (-not (Test-Path -LiteralPath (Join-Path $pyRoot 'python.exe') -PathType Leaf)) {
            Remove-Item -LiteralPath $pyRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $pyRoot | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $pyRoot -Force
            $pth = Join-Path $pyRoot 'python311._pth'
            (Get-Content -LiteralPath $pth -Raw).Replace('#import site','import site') | Set-Content -LiteralPath $pth -Encoding ascii
            Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
            & (Join-Path $pyRoot 'python.exe') $getPip --no-warn-script-location
            if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_PIP_BOOTSTRAP_FAILED' }
          }
          $py = Join-Path $pyRoot 'python.exe'
          & $py --version
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_PYTHON_UNAVAILABLE' }
          "A1_PYTHON_EXE=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and run CURRENT restart contract tests
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_INSTALL_FAILED' }
          & $env:A1_PYTHON_EXE -m pytest -q `
            tests/test_authority_bootstrap.py `
            tests/test_source_universe_manifest.py `
            tests/test_source_universe_semantic_date_reconcile.py `
            tests/test_v32_dynamic_prestart.py `
            tests/test_v32_current_scientific_restart.py
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_CONTRACT_TEST_FAILED' }

      - name: Validate CURRENT atomic restart execution contract
        if: ${{ steps.route.outputs.is_target == 'true' && steps.gate.outputs.open == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          import json
          from a1clean.formula_research.m2_current_execution_contract import (
              assert_safe_atomic_units_per_shard,
              validate_request_for_current_atomic_restart,
          )
          with open('v32-full-observation-behavior-requests/current.json', encoding='utf-8') as fh:
              request = json.load(fh)
          validate_request_for_current_atomic_restart(request)
          assert_safe_atomic_units_per_shard(1)
          print('M2_CURRENT_ATOMIC_EXECUTION_CONTRACT_PASS')
          '@
          $script | & $env:A1_PYTHON_EXE -
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_ATOMIC_EXECUTION_CONTRACT_HOLD' }

      - name: Fresh-read complete authority and discover live source universe
        if: ${{ steps.route.outputs.is_target == 'true' && steps.gate.outputs.open == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:A1_DRIVE_READER_CREDENTIALS)) { throw 'M2_CURRENT_READER_CREDENTIALS_NOT_CONFIGURED' }
          if ([string]::IsNullOrWhiteSpace($env:A1_DRIVE_WRITER_CREDENTIALS)) { throw 'M2_CURRENT_WRITER_CREDENTIALS_NOT_CONFIGURED' }
          if (-not (Test-Path -LiteralPath $env:A1_DRIVE_READER_CREDENTIALS -PathType Leaf)) { throw 'M2_CURRENT_READER_CREDENTIALS_FILE_MISSING' }
          if (-not (Test-Path -LiteralPath $env:A1_DRIVE_WRITER_CREDENTIALS -PathType Leaf)) { throw 'M2_CURRENT_WRITER_CREDENTIALS_FILE_MISSING' }
          $manifest = Join-Path $env:RUNNER_TEMP 'm2-current-source-universe.json'
          $proof = Join-Path $env:RUNNER_TEMP 'm2-current-authority-sync.json'
          $stamp = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.source_universe_drive_preflight `
            --authority-lock governance/a1-clean-active-authority-lock.json `
            --authority-bootstrap governance/a1-clean-authority-bootstrap-current.json `
            --authority-sync-proof $proof `
            --output $manifest `
            --discovery-time-utc $stamp
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_AUTHORITY_OR_SOURCE_UNIVERSE_HOLD' }
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.source_universe_semantic_date_reconcile `
            --manifest $manifest `
            --output $manifest
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_SEMANTIC_DATE_ENVELOPE_RECONCILIATION_HOLD' }
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.v32_dynamic_prestart `
            --request v32-full-observation-behavior-requests/current.json `
            --authority-lock governance/a1-clean-active-authority-lock.json `
            --source-universe-manifest $manifest `
            --require-enabled
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_PRESTART_HOLD' }
          "A1_M2_SOURCE_UNIVERSE_MANIFEST=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_M2_AUTHORITY_SYNC_PROOF=$proof" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve earliest governed source and actual first trading date
        if: ${{ steps.route.outputs.is_target == 'true' && steps.gate.outputs.open == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          import json, os
          from a1clean.google_drive import build_drive_api
          from a1clean.pattern_discovery.source_reader import GovernedSourceReader
          p = os.environ['A1_M2_SOURCE_UNIVERSE_MANIFEST']
          m = json.load(open(p, encoding='utf-8'))
          if m.get('status') != 'PASS' or not m.get('sources'):
              raise SystemExit('M2_CURRENT_SOURCE_UNIVERSE_NOT_PASS')
          reconciliation = m.get('semantic_date_envelope_reconciliation') or {}
          if reconciliation.get('status') != 'PASS':
              raise SystemExit('M2_CURRENT_SEMANTIC_DATE_RECONCILIATION_NOT_PASS')
          source = m['sources'][0]['source_name']
          reader = GovernedSourceReader(build_drive_api(read_write=False), source_name=source)
          if not reader.semantic_manifest_rows:
              raise SystemExit('M2_CURRENT_FIRST_SOURCE_MANIFEST_EMPTY')
          first = reader.semantic_manifest_rows[0]
          if str(m['sources'][0].get('first_date')) != str(first.trading_date):
              raise SystemExit('M2_CURRENT_FIRST_SOURCE_DATE_RECONCILIATION_DRIFT')
          print(source)
          print(first.trading_date)
          print(first.ticker)
          print(first.source_row_first)
          print(first.source_row_last)
          print(first.first_clock_time)
          print(first.last_clock_time)
          '@
          $lines = $script | & $env:A1_PYTHON_EXE -
          if ($LASTEXITCODE -ne 0 -or $lines.Count -lt 7) { throw 'M2_CURRENT_FIRST_UNIT_RESOLUTION_FAILED' }
          "A1_M2_FIRST_SOURCE=$($lines[0])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_M2_FIRST_DATE=$($lines[1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_M2_FIRST_TICKER=$($lines[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "M2_CURRENT_FIRST_UNIT|source=$($lines[0])|date=$($lines[1])|ticker=$($lines[2])|rows=$($lines[3])-$($lines[4])|time=$($lines[5])-$($lines[6])"

      - name: Execute first CURRENT trading date from beginning with progressive checkpointing
        if: ${{ steps.route.outputs.is_target == 'true' && steps.gate.outputs.open == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.v32_current_scientific_restart `
            --request v32-full-observation-behavior-requests/current.json `
            --source-universe-manifest $env:A1_M2_SOURCE_UNIVERSE_MANIFEST `
            --trading-date $env:A1_M2_FIRST_DATE `
            --units-per-shard 1 `
            --software-revision $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_FIRST_DATE_EXECUTION_HOLD' }

      - name: Exact CURRENT checkpoint readback
        if: ${{ steps.route.outputs.is_target == 'true' && steps.gate.outputs.open == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          from a1clean.google_drive import build_drive_api
          from a1clean.formula_research.machine2_current_store import Machine2CurrentStore
          from a1clean.formula_research.m2_current_execution_contract import validate_checkpoint_exact_resume
          from a1clean.formula_research.v32_current_scientific_restart import CHECKPOINT_NAME, LINEAGE
          s = Machine2CurrentStore(build_drive_api(read_write=True))
          cp = s.read_json_optional(s.checkpoint_folder_id, CHECKPOINT_NAME)
          if not cp:
              raise SystemExit('M2_CURRENT_CHECKPOINT_MISSING')
          assert cp['lineage'] == LINEAGE
          assert cp['status'] == 'DATE_CLOSED'
          assert cp['old_pass_completion_inherited'] is False
          assert cp['old_scientific_checkpoint_read_for_completion'] is False
          assert cp['completed_units_in_current_date'] > 0
          assert cp['completed_source_rows_in_current_date'] > 0
          assert cp['next_exact_resume_point'] is None
          assert cp.get('date_close')
          validate_checkpoint_exact_resume(cp)
          shards = list(cp.get('output_shards') or [])
          assert shards
          assert all(int(row.get('packet_count') or 0) == 1 for row in shards)
          assert all(int(row['selection_position_first']) == int(row['selection_position_last']) for row in shards)
          print('M2_CURRENT_DATE_CLOSE_READBACK_PASS')
          print(cp['current_date'])
          print(cp['completed_units_in_current_date'])
          print(cp['completed_source_rows_in_current_date'])
          '@
          $script | & $env:A1_PYTHON_EXE -
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_CHECKPOINT_READBACK_HOLD' }

      - name: Confirm no automatic next-date advance
        if: ${{ steps.route.outputs.is_target == 'true' && steps.gate.outputs.open == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Write-Host 'M2_CURRENT_STOP_AT_DATE_CLOSE|auto_advance=false|formula=CLOSED|grouping=HOLD'
