name: Machine1 Date03 Prefix Reaudit Batch008-017 Evidence
on:
  push:
    branches: [machine1/evidence-kbatch-20241203]
    paths: [.github/workflows/machine1-date03-prefix-reaudit-batch008-017-evidence.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\\TRADING SYSTEM\\02_CURRENT_HISTORICAL_RAW_DATA_UJI\\Raw Des 02-31-2024.csv'
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact Date03 source rows for prefix reaudit 008-017
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'
          $raw=[System.IO.Path]::GetFullPath($env:RAW_FILE)
          $expected='5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          $specs=@(
            [pscustomobject]@{Index=8;Ticker='ADES';First=20625;Last=20670;Count=46},
            [pscustomobject]@{Index=9;Ticker='ADHI';First=23194;Last=23372;Count=179},
            [pscustomobject]@{Index=10;Ticker='ADMF';First=21301;Last=21322;Count=22},
            [pscustomobject]@{Index=11;Ticker='ADMG';First=22581;Last=22597;Count=17},
            [pscustomobject]@{Index=12;Ticker='ADMR';First=26813;Last=27123;Count=311},
            [pscustomobject]@{Index=13;Ticker='ADRO';First=32592;Last=32927;Count=336},
            [pscustomobject]@{Index=14;Ticker='AEGS';First=38440;Last=38542;Count=103},
            [pscustomobject]@{Index=15;Ticker='AGAR';First=39430;Last=39447;Count=18},
            [pscustomobject]@{Index=16;Ticker='AGII';First=40157;Last=40175;Count=19},
            [pscustomobject]@{Index=17;Ticker='AGRO';First=42684;Last=42875;Count=192}
          )
          if(-not(Test-Path -LiteralPath $raw -PathType Leaf)){throw 'RAW_MISSING'}
          $got=(Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant();if($got-ne$expected){throw "RAW_HASH_MISMATCH $got"}
          $header=$null;$captures=@{};foreach($s in $specs){$captures[$s.Ticker]=New-Object 'System.Collections.Generic.List[string]'}
          $maxLast=($specs|Measure-Object Last -Maximum).Maximum;$i=0
          foreach($line in [System.IO.File]::ReadLines($raw,[System.Text.Encoding]::UTF8)){if($i-eq0){$header=$line};foreach($s in $specs){if($i-ge$s.First-and$i-le$s.Last){[void]$captures[$s.Ticker].Add($line)}};if($i-ge$maxLast){break};$i++}
          $out=Join-Path $PWD 'machine1_date03_prefix_reaudit_batch008_017';New-Item -ItemType Directory -Force $out|Out-Null;$enc=New-Object System.Text.UTF8Encoding($false)
          foreach($s in $specs){$lines=$captures[$s.Ticker];if($lines.Count-ne$s.Count){throw "$($s.Ticker)_COUNT got=$($lines.Count) expected=$($s.Count)"};$parsed=@((@($header)+@($lines))|ConvertFrom-Csv);if($parsed.Count-ne$s.Count){throw "$($s.Ticker)_PARSE"};$records=@();for($n=0;$n-lt$parsed.Count;$n++){$o=[ordered]@{source_row=$s.First+$n};foreach($p in $parsed[$n].PSObject.Properties.Name){$o[$p]=[string]$parsed[$n].$p};$records+=[pscustomobject]$o};$ts=@($records|%{$_.RAW_TICKER}|Sort-Object -Unique);if($ts.Count-ne1-or$ts[0]-ne$s.Ticker){throw "$($s.Ticker)_TICKER"};$dts=@($records|%{[string]$_.RAW_DATETIME_ISO});if(@($dts|?{-not $_.StartsWith('2024-12-03')}).Count-gt0){throw "$($s.Ticker)_DATE"};$rp=Join-Path $out "$($s.Ticker)_20241203_ROWS.jsonl";[System.IO.File]::WriteAllLines($rp,[string[]]@($records|%{$_|ConvertTo-Json -Compress -Depth 12}),$enc);$proof=[ordered]@{audit_type='OWNER_CORRECTED_FULL_PREFIX_REAUDIT';ticker=$s.Ticker;trading_date='2024-12-03';recovered_date_local_index=$s.Index;source_name='Raw Des 02-31-2024.csv';source_sha256=$got;source_row_first=$s.First;source_row_last=$s.Last;data_rows=$records.Count;first_datetime=$dts[0];last_datetime=$dts[-1];rows_jsonl_sha256=(Get-FileHash $rp -Algorithm SHA256).Hash.ToLowerInvariant();semantic_status='TRANSPORT_ONLY_NOT_SEMANTIC_COMPLETE';formula_stage='CLOSED';date_advance='PROHIBITED'};[System.IO.File]::WriteAllText((Join-Path $out "$($s.Ticker)_20241203_PROOF.json"),($proof|ConvertTo-Json -Depth 10),$enc)}
      - name: Upload governed batch evidence
        uses: actions/upload-artifact@v4
        with: {name: machine1-date03-prefix-reaudit-batch008-017-evidence, path: machine1_date03_prefix_reaudit_batch008_017/, if-no-files-found: error, retention-days: 7}
      - name: Persist transport evidence
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          New-Item -ItemType Directory -Force '.machine1_prefix_reaudit/date03'|Out-Null;Copy-Item 'machine1_date03_prefix_reaudit_batch008_017/*' '.machine1_prefix_reaudit/date03/' -Force
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.name 'a1-clean-machine1-bot';git -c safe.directory="$env:GITHUB_WORKSPACE" config user.email 'a1-clean-machine1-bot@users.noreply.github.com';git -c safe.directory="$env:GITHUB_WORKSPACE" add -f '.machine1_prefix_reaudit/date03/*_20241203_ROWS.jsonl' '.machine1_prefix_reaudit/date03/*_20241203_PROOF.json';git -c safe.directory="$env:GITHUB_WORKSPACE" commit -m 'Persist governed Date03 prefix reaudit evidence batch 008-017 [skip ci]';git -c safe.directory="$env:GITHUB_WORKSPACE" push origin HEAD:machine1/evidence-kbatch-20241203
