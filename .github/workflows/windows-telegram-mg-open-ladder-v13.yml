name: Windows Telegram MG Open Ladder V13

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - telegram-mg-open-ladder-v13-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-windows-telegram-mg-open-ladder-v13
  cancel-in-progress: true

jobs:
  study:
    name: Run V13 open-extreme and continuation-ladder study
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 180
    steps:
      - name: Checkout exact research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'telegram-mg-open-ladder-v13-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_TELEGRAM_MG_OPEN_LADDER_V13_REQUEST_V1') { throw 'Unsupported V13 request schema.' }
          if ($req.enabled -ne $true) { throw 'V13 request not enabled.' }
          $json = $req | ConvertTo-Json -Compress -Depth 20
          "A1_MG_V13_REQUEST_JSON=$json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Drive reader binding
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:A1_DRIVE_READER_CREDENTIALS) -or -not (Test-Path -LiteralPath $env:A1_DRIVE_READER_CREDENTIALS -PathType Leaf)) { throw 'Drive reader binding missing.' }

      - name: Install and compile V13
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'MG_V13_INSTALL_FAILED' }
          py -3.11 -m py_compile src/a1clean/formula_research/telegram_mg_open_ladder_v13.py
          if ($LASTEXITCODE -ne 0) { throw 'MG_V13_COMPILE_FAILED' }

      - name: Run V13 from durable cache only
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = $env:A1_MG_V13_REQUEST_JSON | ConvertFrom-Json
          & py -3.11 -m a1clean.formula_research.telegram_mg_open_ladder_v13 `
            --output 'telegram-mg-open-ladder-v13-result.json' `
            --prior-days ([string][int]$req.prior_days)
          if ($LASTEXITCODE -ne 0) { throw "MG_V13_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Upload V13 artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mg-open-ladder-v13-${{ github.run_id }}
          path: telegram-mg-open-ladder-v13-result.json
          if-no-files-found: error
          retention-days: 30
