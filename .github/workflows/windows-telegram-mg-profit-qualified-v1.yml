name: Windows Telegram MG Profit Qualified V1

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - telegram-mg-profit-qualified-v1-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-windows-telegram-mg-profit-qualified-v1
  cancel-in-progress: false

jobs:
  proof:
    name: Full-universe MG profit-qualified proof
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 720
    steps:
      - name: Checkout exact formula research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.ref_name }}' -ne 'formula/current-clean-research-v1') { throw 'MG profit qualified workflow is branch-restricted.' }
          $req = Get-Content -LiteralPath 'telegram-mg-profit-qualified-v1-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_TELEGRAM_MG_PROFIT_QUALIFIED_REQUEST_V1') { throw 'Unsupported request schema.' }
          if ($req.enabled -ne $true) { throw 'Request not enabled.' }
          if ($req.authorization_phrase -ne 'AUTHORIZE_MG_PROFIT_QUALIFIED_FULL_UNIVERSE_PROOF') { throw 'Exact authorization phrase required.' }
          if ($req.drive_output_folder_id -ne '1uQKSZD8KbOZ2j3moyZiH1EuJPlEhEAuC') { throw 'Unexpected Formula Research output folder.' }
          if ($req.source_names.Count -lt 2) { throw 'Prior and target sources required.' }
          $json = $req | ConvertTo-Json -Compress -Depth 20
          "A1_MG_PROFIT_REQUEST_JSON=$json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Drive credential bindings
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:A1_DRIVE_READER_CREDENTIALS, $env:A1_DRIVE_WRITER_CREDENTIALS)) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Drive credential binding missing.' }
          }

      - name: Install and test exact proof code
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'MG_PROFIT_INSTALL_FAILED' }
          py -3.11 -m compileall -q src tests
          if ($LASTEXITCODE -ne 0) { throw 'MG_PROFIT_COMPILE_FAILED' }
          py -3.11 -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'MG_PROFIT_TESTS_FAILED' }

      - name: Run full-universe profit-qualified replay
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = $env:A1_MG_PROFIT_REQUEST_JSON | ConvertFrom-Json
          $argsList = @(
            '-3.11', '-m', 'a1clean.formula_research.telegram_mg_profit_qualified_v1',
            '--trading-date', [string]$req.trading_date,
            '--request-id', [string]$req.request_id,
            '--software-revision', '${{ github.sha }}',
            '--drive-output-folder-id', [string]$req.drive_output_folder_id,
            '--output', 'telegram-mg-profit-qualified-v1-result.json',
            '--capital-per-entry', [string][double]$req.execution.capital_per_entry,
            '--buy-fee-pct', [string][double]$req.execution.buy_fee_pct,
            '--sell-fee-pct', [string][double]$req.execution.sell_fee_pct,
            '--tp1-quantile', [string][double]$req.targets.tp1_quantile,
            '--tp2-quantile', [string][double]$req.targets.tp2_quantile,
            '--effort-lookback', [string][int]$req.params.effort_lookback,
            '--progress-lookback', [string][int]$req.params.progress_lookback,
            '--high-lookback', [string][int]$req.params.high_lookback,
            '--recovery-lookback', [string][int]$req.params.recovery_lookback,
            '--low-stabilization-bars', [string][int]$req.params.low_stabilization_bars,
            '--early-checkpoint-bar', [string][int]$req.params.early_checkpoint_bar,
            '--late-lift-min-bar', [string][int]$req.params.late_lift_min_bar
          )
          foreach ($source in $req.source_names) {
            $argsList += @('--source-name', [string]$source)
          }
          & py @argsList
          if ($LASTEXITCODE -ne 0) { throw "MG_PROFIT_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mg-profit-qualified-v1-${{ github.run_id }}
          path: telegram-mg-profit-qualified-v1-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Safety declaration
        if: always()
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          "### MG Profit Qualified V1" >> $env:GITHUB_STEP_SUMMARY
          "- Full eligible target-date universe is scanned." >> $env:GITHUB_STEP_SUMMARY
          "- Target calibration uses strictly prior trading dates only." >> $env:GITHUB_STEP_SUMMARY
          "- Signal state is causal; target-date future bars are outcome audit only." >> $env:GITHUB_STEP_SUMMARY
          "- Historical HAKA/HAKI are explicit price-step proxies because BBO/order-book is not present in the historical RAW." >> $env:GITHUB_STEP_SUMMARY
          "- Result remains RESEARCH_CANDIDATE_NOT_CANONICAL." >> $env:GITHUB_STEP_SUMMARY
