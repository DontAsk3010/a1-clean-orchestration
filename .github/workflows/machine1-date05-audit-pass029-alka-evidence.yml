name: Machine1 Date05 Resolve Exact PASS030 Locator

on:
  workflow_dispatch:
  push:
    branches: [machine1/date05-audit-pass029-alka-evidence]
    paths: [.github/workflows/machine1-date05-audit-pass029-alka-evidence.yml]

permissions:
  contents: read

jobs:
  resolve:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI\Raw Des 02-31-2024.csv'
    steps:
      - uses: actions/checkout@v4
      - name: Resolve first complete ticker context after PASS029 ALKA
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'
          $raw=[System.IO.Path]::GetFullPath($env:RAW_FILE)
          $expectedSha='5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          $sha=(Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne $expectedSha){throw "RAW_SHA256_MISMATCH got=$sha"}
          $header=$null; $lines=New-Object 'System.Collections.Generic.List[string]'; [int64]$idx=0; [int64]$start=60426; [int64]$limit=61000
          foreach($line in [System.IO.File]::ReadLines($raw,[System.Text.Encoding]::UTF8)){
            if($idx -eq 0){$header=$line}
            if($idx -ge $start -and $idx -le $limit){[void]$lines.Add($line)}
            if($idx -gt $limit){break}
            $idx++
          }
          $parsed=@((@($header)+@($lines))|ConvertFrom-Csv)
          if($parsed.Count -lt 1){throw 'NO_ROWS_AFTER_ALKA'}
          $ticker=[string]$parsed[0].RAW_TICKER
          $date=[string]$parsed[0].RAW_DATETIME_ISO
          if(-not $date.StartsWith('2024-12-05')){throw "NEXT_ROW_NOT_DATE05 got=$date"}
          $count=0; $last=-1
          foreach($r in $parsed){if(([string]$r.RAW_TICKER) -eq $ticker -and ([string]$r.RAW_DATETIME_ISO).StartsWith('2024-12-05')){$count++;$last=$start+$count-1}else{break}}
          if($count -le 0){throw 'NEXT_CONTEXT_EMPTY'}
          $firstTime=[string]$parsed[0].RAW_DATETIME_ISO
          $lastTime=[string]$parsed[$count-1].RAW_DATETIME_ISO
          $nextRowTicker=if($count -lt $parsed.Count){[string]$parsed[$count].RAW_TICKER}else{'UNKNOWN_SCAN_LIMIT'}
          Write-Host "PASS030_LOCATOR ticker=$ticker source_rows=$start-$last actual_rows=$count first=$firstTime last=$lastTime next_ticker=$nextRowTicker source_sha=$sha"
