name: Machine1 After BSIM Evidence Extract

on:
  push:
    branches:
      - machine1/evidence-bbss-20241203

permissions:
  contents: read

jobs:
  extract-after-bsim:
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI\Raw Des 02-31-2024.csv'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract exact governed ticker packets after BSIM
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import csv, hashlib, json, os, pathlib

          raw = pathlib.Path(os.environ['RAW_FILE'])
          trading_date = '2024-12-03'
          anchor = 'BSIM'
          take = 20
          expected_md5 = 'b8d42b35c90d2dff8b18ae4e1734523b'
          expected_sha256 = '5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'

          if not raw.is_file():
              raise SystemExit(f'RAW_MISSING: {raw}')

          md5 = hashlib.md5(); sha256 = hashlib.sha256()
          with raw.open('rb') as f:
              for chunk in iter(lambda: f.read(8*1024*1024), b''):
                  md5.update(chunk); sha256.update(chunk)
          got_md5, got_sha256 = md5.hexdigest(), sha256.hexdigest()
          if got_md5 != expected_md5 or got_sha256 != expected_sha256:
              raise SystemExit(f'RAW_HASH_MISMATCH md5={got_md5} sha256={got_sha256}')

          hits = {}
          with raw.open('r', encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              for source_row, row in enumerate(reader, start=1):
                  dt = row.get('RAW_DATETIME_ISO', '')
                  if not dt.startswith(trading_date):
                      continue
                  ticker = row.get('RAW_TICKER')
                  if not ticker:
                      continue
                  hits.setdefault(ticker, []).append((source_row, row))

          tickers = sorted(hits)
          if anchor not in tickers:
              raise SystemExit(f'ANCHOR_MISSING: {anchor}')
          i = tickers.index(anchor)
          selected = tickers[i+1:i+1+take]
          if not selected:
              raise SystemExit('NO_TICKERS_AFTER_ANCHOR')

          out = pathlib.Path('machine1_after_bsim_evidence')
          out.mkdir(exist_ok=True)
          manifest = []
          for offset, ticker in enumerate(selected, start=1):
              arr = hits[ticker]
              rows = [n for n,_ in arr]
              first_dt = arr[0][1]['RAW_DATETIME_ISO']
              last_dt = arr[-1][1]['RAW_DATETIME_ISO']
              packet = {
                  'source_name': raw.name,
                  'source_md5': got_md5,
                  'source_sha256': got_sha256,
                  'ticker': ticker,
                  'trading_date': trading_date,
                  'semantic_bundle': 'Raw Des 02-31-2024__SEMANTIC_0006.jsonl',
                  'bundle_line_number': 49 + offset,
                  'source_row_first': rows[0],
                  'source_row_last': rows[-1],
                  'data_rows': len(arr),
                  'first_datetime': first_dt,
                  'last_datetime': last_dt,
                  'header_fields': list(arr[0][1].keys()),
                  'rows': [{'source_row': n, **r} for n,r in arr],
              }
              (out / f'{ticker}_20241203_PACKET.json').write_text(json.dumps(packet, ensure_ascii=False, indent=2), encoding='utf-8')
              with (out / f'{ticker}_20241203_ROWS.jsonl').open('w', encoding='utf-8', newline='\n') as w:
                  for n,r in arr:
                      w.write(json.dumps({'source_row': n, **r}, ensure_ascii=False, separators=(',',':')) + '\n')
              manifest.append({k: packet[k] for k in ['ticker','trading_date','semantic_bundle','bundle_line_number','source_row_first','source_row_last','data_rows','first_datetime','last_datetime']})
              print(f"NEXT_{offset:02d} ticker={ticker} line={49+offset} rows={len(arr)} source_rows={rows[0]}-{rows[-1]} first={first_dt} last={last_dt}")

          (out / 'CHUNK_MANIFEST.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'ORDER_PROOF.json').write_text(json.dumps({
              'trading_date': trading_date,
              'ticker_count': len(tickers),
              'anchor': anchor,
              'anchor_sorted_index_zero_based': i,
              'anchor_rank_one_based': i+1,
              'selected_after_anchor': selected,
              'source_md5': got_md5,
              'source_sha256': got_sha256,
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          '@ | Set-Content -LiteralPath extract_after_bsim.py -Encoding UTF8
          py -3.11 extract_after_bsim.py

      - name: Upload evidence chunk
        uses: actions/upload-artifact@v4
        with:
          name: machine1-after-bsim-20241203-evidence
          path: machine1_after_bsim_evidence/
          if-no-files-found: error
          retention-days: 7
