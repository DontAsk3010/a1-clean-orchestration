name: Windows Machine2 Local Git Admin Credential Probe

on:
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/windows-machine2-local-git-admin-credential-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1-windows-machine2-local-git-admin-credential-probe
  cancel-in-progress: true

jobs:
  probe_a:
    name: Local Git admin credential probe A
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 6
    steps:
      - name: Probe path-scoped credential only from runner 31
        if: runner.name == 'A1-WINDOWS-COMPUTE'
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        env:
          GCM_INTERACTIVE: Never
        run: |
          $ErrorActionPreference = 'Stop'
          $git = Get-Command git -ErrorAction SilentlyContinue
          if (-not $git) { throw 'M2_LOCAL_GIT_NOT_AVAILABLE' }
          $globalHelper = (& git config --global --get credential.helper 2>$null)
          $systemHelper = (& git config --system --get credential.helper 2>$null)
          $useHttpPath = (& git config --get credential.useHttpPath 2>$null)
          Write-Host ('M2_GIT_GLOBAL_HELPER=' + [bool]$globalHelper)
          Write-Host ('M2_GIT_SYSTEM_HELPER=' + [bool]$systemHelper)
          Write-Host ('M2_GIT_USE_HTTP_PATH=' + [string]$useHttpPath)
          $inFile = Join-Path $env:RUNNER_TEMP 'm2-cred-in.txt'; $outFile = Join-Path $env:RUNNER_TEMP 'm2-cred-out.txt'; $errFile = Join-Path $env:RUNNER_TEMP 'm2-cred-err.txt'
          @('protocol=https','host=github.com','path=DontAsk3010/a1-clean-orchestration','username=DontAsk3010','') | Set-Content -Path $inFile -Encoding Ascii
          try {
            $p = Start-Process -FilePath $git.Source -ArgumentList @('credential','fill') -RedirectStandardInput $inFile -RedirectStandardOutput $outFile -RedirectStandardError $errFile -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) {
              $err = Get-Content -Path $errFile -Raw -ErrorAction SilentlyContinue
              if ($err -match 'terminal prompts disabled|could not read') { Write-Host 'M2_GIT_CREDENTIAL_FAILURE_CLASS=NO_NONINTERACTIVE_STORED_CREDENTIAL' }
              elseif ($err -match 'credential') { Write-Host 'M2_GIT_CREDENTIAL_FAILURE_CLASS=CREDENTIAL_HELPER_FAILURE' }
              else { Write-Host 'M2_GIT_CREDENTIAL_FAILURE_CLASS=OTHER_NONSECRET_ERROR' }
              throw "M2_LOCAL_GIT_CREDENTIAL_FILL_FAILED:$($p.ExitCode)"
            }
            $filled = @(Get-Content -Path $outFile -ErrorAction Stop)
            $passwordLine = @($filled | Where-Object { $_ -like 'password=*' }) | Select-Object -First 1
            if (-not $passwordLine) { throw 'M2_LOCAL_GIT_CREDENTIAL_NO_PASSWORD' }
            $token = $passwordLine.Substring('password='.Length)
            if (-not $token) { throw 'M2_LOCAL_GIT_CREDENTIAL_EMPTY_PASSWORD' }
            Write-Host 'M2_LOCAL_GIT_CREDENTIAL_PRESENT=true'
            $headers = @{ Authorization = "Bearer $token"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
            try { $resp = Invoke-WebRequest -UseBasicParsing -Method Get -Uri 'https://api.github.com/repos/DontAsk3010/a1-clean-orchestration/actions/runners/32/labels' -Headers $headers; $code=[int]$resp.StatusCode }
            catch { if ($_.Exception.Response) { $code=[int]$_.Exception.Response.StatusCode } else { throw } }
            Write-Host "M2_LOCAL_GIT_RUNNER_LABEL_ADMIN_READ_HTTP=$code"
            if ($code -ne 200) { throw "M2_LOCAL_GIT_ADMIN_READ_DENIED:$code" }
            Write-Host 'M2_LOCAL_GIT_RUNNER_LABEL_ADMIN_READ_PASS=true'
          } finally {
            $token=$null; $headers=$null; $filled=$null
            Remove-Item $inFile,$outFile,$errFile -Force -ErrorAction SilentlyContinue
          }
      - name: Non-executor no credential access marker
        if: runner.name != 'A1-WINDOWS-COMPUTE'
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: Write-Host 'M2_LOCAL_GIT_NON_EXECUTOR_NO_CREDENTIAL_ACCESS=true'

  probe_b:
    name: Local Git admin credential probe B
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 6
    steps:
      - name: Probe path-scoped credential only from runner 31
        if: runner.name == 'A1-WINDOWS-COMPUTE'
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
