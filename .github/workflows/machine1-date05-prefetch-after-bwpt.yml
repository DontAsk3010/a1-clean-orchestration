name: Machine1 Date05 Transport Prefetch After BWPT

on:
  push:
    branches:
      - machine1/date05-prefetch-after-bmsr
    paths:
      - .github/workflows/machine1-date05-prefetch-after-bwpt.yml

permissions:
  contents: write

jobs:
  prefetch:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\\TRADING SYSTEM\\02_CURRENT_HISTORICAL_RAW_DATA_UJI\\Raw Des 02-31-2024.csv'
      CACHE_ROOT: 'D:\\TRADING SYSTEM\\A1_CLEAN_TRANSPORT_CACHE'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build transport-only next-20 cache after BWPT
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'
          $raw=[System.IO.Path]::GetFullPath($env:RAW_FILE)
          if(-not (Test-Path -LiteralPath $raw -PathType Leaf)){throw "RAW_MISSING: $raw"}

          $targetDate='2024-12-05'
          $afterSourceRow=353893
          $startBundleLine=254
          $maxContexts=20
          $expectedSize=[int64]453806812
          $expectedMd5='b8d42b35c90d2dff8b18ae4e1734523b'
          $expectedSha256='5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'

          New-Item -ItemType Directory -Force -Path $env:CACHE_ROOT | Out-Null
          $fingerprintPath=Join-Path $env:CACHE_ROOT 'raw_des_202412_source_fingerprint.json'
          $fi=Get-Item -LiteralPath $raw
          if($fi.Length -ne $expectedSize){throw "RAW_SIZE_MISMATCH got=$($fi.Length) expected=$expectedSize"}

          $useCachedHash=$false
          if(Test-Path -LiteralPath $fingerprintPath){
            try{
              $fp=Get-Content -Raw $fingerprintPath | ConvertFrom-Json
              if([int64]$fp.length -eq $fi.Length -and
                 [int64]$fp.last_write_utc_ticks -eq $fi.LastWriteTimeUtc.Ticks -and
                 [string]$fp.sha256 -eq $expectedSha256 -and
                 [string]$fp.md5 -eq $expectedMd5){
                $useCachedHash=$true
                $gotMd5=$expectedMd5
                $gotSha256=$expectedSha256
              }
            }catch{}
          }

          if(-not $useCachedHash){
            $md5=[System.Security.Cryptography.MD5]::Create()
            $sha=[System.Security.Cryptography.SHA256]::Create()
            $fs=[System.IO.File]::OpenRead($raw)
            try{
              $buffer=New-Object byte[] (4MB)
              while(($read=$fs.Read($buffer,0,$buffer.Length)) -gt 0){
                [void]$md5.TransformBlock($buffer,0,$read,$buffer,0)
                [void]$sha.TransformBlock($buffer,0,$read,$buffer,0)
              }
              [void]$md5.TransformFinalBlock([byte[]]::new(0),0,0)
              [void]$sha.TransformFinalBlock([byte[]]::new(0),0,0)
              $gotMd5=([BitConverter]::ToString($md5.Hash)).Replace('-','').ToLowerInvariant()
              $gotSha256=([BitConverter]::ToString($sha.Hash)).Replace('-','').ToLowerInvariant()
            }finally{$fs.Dispose();$md5.Dispose();$sha.Dispose()}
            if($gotMd5 -ne $expectedMd5 -or $gotSha256 -ne $expectedSha256){
              throw "RAW_HASH_MISMATCH md5=$gotMd5 sha256=$gotSha256"
            }
            [ordered]@{
              path=$raw
              length=$fi.Length
              last_write_utc_ticks=$fi.LastWriteTimeUtc.Ticks
              md5=$gotMd5
              sha256=$gotSha256
              verified_at_utc=(Get-Date).ToUniversalTime().ToString('o')
            } | ConvertTo-Json | Set-Content -Encoding UTF8 $fingerprintPath
          }

          $header=$null
          $tickerIdx=-1
          $dtIdx=-1
          $lineIndex=0
          $contexts=[ordered]@{}
          $order=New-Object 'System.Collections.Generic.List[string]'

          foreach($line in [System.IO.File]::ReadLines($raw,[System.Text.Encoding]::UTF8)){
            if($lineIndex -eq 0){
              $header=$line
              $hf=$line.Split(',')
              for($i=0;$i -lt $hf.Length;$i++){
                $h=$hf[$i].Trim('"')
                if($h -eq 'RAW_TICKER'){$tickerIdx=$i}
                if($h -eq 'RAW_DATETIME_ISO'){$dtIdx=$i}
              }
              if($tickerIdx -lt 0 -or $dtIdx -lt 0){throw 'HEADER_INDEX_MISSING'}
              $lineIndex++; continue
            }
            if($lineIndex -le $afterSourceRow){$lineIndex++; continue}

            $p=$line.Split(',')
            if($p.Length -le [Math]::Max($tickerIdx,$dtIdx)){$lineIndex++; continue}
            $tk=$p[$tickerIdx].Trim('"')
            $dt=$p[$dtIdx].Trim('"')
            if($dt.StartsWith($targetDate)){
              if(-not $contexts.Contains($tk)){
                if($order.Count -ge $maxContexts){break}
                $order.Add($tk)
                $contexts[$tk]=[ordered]@{
                  source_first=$lineIndex
                  source_last=$lineIndex
                  lines=New-Object 'System.Collections.Generic.List[string]'
                }
              }
              if($contexts.Contains($tk)){
                $contexts[$tk].source_last=$lineIndex
                [void]$contexts[$tk].lines.Add($line)
              }
            }
            $lineIndex++
          }

          if($order.Count -lt 1){throw 'NO_NEXT_CONTEXTS_FOUND'}

          $out=Join-Path $PWD '.machine1_prefetch/date05_after_bwpt'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $utf8NoBom=New-Object System.Text.UTF8Encoding($false)
          $manifest=New-Object 'System.Collections.Generic.List[object]'

          for($ci=0;$ci -lt $order.Count;$ci++){
            $tk=$order[$ci]
            $ctx=$contexts[$tk]
            $parsed=@((@($header)+@($ctx.lines)) | ConvertFrom-Csv)
            if($parsed.Count -ne $ctx.lines.Count){throw "PARSE_COUNT_MISMATCH ticker=$tk"}
            $records=New-Object 'System.Collections.Generic.List[object]'
            for($i=0;$i -lt $parsed.Count;$i++){
              $ordered=[ordered]@{source_row=([int64]$ctx.source_first+$i)}
              foreach($pn in $parsed[$i].PSObject.Properties.Name){$ordered[$pn]=[string]$parsed[$i].$pn}
              [void]$records.Add([pscustomobject]$ordered)
            }
            $tickers=@($records|ForEach-Object{$_.RAW_TICKER}|Sort-Object -Unique)
            if($tickers.Count -ne 1 -or $tickers[0] -ne $tk){throw "TICKER_MISMATCH $tk"}
            $dts=@($records|ForEach-Object{[string]$_.RAW_DATETIME_ISO})
            if(@($dts|Where-Object{-not $_.StartsWith($targetDate)}).Count -gt 0){throw "DATE_MISMATCH $tk"}

            $rowsPath=Join-Path $out ($tk+'_20241205_ROWS.jsonl')
            $jsonl=@($records|ForEach-Object{$_|ConvertTo-Json -Compress -Depth 8})
            [System.IO.File]::WriteAllLines($rowsPath,[string[]]$jsonl,$utf8NoBom)
            $rowsSha=(Get-FileHash -LiteralPath $rowsPath -Algorithm SHA256).Hash.ToLowerInvariant()

            $item=[ordered]@{
              ticker=$tk
              trading_date=$targetDate
              semantic_bundle='Raw Des 02-31-2024__SEMANTIC_0014.jsonl'
              semantic_bundle_line_number=($startBundleLine+$ci)
              source_row_first=[int64]$ctx.source_first
              source_row_last=[int64]$ctx.source_last
              physical_line_first=([int64]$ctx.source_first+1)
              physical_line_last=([int64]$ctx.source_last+1)
              actual_rows=$records.Count
              first_datetime=$dts[0]
              last_datetime=$dts[$dts.Count-1]
              source_md5=$gotMd5
              source_sha256=$gotSha256
              rows_jsonl_sha256=$rowsSha
              transport_only=$true
              semantic_read_performed=$false
              durable_pass=$false
            }
            [void]$manifest.Add([pscustomobject]$item)
            [System.IO.File]::WriteAllText((Join-Path $out ($tk+'_20241205_PROOF.json')),($item|ConvertTo-Json -Depth 8),$utf8NoBom)
          }

          [System.IO.File]::WriteAllText((Join-Path $out 'BATCH_MANIFEST.json'),($manifest|ConvertTo-Json -Depth 8),$utf8NoBom)
          Write-Host "DATE05_PREFETCH_AFTER_BWPT_OK contexts=$($order.Count) first=$($order[0]) last=$($order[$order.Count-1]) cached_hash=$useCachedHash"

          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.name 'a1-clean-machine1-bot'
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.email 'a1-clean-machine1-bot@users.noreply.github.com'
          git -c safe.directory="$env:GITHUB_WORKSPACE" add -f '.machine1_prefetch/date05_after_bwpt/'
          git -c safe.directory="$env:GITHUB_WORKSPACE" commit -m 'Prefetch Date05 next 20 transport contexts after BWPT [skip ci]'
          git -c safe.directory="$env:GITHUB_WORKSPACE" push origin HEAD:machine1/date05-prefetch-after-bmsr
