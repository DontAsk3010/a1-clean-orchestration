name: Machine2 V3 Storage Generation Contract

on:
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/machine2-v3-storage-generation-contract.yml'
      - 'src/a1clean/formula_research/machine2_current_store.py'
      - 'tests/test_machine2_current_store_generation.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1-machine2-v3-storage-generation-contract
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -U pip
      - run: pip install -e '.[test]'
      - run: python -m compileall -q src tests/test_machine2_current_store_generation.py
      - run: pytest -q tests/test_machine2_current_store_generation.py
