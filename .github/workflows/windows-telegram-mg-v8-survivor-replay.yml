name: Windows Telegram MG V8 Survivor Replay

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - telegram-mg-v8-survivor-replay-requests/current.json
      - formula-packs/MG_V8_SURVIVOR_RESEARCH_PACK.json

permissions:
  contents: read

concurrency:
  group: a1-windows-telegram-mg-v8-survivor-replay
  cancel-in-progress: true

jobs:
  replay:
    name: Replay V8 survivor MG as Telegram snapshots
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 720
    steps:
      - name: Checkout exact replay revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate request and pack
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'telegram-mg-v8-survivor-replay-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_TELEGRAM_MG_V8_SURVIVOR_REPLAY_REQUEST_V1') { throw 'Unsupported replay request schema.' }
          if ($req.enabled -ne $true) { throw 'Replay request disabled.' }
          $pack = Get-Content -LiteralPath 'formula-packs/MG_V8_SURVIVOR_RESEARCH_PACK.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($pack.schema -ne 'A1_TELEGRAM_MG_V8_SURVIVOR_RESEARCH_PACK_V1') { throw 'Unsupported survivor pack schema.' }
          $json = $req | ConvertTo-Json -Compress -Depth 20
          "A1_MG_V8_REPLAY_REQUEST_JSON=$json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Drive credential bindings
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:A1_DRIVE_READER_CREDENTIALS, $env:A1_DRIVE_WRITER_CREDENTIALS)) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Drive credential binding missing.' }
          }

      - name: Install compile test
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'V8_REPLAY_INSTALL_FAILED' }
          py -3.11 -m py_compile src/a1clean/formula_research/telegram_mg_v8_survivor_replay.py
          if ($LASTEXITCODE -ne 0) { throw 'V8_REPLAY_COMPILE_FAILED' }
          py -3.11 -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'V8_REPLAY_TESTS_FAILED' }

      - name: Run survivor Telegram replay
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = $env:A1_MG_V8_REPLAY_REQUEST_JSON | ConvertFrom-Json
          $args = @(
            '-3.11', '-m', 'a1clean.formula_research.telegram_mg_v8_survivor_replay',
            '--formula-pack', 'formula-packs/MG_V8_SURVIVOR_RESEARCH_PACK.json',
            '--target-source', [string]$req.target_source,
            '--prior-days', [string][int]$req.prior_days,
            '--buy-fee-pct', [string][double]$req.execution.buy_fee_pct,
            '--sell-fee-pct', [string][double]$req.execution.sell_fee_pct,
            '--output', 'telegram-mg-v8-survivor-replay-result.json'
          )
          if (-not [string]::IsNullOrWhiteSpace([string]$req.target_date)) {
            $args += @('--target-date', [string]$req.target_date)
          }
          & py @args
          if ($LASTEXITCODE -ne 0) { throw "V8_REPLAY_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Upload replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mg-v8-survivor-replay-${{ github.run_id }}
          path: telegram-mg-v8-survivor-replay-result.json
          if-no-files-found: error
          retention-days: 30
