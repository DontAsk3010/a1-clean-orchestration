name: Machine1 AREA 2024-12-04 Governed Evidence Extract

on:
  push:
    branches:
      - machine1/evidence-area-20241204
    paths:
      - .github/workflows/machine1-area-20241204-evidence.yml

permissions:
  contents: read

jobs:
  extract-area:
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI\Raw Des 02-31-2024.csv'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract exact governed AREA packet with native PowerShell
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = $env:RAW_FILE
          $tickerExpected = 'AREA'
          $tradingDate = '2024-12-04'
          $sourceFirst = 91252
          $sourceLast = 91378
          $expectedCount = 127
          $expectedFirstTime = '09:00:00'
          $expectedLastTime = '16:00:00'
          $semanticBundle = 'Raw Des 02-31-2024__SEMANTIC_0010.jsonl'
          $semanticBundleLine = 7
          $expectedMd5 = 'b8d42b35c90d2dff8b18ae4e1734523b'
          $expectedSha256 = '5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'

          if (-not (Test-Path -LiteralPath $raw -PathType Leaf)) { throw "RAW_MISSING: $raw" }
          $gotMd5 = (Get-FileHash -LiteralPath $raw -Algorithm MD5).Hash.ToLowerInvariant()
          $gotSha256 = (Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($gotMd5 -ne $expectedMd5 -or $gotSha256 -ne $expectedSha256) {
            throw "RAW_HASH_MISMATCH md5=$gotMd5 sha256=$gotSha256"
          }

          $header = Get-Content -LiteralPath $raw -TotalCount 1
          $physicalLast = $sourceLast + 1
          $selectedLines = @(Get-Content -LiteralPath $raw -TotalCount $physicalLast | Select-Object -Skip $sourceFirst)
          if ($selectedLines.Count -ne $expectedCount) { throw "PHYSICAL_ROW_COUNT_MISMATCH got=$($selectedLines.Count) expected=$expectedCount" }
          $parsed = @(@($header) + $selectedLines | ConvertFrom-Csv)
          if ($parsed.Count -ne $expectedCount) { throw "CSV_ROW_COUNT_MISMATCH got=$($parsed.Count) expected=$expectedCount" }
          $headerFields = @($parsed[0].PSObject.Properties.Name)

          $rows = @()
          for ($i=0; $i -lt $parsed.Count; $i++) {
            $p = $parsed[$i]
            $h = [ordered]@{ source_row = ($sourceFirst + $i) }
            foreach ($prop in $p.PSObject.Properties) { $h[$prop.Name] = [string]$prop.Value }
            $rows += [pscustomobject]$h
          }

          $sourceRows = @($rows | ForEach-Object { [int]$_.source_row })
          for ($i=0; $i -lt $sourceRows.Count; $i++) {
            if ($sourceRows[$i] -ne ($sourceFirst + $i)) { throw 'SOURCE_ROW_SEQUENCE_MISMATCH' }
          }
          $tickers = @($rows | ForEach-Object { $_.RAW_TICKER } | Sort-Object -Unique)
          if ($tickers.Count -ne 1 -or $tickers[0] -ne $tickerExpected) { throw "TICKER_MISMATCH: $($tickers -join ',')" }
          $dts = @($rows | ForEach-Object { [string]$_.RAW_DATETIME_ISO })
          foreach ($dt in $dts) { if (-not $dt.StartsWith($tradingDate)) { throw "DATE_MISMATCH: $dt" } }
          $ft = $dts[0].Substring($dts[0].Length-8,8)
          $lt = $dts[-1].Substring($dts[-1].Length-8,8)
          if ($ft -ne $expectedFirstTime -or $lt -ne $expectedLastTime) { throw "TIME_RANGE_MISMATCH got=$ft-$lt" }

          $out = Join-Path $PWD 'machine1_area_20241204_evidence'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $pp = Join-Path $out 'AREA_20241204_PACKET.json'
          $rp = Join-Path $out 'AREA_20241204_ROWS.jsonl'
          $proofPath = Join-Path $out 'EVIDENCE_PROOF.json'
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          $packet = [ordered]@{
            source_name = [IO.Path]::GetFileName($raw)
            source_md5 = $gotMd5
            source_sha256 = $gotSha256
            generation_id = 'BEHAVIOR_UNIFORM_COLAB_SEMANTIC_GEN_20260910_01'
            ticker = $tickerExpected
            trading_date = $tradingDate
            semantic_bundle = $semanticBundle
            semantic_bundle_line_number = $semanticBundleLine
            source_row_first = $sourceFirst
            source_row_last = $sourceLast
            physical_line_first = $sourceFirst + 1
            physical_line_last = $sourceLast + 1
            data_rows = $rows.Count
            first_datetime = $dts[0]
            last_datetime = $dts[-1]
            header_fields = $headerFields
            rows = $rows
          }
          [IO.File]::WriteAllText($pp, ($packet | ConvertTo-Json -Depth 12), $utf8NoBom)
          $rowLines = @($rows | ForEach-Object { $_ | ConvertTo-Json -Compress -Depth 5 })
          [IO.File]::WriteAllLines($rp, $rowLines, $utf8NoBom)
          $packetSha = (Get-FileHash -LiteralPath $pp -Algorithm SHA256).Hash.ToLowerInvariant()
          $rowsSha = (Get-FileHash -LiteralPath $rp -Algorithm SHA256).Hash.ToLowerInvariant()
          $proof = [ordered]@{
            ticker = $tickerExpected
            trading_date = $tradingDate
            source_md5 = $gotMd5
            source_sha256 = $gotSha256
            semantic_bundle = $semanticBundle
            semantic_bundle_line_number = $semanticBundleLine
            source_row_first = $sourceFirst
            source_row_last = $sourceLast
            data_rows = $rows.Count
            first_datetime = $dts[0]
            last_datetime = $dts[-1]
            packet_sha256 = $packetSha
            rows_jsonl_sha256 = $rowsSha
            recovery_wrapper = 'NATIVE_POWERSHELL_NO_PYTHON'
          }
          [IO.File]::WriteAllText($proofPath, ($proof | ConvertTo-Json -Depth 5), $utf8NoBom)
          Write-Host "AREA_EVIDENCE_OK rows=$($rows.Count) source_rows=$sourceFirst-$sourceLast first=$($dts[0]) last=$($dts[-1]) packet_sha256=$packetSha rows_sha256=$rowsSha"
      - name: Upload governed AREA evidence
        uses: actions/upload-artifact@v4
        with:
          name: machine1-area-20241204-evidence-recovery
          path: machine1_area_20241204_evidence/
          if-no-files-found: error
          retention-days: 7
