name: Machine1 BINA 2024-12-05 Governed Evidence Extract

on:
  push:
    branches:
      - machine1/evidence-bina-20241205-recovery
    paths:
      - .github/workflows/machine1-ayam-20241204-evidence.yml

permissions:
  contents: read

jobs:
  extract-bina:
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI\Raw Des 02-31-2024.csv'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract exact governed BINA packet
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'
          $raw=$env:RAW_FILE
          $tickerExpected='BINA'; $tradingDate='2024-12-05'
          $sourceFirst=217220; $sourceLast=217222; $expectedCount=3
          $expectedFirstTime='10:41:00'; $expectedLastTime='16:00:00'
          $semanticBundle='Raw Des 02-31-2024__SEMANTIC_0014.jsonl'; $semanticBundleLine=194
          $expectedMd5='b8d42b35c90d2dff8b18ae4e1734523b'
          $expectedSha256='5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          if(-not(Test-Path -LiteralPath $raw -PathType Leaf)){throw "RAW_MISSING: $raw"}
          $gotMd5=(Get-FileHash -LiteralPath $raw -Algorithm MD5).Hash.ToLowerInvariant()
          $gotSha256=(Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant()
          if($gotMd5-ne$expectedMd5-or$gotSha256-ne$expectedSha256){throw "RAW_HASH_MISMATCH md5=$gotMd5 sha256=$gotSha256"}
          Add-Type -AssemblyName Microsoft.VisualBasic
          $p=New-Object Microsoft.VisualBasic.FileIO.TextFieldParser($raw,[System.Text.Encoding]::UTF8,$true)
          $p.TextFieldType=[Microsoft.VisualBasic.FileIO.FieldType]::Delimited; $p.SetDelimiters(','); $p.HasFieldsEnclosedInQuotes=$true
          try{
            $headers=@($p.ReadFields()); $headers[0]=$headers[0].TrimStart([char]0xFEFF)
            if($headers.Count-ne74){throw "RAW_HEADER_FIELD_COUNT_MISMATCH got=$($headers.Count) expected=74"}
            $rows=New-Object System.Collections.Generic.List[object]; $sourceRow=0
            while(-not$p.EndOfData){
              $f=@($p.ReadFields()); $sourceRow++
              if($sourceRow-lt$sourceFirst){continue}; if($sourceRow-gt$sourceLast){break}
              if($f.Count-ne74){throw "RAW_ROW_FIELD_COUNT_MISMATCH source_row=$sourceRow got=$($f.Count) expected=74"}
              $o=[ordered]@{source_row=$sourceRow}; for($i=0;$i-lt$headers.Count;$i++){$o[$headers[$i]]=$f[$i]}; $rows.Add([pscustomobject]$o)
            }
          }finally{$p.Close()}
          if($rows.Count-ne$expectedCount){throw "ROW_COUNT_MISMATCH got=$($rows.Count) expected=$expectedCount"}
          for($i=0;$i-lt$rows.Count;$i++){if([int]$rows[$i].source_row-ne($sourceFirst+$i)){throw 'SOURCE_ROW_SEQUENCE_MISMATCH'};if(@($rows[$i].PSObject.Properties).Count-ne75){throw 'RETAINED_FIELD_COUNT_MISMATCH'}}
          $tickers=@($rows|%{$_.RAW_TICKER}|Sort-Object -Unique); if($tickers.Count-ne1-or$tickers[0]-ne$tickerExpected){throw 'TICKER_MISMATCH'}
          $dts=@($rows|%{$_.RAW_DATETIME_ISO}); if(@($dts|?{-not$_.StartsWith($tradingDate)}).Count-ne0){throw 'DATE_MISMATCH'}
          function Clock([string]$dt){if($dt.Contains('T')){return $dt.Split('T')[1].Substring(0,8)};return $dt.Split(' ')[-1].Substring(0,8)}
          if((Clock $dts[0])-ne$expectedFirstTime-or(Clock $dts[-1])-ne$expectedLastTime){throw 'TIME_RANGE_MISMATCH'}
          $out=Join-Path $PWD 'machine1_bina_20241205_evidence';New-Item -ItemType Directory -Force -Path $out|Out-Null
          $utf8=New-Object System.Text.UTF8Encoding($false);$rowsPath=Join-Path $out 'BINA_20241205_ROWS.jsonl';$w=New-Object IO.StreamWriter($rowsPath,$false,$utf8)
          try{foreach($r in $rows){$w.WriteLine(($r|ConvertTo-Json -Compress -Depth 10))}}finally{$w.Close()}
          $rowsSha=(Get-FileHash $rowsPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $packet=[ordered]@{source_name=[IO.Path]::GetFileName($raw);source_md5=$gotMd5;source_sha256=$gotSha256;generation_id='BEHAVIOR_UNIFORM_COLAB_SEMANTIC_GEN_20260910_01';ticker=$tickerExpected;trading_date=$tradingDate;semantic_bundle=$semanticBundle;semantic_bundle_line_number=$semanticBundleLine;source_row_first=$sourceFirst;source_row_last=$sourceLast;physical_line_first=$sourceFirst+1;physical_line_last=$sourceLast+1;data_rows=$rows.Count;raw_fields_per_row=74;retained_fields_per_row=75;first_datetime=$dts[0];last_datetime=$dts[-1];header_fields=$headers;rows_sha256=$rowsSha;rows=$rows}
          $packetPath=Join-Path $out 'BINA_20241205_PACKET.json';[IO.File]::WriteAllText($packetPath,($packet|ConvertTo-Json -Depth 12),$utf8);$packetSha=(Get-FileHash $packetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $proof=[ordered]@{ticker=$tickerExpected;trading_date=$tradingDate;source_md5=$gotMd5;source_sha256=$gotSha256;semantic_bundle=$semanticBundle;semantic_bundle_line_number=$semanticBundleLine;source_row_first=$sourceFirst;source_row_last=$sourceLast;data_rows=$rows.Count;raw_fields_per_row=74;retained_fields_per_row=75;first_datetime=$dts[0];last_datetime=$dts[-1];rows_sha256=$rowsSha;packet_sha256=$packetSha;serialization_note='Native PowerShell serialization; exact RAW hashes plus bounded row contract govern source identity.'}
          [IO.File]::WriteAllText((Join-Path $out 'EVIDENCE_PROOF.json'),($proof|ConvertTo-Json -Depth 10),$utf8)
          Write-Host "BINA_EVIDENCE_OK rows=$($rows.Count) retained_fields=75 rows_sha256=$rowsSha packet_sha256=$packetSha"
      - name: Upload governed BINA evidence
        uses: actions/upload-artifact@v4
        with:
          name: machine1-bina-20241205-evidence
          path: machine1_bina_20241205_evidence/
          if-no-files-found: error
          retention-days: 7
