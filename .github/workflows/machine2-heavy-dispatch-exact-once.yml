name: Machine2 Heavy Dispatch Exact Once

on:
  push:
    branches:
      - lane2/algorithmic-pattern-discovery-v1
    paths:
      - .github/workflows/machine2-heavy-dispatch-exact-once.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: a1-machine2-heavy-dispatch-exact-once
  cancel-in-progress: false

jobs:
  route:
    strategy:
      fail-fast: false
      matrix:
        lane: [a, b]
    name: Verify Machine2 endpoint ${{ matrix.lane }}
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 10
    steps:
      - name: Identify exact target
        id: route
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $target = ($env:RUNNER_NAME -eq 'A1-WINDOWS-COMPUTE-02')
          "target=$($target.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "M2_ROUTE_RUNNER=$env:RUNNER_NAME target=$target"

      - name: Persist exact target proof
        if: steps.route.outputs.target == 'true'
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          if ($env:RUNNER_NAME -ne 'A1-WINDOWS-COMPUTE-02') { throw 'M2_ROUTE_WRONG_RUNNER' }
          if ($env:COMPUTERNAME -ne 'PORSCHE-DESIGN') { throw 'M2_ROUTE_WRONG_MACHINE' }
          New-Item -ItemType Directory -Force -Path route-proof | Out-Null
          [ordered]@{
            schema = 'A1_MACHINE2_EXACT_ENDPOINT_PROOF_V1'
            runner = $env:RUNNER_NAME
            machine = $env:COMPUTERNAME
            formula_stage = 'CLOSED'
          } | ConvertTo-Json | Set-Content -LiteralPath route-proof/TARGET.json -Encoding UTF8

      - name: Upload exact target proof
        if: steps.route.outputs.target == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: machine2-exact-target-${{ matrix.lane }}
          path: route-proof/TARGET.json
          if-no-files-found: error
          retention-days: 30

  dispatch:
    name: Dispatch heavy only to verified Machine2 endpoint
    needs: route
    if: always() && needs.route.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout activated Lane2 state
        uses: actions/checkout@v4
        with:
          ref: lane2/algorithmic-pattern-discovery-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download exact target proof after checkout
        uses: actions/download-artifact@v4
        with:
          pattern: machine2-exact-target-*
          merge-multiple: true
          path: route-proof

      - name: Assert endpoint and governance state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('route-proof/TARGET.json',encoding='utf-8-sig'))
          assert p['runner']=='A1-WINDOWS-COMPUTE-02'
          assert p['machine']=='PORSCHE-DESIGN'
          req=json.load(open('v32-full-observation-behavior-requests/current.json',encoding='utf-8-sig'))
          grp=json.load(open('v32-behavior-grouping-requests/current.json',encoding='utf-8-sig'))
          assert req['enabled'] is True
          assert req['formula_stage']=='CLOSED'
          assert req['candidate_formula_research_authorized'] is False
          assert req['dynamic_source_universe_required'] is True
          assert req['fixed_source_count_as_universe_authority_forbidden'] is True
          assert grp['enabled'] is False
          assert grp['formula_stage']=='CLOSED'
          print('M2_DISPATCH_GOVERNANCE_PASS=true')
          PY

      - name: Dispatch and bind heavy run to exact Machine2 runner
        id: dispatch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'lane2/algorithmic-pattern-discovery-v1';
            const workflow_id = 'windows-v32-full-observation-behavior.yml';
            const expectedHead = context.sha;
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            let accepted = null;
            for (let attempt = 1; attempt <= 6; attempt++) {
              const before = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id, branch, event:'workflow_dispatch', per_page:50});
              const seen = new Set(before.data.workflow_runs.map(r => r.id));
              await github.rest.actions.createWorkflowDispatch({owner, repo, workflow_id, ref:branch});
              let run = null;
              for (let i = 0; i < 30; i++) {
                await sleep(2000);
                const runs = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id, branch, event:'workflow_dispatch', per_page:20});
                run = runs.data.workflow_runs.find(r => !seen.has(r.id) && r.head_sha === expectedHead);
                if (run) break;
              }
              if (!run) throw new Error(`M2_HEAVY_RUN_NOT_FOUND_ATTEMPT_${attempt}`);
              let runnerName = '';
              for (let i = 0; i < 30; i++) {
                await sleep(2000);
                const jobs = await github.rest.actions.listJobsForWorkflowRun({owner, repo, run_id:run.id, per_page:20});
                if (jobs.data.jobs.length && jobs.data.jobs[0].runner_name) {
                  runnerName = jobs.data.jobs[0].runner_name;
                  break;
                }
                if (jobs.data.jobs.length && jobs.data.jobs[0].status === 'completed') break;
              }
              core.info(`attempt=${attempt} run=${run.id} runner=${runnerName || 'UNASSIGNED'}`);
              if (runnerName === 'A1-WINDOWS-COMPUTE-02') {
                accepted = {attempt, run_id:run.id, runner:runnerName, head_sha:run.head_sha};
                break;
              }
              await github.rest.actions.cancelWorkflowRun({owner, repo, run_id:run.id}).catch(() => {});
              await sleep(3000);
            }
            if (!accepted) throw new Error('M2_HEAVY_EXACT_RUNNER_NOT_OBTAINED_AFTER_6_ATTEMPTS');
            const proof = {
              schema:'A1_MACHINE2_HEAVY_EXACT_DISPATCH_PROOF_V1',
              status:'HEAVY_RUNNING_EXACT_RUNNER',
              heavy_run_id:accepted.run_id,
              heavy_runner:accepted.runner,
              heavy_head_sha:accepted.head_sha,
              dispatch_attempt:accepted.attempt,
              prestart_run_id:36597891523,
              prestart_artifact_id:11047936226,
              storage_safe_rebind_run_id:36471081944,
              storage_safe_rebind_artifact_id:10991652188,
              formula_stage:'CLOSED',
              grouping_enabled:false
            };
            fs.mkdirSync('dispatch-proof',{recursive:true});
            fs.writeFileSync('dispatch-proof/HEAVY_DISPATCH_PROOF.json',JSON.stringify(proof,null,2));
            core.setOutput('heavy_run_id',String(accepted.run_id));
            core.setOutput('heavy_runner',accepted.runner);
            core.info(`M2_HEAVY_EXACT_RUNNER_PASS run_id=${accepted.run_id} runner=${accepted.runner}`);

      - name: Upload durable dispatch proof
        uses: actions/upload-artifact@v4
        with:
          name: machine2-heavy-exact-dispatch-${{ steps.dispatch.outputs.heavy_run_id }}
          path: dispatch-proof/HEAVY_DISPATCH_PROOF.json
          if-no-files-found: error
          retention-days: 30

      - name: Self-retire dispatcher after exact heavy assignment
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/machine2-heavy-dispatch-exact-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/machine2-heavy-dispatch-exact-once.yml
          git commit -m 'governance: retire Machine2 exact heavy dispatcher after assignment'
          git push origin HEAD:lane2/algorithmic-pattern-discovery-v1
