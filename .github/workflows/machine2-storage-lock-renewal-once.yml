name: Machine2 Storage Manifest Lock Renewal Once

on:
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - .github/workflows/machine2-storage-lock-renewal-once.yml

permissions:
  contents: write
  actions: write

jobs:
  renew-lock-and-dispatch-prestart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v32-dynamic-source-universe-v1
          fetch-depth: 0
      - name: Renew storage manifest lock binding only
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          lock_path = Path('governance/a1-clean-active-authority-lock.json')
          bootstrap_path = Path('governance/a1-clean-authority-bootstrap-current.json')
          full_req_path = Path('v32-full-observation-behavior-requests/current.json')
          grouping_req_path = Path('v32-behavior-grouping-requests/current.json')

          new_rev = 'ANLCKQkALKgw1nCOolpDBjZPS2PO_MuGAGq29odylBQzCKd6KhSY9TbmaQWlOHz4H04_kXBGl26_vgSPyAcE95hIBL1revci2U1dO0oNeeY'

          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          bootstrap = json.loads(bootstrap_path.read_text(encoding='utf-8'))
          full_req = json.loads(full_req_path.read_text(encoding='utf-8'))
          grouping_req = json.loads(grouping_req_path.read_text(encoding='utf-8'))

          assert lock['documents']['storage_manifest']['document_id'] == '16Akf3qCzimsz15wE-pxcMqC-28e73eCNrmGPVFjuPgo'
          assert full_req['enabled'] is False
          assert grouping_req['enabled'] is False
          rows = {row['key']: row for row in bootstrap['authority_documents_in_required_read_order']}
          assert rows['storage_manifest']['drive_revision_id'] == '9'
          assert rows['storage_handbook']['drive_revision_id'] == '9'

          lock['documents']['storage_manifest']['revision_id'] = new_rev
          lock_path.write_text(json.dumps(lock, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Self-retire and commit exact control renewal
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/machine2-storage-lock-renewal-once.yml
          git add governance/a1-clean-active-authority-lock.json
          git diff --cached --check
          git commit -m 'governance: renew storage manifest lock to revision 9'
          git push origin HEAD:fix/v32-dynamic-source-universe-v1
      - name: Dispatch exact lightweight PRESTART on renewed head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/windows-v32-dynamic-source-preflight.yml/dispatches \
            -f ref='fix/v32-dynamic-source-universe-v1'
