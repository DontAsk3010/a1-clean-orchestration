name: Windows Telegram MG Same-Day Precision Study

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - telegram-mg-precision-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-windows-telegram-mg-precision-study
  cancel-in-progress: false

jobs:
  study:
    name: Telegram MG same-day precision study
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 720
    steps:
      - name: Checkout exact formula research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate precision-study request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.ref_name }}' -ne 'formula/current-clean-research-v1') { throw 'MG precision study is branch-restricted.' }
          $req = Get-Content -LiteralPath 'telegram-mg-precision-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_TELEGRAM_MG_SAME_DAY_PRECISION_REQUEST_V1') { throw 'Unsupported MG precision request schema.' }
          if ($req.enabled -ne $true) { throw 'MG precision request not enabled.' }
          if ($req.authorization_phrase -ne 'AUTHORIZE_TELEGRAM_MG_SAME_DAY_PRECISION_STUDY') { throw 'Exact precision-study authorization phrase required.' }
          if ([string]::IsNullOrWhiteSpace($req.source_name)) { throw 'source_name required.' }
          if ($req.mode -notin @('DEVELOPMENT_COMPARE_ALL','FROZEN_VALIDATION_ONE')) { throw 'Unsupported precision mode.' }
          if ($req.mode -eq 'DEVELOPMENT_COMPARE_ALL' -and -not [string]::IsNullOrWhiteSpace($req.selected_variant)) { throw 'Development mode must not preselect a variant.' }
          if ($req.mode -eq 'FROZEN_VALIDATION_ONE' -and [string]::IsNullOrWhiteSpace($req.selected_variant)) { throw 'Validation mode requires one frozen selected_variant.' }
          if ($req.drive_output_folder_id -ne '1uQKSZD8KbOZ2j3moyZiH1EuJPlEhEAuC') { throw 'Unexpected Formula Research output folder.' }
          $json = $req | ConvertTo-Json -Compress -Depth 20
          "A1_MG_PRECISION_REQUEST_JSON=$json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Drive credential bindings
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:A1_DRIVE_READER_CREDENTIALS, $env:A1_DRIVE_WRITER_CREDENTIALS)) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Drive credential binding missing.' }
          }

      - name: Install and test exact MG precision code
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'MG_PRECISION_INSTALL_FAILED' }
          py -3.11 -m compileall -q src tests
          if ($LASTEXITCODE -ne 0) { throw 'MG_PRECISION_COMPILE_FAILED' }
          py -3.11 -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'MG_PRECISION_TESTS_FAILED' }

      - name: Run same-day precision study
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = $env:A1_MG_PRECISION_REQUEST_JSON | ConvertFrom-Json
          py -3.11 -m a1clean.formula_research.telegram_mg_precision_study `
            --source-name $req.source_name `
            --request-id $req.request_id `
            --software-revision '${{ github.sha }}' `
            --drive-output-folder-id $req.drive_output_folder_id `
            --output 'telegram-mg-precision-study-result.json' `
            --mode $req.mode `
            --selected-variant ([string]$req.selected_variant) `
            --effort-lookback ([int]$req.params.effort_lookback) `
            --progress-lookback ([int]$req.params.progress_lookback) `
            --high-lookback ([int]$req.params.high_lookback) `
            --recovery-lookback ([int]$req.params.recovery_lookback) `
            --low-stabilization-bars ([int]$req.params.low_stabilization_bars) `
            --early-checkpoint-bar ([int]$req.params.early_checkpoint_bar) `
            --late-lift-min-bar ([int]$req.params.late_lift_min_bar)
          if ($LASTEXITCODE -ne 0) { throw "MG_PRECISION_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Upload precision-study artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mg-precision-study-${{ github.run_id }}
          path: telegram-mg-precision-study-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Research safety declaration
        if: always()
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          "### Telegram MG same-day precision study" >> $env:GITHUB_STEP_SUMMARY
          "- Goal: fewer, cleaner EARLY_POTENTIAL/MULAI GENIT first alerts that deliver reward on trading day H." >> $env:GITHUB_STEP_SUMMARY
          "- H+1 is not used to qualify MG; continuation remains a separate research family." >> $env:GITHUB_STEP_SUMMARY
          "- Development comparison is December-only; one variant must be frozen before January validation." >> $env:GITHUB_STEP_SUMMARY
          "- Same alert bar high is excluded from reward evaluation." >> $env:GITHUB_STEP_SUMMARY
          "- All results remain research-only and non-canonical." >> $env:GITHUB_STEP_SUMMARY
