name: Windows Exhaustive Minute Behavior Census V2.1

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - minute-behavior-census-v21-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-windows-minute-behavior-census-v21
  cancel-in-progress: true

jobs:
  census:
    name: Read every governed ticker minute and ticker day
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 720
    steps:
      - name: Checkout exact research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'minute-behavior-census-v21-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_MINUTE_BEHAVIOR_CENSUS_V21_REQUEST') { throw 'Unsupported minute census request schema.' }
          if ($req.enabled -ne $true) { throw 'Minute behavior census request not enabled.' }

      - name: Install compile and test minute census
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'MINUTE_CENSUS_INSTALL_FAILED' }
          py -3.11 -m py_compile src/a1clean/formula_research/haka_haki_reconstruction.py src/a1clean/formula_research/minute_behavior_census_v21.py
          if ($LASTEXITCODE -ne 0) { throw 'MINUTE_CENSUS_COMPILE_FAILED' }
          py -3.11 -m pytest -q tests/test_haka_haki_reconstruction.py tests/test_haka_haki_behavior_lane.py tests/test_minute_behavior_census_v21.py
          if ($LASTEXITCODE -ne 0) { throw 'MINUTE_CENSUS_TEST_FAILED' }

      - name: Run exhaustive governed minute behavior census
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & py -3.11 -m a1clean.formula_research.minute_behavior_census_v21 `
            --output 'minute-behavior-census-v21-result.json' `
            --ticker-day-output 'minute-behavior-census-v21-ticker-days.jsonl.gz' `
            --transition-output 'minute-behavior-census-v21-temporal-runs.jsonl.gz'
          if ($LASTEXITCODE -ne 0) { throw "MINUTE_CENSUS_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Assert census guardrails and complete accounting
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $obj = Get-Content -LiteralPath 'minute-behavior-census-v21-result.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($obj.schema -ne 'A1_MINUTE_BEHAVIOR_CENSUS_V21') { throw 'MINUTE_CENSUS_RESULT_SCHEMA_MISMATCH' }
          if ($obj.scope.every_ticker_day_processed -ne $true) { throw 'TICKER_DAY_SCOPE_INCOMPLETE' }
          if ($obj.scope.every_cached_session_bar_processed -ne $true) { throw 'MINUTE_SCOPE_INCOMPLETE' }
          if ($obj.scope.publication_slot_filter_used -ne $false) { throw 'PUBLICATION_SLOT_FILTER_NOT_ALLOWED' }
          if ($obj.scope.source_order_preserved -ne $true) { throw 'SOURCE_ORDER_NOT_PRESERVED' }
          if ($obj.important_semantics.reserved_oos_touched -ne $false) { throw 'RESERVED_OOS_TOUCHED' }
          if ($obj.important_semantics.physical_zero_not_assumed_available_flow -ne $true) { throw 'ZERO_AVAILABILITY_GUARD_MISSING' }
          if ($obj.important_semantics.haka_haki_not_used_outside_proven_source_contract -ne $true) { throw 'HAKA_HAKI_SCOPE_GUARD_MISSING' }
          if ($obj.important_semantics.future_outcome_not_used_to_define_current_state -ne $true) { throw 'FUTURE_LEAKAGE_GUARD_MISSING' }
          if ([int64]$obj.totals.ticker_days -le 0 -or [int64]$obj.totals.minute_rows -le 0) { throw 'EMPTY_CENSUS' }
          foreach ($src in $obj.source_accounting) {
            if ($src.ticker_day_accounting_pass -ne $true) { throw "SOURCE_ACCOUNTING_FAILED:$($src.source_name)" }
          }
          if (-not (Test-Path -LiteralPath 'minute-behavior-census-v21-ticker-days.jsonl.gz')) { throw 'TICKER_DAY_ARTIFACT_MISSING' }
          if (-not (Test-Path -LiteralPath 'minute-behavior-census-v21-temporal-runs.jsonl.gz')) { throw 'TEMPORAL_RUN_ARTIFACT_MISSING' }

      - name: Upload exhaustive minute behavior census artifacts
        uses: actions/upload-artifact@v4
        with:
          name: minute-behavior-census-v21-${{ github.run_id }}
          path: |
            minute-behavior-census-v21-result.json
            minute-behavior-census-v21-ticker-days.jsonl.gz
            minute-behavior-census-v21-temporal-runs.jsonl.gz
          if-no-files-found: error
          retention-days: 30
