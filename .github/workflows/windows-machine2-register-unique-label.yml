          if ($LASTEXITCODE -ne 0) { throw 'M2_UNIQUE_LABEL_TARGET_READBACK_FAILED' }
          $names = @($d.labels | ForEach-Object { [string]$_.name })
          if ($names -notcontains 'a1-machine2-exact') { throw 'M2_UNIQUE_LABEL_NOT_PRESENT_ON_TARGET' }
          Write-Host 'M2_UNIQUE_LABEL_TARGET_READBACK_PASS=true'
      - id: otherread
        name: Uniqueness readback - label absent on agent 31
        if: runner.name == 'A1-WINDOWS-COMPUTE-02'
        continue-on-error: true
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $d = ((& gh api 'repos/DontAsk3010/a1-clean-orchestration/actions/runners/31/labels') | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'M2_UNIQUE_LABEL_OTHER_READBACK_FAILED' }
          $names = @($d.labels | ForEach-Object { [string]$_.name })
          if ($names -contains 'a1-machine2-exact') { throw 'M2_UNIQUE_LABEL_NOT_UNIQUE_OTHER_RUNNER_HAS_LABEL' }
          Write-Host 'M2_UNIQUE_LABEL_OTHER_EXCLUSION_PASS=true'
      - name: Target final registration verdict
        if: always() && runner.name == 'A1-WINDOWS-COMPUTE-02'
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          POST_OUTCOME: ${{ steps.postlabel.outcome }}
          TARGET_READ_OUTCOME: ${{ steps.targetread.outcome }}
          OTHER_READ_OUTCOME: ${{ steps.otherread.outcome }}
        run: |
          Write-Host "M2_AUTH_OUTCOME=$env:AUTH_OUTCOME"
          Write-Host "M2_POST_OUTCOME=$env:POST_OUTCOME"
          Write-Host "M2_TARGET_READ_OUTCOME=$env:TARGET_READ_OUTCOME"
          Write-Host "M2_OTHER_READ_OUTCOME=$env:OTHER_READ_OUTCOME"
          if ($env:AUTH_OUTCOME -ne 'success') { throw 'M2_UNIQUE_LABEL_AUTH_HOLD' }
          if ($env:POST_OUTCOME -ne 'success') { throw 'M2_UNIQUE_LABEL_POST_HOLD' }
          if ($env:TARGET_READ_OUTCOME -ne 'success') { throw 'M2_UNIQUE_LABEL_TARGET_READ_HOLD' }
          if ($env:OTHER_READ_OUTCOME -ne 'success') { throw 'M2_UNIQUE_LABEL_OTHER_READ_HOLD' }
          Write-Host 'M2_UNIQUE_LABEL_EXACT_READBACK_PASS=true'
      - name: Non-target no mutation marker
        if: always() && runner.name != 'A1-WINDOWS-COMPUTE-02'
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: Write-Host 'M2_UNIQUE_LABEL_NON_TARGET_NO_MUTATION=true'
