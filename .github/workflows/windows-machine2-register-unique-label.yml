name: Windows Machine2 Register Unique Exact Runner Label

on:
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/windows-machine2-register-unique-label.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1-windows-machine2-register-unique-label
  cancel-in-progress: true

jobs:
  candidate_a:
    name: Register exact label candidate A
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 8
    steps:
      - name: Register label only from exact target and prove uniqueness
        if: runner.name == 'A1-WINDOWS-COMPUTE-02'
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          & gh auth status --hostname github.com
          if ($LASTEXITCODE -ne 0) { throw 'M2_UNIQUE_LABEL_LOCAL_GH_AUTH_FAILED' }
          $label = 'a1-machine2-exact'
          $body = @{ labels = @($label) } | ConvertTo-Json -Compress
          $null = $body | gh api --method POST 'repos/DontAsk3010/a1-clean-orchestration/actions/runners/32/labels' --input -
          if ($LASTEXITCODE -ne 0) { throw 'M2_UNIQUE_LABEL_REGISTRATION_FAILED' }
          $target = (& gh api 'repos/DontAsk3010/a1-clean-orchestration/actions/runners/32/labels') | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'M2_UNIQUE_LABEL_TARGET_READBACK_FAILED' }
          $other = (& gh api 'repos/DontAsk3010/a1-clean-orchestration/actions/runners/31/labels') | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'M2_UNIQUE_LABEL_OTHER_READBACK_FAILED' }
          $targetNames = @($target.labels | ForEach-Object { [string]$_.name })
          $otherNames = @($other.labels | ForEach-Object { [string]$_.name })
          if ($targetNames -notcontains $label) { throw 'M2_UNIQUE_LABEL_NOT_PRESENT_ON_TARGET' }
          if ($otherNames -contains $label) { throw 'M2_UNIQUE_LABEL_NOT_UNIQUE_OTHER_RUNNER_HAS_LABEL' }
          Write-Host 'M2_UNIQUE_LABEL_REGISTERED=true'
          Write-Host 'M2_UNIQUE_LABEL_TARGET_AGENT_ID=32'
          Write-Host 'M2_UNIQUE_LABEL_OTHER_AGENT_ID=31'
          Write-Host 'M2_UNIQUE_LABEL=a1-machine2-exact'
          Write-Host 'M2_UNIQUE_LABEL_EXACT_READBACK_PASS=true'
      - name: Non-target no mutation marker
        if: runner.name != 'A1-WINDOWS-COMPUTE-02'
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: Write-Host 'M2_UNIQUE_LABEL_NON_TARGET_NO_MUTATION=true'

  candidate_b:
    name: Register exact label candidate B
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 8
    steps:
      - name: Register label only from exact target and prove uniqueness
        if: runner.name == 'A1-WINDOWS-COMPUTE-02'
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          & gh auth status --hostname github.com
          if ($LASTEXITCODE -ne 0) { throw 'M2_UNIQUE_LABEL_LOCAL_GH_AUTH_FAILED' }
          $label = 'a1-machine2-exact'
          $body = @{ labels = @($label) } | ConvertTo-Json -Compress
          $null = $body | gh api --method POST 'repos/DontAsk3010/a1-clean-orchestration/actions/runners/32/labels' --input -
          if ($LASTEXITCODE -ne 0) { throw 'M2_UNIQUE_LABEL_REGISTRATION_FAILED' }
          $target = (& gh api 'repos/DontAsk3010/a1-clean-orchestration/actions/runners/32/labels') | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'M2_UNIQUE_LABEL_TARGET_READBACK_FAILED' }
          $other = (& gh api 'repos/DontAsk3010/a1-clean-orchestration/actions/runners/31/labels') | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'M2_UNIQUE_LABEL_OTHER_READBACK_FAILED' }
          $targetNames = @($target.labels | ForEach-Object { [string]$_.name })
          $otherNames = @($other.labels | ForEach-Object { [string]$_.name })
          if ($targetNames -notcontains $label) { throw 'M2_UNIQUE_LABEL_NOT_PRESENT_ON_TARGET' }
          if ($otherNames -contains $label) { throw 'M2_UNIQUE_LABEL_NOT_UNIQUE_OTHER_RUNNER_HAS_LABEL' }
          Write-Host 'M2_UNIQUE_LABEL_REGISTERED=true'
          Write-Host 'M2_UNIQUE_LABEL_TARGET_AGENT_ID=32'
          Write-Host 'M2_UNIQUE_LABEL_OTHER_AGENT_ID=31'
          Write-Host 'M2_UNIQUE_LABEL=a1-machine2-exact'
          Write-Host 'M2_UNIQUE_LABEL_EXACT_READBACK_PASS=true'
      - name: Non-target no mutation marker
        if: runner.name != 'A1-WINDOWS-COMPUTE-02'
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: Write-Host 'M2_UNIQUE_LABEL_NON_TARGET_NO_MUTATION=true'
