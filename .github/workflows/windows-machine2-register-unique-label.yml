      - id: postlabel
        name: Target mutation - add unique label
        if: runner.name == 'A1-WINDOWS-COMPUTE-02'
        continue-on-error: true
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          $body = '{"labels":["a1-machine2-exact"]}'
          $null = $body | gh api --method POST 'repos/DontAsk3010/a1-clean-orchestration/actions/runners/32/labels' --input -
          if ($LASTEXITCODE -ne 0) { throw 'M2_UNIQUE_LABEL_REGISTRATION_FAILED' }
      - id: targetread
        name: Target readback - label present on agent 32
        if: runner.name == 'A1-WINDOWS-COMPUTE-02'
        continue-on-error: true
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
