name: Claude Open=Low Pattern Mining V1

on:
  push:
    branches:
      - research/claude-mg-discovery
    paths:
      - claude-mg-openlow-mining-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-claude-openlow-mining
  cancel-in-progress: true

jobs:
  mine:
    name: Sort and group Open=Low signals, derive boundaries from recurring cells
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 720
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'claude-mg-openlow-mining-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_CLAUDE_OPENLOW_MINING_REQUEST_V1') { throw 'Unsupported request schema.' }
          if ($req.enabled -ne $true) { throw 'Request disabled.' }
          if ($req.authorization_phrase -ne 'AUTHORIZE_CLAUDE_OPENLOW_MINING_V1') { throw 'Authorization phrase required.' }
          if ($req.source_name -match '(?i)mar(et)?') { throw 'Refusing source name that may be the reserved March 2025 OOS month.' }

      - name: Verify Drive bindings
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:A1_DRIVE_READER_CREDENTIALS)) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Drive credential binding missing.' }
          }

      - name: Install compile test
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'INSTALL_FAILED' }
          py -3.11 -m compileall -q src tests
          if ($LASTEXITCODE -ne 0) { throw 'COMPILE_FAILED' }
          py -3.11 -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'TESTS_FAILED' }

      - name: Mine patterns
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'claude-mg-openlow-mining-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          & py -3.11 -m a1clean.formula_research.claude_openlow_pattern_mining_v1 `
            --source-name $req.source_name `
            --min-chg-pct $req.min_chg_pct `
            --strength-target-pct $req.strength_target_pct `
            --buckets $req.buckets `
            --min-support $req.min_support `
            --max-combo $req.max_combo `
            --top-cells $req.top_cells `
            --output 'claude-openlow-mining-result.json' `
            --report-output 'claude-openlow-mining-report.txt' `
            --feed-output 'claude-openlow-screening-feed.txt' `
            --from-time '09:00' `
            --slot-minutes 5 `
            --capital-per-signal $req.capital_per_signal
          if ($LASTEXITCODE -ne 0) { throw "CLAUDE_OPENLOW_MINING_RUN_FAILED:$LASTEXITCODE" }

      - name: Print mining report to log
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '===== OPEN=LOW SCREENING FEED (contoh 2 hari pertama) ====='
          Get-Content -LiteralPath 'claude-openlow-screening-feed.txt' -Encoding UTF8 -TotalCount 160 | Write-Host
          Write-Host '(feed lengkap ada di artifact; log dipotong supaya blok mining di bawah ini terbaca)'
          Write-Host '===== OPEN=LOW PATTERN MINING ====='
          Get-Content -LiteralPath 'claude-openlow-mining-report.txt' -Encoding UTF8 | Write-Host
          Write-Host '===== END ====='

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-openlow-mining-${{ github.run_id }}
          path: |
            claude-openlow-mining-result.json
            claude-openlow-mining-report.txt
            claude-openlow-screening-feed.txt
          if-no-files-found: error
          retention-days: 30
