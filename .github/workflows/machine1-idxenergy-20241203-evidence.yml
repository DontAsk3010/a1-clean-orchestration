name: Machine1 IDXENERGY 20241203 Evidence Extract

on:
  push:
    branches:
      - machine1/evidence-bbss-20241203
    paths:
      - .github/workflows/machine1-idxenergy-20241203-evidence.yml

permissions:
  contents: read

jobs:
  extract-idxenergy:
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\\TRADING SYSTEM\\02_CURRENT_HISTORICAL_RAW_DATA_UJI\\Raw Des 02-31-2024.csv'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract exact governed IDXENERGY packet
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import csv, hashlib, json, os, pathlib

          raw = pathlib.Path(os.environ['RAW_FILE'])
          ticker = 'IDXENERGY'
          trading_date = '2024-12-03'
          expected_md5 = 'b8d42b35c90d2dff8b18ae4e1734523b'
          expected_sha256 = '5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          expected_first = 693059
          expected_last = 693393
          expected_count = 335
          expected_first_dt = '2024-12-03 09:00:00'
          expected_last_dt = '2024-12-03 16:14:00'

          if not raw.is_file():
              raise SystemExit(f'RAW_MISSING: {raw}')

          md5 = hashlib.md5(); sha256 = hashlib.sha256()
          with raw.open('rb') as f:
              for chunk in iter(lambda: f.read(8*1024*1024), b''):
                  md5.update(chunk); sha256.update(chunk)
          got_md5, got_sha256 = md5.hexdigest(), sha256.hexdigest()
          if got_md5 != expected_md5 or got_sha256 != expected_sha256:
              raise SystemExit(f'RAW_HASH_MISMATCH md5={got_md5} sha256={got_sha256}')

          arr = []
          with raw.open('r', encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              for source_row, row in enumerate(reader, start=1):
                  if row.get('RAW_TICKER') == ticker and row.get('RAW_DATETIME_ISO','').startswith(trading_date):
                      arr.append((source_row, row))

          if len(arr) != expected_count:
              raise SystemExit(f'ROW_COUNT_MISMATCH got={len(arr)} expected={expected_count}')
          rows = [n for n,_ in arr]
          if rows[0] != expected_first or rows[-1] != expected_last:
              raise SystemExit(f'SOURCE_RANGE_MISMATCH got={rows[0]}-{rows[-1]} expected={expected_first}-{expected_last}')
          if arr[0][1]['RAW_DATETIME_ISO'] != expected_first_dt or arr[-1][1]['RAW_DATETIME_ISO'] != expected_last_dt:
              raise SystemExit(f'TIME_RANGE_MISMATCH got={arr[0][1]["RAW_DATETIME_ISO"]}-{arr[-1][1]["RAW_DATETIME_ISO"]}')
          if rows != list(range(expected_first, expected_last + 1)):
              raise SystemExit('SOURCE_ROWS_NOT_CONTIGUOUS')

          out = pathlib.Path('idxenergy_20241203_evidence')
          out.mkdir(exist_ok=True)
          packet = {
              'source_name': raw.name,
              'source_md5': got_md5,
              'source_sha256': got_sha256,
              'ticker': ticker,
              'trading_date': trading_date,
              'semantic_bundle': 'Raw Des 02-31-2024__SEMANTIC_0007.jsonl',
              'bundle_line_number': 50,
              'source_row_first': rows[0],
              'source_row_last': rows[-1],
              'data_rows': len(arr),
              'first_datetime': arr[0][1]['RAW_DATETIME_ISO'],
              'last_datetime': arr[-1][1]['RAW_DATETIME_ISO'],
              'header_fields': list(arr[0][1].keys()),
              'rows': [{'source_row': n, **r} for n,r in arr],
          }
          (out / 'IDXENERGY_20241203_PACKET.json').write_text(json.dumps(packet, ensure_ascii=False, indent=2), encoding='utf-8')
          with (out / 'IDXENERGY_20241203_ROWS.jsonl').open('w', encoding='utf-8', newline='\n') as w:
              for n,r in arr:
                  w.write(json.dumps({'source_row': n, **r}, ensure_ascii=False, separators=(',',':')) + '\n')
          proof = {
              'status':'PASS',
              'source_name': raw.name,
              'source_md5': got_md5,
              'source_sha256': got_sha256,
              'ticker': ticker,
              'trading_date': trading_date,
              'source_row_first': rows[0],
              'source_row_last': rows[-1],
              'data_rows': len(arr),
              'first_datetime': arr[0][1]['RAW_DATETIME_ISO'],
              'last_datetime': arr[-1][1]['RAW_DATETIME_ISO'],
          }
          (out / 'PROOF.json').write_text(json.dumps(proof, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(proof, ensure_ascii=False))
          '@ | Set-Content -LiteralPath extract_idxenergy_20241203.py -Encoding UTF8
          py -3.11 extract_idxenergy_20241203.py

      - name: Upload governed IDXENERGY evidence
        uses: actions/upload-artifact@v4
        with:
          name: machine1-idxenergy-20241203-evidence
          path: idxenergy_20241203_evidence/
          if-no-files-found: error
          retention-days: 7
