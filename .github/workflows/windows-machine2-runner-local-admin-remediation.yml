name: Windows Machine2 Local Runner Admin Remediation

on:
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/windows-machine2-runner-local-admin-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1-windows-machine2-runner-local-admin-remediation
  cancel-in-progress: false

jobs:
  discover_and_assign:
    name: Discover bound runner-admin credential and assign exact label ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [A, B, C, D]
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 12
    steps:
      - name: Probe and use only pre-bound admin credential candidates on runner 31
        if: runner.name == 'A1-WINDOWS-COMPUTE'
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY
          $api = "$env:GITHUB_API_URL/repos/$repo/actions/runners"
          $targetName = 'A1-WINDOWS-COMPUTE-02'
          $targetLabel = 'a1-machine2-exact'

          $candidateNames = @(
            'A1_GITHUB_RUNNER_ADMIN_TOKEN',
            'A1_GITHUB_ADMIN_TOKEN',
            'A1_GITHUB_TOKEN',
            'GH_ADMIN_TOKEN',
            'GITHUB_ADMIN_TOKEN',
            'GH_PAT',
            'GITHUB_PAT',
            'GH_TOKEN',
            'GITHUB_TOKEN'
          )

          $present = @()
          foreach ($name in $candidateNames) {
            $value = [Environment]::GetEnvironmentVariable($name, 'Process')
            if ([string]::IsNullOrWhiteSpace($value)) {
              $value = [Environment]::GetEnvironmentVariable($name, 'Machine')
            }
            if ([string]::IsNullOrWhiteSpace($value)) {
              $value = [Environment]::GetEnvironmentVariable($name, 'User')
            }
            if (-not [string]::IsNullOrWhiteSpace($value)) {
              $present += $name
            }
          }
          Write-Host ('M2_LOCAL_ADMIN_CREDENTIAL_NAMES_PRESENT=' + (($present | Sort-Object -Unique) -join ','))
          if ($present.Count -eq 0) {
            throw 'M2_LOCAL_ADMIN_REMEDIATION_HOLD:NO_BOUND_ADMIN_CREDENTIAL_CANDIDATE'
          }

          $selectedName = $null
          $selectedToken = $null
          $runners = $null

          foreach ($name in ($present | Sort-Object -Unique)) {
            $token = [Environment]::GetEnvironmentVariable($name, 'Process')
            if ([string]::IsNullOrWhiteSpace($token)) { $token = [Environment]::GetEnvironmentVariable($name, 'Machine') }
            if ([string]::IsNullOrWhiteSpace($token)) { $token = [Environment]::GetEnvironmentVariable($name, 'User') }
            if ([string]::IsNullOrWhiteSpace($token)) { continue }

            $headers = @{
              Authorization = "Bearer $token"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }

            try {
              $resp = Invoke-RestMethod -Method Get -Uri "$api?per_page=100" -Headers $headers
              $selectedName = $name
              $selectedToken = $token
              $runners = $resp
              Write-Host "M2_LOCAL_ADMIN_CAPABILITY_PASS=true|credential_name=$name"
              break
            } catch {
              if ($_.Exception.Response) {
                Write-Host "M2_LOCAL_ADMIN_CAPABILITY_DENIED|credential_name=$name|http=$([int]$_.Exception.Response.StatusCode)"
              } else {
                Write-Host "M2_LOCAL_ADMIN_CAPABILITY_ERROR|credential_name=$name|class=$($_.Exception.GetType().Name)"
              }
            } finally {
              $headers = $null
              $token = $null
            }
          }

          if (-not $selectedName -or [string]::IsNullOrWhiteSpace($selectedToken) -or -not $runners) {
            throw 'M2_LOCAL_ADMIN_REMEDIATION_HOLD:NO_AUTHORIZED_BOUND_CREDENTIAL'
          }

          try {
            $targets = @($runners.runners | Where-Object { [string]$_.name -eq $targetName })
            if ($targets.Count -ne 1) {
              throw "M2_LOCAL_ADMIN_TARGET_RESOLUTION_HOLD:count=$($targets.Count)"
            }
            $targetId = [int64]$targets[0].id
            Write-Host "M2_LOCAL_ADMIN_TARGET_ID=$targetId"
            Write-Host "M2_LOCAL_ADMIN_TARGET_STATUS=$($targets[0].status)"

            $headers = @{
              Authorization = "Bearer $selectedToken"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $body = @{ labels = @($targetLabel) } | ConvertTo-Json -Compress
            Invoke-RestMethod -Method Post -Uri "$api/$targetId/labels" -Headers $headers -ContentType 'application/json' -Body $body | Out-Null

            $targetReadback = Invoke-RestMethod -Method Get -Uri "$api/$targetId/labels" -Headers $headers
            $targetNames = @($targetReadback.labels | ForEach-Object { [string]$_.name })
            if ($targetLabel -notin $targetNames) {
              throw 'M2_LOCAL_ADMIN_TARGET_LABEL_READBACK_MISSING'
            }

            foreach ($runner in @($runners.runners)) {
              if ([int64]$runner.id -eq $targetId) { continue }
              $other = Invoke-RestMethod -Method Get -Uri "$api/$($runner.id)/labels" -Headers $headers
              $otherNames = @($other.labels | ForEach-Object { [string]$_.name })
              if ($targetLabel -in $otherNames) {
                throw "M2_LOCAL_ADMIN_UNIQUE_LABEL_COLLISION:runner=$($runner.name):id=$($runner.id)"
              }
            }

            Write-Host 'M2_LOCAL_ADMIN_UNIQUE_SERVER_SIDE_LABEL_PASS=true'
            Write-Host 'M2_LOCAL_ADMIN_EXACT_SELECTOR=self-hosted,windows,x64,a1-machine2-exact'
          } finally {
            $selectedToken = $null
            $headers = $null
            $runners = $null
          }

      - name: Non-executor lane marker
        if: runner.name != 'A1-WINDOWS-COMPUTE'
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Write-Host "M2_LOCAL_ADMIN_NON_EXECUTOR=true|runner=$env:RUNNER_NAME"

  exact_route_proof:
    name: Prove exact Machine2 route after local remediation
    needs: discover_and_assign
    runs-on: [self-hosted, windows, x64, a1-machine2-exact]
    timeout-minutes: 10
    steps:
      - name: Exact target identity proof
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "M2_LOCAL_ROUTE_PROOF_RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "M2_LOCAL_ROUTE_PROOF_COMPUTERNAME=$env:COMPUTERNAME"
          if ($env:RUNNER_NAME -ne 'A1-WINDOWS-COMPUTE-02') {
            throw "M2_LOCAL_EXACT_ROUTING_WRONG_RUNNER:$env:RUNNER_NAME"
          }
          if ($env:COMPUTERNAME -ne 'PORSCHE-DESIGN') {
            throw "M2_LOCAL_EXACT_ROUTING_WRONG_MACHINE:$env:COMPUTERNAME"
          }
          Write-Host 'M2_LOCAL_DETERMINISTIC_EXACT_RUNNER_ROUTING_PASS=true'
