name: Machine1 FOLK-GGRM Evidence Extract

on:
  push:
    branches:
      - machine1/evidence-bbss-20241203

permissions:
  contents: read

jobs:
  extract-governed-block:
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI\Raw Des 02-31-2024.csv'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract exact governed ticker packets
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import csv, hashlib, json, os, pathlib
          raw = pathlib.Path(os.environ['RAW_FILE'])
          expected_md5 = 'b8d42b35c90d2dff8b18ae4e1734523b'
          expected_sha256 = '5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          specs = {
              'FOLK': {'first':559711,'last':559723,'count':13,'first_time':'09:00:00','last_time':'16:08:00'},
              'FOOD': {'first':559475,'last':559481,'count':7,'first_time':'09:41:00','last_time':'16:00:00'},
              'FORU': {'first':560044,'last':560104,'count':61,'first_time':'09:02:00','last_time':'16:00:00'},
              'FPNI': {'first':564189,'last':564227,'count':39,'first_time':'09:00:00','last_time':'16:13:00'},
              'FUJI': {'first':561826,'last':561948,'count':123,'first_time':'09:00:00','last_time':'16:01:00'},
              'FWCT': {'first':565940,'last':566071,'count':132,'first_time':'09:00:00','last_time':'16:13:00'},
              'GDST': {'first':567699,'last':567761,'count':63,'first_time':'09:00:00','last_time':'16:02:00'},
              'GDYR': {'first':567217,'last':567223,'count':7,'first_time':'09:17:00','last_time':'16:09:00'},
              'GEMS': {'first':571689,'last':571915,'count':227,'first_time':'09:01:00','last_time':'16:09:00'},
              'GGRM': {'first':574285,'last':574460,'count':176,'first_time':'09:00:00','last_time':'16:11:00'},
          }
          if not raw.is_file(): raise SystemExit(f'RAW_MISSING: {raw}')
          md5=hashlib.md5(); sha256=hashlib.sha256()
          with raw.open('rb') as f:
              for chunk in iter(lambda: f.read(8*1024*1024), b''):
                  md5.update(chunk); sha256.update(chunk)
          got_md5, got_sha256=md5.hexdigest(), sha256.hexdigest()
          if got_md5 != expected_md5 or got_sha256 != expected_sha256:
              raise SystemExit(f'RAW_HASH_MISMATCH md5={got_md5} sha256={got_sha256}')
          hits={k:[] for k in specs}
          with raw.open('r',encoding='utf-8-sig',newline='') as f:
              reader=csv.DictReader(f)
              for source_row,row in enumerate(reader,start=1):
                  t=row.get('RAW_TICKER')
                  if t in hits and row.get('RAW_DATETIME_ISO','').startswith('2024-12-03'):
                      hits[t].append((source_row,row))
          out=pathlib.Path('machine1_folk_ggrm_evidence'); out.mkdir(exist_ok=True)
          manifest=[]
          for ticker,s in specs.items():
              arr=hits[ticker]; rows=[n for n,_ in arr]
              if len(arr)!=s['count']: raise SystemExit(f'{ticker}_ROW_COUNT_MISMATCH got={len(arr)} expected={s["count"]}')
              if rows != list(range(s['first'],s['last']+1)): raise SystemExit(f'{ticker}_SOURCE_ROW_MISMATCH first={rows[:3]} last={rows[-3:]}')
              first_dt=arr[0][1]['RAW_DATETIME_ISO']; last_dt=arr[-1][1]['RAW_DATETIME_ISO']
              if s['first_time'] not in first_dt or s['last_time'] not in last_dt: raise SystemExit(f'{ticker}_BOUNDARY_TIME_MISMATCH first={first_dt} last={last_dt}')
              packet={'source_name':raw.name,'source_md5':got_md5,'source_sha256':got_sha256,'ticker':ticker,'trading_date':'2024-12-03','source_row_first':rows[0],'source_row_last':rows[-1],'data_rows':len(arr),'first_datetime':first_dt,'last_datetime':last_dt,'header_fields':list(arr[0][1].keys()),'rows':[{'source_row':n,**r} for n,r in arr]}
              (out/f'{ticker}_20241203_PACKET.json').write_text(json.dumps(packet,ensure_ascii=False,indent=2),encoding='utf-8')
              with (out/f'{ticker}_20241203_ROWS.jsonl').open('w',encoding='utf-8',newline='\n') as w:
                  for n,r in arr: w.write(json.dumps({'source_row':n,**r},ensure_ascii=False,separators=(',',':'))+'\n')
              manifest.append({k:packet[k] for k in ['ticker','trading_date','source_row_first','source_row_last','data_rows','first_datetime','last_datetime']})
              print(f'{ticker}_PACKET_PASS rows={len(arr)} source_rows={rows[0]}-{rows[-1]} first={first_dt} last={last_dt}')
          (out/'CHUNK_MANIFEST.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          '@ | Set-Content -LiteralPath extract_folk_ggrm.py -Encoding UTF8
          py -3.11 extract_folk_ggrm.py

      - name: Upload evidence block
        uses: actions/upload-artifact@v4
        with:
          name: machine1-folk-ggrm-20241203-evidence
          path: machine1_folk_ggrm_evidence/
          if-no-files-found: error
          retention-days: 7
