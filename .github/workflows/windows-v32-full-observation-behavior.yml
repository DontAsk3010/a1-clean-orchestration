name: Windows V3.2 Full Observation and Behavior Capability Dynamic

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - 'v32-full-observation-behavior-requests/current.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1-windows-v32-full-observation-behavior
  cancel-in-progress: true

jobs:
  enrich:
    name: Dynamic-source evidence substrate under current authority contract
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 4320
    env:
      A1_RAW_DIR: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI'
      A1_MG_FEATURE_CACHE_ROOT: 'C:\Users\feri-admin\.a1clean\mg_normalized_cache_v1'
      PSExecutionPolicyPreference: Bypass

    steps:
      - name: Checkout exact trigger revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 96

      - name: Provision portable Python 3.11
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $pyRoot = Join-Path $env:RUNNER_TEMP 'a1-python-3.11.9'
          $zip = Join-Path $env:RUNNER_TEMP 'python-3.11.9-embed-amd64.zip'
          $getPip = Join-Path $env:RUNNER_TEMP 'get-pip.py'
          if (-not (Test-Path -LiteralPath (Join-Path $pyRoot 'python.exe') -PathType Leaf)) {
            Remove-Item -LiteralPath $pyRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $pyRoot | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $pyRoot -Force
            $pth = Join-Path $pyRoot 'python311._pth'
            (Get-Content -LiteralPath $pth -Raw).Replace('#import site','import site') | Set-Content -LiteralPath $pth -Encoding ascii
            Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
            & (Join-Path $pyRoot 'python.exe') $getPip --no-warn-script-location
            if ($LASTEXITCODE -ne 0) { throw 'V32_DYNAMIC_PORTABLE_PIP_BOOTSTRAP_FAILED' }
          }
          $py = Join-Path $pyRoot 'python.exe'
          & $py --version
          if ($LASTEXITCODE -ne 0) { throw 'V32_DYNAMIC_PORTABLE_PYTHON_UNAVAILABLE' }
          "A1_PYTHON_EXE=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $pyRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install compile and run lightweight implementation tests
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'V32_DYNAMIC_INSTALL_FAILED' }
          & $env:A1_PYTHON_EXE -m py_compile `
            src/a1clean/formula_research/source_universe_manifest.py `
            src/a1clean/formula_research/source_universe_drive_preflight.py `
            src/a1clean/formula_research/v32_dynamic_prestart.py `
            src/a1clean/formula_research/v32_observation_envelope_dynamic.py `
            src/a1clean/formula_research/v32_full_observation_semantic_dynamic.py
          if ($LASTEXITCODE -ne 0) { throw 'V32_DYNAMIC_COMPILE_FAILED' }
          & $env:A1_PYTHON_EXE -m pytest -q `
            tests/test_source_universe_manifest.py `
            tests/test_v32_dynamic_prestart.py `
            tests/test_v30_semantic_journey_enrichment.py `
            tests/test_v31_full_chronological_semantic_enrichment.py `
            tests/test_v32_observation_envelope.py `
            tests/test_v32_full_observation_semantic_dynamic.py
          if ($LASTEXITCODE -ne 0) { throw 'V32_DYNAMIC_TEST_FAILED' }

      - name: Verify runner credentials and current state roots
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:A1_DRIVE_READER_CREDENTIALS)) { throw 'V32_DYNAMIC_DRIVE_READER_CREDENTIALS_NOT_CONFIGURED' }
          if (-not (Test-Path -LiteralPath $env:A1_DRIVE_READER_CREDENTIALS -PathType Leaf)) { throw 'V32_DYNAMIC_DRIVE_READER_CREDENTIALS_FILE_MISSING' }
          if (-not (Test-Path -LiteralPath 'C:\Users\feri-admin\.a1clean' -PathType Container)) { throw 'V32_DYNAMIC_STATE_ROOT_MISSING' }

      - name: Build governed dynamic source universe from current Drive controls
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Join-Path $env:RUNNER_TEMP 'a1-source-universe-manifest.json'
          $stamp = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.source_universe_drive_preflight `
            --authority-lock governance/a1-clean-active-authority-lock.json `
            --output $manifest `
            --discovery-time-utc $stamp
          if ($LASTEXITCODE -ne 0) { throw "V32_DYNAMIC_SOURCE_UNIVERSE_HOLD:$LASTEXITCODE" }
          $u = Get-Content -LiteralPath $manifest -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($u.status -ne 'PASS' -or $u.dynamic_source_universe_required -ne $true -or $u.fixed_source_count_as_invariant_forbidden -ne $true) { throw 'V32_DYNAMIC_SOURCE_UNIVERSE_PRESTART_FAIL' }
          if ([int]$u.source_count -lt 1 -or $u.sources.Count -ne [int]$u.source_count) { throw 'V32_DYNAMIC_SOURCE_UNIVERSE_CARDINALITY_FAIL' }
          "A1_SOURCE_UNIVERSE_MANIFEST=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_SOURCE_UNIVERSE_COUNT=$($u.source_count)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_SOURCE_UNIVERSE_DIGEST=$($u.manifest_digest)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: PRESTART latest-authority request benchmark source and semantic gate
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.v32_dynamic_prestart `
            --request v32-full-observation-behavior-requests/current.json `
            --authority-lock governance/a1-clean-active-authority-lock.json `
            --source-universe-manifest $env:A1_SOURCE_UNIVERSE_MANIFEST `
            --require-enabled
          if ($LASTEXITCODE -ne 0) { throw "V32_DYNAMIC_PRESTART_FAIL:$LASTEXITCODE" }

          $req = Get-Content -LiteralPath 'v32-full-observation-behavior-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_V32_FULL_OBSERVATION_BEHAVIOR_REQUEST_V2') { throw 'V32_DYNAMIC_REQUEST_SCHEMA_MISMATCH' }
          if ($req.scope_class -ne 'EVIDENCE_SUBSTRATE_ONLY_NOT_FINAL_ATLAS') { throw 'V32_DYNAMIC_SCOPE_CLASS_FAIL' }
          if ($req.formula_stage -ne 'CLOSED') { throw 'V32_DYNAMIC_FORMULA_STAGE_MUST_BE_CLOSED' }
          if ($req.full_source_supported_observation_envelope -ne $true -or $req.all_source_columns_retrievable_required -ne $true) { throw 'V32_DYNAMIC_FULL_ENVELOPE_CONTRACT_FAIL' }
          if ($req.regular_behavior_stream_isolated -ne $true -or $req.behavior_lifecycle_required -ne $true -or $req.behavior_path_required -ne $true) { throw 'V32_DYNAMIC_BEHAVIOR_CONTRACT_FAIL' }
          if ($req.unnamed_state_transitions_must_be_preserved -ne $true) { throw 'V32_DYNAMIC_UNNAMED_TRANSITIONS_REQUIRED' }
          if ($req.manual_labels_used_as_hidden_targets -ne $false -or $req.arbitrary_thresholds_added -ne $false -or $req.missing_as_zero -ne $false) { throw 'V32_DYNAMIC_PROHIBITION_FAIL' }
          if ($req.v31_immutable -ne $true -or $req.v2x_immutable -ne $true) { throw 'V32_DYNAMIC_PRIOR_LINEAGE_IMMUTABILITY_REQUIRED' }
          if ($req.temporal_behavior_sequence_downstream_required -ne $true -or $req.permanent_blindspot_register_downstream_required -ne $true -or $req.future_hpx_lane_gate_downstream_required -ne $true) { throw 'V32_DYNAMIC_DOWNSTREAM_OWNER_LOCK_FAIL' }
          if ($req.dual_independent_full_depth_research_engines_required -ne $true -or $req.machine1_machine2_division_of_labor_forbidden -ne $true) { throw 'V32_DYNAMIC_DUAL_ENGINE_LOCK_FAIL' }

          $coverage = Get-Content -LiteralPath 'v32-manual-behavior-benchmark-coverage/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($coverage.schema -ne 'A1_V32_MANUAL_BEHAVIOR_BENCHMARK_COVERAGE_V1' -or $coverage.status -ne 'PASS_READY_FOR_FULL_CORPUS_RUN') { throw 'V32_DYNAMIC_BENCHMARK_COVERAGE_NOT_READY' }
          $blocking = @($coverage.requirements | Where-Object { [string]$_.status -match 'BLOCKING|NOT_IMPLEMENTED|NOT_COMPLETE|NOT_YET_PROVEN' })
          if ($blocking.Count -ne 0) { throw "V32_DYNAMIC_BENCHMARK_BLOCKING_REQUIREMENTS_REMAIN:$($blocking.Count)" }

          $softwareRevision = [string]$req.required_parent_revision
          if ([string]::IsNullOrWhiteSpace($softwareRevision)) { throw 'V32_DYNAMIC_PARENT_REVISION_EMPTY' }
          git -c "safe.directory=$PWD" cat-file -e "$softwareRevision^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'V32_DYNAMIC_PARENT_REVISION_NOT_FOUND' }
          $semanticPaths = @(
            'src/a1clean/formula_research/v30_semantic_journey_enrichment.py',
            'src/a1clean/formula_research/v32_observation_envelope.py',
            'src/a1clean/formula_research/v32_behavior_lifecycle.py',
            'src/a1clean/formula_research/v32_full_observation_semantic_enrichment.py',
            'src/a1clean/formula_research/haka_haki_reconstruction.py'
          )
          $semanticChanged = @(git -c "safe.directory=$PWD" diff --name-only "$softwareRevision..HEAD" -- $semanticPaths)
          if ($LASTEXITCODE -ne 0) { throw 'V32_DYNAMIC_SEMANTIC_REVISION_DIFF_CHECK_FAILED' }
          if ($semanticChanged.Count -ne 0) { throw "V32_DYNAMIC_BASE_SEMANTIC_CODE_DRIFT:$($semanticChanged -join ',')" }

          "A1_V32_SOFTWARE_REVISION=$softwareRevision" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $out = Join-Path 'C:\Users\feri-admin\.a1clean\v32_full_observation_behavior\schema-v3' $softwareRevision
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "V32_OUTPUT_ROOT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_V32_SCOPE_CLASS=EVIDENCE_SUBSTRATE_ONLY_NOT_FINAL_ATLAS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PRESTART_COMPLETENESS_PASS|scope=V32_FULL_OBSERVATION_DYNAMIC|sources=$env:A1_SOURCE_UNIVERSE_COUNT"

      - name: Build or reuse dynamic V3.2 evidence corpus
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.v32_full_observation_semantic_dynamic `
            --output-root $env:V32_OUTPUT_ROOT `
            --source-universe-manifest $env:A1_SOURCE_UNIVERSE_MANIFEST
          if ($LASTEXITCODE -ne 0) { throw "V32_DYNAMIC_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Assert dynamic full-source evidence and lineage reconciliation
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $u = Get-Content -LiteralPath $env:A1_SOURCE_UNIVERSE_MANIFEST -Raw -Encoding UTF8 | ConvertFrom-Json
          $m = Get-Content -LiteralPath (Join-Path $env:V32_OUTPUT_ROOT 'manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($m.schema -ne 'A1_V32_FULL_OBSERVATION_SEMANTIC_ENRICHMENT_V3' -or $m.status -ne 'PASS') { throw 'V32_DYNAMIC_MANIFEST_IDENTITY_FAIL' }
          if ($m.dynamic_source_universe -ne $true -or $m.source_count_is_dynamic -ne $true -or $m.fixed_source_count_invariant_used -ne $false) { throw 'V32_DYNAMIC_SOURCE_CONTRACT_FAIL' }
          if ([string]$m.source_universe_manifest_digest -ne [string]$u.manifest_digest) { throw 'V32_DYNAMIC_SOURCE_MANIFEST_BINDING_FAIL' }
          if ([int64]$m.reconciliation.source_count -ne [int64]$u.source_count) { throw 'V32_DYNAMIC_SOURCE_COUNT_RECONCILIATION_FAIL' }
          if ($m.reconciliation.pass -ne $true -or [int64]$m.reconciliation.excluded_rows -ne 0) { throw 'V32_DYNAMIC_RECONCILIATION_FAIL' }
          if ($m.reconciliation.full_equals_regular_plus_nonregular -ne $true) { throw 'V32_DYNAMIC_LAYER_ACCOUNTING_FAIL' }
          if ($m.reconciliation.behavior_day_profile_coverage_pass -ne $true -or $m.reconciliation.behavior_path_coverage_pass -ne $true) { throw 'V32_DYNAMIC_BEHAVIOR_DAY_OR_PATH_COVERAGE_FAIL' }
          if ($m.reconciliation.behavior_lifecycle_journey_coverage_pass -ne $true -or $m.reconciliation.behavior_lifecycle_contract_pass -ne $true) { throw 'V32_DYNAMIC_LIFECYCLE_COVERAGE_FAIL' }
          if ($m.contract.full_source_supported_observation_envelope_preserved -ne $true -or $m.contract.all_source_columns_retrievable_from_full_observation_layer -ne $true) { throw 'V32_DYNAMIC_FULL_ENVELOPE_FLAG_FAIL' }
          if ($m.contract.source_values_retained_for_every_observation -ne $true -or $m.contract.source_packet_fingerprint_preserved -ne $true) { throw 'V32_DYNAMIC_SOURCE_VALUE_RETENTION_FAIL' }
          if ($m.contract.cross_date_carry_uses_terminal_source_observation -ne $true -or $m.contract.manual_behavior_lifecycle_contract_materialized -ne $true) { throw 'V32_DYNAMIC_TEMPORAL_CONTRACT_FAIL' }
          if ($m.contract.unnamed_state_transitions_preserved -ne $true -or $m.contract.manual_labels_not_used_as_hidden_targets -ne $true) { throw 'V32_DYNAMIC_CAUSAL_CONTRACT_FAIL' }
          if ($m.contract.exact_source_compatible_checkpoint_reuse -ne $true) { throw 'V32_DYNAMIC_CHECKPOINT_REUSE_CONTRACT_FAIL' }
          if ($m.aali_concordance_gate.pass -ne $true) { throw 'V32_DYNAMIC_AALI_CONCORDANCE_FAIL' }
          if ($m.source_summaries.Count -ne [int]$u.source_count) { throw 'V32_DYNAMIC_SOURCE_SUMMARY_COUNT_FAIL' }
          foreach ($s in $m.source_summaries) {
            if ($s.status -ne 'PASS') { throw "V32_DYNAMIC_SOURCE_NOT_PASS:$($s.source)" }
            if ($s.all_source_columns_retrievable -ne $true) { throw "V32_DYNAMIC_SOURCE_FIELDS_NOT_RETRIEVABLE:$($s.source)" }
            foreach ($key in @('ticker_days','formation_runs','event_journeys','phase_context','full_observation_envelope','regular_behavior_stream','behavior_day_profiles','behavior_lifecycle','behavior_paths')) {
              $meta = $s.output_files.$key
              if ($null -eq $meta -or [string]::IsNullOrWhiteSpace([string]$meta.sha256) -or [int64]$meta.bytes -lt 0) { throw "V32_DYNAMIC_OUTPUT_HASH_METADATA_FAIL:$($s.source):$key" }
            }
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### V3.2 dynamic-source evidence substrate'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Governed sources: $($u.source_count)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Reused exact source checkpoints: $($m.reconciliation.reused_pass_sources)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Newly built sources: $($m.reconciliation.built_sources)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '- Scope: evidence substrate only; NOT final atlas and NOT formula.'

      - name: Exact second-run readback proves source-compatible checkpoint reuse
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.v32_full_observation_semantic_dynamic `
            --output-root $env:V32_OUTPUT_ROOT `
            --source-universe-manifest $env:A1_SOURCE_UNIVERSE_MANIFEST
          if ($LASTEXITCODE -ne 0) { throw "V32_DYNAMIC_READBACK_RUNTIME_FAILED:$LASTEXITCODE" }
          $m = Get-Content -LiteralPath (Join-Path $env:V32_OUTPUT_ROOT 'manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([int64]$m.reconciliation.reused_pass_sources -ne [int64]$m.reconciliation.source_count) { throw "V32_DYNAMIC_READBACK_REUSE_FAIL:$($m.reconciliation.reused_pass_sources):$($m.reconciliation.source_count)" }
          if ([int64]$m.reconciliation.built_sources -ne 0) { throw "V32_DYNAMIC_READBACK_UNEXPECTED_REBUILD:$($m.reconciliation.built_sources)" }
          if ($m.reconciliation.behavior_path_coverage_pass -ne $true -or $m.reconciliation.behavior_lifecycle_contract_pass -ne $true) { throw 'V32_DYNAMIC_READBACK_COVERAGE_FAIL' }

      - name: Build compact governed summary artifact
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'v32-full-observation-dynamic-summary' | Out-Null
          Copy-Item -LiteralPath 'v32-full-observation-behavior-requests\current.json' -Destination 'v32-full-observation-dynamic-summary\request.json' -Force
          Copy-Item -LiteralPath $env:A1_SOURCE_UNIVERSE_MANIFEST -Destination 'v32-full-observation-dynamic-summary\source-universe-manifest.json' -Force
          Copy-Item -LiteralPath (Join-Path $env:V32_OUTPUT_ROOT 'manifest.json') -Destination 'v32-full-observation-dynamic-summary\manifest.json' -Force
          Copy-Item -LiteralPath (Join-Path $env:V32_OUTPUT_ROOT 'compact-sample.jsonl.gz') -Destination 'v32-full-observation-dynamic-summary\compact-sample.jsonl.gz' -Force

      - uses: actions/upload-artifact@v4
        with:
          name: v32-full-observation-dynamic-${{ github.run_id }}
          path: v32-full-observation-dynamic-summary
          if-no-files-found: error
          retention-days: 90
