name: Windows V3.2 Full Observation and Behavior Capability

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - 'v32-full-observation-behavior-requests/current.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1-windows-v32-full-observation-behavior
  cancel-in-progress: true

jobs:
  enrich:
    name: Build complete 18-source observation and behavior capability lineage
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 4320
    env:
      A1_RAW_DIR: 'D:\\TRADING SYSTEM\\02_CURRENT_HISTORICAL_RAW_DATA_UJI'
      A1_MG_FEATURE_CACHE_ROOT: 'C:\Users\feri-admin\.a1clean\mg_normalized_cache_v1'
      PSExecutionPolicyPreference: Bypass
    steps:
      - name: Checkout exact trigger revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Provision portable Python 3.11 for service runner
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $pyRoot = Join-Path $env:RUNNER_TEMP 'a1-python-3.11.9'
          $zip = Join-Path $env:RUNNER_TEMP 'python-3.11.9-embed-amd64.zip'
          $getPip = Join-Path $env:RUNNER_TEMP 'get-pip.py'
          if (-not (Test-Path -LiteralPath (Join-Path $pyRoot 'python.exe') -PathType Leaf)) {
            Remove-Item -LiteralPath $pyRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $pyRoot | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $pyRoot -Force
            $pth = Join-Path $pyRoot 'python311._pth'
            (Get-Content -LiteralPath $pth -Raw).Replace('#import site','import site') | Set-Content -LiteralPath $pth -Encoding ascii
            Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
            & (Join-Path $pyRoot 'python.exe') $getPip --no-warn-script-location
            if ($LASTEXITCODE -ne 0) { throw 'V32_PORTABLE_PIP_BOOTSTRAP_FAILED' }
          }
          $py = Join-Path $pyRoot 'python.exe'
          & $py --version
          if ($LASTEXITCODE -ne 0) { throw 'V32_PORTABLE_PYTHON_UNAVAILABLE' }
          "A1_PYTHON_EXE=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $pyRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate governed request and pin software revision
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'v32-full-observation-behavior-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_V32_FULL_OBSERVATION_BEHAVIOR_REQUEST_V1') { throw 'V32_REQUEST_SCHEMA_MISMATCH' }
          if ($req.enabled -ne $true) { throw 'V32_REQUEST_DISABLED' }
          $coverage = Get-Content -LiteralPath 'v32-manual-behavior-benchmark-coverage/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($coverage.schema -ne 'A1_V32_MANUAL_BEHAVIOR_BENCHMARK_COVERAGE_V1') { throw 'V32_BENCHMARK_COVERAGE_SCHEMA_MISMATCH' }
          if ($coverage.status -ne 'PASS_READY_FOR_FULL_CORPUS_RUN') { throw "V32_BENCHMARK_COVERAGE_NOT_READY:$($coverage.status)" }
          $blocking = @($coverage.requirements | Where-Object { [string]$_.status -match 'BLOCKING|NOT_IMPLEMENTED|NOT_COMPLETE|NOT_YET_PROVEN' })
          if ($blocking.Count -ne 0) { throw "V32_BENCHMARK_BLOCKING_REQUIREMENTS_REMAIN:$($blocking.Count)" }
          if ([int64]$req.required_source_count -ne 18) { throw 'V32_REQUIRED_SOURCE_COUNT_MISMATCH' }
          if ($req.march_2025_required -ne $true) { throw 'V32_MARCH_REQUIRED' }
          if ($req.full_source_supported_observation_envelope -ne $true) { throw 'V32_FULL_ENVELOPE_REQUIRED' }
          if ($req.all_source_columns_retrievable_required -ne $true) { throw 'V32_ALL_SOURCE_COLUMNS_RETRIEVABLE_REQUIRED' }
          if ($req.regular_behavior_stream_isolated -ne $true) { throw 'V32_REGULAR_STREAM_ISOLATION_REQUIRED' }
          if ($req.behavior_lifecycle_required -ne $true) { throw 'V32_LIFECYCLE_REQUIRED' }
          if ($req.behavior_path_required -ne $true) { throw 'V32_BEHAVIOR_PATH_REQUIRED' }
          if ($req.dual_reader_complete_source_scope_parity_contract_ready -ne $true) { throw 'V32_DUAL_READER_SOURCE_PARITY_CONTRACT_NOT_READY' }
          if ($req.machine1_semantic_reader_remains_independent -ne $true) { throw 'V32_MACHINE1_INDEPENDENCE_NOT_PROVEN' }
          if ($req.formula_research_not_substitute_for_machine1_behavior_pass -ne $true) { throw 'V32_FORMULA_RESEARCH_CANNOT_SUBSTITUTE_MACHINE1' }
          if ($req.manual_benchmark_evidence_retrievability_contract_ready -ne $true) { throw 'V32_MANUAL_BENCHMARK_RETRIEVAL_CONTRACT_NOT_READY' }
          if ($req.master_and_behavior_handbook_revision_bound -ne $true) { throw 'V32_AUTHORITY_REVISION_BINDING_REQUIRED' }
          if ($req.unnamed_state_transitions_must_be_preserved -ne $true) { throw 'V32_UNNAMED_TRANSITIONS_REQUIRED' }
          if ($req.manual_labels_used_as_hidden_targets -ne $false) { throw 'V32_MANUAL_HIDDEN_TARGET_FORBIDDEN' }
          if ($req.arbitrary_thresholds_added -ne $false) { throw 'V32_ARBITRARY_THRESHOLD_FORBIDDEN' }
          if ($req.v31_immutable -ne $true) { throw 'V32_V31_IMMUTABILITY_REQUIRED' }
          if ($req.v2x_immutable -ne $true) { throw 'V32_V2X_IMMUTABILITY_REQUIRED' }
          if ([int64]$req.v31_run_id -ne 35291174908) { throw 'V32_V31_RUN_BINDING_FAIL' }
          if ([int64]$req.v31_artifact_id -ne 10533633559) { throw 'V32_V31_ARTIFACT_BINDING_FAIL' }
          if ($req.v31_artifact_digest -ne 'sha256:b1f6b891aad38fa4afcdfd7e34657fb7b44456e96c8d2985d05f4f4378961f03') { throw 'V32_V31_ARTIFACT_DIGEST_FAIL' }
          if ($req.v31_corpus_digest -ne '9c2ed57ec60c81caaa0220ce57a7392473b2cf63eb23f8c846d4e961187e8732') { throw 'V32_V31_CORPUS_DIGEST_FAIL' }
          if ([int64]$req.phase_probe_run_id -ne 35322105528) { throw 'V32_PHASE_PROBE_RUN_BINDING_FAIL' }
          if ([int64]$req.phase_probe_artifact_id -ne 10537732681) { throw 'V32_PHASE_PROBE_ARTIFACT_BINDING_FAIL' }
          if ($req.phase_probe_artifact_digest -ne 'sha256:3d07b1f7a5a16acb8cc66930c7f271f2de432a6cb52340f77e43efae0e8e7057') { throw 'V32_PHASE_PROBE_DIGEST_FAIL' }

          $softwareRevision = [string]$req.required_parent_revision
          $changed = @(git -c "safe.directory=$PWD" diff --name-only "$softwareRevision..HEAD")
          if ($LASTEXITCODE -ne 0) { throw 'V32_SOFTWARE_REVISION_DIFF_CHECK_FAILED' }
          $allowedOperationalFiles = @(
            '.github/workflows/windows-v32-full-observation-behavior.yml',
            'v32-full-observation-behavior-requests/current.json',
            '.github/workflows/windows-v32-behavior-grouping-atlas.yml',
            'v32-behavior-grouping-requests/current.json',
            'src/a1clean/formula_research/v32_behavior_grouping_atlas.py',
            'tests/test_v32_behavior_grouping_atlas.py'
          )
          $unexpected = @($changed | Where-Object { $_ -notin $allowedOperationalFiles })
          if ($unexpected.Count -ne 0) { throw "V32_UNEXPECTED_CODE_CHANGE_SINCE_SOFTWARE_REVISION:$($unexpected -join ',')" }
          "A1_V32_SOFTWARE_REVISION=$softwareRevision" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $out = Join-Path "C:\Users\feri-admin\.a1clean\v32_full_observation_behavior\schema-v3" $softwareRevision
          "V32_OUTPUT_ROOT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enforce Machine 2 behavior-parity boundary
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'v32-full-observation-behavior-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $coverage = Get-Content -LiteralPath 'v32-manual-behavior-benchmark-coverage/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($coverage.benchmark_mode -ne 'EVIDENCE_RETRIEVAL_PARITY_NOT_SEMANTIC_LABEL_PARITY') { throw 'V32_BENCHMARK_MODE_DRIFT' }
          if ($req.manual_behavior_handbook_is_immutable_benchmark -ne $true) { throw 'V32_MANUAL_BENCHMARK_IMMUTABILITY_REQUIRED' }
          if ($req.machine1_semantic_reader_remains_independent -ne $true) { throw 'V32_MACHINE1_INDEPENDENCE_REQUIRED' }
          if ($req.formula_research_not_substitute_for_machine1_behavior_pass -ne $true) { throw 'V32_MACHINE2_CANNOT_SUBSTITUTE_MACHINE1' }
          $b13 = @($coverage.requirements | Where-Object { $_.id -eq 'B13' })
          $b14 = @($coverage.requirements | Where-Object { $_.id -eq 'B14' })
          if ($b13.Count -ne 1 -or $b13[0].status -ne 'LOCKED_PASS') { throw 'V32_B13_INDEPENDENCE_LOCK_MISSING' }
          if ($b14.Count -ne 1 -or $b14[0].status -ne 'LOCKED_PASS') { throw 'V32_B14_BENCHMARK_LOCK_MISSING' }
          $semanticPending = @($coverage.requirements | Where-Object {
            ([string]$_.status -eq 'SEMANTIC_BENCHMARK_TRACKED_NOT_DATA_PARITY_BLOCKER') -or
            (-not [string]::IsNullOrWhiteSpace([string]$_.gap))
          })
          if ($req.full_behavior_requirement_retrievability_proven -eq $true -and $semanticPending.Count -ne 0) {
            throw "V32_FALSE_BEHAVIOR_PARITY_CLAIM_PENDING_GAPS:$((@($semanticPending | ForEach-Object { $_.id })) -join ',')"
          }
          $gapIds = (@($semanticPending | ForEach-Object { [string]$_.id }) -join ',')
          "A1_V32_SCOPE_CLASS=EVIDENCE_RETRIEVAL_PARITY_ONLY" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_V32_SEMANTIC_GAP_IDS=$gapIds" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "### Machine 2 parity boundary"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Scope class: EVIDENCE_RETRIEVAL_PARITY_ONLY"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Machine 1 semantic reader remains independent: TRUE"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Machine 2 full behavior parity proven: FALSE while benchmark gaps remain"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Pending benchmark gap IDs: $gapIds"

      - name: Preflight legacy checkpoint access
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $legacyRoot = "C:\Users\feri-admin\.a1clean"
          if (-not (Test-Path -LiteralPath $legacyRoot -PathType Container)) { throw 'V32_LEGACY_STATE_ROOT_MISSING' }
          $v32Root = Join-Path $legacyRoot 'v32_full_observation_behavior'
          if (-not (Test-Path -LiteralPath $v32Root -PathType Container)) { throw 'V32_LEGACY_V32_OUTPUT_ROOT_MISSING' }
          $probe = Join-Path $v32Root '.service_access_probe.tmp'
          'probe' | Out-File -LiteralPath $probe -Encoding ascii
          Remove-Item -LiteralPath $probe -Force
          "A1_SERVICE_LEGACY_STATE_ACCESS=PASS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install compile and test exact V3.2 capability
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE --version
          if ($LASTEXITCODE -ne 0) { throw 'V32_SERVICE_PYTHON_UNAVAILABLE' }
          & $env:A1_PYTHON_EXE -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'V32_INSTALL_FAILED' }
          & $env:A1_PYTHON_EXE -m py_compile src/a1clean/formula_research/v32_observation_envelope.py src/a1clean/formula_research/v32_behavior_lifecycle.py src/a1clean/formula_research/v32_full_observation_semantic_enrichment.py
          if ($LASTEXITCODE -ne 0) { throw 'V32_COMPILE_FAILED' }
          & $env:A1_PYTHON_EXE -m pytest -q tests/test_v30_semantic_journey_enrichment.py tests/test_v31_full_chronological_semantic_enrichment.py tests/test_v32_observation_envelope.py
          if ($LASTEXITCODE -ne 0) { throw 'V32_TEST_FAILED' }

      - name: Verify Drive reader credential binding
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:A1_DRIVE_READER_CREDENTIALS)) { throw 'A1_DRIVE_READER_CREDENTIALS_NOT_CONFIGURED' }
          if (-not (Test-Path -LiteralPath $env:A1_DRIVE_READER_CREDENTIALS -PathType Leaf)) { throw 'A1_DRIVE_READER_CREDENTIALS_FILE_MISSING' }

      - name: Preflight governed legacy normalized-cache binding
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:A1_MG_FEATURE_CACHE_ROOT)) { throw 'V32_LEGACY_CACHE_ROOT_NOT_BOUND' }
          if (-not (Test-Path -LiteralPath $env:A1_MG_FEATURE_CACHE_ROOT -PathType Container)) { throw 'V32_LEGACY_CACHE_ROOT_MISSING' }
          & $env:A1_PYTHON_EXE -c "from a1clean.formula_research.full_chronological_cache_catalog import LEGACY_SOURCE_NAMES; from a1clean.formula_research import telegram_mg_structure_v12_runner as v12r; missing=[s for s in LEGACY_SOURCE_NAMES if (not v12r._cache_path(s).is_file()) or (not v12r._meta_path(s).is_file())]; print('V32_LEGACY_CACHE_ROOT=' + str(v12r._cache_root())); print('V32_LEGACY_CACHE_MISSING_COUNT=' + str(len(missing))); print('V32_LEGACY_CACHE_MISSING=' + '|'.join(missing) if missing else 'V32_LEGACY_CACHE_MISSING=NONE'); raise SystemExit(1 if missing else 0)"
          if ($LASTEXITCODE -ne 0) { throw 'V32_LEGACY_CACHE_PREFLIGHT_FAILED' }

      - name: Build complete V3.2 corpus
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.v32_full_observation_semantic_enrichment --output-root $env:V32_OUTPUT_ROOT
          if ($LASTEXITCODE -ne 0) { throw "V32_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Assert full source behavior and lineage reconciliation
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content -LiteralPath (Join-Path $env:V32_OUTPUT_ROOT 'manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($m.schema -ne 'A1_V32_FULL_OBSERVATION_SEMANTIC_ENRICHMENT_V3') { throw 'V32_MANIFEST_SCHEMA_FAIL' }
          if ($m.status -ne 'PASS' -or $m.reconciliation.pass -ne $true) { throw 'V32_RECONCILIATION_FAIL' }
          if ($m.software_revision -ne $env:A1_V32_SOFTWARE_REVISION) { throw 'V32_SOFTWARE_REVISION_BINDING_FAIL' }
          if ([int64]$m.reconciliation.source_count -ne 18) { throw 'V32_SOURCE_COUNT_FAIL' }
          if ([int64]$m.reconciliation.ticker_days -ne 315637) { throw 'V32_TICKER_DAY_FAIL' }
          if ([int64]$m.reconciliation.regular_rows -ne 33733344) { throw 'V32_REGULAR_ROW_FAIL' }
          if ([int64]$m.reconciliation.governed_dates -ne 347) { throw 'V32_GOVERNED_DATE_FAIL' }
          if ([int64]$m.reconciliation.excluded_rows -ne 0) { throw 'V32_EXCLUDED_ROW_FAIL' }
          if ($m.reconciliation.full_equals_regular_plus_nonregular -ne $true) { throw 'V32_LAYER_ACCOUNTING_FAIL' }
          if ([int64]$m.reconciliation.behavior_day_profiles -ne [int64]$m.reconciliation.ticker_days) { throw 'V32_BEHAVIOR_DAY_COVERAGE_FAIL' }
          if ([int64]$m.reconciliation.behavior_paths -ne [int64]$m.reconciliation.ticker_days) { throw 'V32_BEHAVIOR_PATH_COVERAGE_FAIL' }
          if ([int64]$m.reconciliation.behavior_lifecycle_journeys -ne [int64]$m.reconciliation.event_journeys) { throw 'V32_LIFECYCLE_EVENT_COVERAGE_FAIL' }
          if ([int64]$m.reconciliation.behavior_lifecycle_contract_records -ne [int64]$m.reconciliation.behavior_lifecycle_journeys) { throw 'V32_LIFECYCLE_CONTRACT_COVERAGE_FAIL' }
          if ($m.contract.full_source_supported_observation_envelope_preserved -ne $true) { throw 'V32_FULL_ENVELOPE_FLAG_FAIL' }
          if ($m.contract.all_source_columns_retrievable_from_full_observation_layer -ne $true) { throw 'V32_SOURCE_FIELD_RETRIEVABILITY_FAIL' }
          if ($m.contract.source_values_retained_for_every_observation -ne $true) { throw 'V32_SOURCE_VALUES_RETENTION_FAIL' }
          if ($m.contract.source_packet_fingerprint_preserved -ne $true) { throw 'V32_SOURCE_PACKET_FINGERPRINT_FAIL' }
          if ($m.contract.manual_benchmark_evidence_retrievability_supported -ne $true) { throw 'V32_MANUAL_BENCHMARK_RETRIEVABILITY_FAIL' }
          if ($m.contract.semantic_interpretation_independence_preserved -ne $true) { throw 'V32_SEMANTIC_INDEPENDENCE_FAIL' }
          if ($m.contract.full_layer_has_source_file_hash_generation_row_time_and_all_field_values -ne $true) { throw 'V32_FULL_TRACEBACK_CONTRACT_FAIL' }
          if ($m.contract.cross_date_carry_uses_terminal_source_observation -ne $true) { throw 'V32_TERMINAL_CARRY_FLAG_FAIL' }
          if ($m.contract.manual_behavior_lifecycle_contract_materialized -ne $true) { throw 'V32_LIFECYCLE_FLAG_FAIL' }
          if ($m.contract.all_formation_runs_and_state_changes_materialized_in_behavior_path -ne $true) { throw 'V32_BEHAVIOR_PATH_FLAG_FAIL' }
          if ($m.contract.unnamed_state_transitions_preserved -ne $true) { throw 'V32_UNNAMED_STATE_FLAG_FAIL' }
          if ($m.contract.manual_labels_not_used_as_hidden_targets -ne $true) { throw 'V32_MANUAL_TARGET_FLAG_FAIL' }
          if ($m.contract.v31_not_rewritten -ne $true -or $m.contract.v2x_not_rewritten -ne $true) { throw 'V32_IMMUTABILITY_FLAG_FAIL' }
          if ($m.aali_concordance_gate.pass -ne $true) { throw 'V32_AALI_CONCORDANCE_FAIL' }
          if ($m.source_summaries.Count -ne 18) { throw 'V32_SOURCE_SUMMARY_COUNT_FAIL' }
          foreach ($s in $m.source_summaries) {
            if ($s.status -ne 'PASS') { throw "V32_SOURCE_NOT_PASS:$($s.source)" }
            if ($s.dual_layer_materialized -ne $true) { throw "V32_SOURCE_DUAL_LAYER_FAIL:$($s.source)" }
            if ($s.all_source_columns_retrievable -ne $true) { throw "V32_SOURCE_FIELDS_NOT_RETRIEVABLE:$($s.source)" }
            if ($s.source_values_retained_for_every_observation -ne $true) { throw "V32_SOURCE_VALUES_NOT_RETAINED:$($s.source)" }
            if ($s.source_packet_fingerprint_preserved -ne $true) { throw "V32_SOURCE_PACKET_FINGERPRINT_NOT_PRESERVED:$($s.source)" }
            if ($s.manual_behavior_lifecycle_contract_materialized -ne $true) { throw "V32_SOURCE_LIFECYCLE_FAIL:$($s.source)" }
            if ($s.all_event_journeys_have_lifecycle_representation -ne $true) { throw "V32_SOURCE_EVENT_COVERAGE_FAIL:$($s.source)" }
            if ($s.unnamed_state_transitions_preserved -ne $true) { throw "V32_SOURCE_UNNAMED_STATE_FAIL:$($s.source)" }
            foreach ($key in @('ticker_days','formation_runs','event_journeys','phase_context','full_observation_envelope','regular_behavior_stream','behavior_day_profiles','behavior_lifecycle','behavior_paths')) {
              $meta = $s.output_files.$key
              if ($null -eq $meta -or [string]::IsNullOrWhiteSpace([string]$meta.sha256) -or [int64]$meta.bytes -lt 0) { throw "V32_OUTPUT_HASH_METADATA_FAIL:$($s.source):$key" }
            }
          }

      - name: Assert V3.2 result cannot be promoted as full Machine 2 behavior parity
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'v32-full-observation-behavior-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $coverage = Get-Content -LiteralPath 'v32-manual-behavior-benchmark-coverage/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $m = Get-Content -LiteralPath (Join-Path $env:V32_OUTPUT_ROOT 'manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($m.research_status -ne 'RESEARCH_ONLY_NOT_CANONICAL') { throw 'V32_RESEARCH_ONLY_BOUNDARY_FAIL' }
          if ($req.machine1_semantic_reader_remains_independent -ne $true) { throw 'V32_MACHINE1_INDEPENDENCE_DRIFT' }
          $semanticPending = @($coverage.requirements | Where-Object {
            ([string]$_.status -eq 'SEMANTIC_BENCHMARK_TRACKED_NOT_DATA_PARITY_BLOCKER') -or
            (-not [string]::IsNullOrWhiteSpace([string]$_.gap))
          })
          if ($semanticPending.Count -ne 0 -and $req.full_behavior_requirement_retrievability_proven -eq $true) {
            throw 'V32_BEHAVIOR_PARITY_PROMOTION_FORBIDDEN_WITH_OPEN_BENCHMARK_GAPS'
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "V3.2 corpus PASS, if reached, proves governed evidence/source retrieval parity only."
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "It does NOT prove full Machine 2 semantic behavior-reading parity while B04-B12/B15-class benchmark gaps remain."

      - name: Exact second-run readback and checkpoint reuse
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.v32_full_observation_semantic_enrichment --output-root $env:V32_OUTPUT_ROOT
          if ($LASTEXITCODE -ne 0) { throw "V32_READBACK_RUNTIME_FAILED:$LASTEXITCODE" }
          $m = Get-Content -LiteralPath (Join-Path $env:V32_OUTPUT_ROOT 'manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([int64]$m.reconciliation.reused_pass_sources -ne 18) { throw "V32_READBACK_REUSE_FAIL:$($m.reconciliation.reused_pass_sources)" }
          if ($m.reconciliation.behavior_path_coverage_pass -ne $true) { throw 'V32_READBACK_BEHAVIOR_PATH_FAIL' }
          if ($m.reconciliation.behavior_lifecycle_contract_pass -ne $true) { throw 'V32_READBACK_LIFECYCLE_CONTRACT_FAIL' }

      - name: Build compact governed summary artifact
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'v32-full-observation-behavior-summary\checkpoints' | Out-Null
          Copy-Item -LiteralPath 'v32-full-observation-behavior-requests\current.json' -Destination 'v32-full-observation-behavior-summary\request.json' -Force
          Copy-Item -LiteralPath (Join-Path $env:V32_OUTPUT_ROOT 'manifest.json') -Destination 'v32-full-observation-behavior-summary\manifest.json' -Force
          Copy-Item -LiteralPath (Join-Path $env:V32_OUTPUT_ROOT 'compact-sample.jsonl.gz') -Destination 'v32-full-observation-behavior-summary\compact-sample.jsonl.gz' -Force
          Get-ChildItem -LiteralPath $env:V32_OUTPUT_ROOT -Recurse -Filter 'checkpoint.json' | ForEach-Object {
            $parent = Split-Path $_.DirectoryName -Leaf
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path 'v32-full-observation-behavior-summary\checkpoints' ($parent + '.json')) -Force
          }
          @{
            trigger_revision = '${{ github.sha }}'
            software_revision = $env:A1_V32_SOFTWARE_REVISION
            output_root = $env:V32_OUTPUT_ROOT
            scope_class = $env:A1_V32_SCOPE_CLASS
            semantic_gap_ids = $env:A1_V32_SEMANTIC_GAP_IDS
            machine2_full_behavior_parity_proven = $false
            machine1_semantic_reader_independent = $true
          } | ConvertTo-Json | Out-File -LiteralPath 'v32-full-observation-behavior-summary\run-identity.json' -Encoding utf8

      - name: Upload V3.2 governed summary
        uses: actions/upload-artifact@v4
        with:
          name: v32-full-observation-behavior-summary-${{ github.run_id }}
          path: v32-full-observation-behavior-summary
          if-no-files-found: error
          retention-days: 30