name: Machine1 Next 651-660 20241202 Evidence
on:
  push:
    branches: [machine1/evidence-next-651-660-20241202]
    paths:
      - '.github/workflows/machine1-next-631-640-20241202-evidence.yml'
      - 'scripts/extract-machine1-next-631-640-20241202.ps1'
permissions:
  contents: read
jobs:
  evidence:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: machine1/evidence-next-651-660-20241202
      - name: Reconstruct manifest boundary and extract exact source rows
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          try { & './scripts/extract-machine1-next-631-640-20241202.ps1' }
          catch { ($_ | Format-List * -Force | Out-String) | Set-Content 'machine1_next_651_660_error.txt' -Encoding UTF8; throw }
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine1-next-651-660-20241202-evidence
          path: |
            machine1_next_651_660_20241202_evidence/
            machine1_next_651_660_error.txt
          if-no-files-found: error
          retention-days: 7
