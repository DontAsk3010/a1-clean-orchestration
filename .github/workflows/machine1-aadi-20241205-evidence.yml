name: Machine1 AADI 2024-12-05 Governed Evidence Extract

on:
  push:
    branches:
      - machine1/evidence-aadi-20241205
    paths:
      - .github/workflows/machine1-aadi-20241205-evidence.yml

permissions:
  contents: read

jobs:
  extract-aadi:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI\Raw Des 02-31-2024.csv'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract exact governed AADI packet
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = $env:RAW_FILE
          $tickerExpected = 'AADI'
          $tradingDate = '2024-12-05'
          $sourceFirst = 1
          $sourceLast = 242
          $expectedCount = 242
          $expectedFirstTime = '09:00:00'
          $expectedLastTime = '16:10:00'
          $semanticBundle = 'Raw Des 02-31-2024__SEMANTIC_0014.jsonl'
          $semanticBundleLine = 75
          $expectedMd5 = 'b8d42b35c90d2dff8b18ae4e1734523b'
          $expectedSha256 = '5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'

          if (-not (Test-Path -LiteralPath $raw -PathType Leaf)) { throw "RAW_MISSING: $raw" }
          $gotMd5 = (Get-FileHash -LiteralPath $raw -Algorithm MD5).Hash.ToLowerInvariant()
          $gotSha256 = (Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($gotMd5 -ne $expectedMd5 -or $gotSha256 -ne $expectedSha256) {
            throw "RAW_HASH_MISMATCH md5=$gotMd5 sha256=$gotSha256"
          }

          Add-Type -AssemblyName Microsoft.VisualBasic
          $parser = New-Object Microsoft.VisualBasic.FileIO.TextFieldParser($raw)
          $parser.TextFieldType = [Microsoft.VisualBasic.FileIO.FieldType]::Delimited
          $parser.SetDelimiters(',')
          $parser.HasFieldsEnclosedInQuotes = $true
          try {
            if ($parser.EndOfData) { throw 'RAW_EMPTY' }
            $headerFields = @($parser.ReadFields())
            if ($headerFields.Count -eq 0) { throw 'HEADER_EMPTY' }
            $rows = @()
            $sourceRow = 0
            while (-not $parser.EndOfData -and $sourceRow -lt $sourceLast) {
              $fields = @($parser.ReadFields())
              $sourceRow++
              if ($sourceRow -lt $sourceFirst) { continue }
              if ($fields.Count -ne $headerFields.Count) { throw "FIELD_COUNT_MISMATCH source_row=$sourceRow got=$($fields.Count) expected=$($headerFields.Count)" }
              $o = [ordered]@{ source_row = $sourceRow }
              for ($i=0; $i -lt $headerFields.Count; $i++) { $o[[string]$headerFields[$i]] = [string]$fields[$i] }
              $rows += [pscustomobject]$o
            }
          } finally {
            $parser.Close()
          }

          if ($rows.Count -ne $expectedCount) { throw "ROW_COUNT_MISMATCH got=$($rows.Count) expected=$expectedCount" }
          $seq = @($rows | ForEach-Object { [int]$_.source_row })
          for ($i=0; $i -lt $seq.Count; $i++) { if ($seq[$i] -ne ($sourceFirst + $i)) { throw "SOURCE_ROW_SEQUENCE_MISMATCH at_index=$i got=$($seq[$i])" } }
          $tickers = @($rows | ForEach-Object { $_.RAW_TICKER } | Sort-Object -Unique)
          if ($tickers.Count -ne 1 -or $tickers[0] -ne $tickerExpected) { throw "TICKER_MISMATCH got=$($tickers -join ',')" }
          $dts = @($rows | ForEach-Object { [string]$_.RAW_DATETIME_ISO })
          foreach ($dt in $dts) { if (-not $dt.StartsWith($tradingDate)) { throw "DATE_MISMATCH dt=$dt" } }
          function Get-TimePart([string]$dt) {
            if ($dt.Contains('T')) { return $dt.Split('T')[1].Substring(0,8) }
            return ($dt -split ' ')[-1].Substring(0,8)
          }
          $ft = Get-TimePart $dts[0]
          $lt = Get-TimePart $dts[-1]
          if ($ft -ne $expectedFirstTime -or $lt -ne $expectedLastTime) { throw "TIME_RANGE_MISMATCH got=$ft-$lt" }

          $out = Join-Path $PWD 'machine1_aadi_20241205_evidence'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $packetPath = Join-Path $out 'AADI_20241205_PACKET.json'
          $rowsPath = Join-Path $out 'AADI_20241205_ROWS.jsonl'
          $proofPath = Join-Path $out 'EVIDENCE_PROOF.json'
          $packet = [ordered]@{
            source_name = [IO.Path]::GetFileName($raw)
            source_md5 = $gotMd5
            source_sha256 = $gotSha256
            generation_id = 'BEHAVIOR_UNIFORM_COLAB_SEMANTIC_GEN_20260910_01'
            ticker = $tickerExpected
            trading_date = $tradingDate
            semantic_bundle = $semanticBundle
            semantic_bundle_line_number = $semanticBundleLine
            source_row_first = $sourceFirst
            source_row_last = $sourceLast
            physical_line_first = $sourceFirst + 1
            physical_line_last = $sourceLast + 1
            data_rows = $rows.Count
            first_datetime = $dts[0]
            last_datetime = $dts[-1]
            header_fields = $headerFields
            rows = $rows
          }
          $packet | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $packetPath -Encoding UTF8
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $lines = @($rows | ForEach-Object { $_ | ConvertTo-Json -Compress -Depth 20 })
          [IO.File]::WriteAllText($rowsPath, (($lines -join "`n") + "`n"), $utf8NoBom)
          $packetSha = (Get-FileHash -LiteralPath $packetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $rowsSha = (Get-FileHash -LiteralPath $rowsPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $proof = [ordered]@{
            ticker = $tickerExpected
            trading_date = $tradingDate
            source_md5 = $gotMd5
            source_sha256 = $gotSha256
            semantic_bundle = $semanticBundle
            semantic_bundle_line_number = $semanticBundleLine
            source_row_first = $sourceFirst
            source_row_last = $sourceLast
            data_rows = $rows.Count
            first_datetime = $dts[0]
            last_datetime = $dts[-1]
            packet_sha256 = $packetSha
            rows_jsonl_sha256 = $rowsSha
          }
          $proof | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $proofPath -Encoding UTF8
          Write-Host "AADI_EVIDENCE_OK rows=$($rows.Count) source_rows=$sourceFirst-$sourceLast first=$($dts[0]) last=$($dts[-1]) packet_sha256=$packetSha rows_sha256=$rowsSha"
      - name: Upload governed AADI evidence
        uses: actions/upload-artifact@v4
        with:
          name: machine1-aadi-20241205-evidence
          path: machine1_aadi_20241205_evidence/
          if-no-files-found: error
          retention-days: 7

# Date05 AADI transport uses native PowerShell streaming CSV parser; scientific scope/rows unchanged.
