name: Windows MG Frozen Candidate Replay

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - mg-frozen-replay-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-windows-mg-frozen-candidate-replay
  cancel-in-progress: true

jobs:
  replay:
    name: Replay frozen MG formula pack
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 720
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'mg-frozen-replay-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_MG_FROZEN_REPLAY_REQUEST_V1') { throw 'Unsupported request schema.' }
          if ($req.enabled -ne $true) { throw 'Request disabled.' }
          if ($req.authorization_phrase -ne 'AUTHORIZE_MG_FROZEN_CANDIDATE_REPLAY') { throw 'Authorization phrase required.' }
          if (-not (Test-Path -LiteralPath $req.pack_path -PathType Leaf)) { throw 'Frozen pack missing.' }
          if ($req.source_names -contains 'Raw Maret 03-31-2025.csv') { throw 'March OOS remains untouched.' }
          $json = $req | ConvertTo-Json -Compress -Depth 20
          "A1_MG_FROZEN_REPLAY_REQUEST_JSON=$json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Drive bindings
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:A1_DRIVE_READER_CREDENTIALS)) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Drive credential binding missing.' }
          }

      - name: Install compile test
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'INSTALL_FAILED' }
          py -3.11 -m compileall -q src tests
          if ($LASTEXITCODE -ne 0) { throw 'COMPILE_FAILED' }
          py -3.11 -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'TESTS_FAILED' }

      - name: Replay frozen candidates
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = $env:A1_MG_FROZEN_REPLAY_REQUEST_JSON | ConvertFrom-Json
          $argsList = @(
            '-3.11','-m','a1clean.formula_research.mg_frozen_candidate_replay',
            '--pack',[string]$req.pack_path,
            '--output','mg-frozen-candidate-replay-result.json',
            '--prior-window',[string][int]$req.prior_window,
            '--buy-fee-pct',[string][double]$req.execution.buy_fee_pct,
            '--sell-fee-pct',[string][double]$req.execution.sell_fee_pct,
            '--effort-lookback',[string][int]$req.params.effort_lookback,
            '--progress-lookback',[string][int]$req.params.progress_lookback,
            '--high-lookback',[string][int]$req.params.high_lookback,
            '--recovery-lookback',[string][int]$req.params.recovery_lookback,
            '--low-stabilization-bars',[string][int]$req.params.low_stabilization_bars,
            '--early-checkpoint-bar',[string][int]$req.params.early_checkpoint_bar,
            '--late-lift-min-bar',[string][int]$req.params.late_lift_min_bar
          )
          foreach ($source in $req.source_names) { $argsList += @('--source-name',[string]$source) }
          & py @argsList
          if ($LASTEXITCODE -ne 0) { throw "MG_FROZEN_REPLAY_FAILED:$LASTEXITCODE" }

      - name: Upload replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: mg-frozen-candidate-replay-${{ github.run_id }}
          path: mg-frozen-candidate-replay-result.json
          if-no-files-found: error
          retention-days: 30
