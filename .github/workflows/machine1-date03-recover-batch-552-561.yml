name: Machine1 Date03 Recover Batch 562-571
on:
  push:
    branches: [machine1/evidence-kbatch-20241203]
    paths: [.github/workflows/machine1-date03-recover-batch-552-561.yml]
permissions: {contents: write}
jobs:
  extract:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 60
    env:
      RAW_FILE: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI\Raw Des 02-31-2024.csv'
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact governed batch
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'; $raw=[IO.Path]::GetFullPath($env:RAW_FILE); $manifest='.machine1_evidence/DATE03_RECONSTRUCTED_MANIFEST_FROM_RAW.jsonl'
          $rawSha=(Get-FileHash $raw -Algorithm SHA256).Hash.ToLowerInvariant(); if($rawSha-ne'5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'){throw 'RAW_HASH_MISMATCH'}
          $manSha=(Get-FileHash $manifest -Algorithm SHA256).Hash.ToLowerInvariant(); if($manSha-ne'c07cf5c0c075e6ad6da2ca87623138ed84521423a6a6c143bb75db7a689d6625'){throw 'MANIFEST_HASH_MISMATCH'}
          $m=@(Get-Content $manifest -Encoding UTF8|%{$_|ConvertFrom-Json}); if($m.Count-ne891){throw 'MANIFEST_COUNT'}
          $payload=([string]::Join("`n",@($m[0..560]|%{$_.ticker})))+"`n"; $h=[Security.Cryptography.SHA256]::Create(); try{$prefix=([BitConverter]::ToString($h.ComputeHash([Text.Encoding]::UTF8.GetBytes($payload))).Replace('-','').ToLowerInvariant())}finally{$h.Dispose()}
          if($prefix-ne'b6f2097208bcfbb5d2d55c414f0ffbeb45a8fb0ffbca37099ead5614b3dd2895' -or [string]$m[560].ticker-ne'MSTI'){throw 'PREFIX_MISMATCH'}
          $specs=@($m[561..570]); if([string]$specs[0].ticker-ne'MTDL' -or [string]$specs[-1].ticker-ne'MYOH'){throw 'BOUNDARY_MISMATCH'}
          $out=Join-Path $PWD 'machine1_date03_batch_562_571'; New-Item -ItemType Directory -Force $out|Out-Null; $enc=New-Object Text.UTF8Encoding($false)
          [IO.File]::WriteAllText((Join-Path $out 'DATE03_POINTERS_562_571.json'),($specs|ConvertTo-Json -Depth 8),$enc)
          $cap=@{}; foreach($s in $specs){$cap[[string]$s.ticker]=New-Object 'Collections.Generic.List[string]'}; $max=($specs|Measure-Object source_row_last -Maximum).Maximum; $i=0;$header=$null
          foreach($line in [IO.File]::ReadLines($raw,[Text.Encoding]::UTF8)){if($i-eq0){$header=$line};foreach($s in $specs){if($i-ge[int64]$s.source_row_first -and $i-le[int64]$s.source_row_last){[void]$cap[[string]$s.ticker].Add($line)}};if($i-ge$max){break};$i++}
          foreach($s in $specs){$t=[string]$s.ticker;$lines=$cap[$t];if($lines.Count-ne[int]$s.data_rows){throw "$t COUNT"};$parsed=@((@($header)+@($lines))|ConvertFrom-Csv);$rec=New-Object 'Collections.Generic.List[object]';for($n=0;$n-lt$parsed.Count;$n++){$o=[ordered]@{source_row=[int64]$s.source_row_first+$n};foreach($p in $parsed[$n].PSObject.Properties.Name){$o[$p]=[string]$parsed[$n].$p};[void]$rec.Add([pscustomobject]$o)};$uniq=@($rec|%{$_.RAW_TICKER}|Sort-Object -Unique);if($uniq.Count-ne1 -or $uniq[0]-ne$t){throw "$t TICKER"};$rp=Join-Path $out "${t}_20241203_ROWS.jsonl";[IO.File]::WriteAllLines($rp,[string[]]@($rec|%{$_|ConvertTo-Json -Compress -Depth 8}),$enc);$dts=@($rec|%{[string]$_.RAW_DATETIME_ISO});$proof=[ordered]@{ticker=$t;trading_date='2024-12-03';source_sha256=$rawSha;recovered_manifest_sha256=$manSha;durable_prefix_count=561;durable_prefix_sha256=$prefix;recovered_date_local_index=[int]$s.date_local_index;source_row_first=[int64]$s.source_row_first;source_row_last=[int64]$s.source_row_last;data_rows=$rec.Count;first_datetime=$dts[0];last_datetime=$dts[-1];rows_jsonl_sha256=(Get-FileHash $rp -Algorithm SHA256).Hash.ToLowerInvariant()};[IO.File]::WriteAllText((Join-Path $out "${t}_20241203_RECOVERY_PROOF.json"),($proof|ConvertTo-Json -Depth 8),$enc)}
          $bp=[ordered]@{status='PASS';source_sha256=$rawSha;recovered_manifest_sha256=$manSha;durable_prefix_count=561;durable_prefix_last='MSTI';durable_prefix_sha256=$prefix;batch_first='MTDL';batch_last='MYOH';batch_count=10};[IO.File]::WriteAllText((Join-Path $out 'DATE03_BATCH_562_571_PROOF.json'),($bp|ConvertTo-Json),$enc)
      - uses: actions/upload-artifact@v4
        with: {name: machine1-date03-batch-562-571, path: 'machine1_date03_batch_562_571/', if-no-files-found: error, retention-days: 30}
      - name: Persist exact packets
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          New-Item -ItemType Directory -Force '.machine1_evidence'|Out-Null; Copy-Item 'machine1_date03_batch_562_571/*' '.machine1_evidence/' -Force
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.name 'a1-clean-machine1-bot'; git -c safe.directory="$env:GITHUB_WORKSPACE" config user.email 'a1-clean-machine1-bot@users.noreply.github.com'
          git -c safe.directory="$env:GITHUB_WORKSPACE" add -f '.machine1_evidence/DATE03_POINTERS_562_571.json' '.machine1_evidence/DATE03_BATCH_562_571_PROOF.json' '.machine1_evidence/*_20241203_ROWS.jsonl' '.machine1_evidence/*_20241203_RECOVERY_PROOF.json'; git -c safe.directory="$env:GITHUB_WORKSPACE" commit -m 'Persist governed date03 packets 562-571 [skip ci]'; git -c safe.directory="$env:GITHUB_WORKSPACE" push origin HEAD:machine1/evidence-kbatch-20241203
