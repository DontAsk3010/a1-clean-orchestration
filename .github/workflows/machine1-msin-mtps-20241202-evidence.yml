name: Machine1 MSIN-MTPS 20241202 Evidence Extract
on:
  push:
    branches: [machine1/evidence-msin-mtps-20241202]
    paths: [.github/workflows/machine1-msin-mtps-20241202-evidence.yml]
permissions:
  contents: read
jobs:
  extract-governed-msin-mtps:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\\TRADING SYSTEM\\02_CURRENT_HISTORICAL_RAW_DATA_UJI\\Raw Des 02-31-2024.csv'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: machine1/evidence-msin-mtps-20241202
      - name: Extract exact governed MSIN-MTPS packets
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'
          $raw=$env:RAW_FILE
          $date='2024-12-02'
          $md5='b8d42b35c90d2dff8b18ae4e1734523b'
          $sha='5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          if(-not(Test-Path -LiteralPath $raw -PathType Leaf)){throw "RAW_MISSING"}
          $gm=(Get-FileHash -LiteralPath $raw -Algorithm MD5).Hash.ToLowerInvariant()
          $gs=(Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant()
          if($gm-ne$md5 -or $gs-ne$sha){throw "RAW_HASH_MISMATCH"}
          $specs=@(
            [pscustomobject][ordered]@{ticker='MSIN';first=1118263;last=1118354;count=92;first_time='09:00:00';last_time='16:00:00';bundle_line=9},
            [pscustomobject][ordered]@{ticker='MSJA';first=1117490;last=1117541;count=52;first_time='09:00:00';last_time='16:00:00';bundle_line=10},
            [pscustomobject][ordered]@{ticker='MSKY';first=1121681;last=1121832;count=152;first_time='09:00:00';last_time='16:12:00';bundle_line=11},
            [pscustomobject][ordered]@{ticker='MSTI';first=1120426;last=1120492;count=67;first_time='09:00:00';last_time='16:02:00';bundle_line=12},
            [pscustomobject][ordered]@{ticker='MTDL';first=1124674;last=1124787;count=114;first_time='09:00:00';last_time='16:03:00';bundle_line=13},
            [pscustomobject][ordered]@{ticker='MTEL';first=1128795;last=1129012;count=218;first_time='08:59:00';last_time='16:10:00';bundle_line=14},
            [pscustomobject][ordered]@{ticker='MTFN';first=1126851;last=1126859;count=9;first_time='09:55:00';last_time='16:14:00';bundle_line=15},
            [pscustomobject][ordered]@{ticker='MTLA';first=1126991;last=1126995;count=5;first_time='09:00:00';last_time='16:00:00';bundle_line=16},
            [pscustomobject][ordered]@{ticker='MTMH';first=1127348;last=1127406;count=59;first_time='09:00:00';last_time='16:00:00';bundle_line=17},
            [pscustomobject][ordered]@{ticker='MTPS';first=1128602;last=1128605;count=4;first_time='09:55:00';last_time='14:55:00';bundle_line=18}
          )
          $out=Join-Path $PWD 'machine1_msin_mtps_20241202_evidence'
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          $map=@{}; foreach($s in $specs){$map[$s.ticker]=New-Object System.Collections.Generic.List[object]}
          $sr=New-Object System.IO.StreamReader($raw,[System.Text.Encoding]::UTF8,$true,1048576)
          try{
            $hdr=$sr.ReadLine(); if($null-eq$hdr){throw 'RAW_EMPTY'}
            $h=@($hdr.TrimStart([char]0xFEFF).Split(','))
            $pl=1
            while(-not $sr.EndOfStream){
              $line=$sr.ReadLine();$pl++;$row=$pl-1
              if($row-gt 1129012){break}
              if($row-lt 1117490){continue}
              foreach($s in $specs){
                if($row-ge$s.first -and $row-le$s.last){
                  $x=$line|ConvertFrom-Csv -Header $h
                  $f=[ordered]@{};foreach($hh in $h){$f[$hh]=$x.$hh}
                  $map[$s.ticker].Add([pscustomobject][ordered]@{source_row=[int]$row;physical_line=[int]$pl;raw_line=$line;fields=$f})
                  break
                }
              }
            }
          }finally{$sr.Dispose()}
          $proof=@()
          foreach($s in $specs){
            $a=$map[$s.ticker]
            if($a.Count-ne$s.count){throw "$($s.ticker)_COUNT got=$($a.Count) exp=$($s.count)"}
            for($i=0;$i-lt$a.Count;$i++){
              if($a[$i].source_row-ne($s.first+$i)){throw "$($s.ticker)_ROW"}
              if($a[$i].fields.RAW_TICKER-ne$s.ticker){throw "$($s.ticker)_TICKER"}
              if(-not([string]$a[$i].fields.RAW_DATETIME_ISO).StartsWith($date)){throw "$($s.ticker)_DATE"}
            }
            $fd=[string]$a[0].fields.RAW_DATETIME_ISO;$ld=[string]$a[$a.Count-1].fields.RAW_DATETIME_ISO
            if($fd.Substring($fd.Length-8)-ne$s.first_time -or $ld.Substring($ld.Length-8)-ne$s.last_time){throw "$($s.ticker)_TIME"}
            [ordered]@{source_name=[IO.Path]::GetFileName($raw);source_md5=$gm;source_sha256=$gs;ticker=$s.ticker;trading_date=$date;semantic_bundle='Raw Des 02-31-2024__SEMANTIC_0004.jsonl';bundle_line_number=[int]$s.bundle_line;source_row_first=[int]$s.first;source_row_last=[int]$s.last;data_rows=[int]$s.count;first_datetime=$fd;last_datetime=$ld;header_line=$hdr;header_fields=$h;rows=$a}|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $out "$($s.ticker)_20241202_PACKET.json") -Encoding UTF8
            $rp=Join-Path $out "$($s.ticker)_20241202_ROWS.jsonl";if(Test-Path $rp){Remove-Item $rp -Force}
            foreach($rr in $a){($rr|ConvertTo-Json -Depth 6 -Compress)|Add-Content -LiteralPath $rp -Encoding UTF8}
            $proof+=[pscustomobject][ordered]@{ticker=$s.ticker;trading_date=$date;semantic_bundle='Raw Des 02-31-2024__SEMANTIC_0004.jsonl';bundle_line_number=[int]$s.bundle_line;source_row_first=[int]$s.first;source_row_last=[int]$s.last;data_rows=[int]$s.count;first_datetime=$fd;last_datetime=$ld}
            Write-Host "PASS $($s.ticker) rows=$($s.count)"
          }
          [ordered]@{status='PASS';source_md5=$gm;source_sha256=$gs;trading_date=$date;tickers=$proof}|ConvertTo-Json -Depth 6|Set-Content -LiteralPath (Join-Path $out 'CHUNK_PROOF.json') -Encoding UTF8
      - name: Upload governed evidence
        uses: actions/upload-artifact@v4
        with:
          name: machine1-msin-mtps-20241202-evidence
          path: machine1_msin_mtps_20241202_evidence/
          if-no-files-found: error
          retention-days: 7
