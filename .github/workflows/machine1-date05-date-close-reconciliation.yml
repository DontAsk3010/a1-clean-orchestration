name: Machine1 Date05 Date-Close Reconciliation

on:
  workflow_dispatch:
  push:
    branches:
      - machine1/date05-prefetch-after-bmsr
    paths:
      - .github/workflows/machine1-date05-date-close-reconciliation.yml

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI\Raw Des 02-31-2024.csv'
    steps:
      - uses: actions/checkout@v4

      - name: Reconcile complete Date05 source and boundary states
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'
          $raw=[System.IO.Path]::GetFullPath($env:RAW_FILE)
          if(-not (Test-Path -LiteralPath $raw -PathType Leaf)){throw "RAW_MISSING: $raw"}
          $expectedSize=[int64]453806812
          $expectedMd5='b8d42b35c90d2dff8b18ae4e1734523b'
          $expectedSha='5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          $fi=Get-Item -LiteralPath $raw
          if($fi.Length -ne $expectedSize){throw "RAW_SIZE_MISMATCH"}
          $md5=(Get-FileHash -LiteralPath $raw -Algorithm MD5).Hash.ToLowerInvariant()
          $sha=(Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant()
          if($md5 -ne $expectedMd5 -or $sha -ne $expectedSha){throw "RAW_HASH_MISMATCH"}

          $target='2024-12-05'
          $expectedRows=85534
          $expectedTickers=891
          $expectedFirst='AALI'
          $expectedLast='ZYRX'
          $expectedManifestFirst=75
          $expectedManifestLast=965
          $out=Join-Path $PWD '.machine1_transport/date05_close_reconciliation'
          if(Test-Path $out){Remove-Item -Recurse -Force $out}
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $utf8=New-Object System.Text.UTF8Encoding($false)

          $header=$null; $idx=@{}; [int64]$lineIndex=0; [int64]$dateRows=0
          $order=New-Object 'System.Collections.Generic.List[string]'
          $stats=[ordered]@{}
          $minuteCounts=@{}
          $closedTickerSet=New-Object 'System.Collections.Generic.HashSet[string]'
          $currentTicker=$null
          foreach($line in [System.IO.File]::ReadLines($raw,[System.Text.Encoding]::UTF8)){
            if($lineIndex -eq 0){
              $header=$line; $hf=$line.Split(',')
              $needed=@('RAW_TICKER','RAW_DATETIME_ISO','RAW_OPEN','RAW_HIGH','RAW_LOW','RAW_CLOSE','RAW_VOLUME','OBS_GAP_GT_BASE_INTERVAL_FLAG','OBS_DUP_OR_OUT_OF_ORDER_TIME_FLAG','IDX_REGULAR_CLOCK_SESSION_CODE')
              for($i=0;$i -lt $hf.Length;$i++){$idx[$hf[$i].Trim('"')]=$i}
              foreach($n in $needed){if(-not $idx.ContainsKey($n)){throw "HEADER_MISSING_$n"}}
              $lineIndex++; continue
            }
            $p=$line.Split(',')
            $dt=$p[$idx['RAW_DATETIME_ISO']].Trim('"')
            if(-not $dt.StartsWith($target)){$lineIndex++; continue}
            $tk=$p[$idx['RAW_TICKER']].Trim('"')
            if($null -ne $currentTicker -and $tk -ne $currentTicker){[void]$closedTickerSet.Add($currentTicker)}
            if($closedTickerSet.Contains($tk) -and $tk -ne $currentTicker){throw "NONCONTIGUOUS_TICKER_CONTEXT_$tk"}
            if(-not $stats.Contains($tk)){
              $order.Add($tk)
              $stats[$tk]=[ordered]@{
                ticker=$tk; manifest_line=($expectedManifestFirst+$order.Count-1); count=0;
                source_row_first=[int64]$lineIndex; source_row_last=[int64]$lineIndex;
                physical_line_first=([int64]$lineIndex+1); physical_line_last=([int64]$lineIndex+1);
                first_datetime=$dt; last_datetime=$dt;
                first_open=$p[$idx['RAW_OPEN']].Trim('"'); first_high=$p[$idx['RAW_HIGH']].Trim('"'); first_low=$p[$idx['RAW_LOW']].Trim('"'); first_close=$p[$idx['RAW_CLOSE']].Trim('"'); first_volume=$p[$idx['RAW_VOLUME']].Trim('"');
                last_open=$p[$idx['RAW_OPEN']].Trim('"'); last_high=$p[$idx['RAW_HIGH']].Trim('"'); last_low=$p[$idx['RAW_LOW']].Trim('"'); last_close=$p[$idx['RAW_CLOSE']].Trim('"'); last_volume=$p[$idx['RAW_VOLUME']].Trim('"');
                last_session_code=$p[$idx['IDX_REGULAR_CLOCK_SESSION_CODE']].Trim('"'); gap_transitions=0; duplicate_or_out_of_order_flags=0
              }
            }
            $s=$stats[$tk]
            $s.count=[int64]$s.count+1; $s.source_row_last=[int64]$lineIndex; $s.physical_line_last=[int64]$lineIndex+1; $s.last_datetime=$dt
            $s.last_open=$p[$idx['RAW_OPEN']].Trim('"'); $s.last_high=$p[$idx['RAW_HIGH']].Trim('"'); $s.last_low=$p[$idx['RAW_LOW']].Trim('"'); $s.last_close=$p[$idx['RAW_CLOSE']].Trim('"'); $s.last_volume=$p[$idx['RAW_VOLUME']].Trim('"'); $s.last_session_code=$p[$idx['IDX_REGULAR_CLOCK_SESSION_CODE']].Trim('"')
            if($p[$idx['OBS_GAP_GT_BASE_INTERVAL_FLAG']].Trim('"') -eq '1'){$s.gap_transitions=[int64]$s.gap_transitions+1}
            if($p[$idx['OBS_DUP_OR_OUT_OF_ORDER_TIME_FLAG']].Trim('"') -eq '1'){$s.duplicate_or_out_of_order_flags=[int64]$s.duplicate_or_out_of_order_flags+1}
            if($minuteCounts.ContainsKey($dt)){$minuteCounts[$dt]++}else{$minuteCounts[$dt]=1}
            $dateRows++; $currentTicker=$tk; $lineIndex++
          }

          if($dateRows -ne $expectedRows){throw "DATE_ROW_COUNT_MISMATCH got=$dateRows expected=$expectedRows"}
          if($order.Count -ne $expectedTickers){throw "TICKER_COUNT_MISMATCH got=$($order.Count) expected=$expectedTickers"}
          if($order[0] -ne $expectedFirst){throw "FIRST_TICKER_MISMATCH got=$($order[0])"}
          if($order[$order.Count-1] -ne $expectedLast){throw "LAST_TICKER_MISMATCH got=$($order[$order.Count-1])"}
          if(($expectedManifestFirst+$order.Count-1) -ne $expectedManifestLast){throw 'MANIFEST_LINE_RANGE_MISMATCH'}
          $sum=0; foreach($tk in $order){$sum += [int64]$stats[$tk].count}; if($sum -ne $dateRows){throw 'TICKER_SUM_MISMATCH'}

          $boundary=New-Object 'System.Collections.Generic.List[string]'
          $coverage=New-Object 'System.Collections.Generic.List[string]'
          foreach($tk in $order){
            $s=$stats[$tk]
            $b=[ordered]@{
              ticker=$tk; trading_date=$target; manifest_line=$s.manifest_line; actual_rows=[int64]$s.count;
              source_row_first=[int64]$s.source_row_first; source_row_last=[int64]$s.source_row_last; physical_line_first=[int64]$s.physical_line_first; physical_line_last=[int64]$s.physical_line_last;
              first_supported=[ordered]@{datetime=$s.first_datetime;open=$s.first_open;high=$s.first_high;low=$s.first_low;close=$s.first_close;volume=$s.first_volume};
              right_boundary_supported=[ordered]@{datetime=$s.last_datetime;open=$s.last_open;high=$s.last_high;low=$s.last_low;close=$s.last_close;volume=$s.last_volume;session_code=$s.last_session_code};
              post_last_supported_path='UNKNOWN_IF_NO_SUPPORTED_ROW'; boundary_origin='SOURCE_SUPPORTED_ONLY'; no_hindsight_backfill=$true
            }
            [void]$boundary.Add(($b|ConvertTo-Json -Compress -Depth 8))
            $c=[ordered]@{ticker=$tk;manifest_line=$s.manifest_line;actual_rows=[int64]$s.count;gap_transitions=[int64]$s.gap_transitions;duplicate_or_out_of_order_flags=[int64]$s.duplicate_or_out_of_order_flags;first_datetime=$s.first_datetime;last_datetime=$s.last_datetime}
            [void]$coverage.Add(($c|ConvertTo-Json -Compress -Depth 5))
          }
          [System.IO.File]::WriteAllLines((Join-Path $out 'DATE05_BOUNDARY_STATES.jsonl'),[string[]]$boundary,$utf8)
          [System.IO.File]::WriteAllLines((Join-Path $out 'DATE05_COVERAGE_BY_TICKER.jsonl'),[string[]]$coverage,$utf8)

          $minuteOut=New-Object 'System.Collections.Generic.List[string]'
          foreach($k in ($minuteCounts.Keys|Sort-Object)){$o=[ordered]@{datetime=$k;supported_ticker_rows=[int]$minuteCounts[$k]};[void]$minuteOut.Add(($o|ConvertTo-Json -Compress))}
          [System.IO.File]::WriteAllLines((Join-Path $out 'DATE05_CROSS_TICKER_MINUTE_COVERAGE.jsonl'),[string[]]$minuteOut,$utf8)

          $summary=[ordered]@{
            reconciliation='DATE05_SOURCE_AND_BOUNDARY_RECONCILIATION_V1'; trading_date=$target; status='PASS';
            source_file='Raw Des 02-31-2024.csv'; source_size=$fi.Length; source_md5=$md5; source_sha256=$sha;
            expected_rows=$expectedRows; actual_rows=$dateRows; expected_ticker_contexts=$expectedTickers; actual_ticker_contexts=$order.Count;
            manifest_line_first=$expectedManifestFirst; manifest_line_last=$expectedManifestLast; first_ticker=$order[0]; last_ticker=$order[$order.Count-1];
            ticker_row_sum=$sum; context_contiguity='PASS'; boundary_states_count=$order.Count; minute_coverage_points=$minuteCounts.Count;
            missing_minutes_synthesized=$false; intragap_paths_reconstructed=$false; volume_semantics='EFFORT_PARTICIPATION_ONLY'; formula_creation='CLOSED'; auto_advance='PROHIBITED';
            date_local_pass='PENDING_DRIVE_READBACK_AND_REGISTRY_CLOSE'
          }
          [System.IO.File]::WriteAllText((Join-Path $out 'DATE05_RECONCILIATION_SUMMARY.json'),($summary|ConvertTo-Json -Depth 8),$utf8)
          $hashLines=Get-ChildItem $out -File | Sort-Object Name | ForEach-Object {((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())+'  '+$_.Name}
          [System.IO.File]::WriteAllLines((Join-Path $out '_DATE05_RECONCILIATION_SHA256.txt'),[string[]]$hashLines,$utf8)
          Write-Host ($summary|ConvertTo-Json -Compress)

      - name: Upload Date05 reconciliation artifact
        uses: actions/upload-artifact@v4
        with:
          name: machine1-date05-date-close-reconciliation
          path: .machine1_transport/date05_close_reconciliation/*
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
