name: Windows Machine2 Runner Label Remediation

on:
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/windows-machine2-runner-label-remediation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1-windows-machine2-runner-label-remediation
  cancel-in-progress: false

jobs:
  assign_unique_label:
    name: Assign and verify exact Machine2 runner label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADMIN_TOKEN: ${{ secrets.A1_GITHUB_RUNNER_ADMIN_TOKEN }}
      TARGET_RUNNER_NAME: A1-WINDOWS-COMPUTE-02
      TARGET_LABEL: a1-machine2-exact
    steps:
      - name: Require authorized runner-admin token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            echo 'M2_RUNNER_ADMIN_TOKEN_CONFIGURED=false'
            echo 'M2_RUNNER_LABEL_REMEDIATION_HOLD=MISSING_A1_GITHUB_RUNNER_ADMIN_TOKEN'
            exit 23
          fi
          echo 'M2_RUNNER_ADMIN_TOKEN_CONFIGURED=true'

      - name: Resolve exact target and assign unique label
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runners"
          hdr=(-H "Authorization: Bearer ${ADMIN_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')

          code="$(curl -sS -o runners.json -w '%{http_code}' "${hdr[@]}" "${api}?per_page=100")"
          echo "M2_RUNNER_ADMIN_LIST_HTTP=${code}"
          if [ "${code}" != '200' ]; then
            echo 'M2_RUNNER_LABEL_REMEDIATION_HOLD=RUNNER_ADMIN_LIST_DENIED'
            exit 24
          fi

          python - <<'PY' > target.env
          import json, os, sys
          data=json.load(open('runners.json',encoding='utf-8'))
          target=os.environ['TARGET_RUNNER_NAME']
          rows=[r for r in data.get('runners',[]) if str(r.get('name'))==target]
          if len(rows)!=1:
              print(f"M2_TARGET_RESOLUTION_COUNT={len(rows)}", file=sys.stderr)
              raise SystemExit(25)
          print(f"TARGET_RUNNER_ID={rows[0]['id']}")
          print(f"M2_TARGET_RUNNER_STATUS={rows[0].get('status')}")
          print(f"M2_TARGET_RUNNER_BUSY={str(rows[0].get('busy')).lower()}")
          PY
          cat target.env
          # shellcheck disable=SC1091
          source target.env

          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({"labels":[os.environ["TARGET_LABEL"]]}))
          PY
          )"
          code="$(curl -sS -o add-label.json -w '%{http_code}' -X POST "${hdr[@]}"             -H 'Content-Type: application/json'             -d "${payload}"             "${api}/${TARGET_RUNNER_ID}/labels")"
          echo "M2_RUNNER_LABEL_ADD_HTTP=${code}"
          if [ "${code}" != '200' ]; then
            echo 'M2_RUNNER_LABEL_REMEDIATION_HOLD=LABEL_ADD_DENIED'
            exit 26
          fi

          code="$(curl -sS -o target-labels.json -w '%{http_code}' "${hdr[@]}" "${api}/${TARGET_RUNNER_ID}/labels")"
          echo "M2_TARGET_LABEL_READBACK_HTTP=${code}"
          if [ "${code}" != '200' ]; then exit 27; fi

          python - <<'PY'
          import json, os
          label=os.environ['TARGET_LABEL']
          names={str(x.get('name')) for x in json.load(open('target-labels.json',encoding='utf-8')).get('labels',[])}
          if label not in names:
              raise SystemExit('M2_TARGET_UNIQUE_LABEL_READBACK_MISSING')
          print('M2_TARGET_UNIQUE_LABEL_READBACK_PASS=true')
          PY

          python - <<'PY' > other_ids.txt
          import json, os
          data=json.load(open('runners.json',encoding='utf-8'))
          target=os.environ['TARGET_RUNNER_NAME']
          for r in data.get('runners',[]):
              if str(r.get('name')) != target:
                  print(r['id'])
          PY

          collision=0
          while IFS= read -r rid; do
            [ -n "${rid}" ] || continue
            code="$(curl -sS -o "labels-${rid}.json" -w '%{http_code}' "${hdr[@]}" "${api}/${rid}/labels")"
            if [ "${code}" != '200' ]; then
              echo "M2_OTHER_RUNNER_LABEL_READBACK_HTTP=${code}|runner_id=${rid}"
              exit 28
            fi
            if python - "${rid}" <<'PY'
          import json, os, sys
          rid=sys.argv[1]
          label=os.environ['TARGET_LABEL']
          names={str(x.get('name')) for x in json.load(open(f'labels-{rid}.json',encoding='utf-8')).get('labels',[])}
          raise SystemExit(0 if label in names else 1)
          PY
            then
              echo "M2_UNIQUE_LABEL_COLLISION=true|runner_id=${rid}"
              collision=1
            fi
          done < other_ids.txt
          if [ "${collision}" -ne 0 ]; then
            echo 'M2_RUNNER_LABEL_REMEDIATION_HOLD=UNIQUE_LABEL_COLLISION'
            exit 29
          fi

          echo 'M2_UNIQUE_SERVER_SIDE_LABEL_PASS=true'
          echo "M2_EXACT_RUNNER_SELECTOR=self-hosted,windows,x64,${TARGET_LABEL}"

  exact_route_proof:
    name: Prove exact Machine2 routing
    needs: assign_unique_label
    runs-on: [self-hosted, windows, x64, a1-machine2-exact]
    timeout-minutes: 10
    steps:
      - name: Prove exact runner identity
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "M2_ROUTE_PROOF_RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "M2_ROUTE_PROOF_COMPUTERNAME=$env:COMPUTERNAME"
          if ($env:RUNNER_NAME -ne 'A1-WINDOWS-COMPUTE-02') {
            throw "M2_EXACT_ROUTING_WRONG_RUNNER:$env:RUNNER_NAME"
          }
          if ($env:COMPUTERNAME -ne 'PORSCHE-DESIGN') {
            throw "M2_EXACT_ROUTING_WRONG_MACHINE:$env:COMPUTERNAME"
          }
          Write-Host 'M2_DETERMINISTIC_EXACT_RUNNER_ROUTING_PASS=true'
          Write-Host 'M2_DETERMINISTIC_EXACT_RUNNER_SELECTOR=self-hosted,windows,x64,a1-machine2-exact'
