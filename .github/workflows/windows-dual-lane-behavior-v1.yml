name: Windows Dual Lane Price Formation Behavior V1

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - dual-lane-behavior-v1-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-windows-dual-lane-behavior-v1
  cancel-in-progress: true

jobs:
  study:
    name: Run synchronized price x formation behavior research
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 720
    steps:
      - name: Checkout exact research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'dual-lane-behavior-v1-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_DUAL_LANE_BEHAVIOR_V1_REQUEST') { throw 'Unsupported dual-lane request schema.' }
          if ($req.enabled -ne $true) { throw 'Dual-lane request not enabled.' }
          $json = $req | ConvertTo-Json -Compress -Depth 20
          "A1_DUAL_LANE_REQUEST_JSON=$json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and test dual-lane state machine
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'DUAL_LANE_INSTALL_FAILED' }
          py -3.11 -m py_compile src/a1clean/formula_research/dual_lane_behavior_v1.py src/a1clean/formula_research/dual_lane_behavior_v1_cached.py
          if ($LASTEXITCODE -ne 0) { throw 'DUAL_LANE_COMPILE_FAILED' }
          py -3.11 -m pytest -q tests/test_dual_lane_behavior_v1.py
          if ($LASTEXITCODE -ne 0) { throw 'DUAL_LANE_TEST_FAILED' }

      - name: Run governed non-OOS dual-lane research from durable cache catalog
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = $env:A1_DUAL_LANE_REQUEST_JSON | ConvertFrom-Json
          & py -3.11 -m a1clean.formula_research.dual_lane_behavior_v1_cached `
            --output 'dual-lane-behavior-v1-result.json' `
            --prior-days ([string][int]$req.prior_days) `
            --buy-fee-pct ([string][double]$req.execution.buy_fee_pct) `
            --sell-fee-pct ([string][double]$req.execution.sell_fee_pct) `
            --min-support ([string][int]$req.min_support)
          if ($LASTEXITCODE -ne 0) { throw "DUAL_LANE_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Assert cache-only execution and reserved OOS untouched
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $obj = Get-Content -LiteralPath 'dual-lane-behavior-v1-result.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($obj.march_2025_reserved_oos_touched -ne $false) { throw 'RESERVED_OOS_TOUCHED' }
          if ($obj.future_data_used_for_formula_state -ne $false) { throw 'FUTURE_STATE_LEAKAGE_FLAGGED' }
          if ($obj.data_access -ne 'DURABLE_CACHE_ONLY_NO_RAW_REREAD') { throw 'RAW_REREAD_NOT_ALLOWED' }
          if ($obj.source_catalog -ne 'DURABLE_CACHE_META_ONLY_NO_DRIVE_MANIFEST_DISCOVERY') { throw 'CACHE_CATALOG_ASSERTION_FAILED' }
          if ($obj.cache_source_count -le 0) { throw 'CACHE_SOURCE_COUNT_INVALID' }

      - name: Upload dual-lane research artifact
        uses: actions/upload-artifact@v4
        with:
          name: dual-lane-behavior-v1-${{ github.run_id }}
          path: dual-lane-behavior-v1-result.json
          if-no-files-found: error
          retention-days: 30
