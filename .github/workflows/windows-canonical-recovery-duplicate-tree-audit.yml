name: Windows Canonical Recovery Duplicate-Tree Audit

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/windows-canonical-recovery-duplicate-tree-audit.yml'
      - 'canonical-current-recovery-requests/duplicate-tree-audit-current.json'
      - 'src/a1clean/recovery_duplicate_tree_audit.py'

permissions:
  contents: read

concurrency:
  group: a1-windows-canonical-recovery-duplicate-tree-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Read-only duplicate-tree audit
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Route exact recovery runner
        id: route
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne 'PORSCHE-DESIGN') { throw "DUPLICATE_TREE_AUDIT_WRONG_MACHINE:$env:COMPUTERNAME" }
          if ($env:RUNNER_NAME -ne 'A1-WINDOWS-COMPUTE-02') { throw "DUPLICATE_TREE_AUDIT_WRONG_RUNNER:$env:RUNNER_NAME" }
          foreach ($name in @('A1_DRIVE_READER_CREDENTIALS')) {
            $p = [Environment]::GetEnvironmentVariable($name,'Process')
            if ([string]::IsNullOrWhiteSpace($p) -or -not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "DUPLICATE_TREE_AUDIT_READER_BINDING_FAIL:$name" }
          }
          Write-Host 'DUPLICATE_TREE_AUDIT_EXACT_RUNNER_PASS'

      - name: Provision governed Python runtime
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\windows\Ensure-A1PortablePython311.ps1'
          $py = 'C:\Users\feri-admin\.a1clean\runtime\python-3.11.9-embed-amd64\python.exe'
          $pip = 'C:\Users\feri-admin\.a1clean\runtime\python-3.11.9-embed-amd64\pip.pyz'
          $site = 'C:\Users\feri-admin\.a1clean\runtime\python-3.11.9-embed-amd64\Lib\site-packages'
          if (-not (Test-Path -LiteralPath $py -PathType Leaf)) { throw 'DUPLICATE_TREE_AUDIT_PYTHON_MISSING' }
          & $py $pip install --disable-pip-version-check --upgrade --no-deps --target $site .
          if ($LASTEXITCODE -ne 0) { throw 'DUPLICATE_TREE_AUDIT_PROJECT_INSTALL_FAIL' }
          "A1_AUDIT_PY=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate no-mutation locks
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_AUDIT_PY -m py_compile 'src\a1clean\recovery_duplicate_tree_audit.py'
          if ($LASTEXITCODE -ne 0) { throw 'DUPLICATE_TREE_AUDIT_COMPILE_FAIL' }
          $r = Get-Content -LiteralPath 'canonical-current-recovery-requests\duplicate-tree-audit-current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($r.mode -ne 'READ_ONLY_METADATA_AUDIT') { throw 'DUPLICATE_TREE_AUDIT_MODE_FAIL' }
          if ($r.canonical_current_mutation_allowed -ne $false -or $r.physical_delete_allowed_by_this_audit -ne $false -or $r.raw_write_allowed -ne $false -or $r.heavy_behavior_research_allowed -ne $false) { throw 'DUPLICATE_TREE_AUDIT_MUTATION_LOCK_FAIL' }
          if ($r.formula_stage -ne 'CLOSED') { throw 'DUPLICATE_TREE_AUDIT_FORMULA_LOCK_FAIL' }
          Write-Host 'DUPLICATE_TREE_AUDIT_NO_MUTATION_LOCK_PASS'

      - name: Execute read-only duplicate-tree audit
        id: execute
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path 'duplicate-tree-audit-evidence' | Out-Null
          $out = Join-Path (Resolve-Path 'duplicate-tree-audit-evidence').Path 'DUPLICATE_TREE_AUDIT_RESULT.json'
          & $env:A1_AUDIT_PY -m a1clean.recovery_duplicate_tree_audit --repo-root . --output $out
          $code = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $out -PathType Leaf)) { throw "DUPLICATE_TREE_AUDIT_RESULT_MISSING_EXIT_$code" }
          $p = Get-Content -LiteralPath $out -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($p.mutation.drive_write_performed -ne $false -or $p.mutation.canonical_current_mutation -ne $false -or $p.mutation.physical_delete_performed -ne $false -or $p.mutation.raw_write_performed -ne $false) { throw 'DUPLICATE_TREE_AUDIT_FORBIDDEN_MUTATION_REPORTED' }
          Copy-Item -LiteralPath 'canonical-current-recovery-requests\duplicate-tree-audit-current.json' -Destination 'duplicate-tree-audit-evidence\DUPLICATE_TREE_AUDIT_REQUEST.json' -Force
          "audit_pass=$($p.pass.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "audit_status=$($p.status)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Add-Content $env:GITHUB_STEP_SUMMARY '### Canonical recovery duplicate-tree audit'
          Add-Content $env:GITHUB_STEP_SUMMARY "- Status: $($p.status)"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Recovered origin files: $($p.origin_summary.recovered_source_file_count)"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Control origin files: $($p.origin_summary.committed_control_file_count)"
          foreach ($c in $p.candidates) {
            Add-Content $env:GITHUB_STEP_SUMMARY "- Candidate $($c.candidate_folder_id): files=$($c.file_count), matched=$($c.matched_file_count), missing_md5=$($c.missing_md5_count), unmatched=$($c.unmatched_file_count), unexpected_refs=$($c.unexpected_drive_reference_hit_count), pass=$($c.pass)"
          }
          Add-Content $env:GITHUB_STEP_SUMMARY '- Drive mutation: false'
          Add-Content $env:GITHUB_STEP_SUMMARY "- Next gate: $($p.next_gate)"
          if ($code -ne 0 -and $code -ne 3) { throw "DUPLICATE_TREE_AUDIT_EXECUTION_ERROR_EXIT_$code" }
          Write-Host "DUPLICATE_TREE_AUDIT_COMPLETED:$($p.status)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duplicate-tree-audit-${{ github.run_id }}
          path: duplicate-tree-audit-evidence
          if-no-files-found: error
          retention-days: 30
