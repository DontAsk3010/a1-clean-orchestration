name: Windows Telegram MG Multi-Day Context Study

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - telegram-mg-multiday-context-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-windows-telegram-mg-multiday-context-study
  cancel-in-progress: false

jobs:
  study:
    name: Telegram MG multi-day prior-state context study
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 720
    steps:
      - name: Checkout exact formula research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate multi-day context request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.ref_name }}' -ne 'formula/current-clean-research-v1') { throw 'MG context study is branch-restricted.' }
          $req = Get-Content -LiteralPath 'telegram-mg-multiday-context-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_TELEGRAM_MG_MULTIDAY_CONTEXT_REQUEST_V1') { throw 'Unsupported MG context request schema.' }
          if ($req.enabled -ne $true) { throw 'MG context request not enabled.' }
          if ($req.authorization_phrase -ne 'AUTHORIZE_TELEGRAM_MG_MULTIDAY_CONTEXT_STUDY') { throw 'Exact context-study authorization phrase required.' }
          if ($req.source_names.Count -lt 3) { throw 'At least three chronological source periods required.' }
          if ($req.drive_output_folder_id -ne '1uQKSZD8KbOZ2j3moyZiH1EuJPlEhEAuC') { throw 'Unexpected Formula Research output folder.' }
          $json = $req | ConvertTo-Json -Compress -Depth 20
          "A1_MG_MULTIDAY_REQUEST_JSON=$json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Drive credential bindings
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:A1_DRIVE_READER_CREDENTIALS, $env:A1_DRIVE_WRITER_CREDENTIALS)) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Drive credential binding missing.' }
          }

      - name: Install and test exact MG context code
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'MG_CONTEXT_INSTALL_FAILED' }
          py -3.11 -m compileall -q src tests
          if ($LASTEXITCODE -ne 0) { throw 'MG_CONTEXT_COMPILE_FAILED' }
          py -3.11 -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'MG_CONTEXT_TESTS_FAILED' }

      - name: Run multi-period prior-state context study
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = $env:A1_MG_MULTIDAY_REQUEST_JSON | ConvertFrom-Json
          $argsList = @(
            '-3.11', '-m', 'a1clean.formula_research.telegram_mg_multiday_context_study',
            '--request-id', [string]$req.request_id,
            '--software-revision', '${{ github.sha }}',
            '--drive-output-folder-id', [string]$req.drive_output_folder_id,
            '--output', 'telegram-mg-multiday-context-study-result.json',
            '--effort-lookback', [string][int]$req.params.effort_lookback,
            '--progress-lookback', [string][int]$req.params.progress_lookback,
            '--high-lookback', [string][int]$req.params.high_lookback,
            '--recovery-lookback', [string][int]$req.params.recovery_lookback,
            '--low-stabilization-bars', [string][int]$req.params.low_stabilization_bars,
            '--early-checkpoint-bar', [string][int]$req.params.early_checkpoint_bar,
            '--late-lift-min-bar', [string][int]$req.params.late_lift_min_bar
          )
          foreach ($source in $req.source_names) {
            $argsList += @('--source-name', [string]$source)
          }
          & py @argsList
          if ($LASTEXITCODE -ne 0) { throw "MG_CONTEXT_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Upload context-study artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mg-multiday-context-study-${{ github.run_id }}
          path: telegram-mg-multiday-context-study-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Research safety declaration
        if: always()
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          "### Telegram MG multi-day prior-state context study" >> $env:GITHUB_STEP_SUMMARY
          "- Purpose: detect early same-day movement relative to the ticker's own prior-state baseline, not merely a stock already moving intraday." >> $env:GITHUB_STEP_SUMMARY
          "- Candidate baseline horizons: 2/3/5/10 prior trading days; none is canonical by construction." >> $env:GITHUB_STEP_SUMMARY
          "- Comparison uses the same ticker, same session segment, and comparable observed-bar stage." >> $env:GITHUB_STEP_SUMMARY
          "- H+1 is not used to qualify MG; reward evaluation is same-day only and begins after the alert bar." >> $env:GITHUB_STEP_SUMMARY
          "- All variants remain research-only and non-canonical." >> $env:GITHUB_STEP_SUMMARY
