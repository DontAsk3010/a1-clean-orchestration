name: Cancel Superseded Formula Run

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - formula-run-cancel-requests/current.json

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate request and cancel exact superseded run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('formula-run-cancel-requests/current.json', encoding='utf-8'))
          assert r['schema']=='A1_FORMULA_RUN_CANCEL_REQUEST_V1'
          assert r['authorization_phrase']=='CANCEL_EXACT_SUPERSEDED_FORMULA_RUN'
          assert r['reason']=='SUPERSEDED_BY_VALIDATED_NEWER_RESEARCH_REVISION'
          assert int(r['run_id']) > 0
          print(int(r['run_id']))
          PY
          RUN_ID=$(python -c "import json; print(json.load(open('formula-run-cancel-requests/current.json'))['run_id'])")
          BODY=$(mktemp)
          STATUS=$(curl -sS -o "$BODY" -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/cancel")
          if [ "$STATUS" = "202" ]; then
            echo "Cancellation accepted for exact run ${RUN_ID}."
          elif [ "$STATUS" = "409" ]; then
            echo "Exact run ${RUN_ID} is already completed/cancelled; no action needed."
            cat "$BODY"
          else
            echo "Unexpected cancel status ${STATUS} for exact run ${RUN_ID}."
            cat "$BODY"
            exit 1
          fi
