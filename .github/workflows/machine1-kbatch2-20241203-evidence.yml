name: Machine1 K-batch2 2024-12-03 Governed Evidence Extract

on:
  push:
    branches:
      - machine1/evidence-kbatch-20241203
    paths:
      - .github/workflows/machine1-kbatch2-20241203-evidence.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\\TRADING SYSTEM\\02_CURRENT_HISTORICAL_RAW_DATA_UJI\\Raw Des 02-31-2024.csv'
    steps:
      - uses: actions/checkout@v4
      - name: Extract governed packets
        id: extract
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'
          $raw=[System.IO.Path]::GetFullPath($env:RAW_FILE)
          $expectedSha256='5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          $specs=@(
            [pscustomobject]@{Ticker='KIJA'; First=934393; Last=934583; Count=191; FirstTime='09:00:00'; LastTime='16:06:00'; BundleLine=144},
            [pscustomobject]@{Ticker='KING'; First=933548; Last=933566; Count=19; FirstTime='09:01:00'; LastTime='15:15:00'; BundleLine=145},
            [pscustomobject]@{Ticker='KINO'; First=933918; Last=933927; Count=10; FirstTime='09:00:00'; LastTime='15:39:00'; BundleLine=146}
          )
          if(-not(Test-Path -LiteralPath $raw -PathType Leaf)){throw "RAW_MISSING $raw"}
          $got=(Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant()
          if($got -ne $expectedSha256){throw "RAW_HASH_MISMATCH $got"}
          $header=$null; $captures=@{}
          foreach($s in $specs){$captures[$s.Ticker]=New-Object 'System.Collections.Generic.List[string]'}
          $maxLast=($specs|Measure-Object Last -Maximum).Maximum
          $i=0
          foreach($line in [System.IO.File]::ReadLines($raw,[System.Text.Encoding]::UTF8)){
            if($i -eq 0){$header=$line}
            foreach($s in $specs){if($i -ge $s.First -and $i -le $s.Last){[void]$captures[$s.Ticker].Add($line)}}
            if($i -ge $maxLast){break}; $i++
          }
          $out=Join-Path $PWD 'machine1_kbatch2_20241203_evidence'; New-Item -ItemType Directory -Force $out|Out-Null
          $enc=New-Object System.Text.UTF8Encoding($false)
          foreach($s in $specs){
            $lines=$captures[$s.Ticker]; if($lines.Count -ne $s.Count){throw "$($s.Ticker)_COUNT got=$($lines.Count)"}
            $parsed=@((@($header)+@($lines))|ConvertFrom-Csv); if($parsed.Count -ne $s.Count){throw "$($s.Ticker)_PARSE_COUNT"}
            $records=@()
            for($n=0;$n -lt $parsed.Count;$n++){
              $o=[ordered]@{source_row=$s.First+$n}
              foreach($p in $parsed[$n].PSObject.Properties.Name){$o[$p]=[string]$parsed[$n].$p}
              $records += [pscustomobject]$o
            }
            $tickers=@($records|%{$_.RAW_TICKER}|Sort-Object -Unique)
            if($tickers.Count -ne 1 -or $tickers[0] -ne $s.Ticker){throw "$($s.Ticker)_TICKER_MISMATCH"}
            $dts=@($records|%{[string]$_.RAW_DATETIME_ISO})
            if(@($dts|?{-not $_.StartsWith('2024-12-03')}).Count -gt 0){throw "$($s.Ticker)_DATE_MISMATCH"}
            function Clock([string]$dt){if($dt.Contains('T')){return $dt.Split('T',2)[1].Substring(0,8)};$a=$dt.Split(' ');return $a[$a.Length-1].Substring(0,8)}
            $ft=Clock $dts[0]; $lt=Clock $dts[-1]
            if($ft -ne $s.FirstTime -or $lt -ne $s.LastTime){throw "$($s.Ticker)_TIME $ft-$lt"}
            $rp=Join-Path $out "$($s.Ticker)_20241203_ROWS.jsonl"
            [System.IO.File]::WriteAllLines($rp,[string[]]@($records|%{$_|ConvertTo-Json -Compress -Depth 8}),$enc)
            $proof=[ordered]@{ticker=$s.Ticker;trading_date='2024-12-03';source_sha256=$got;semantic_bundle='Raw Des 02-31-2024__SEMANTIC_0007.jsonl';semantic_bundle_line_number=$s.BundleLine;source_row_first=$s.First;source_row_last=$s.Last;data_rows=$records.Count;first_datetime=$dts[0];last_datetime=$dts[-1];rows_jsonl_sha256=(Get-FileHash $rp -Algorithm SHA256).Hash.ToLowerInvariant()}
            [System.IO.File]::WriteAllText((Join-Path $out "$($s.Ticker)_20241203_PROOF.json"),($proof|ConvertTo-Json -Depth 10),$enc)
            Write-Host "$($s.Ticker)_EVIDENCE_OK rows=$($records.Count) first=$($dts[0]) last=$($dts[-1])"
          }
      - name: Upload governed evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: machine1-kbatch2-20241203-evidence
          path: machine1_kbatch2_20241203_evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Persist exact evidence rows
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force '.machine1_evidence'|Out-Null
          Copy-Item 'machine1_kbatch2_20241203_evidence/*' '.machine1_evidence/' -Force
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.name 'a1-clean-machine1-bot'
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.email 'a1-clean-machine1-bot@users.noreply.github.com'
          git -c safe.directory="$env:GITHUB_WORKSPACE" add -f '.machine1_evidence/*_20241203_ROWS.jsonl'
          git -c safe.directory="$env:GITHUB_WORKSPACE" add '.machine1_evidence/*_20241203_PROOF.json'
          git -c safe.directory="$env:GITHUB_WORKSPACE" commit -m 'Persist governed K-batch2 evidence [skip ci]'
          git -c safe.directory="$env:GITHUB_WORKSPACE" push origin HEAD:machine1/evidence-kbatch-20241203
