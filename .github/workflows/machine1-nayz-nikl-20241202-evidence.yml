name: Machine1 NAYZ-NIKL 20241202 Evidence Extract
on:
  push:
    branches: [machine1/evidence-nayz-nikl-20241202]
    paths: [.github/workflows/machine1-nayz-nikl-20241202-evidence.yml]
permissions:
  contents: read
jobs:
  extract-governed-nayz-nikl:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\\TRADING SYSTEM\\02_CURRENT_HISTORICAL_RAW_DATA_UJI\\Raw Des 02-31-2024.csv'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: machine1/evidence-nayz-nikl-20241202
      - name: Extract exact governed NAYZ-NIKL packets
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'
          $raw=$env:RAW_FILE
          $date='2024-12-02'
          $md5='b8d42b35c90d2dff8b18ae4e1734523b'
          $sha='5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          if(-not(Test-Path -LiteralPath $raw -PathType Leaf)){throw 'RAW_MISSING'}
          $gm=(Get-FileHash -LiteralPath $raw -Algorithm MD5).Hash.ToLowerInvariant()
          $gs=(Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant()
          if($gm-ne$md5 -or $gs-ne$sha){throw 'RAW_HASH_MISMATCH'}
          $specs=@(
            [pscustomobject][ordered]@{ticker='NAYZ';first=1148878;last=1148917;count=40;first_time='09:00:00';last_time='16:00:00';bundle='Raw Des 02-31-2024__SEMANTIC_0004.jsonl';bundle_line=29},
            [pscustomobject][ordered]@{ticker='NCKL';first=1151421;last=1151641;count=221;first_time='09:00:00';last_time='16:13:00';bundle='Raw Des 02-31-2024__SEMANTIC_0004.jsonl';bundle_line=30},
            [pscustomobject][ordered]@{ticker='NELY';first=1149918;last=1149996;count=79;first_time='09:00:00';last_time='16:14:00';bundle='Raw Des 02-31-2024__SEMANTIC_0004.jsonl';bundle_line=31},
            [pscustomobject][ordered]@{ticker='NEST';first=1155717;last=1155894;count=178;first_time='09:00:00';last_time='16:00:00';bundle='Raw Des 02-31-2024__SEMANTIC_0004.jsonl';bundle_line=32},
            [pscustomobject][ordered]@{ticker='NETV';first=1159723;last=1159733;count=11;first_time='09:55:00';last_time='16:09:00';bundle='Raw Des 02-31-2024__SEMANTIC_0004.jsonl';bundle_line=33},
            [pscustomobject][ordered]@{ticker='NFCX';first=1159071;last=1159146;count=76;first_time='09:00:00';last_time='16:14:00';bundle='Raw Des 02-31-2024__SEMANTIC_0004.jsonl';bundle_line=34},
            [pscustomobject][ordered]@{ticker='NICE';first=1159975;last=1160093;count=119;first_time='09:00:00';last_time='16:03:00';bundle='Raw Des 02-31-2024__SEMANTIC_0004.jsonl';bundle_line=35},
            [pscustomobject][ordered]@{ticker='NICK';first=1159858;last=1159879;count=22;first_time='10:57:00';last_time='16:00:00';bundle='Raw Des 02-31-2024__SEMANTIC_0004.jsonl';bundle_line=36},
            [pscustomobject][ordered]@{ticker='NICL';first=1162210;last=1162423;count=214;first_time='09:00:00';last_time='16:14:00';bundle='Raw Des 02-31-2024__SEMANTIC_0004.jsonl';bundle_line=37},
            [pscustomobject][ordered]@{ticker='NIKL';first=1164615;last=1164676;count=62;first_time='09:00:00';last_time='16:14:00';bundle='Raw Des 02-31-2024__SEMANTIC_0004.jsonl';bundle_line=38}
          )
          $out=Join-Path $PWD 'machine1_nayz_nikl_20241202_evidence'
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          $map=@{}; foreach($s in $specs){$map[$s.ticker]=New-Object System.Collections.Generic.List[object]}
          $sr=New-Object System.IO.StreamReader($raw,[System.Text.Encoding]::UTF8,$true,1048576)
          try{
            $hdr=$sr.ReadLine(); if($null-eq$hdr){throw 'RAW_EMPTY'}
            $h=@($hdr.TrimStart([char]0xFEFF).Split(',')); $pl=1
            while(-not $sr.EndOfStream){
              $line=$sr.ReadLine(); $pl++; $row=$pl-1
              if($row-gt 1164676){break}
              if($row-lt 1148878){continue}
              foreach($s in $specs){
                if($row-ge$s.first -and $row-le$s.last){
                  $x=$line|ConvertFrom-Csv -Header $h
                  $f=[ordered]@{}; foreach($hh in $h){$f[$hh]=$x.$hh}
                  $map[$s.ticker].Add([pscustomobject][ordered]@{source_row=[int]$row;physical_line=[int]$pl;raw_line=$line;fields=$f})
                  break
                }
              }
            }
          }finally{$sr.Dispose()}
          $proof=@()
          foreach($s in $specs){
            $a=$map[$s.ticker]
            if($a.Count-ne$s.count){throw "$($s.ticker)_COUNT got=$($a.Count) exp=$($s.count)"}
            for($i=0;$i-lt$a.Count;$i++){
              if($a[$i].source_row-ne($s.first+$i)){throw "$($s.ticker)_ROW"}
              if($a[$i].fields.RAW_TICKER-ne$s.ticker){throw "$($s.ticker)_TICKER"}
              if(-not([string]$a[$i].fields.RAW_DATETIME_ISO).StartsWith($date)){throw "$($s.ticker)_DATE"}
            }
            $fd=[string]$a[0].fields.RAW_DATETIME_ISO; $ld=[string]$a[$a.Count-1].fields.RAW_DATETIME_ISO
            if($fd.Substring($fd.Length-8)-ne$s.first_time -or $ld.Substring($ld.Length-8)-ne$s.last_time){throw "$($s.ticker)_TIME"}
            [ordered]@{source_name=[IO.Path]::GetFileName($raw);source_md5=$gm;source_sha256=$gs;ticker=$s.ticker;trading_date=$date;semantic_bundle=$s.bundle;bundle_line_number=[int]$s.bundle_line;source_row_first=[int]$s.first;source_row_last=[int]$s.last;data_rows=[int]$s.count;first_datetime=$fd;last_datetime=$ld;header_line=$hdr;header_fields=$h;rows=$a}|ConvertTo-Json -Depth 8|Set-Content -LiteralPath (Join-Path $out "$($s.ticker)_20241202_PACKET.json") -Encoding UTF8
            $rp=Join-Path $out "$($s.ticker)_20241202_ROWS.jsonl"; if(Test-Path $rp){Remove-Item $rp -Force}
            foreach($rr in $a){($rr|ConvertTo-Json -Depth 6 -Compress)|Add-Content -LiteralPath $rp -Encoding UTF8}
            $proof+=[pscustomobject][ordered]@{ticker=$s.ticker;trading_date=$date;semantic_bundle=$s.bundle;bundle_line_number=[int]$s.bundle_line;source_row_first=[int]$s.first;source_row_last=[int]$s.last;data_rows=[int]$s.count;first_datetime=$fd;last_datetime=$ld}
            Write-Host "PASS $($s.ticker) rows=$($s.count)"
          }
          [ordered]@{status='PASS';source_md5=$gm;source_sha256=$gs;trading_date=$date;tickers=$proof}|ConvertTo-Json -Depth 6|Set-Content -LiteralPath (Join-Path $out 'CHUNK_PROOF.json') -Encoding UTF8
      - name: Upload governed evidence
        uses: actions/upload-artifact@v4
        with:
          name: machine1-nayz-nikl-20241202-evidence
          path: machine1_nayz_nikl_20241202_evidence/
          if-no-files-found: error
          retention-days: 7
