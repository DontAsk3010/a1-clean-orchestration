name: Windows Dual Lane Multi Layer Behavior Miner V2

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - dual-lane-behavior-v2-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-windows-dual-lane-behavior-v2
  cancel-in-progress: true

jobs:
  study:
    name: Mine synchronized price x formation behavior
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 720
    steps:
      - name: Checkout exact research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'dual-lane-behavior-v2-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_DUAL_LANE_BEHAVIOR_V2_REQUEST') { throw 'Unsupported V2 request schema.' }
          if ($req.enabled -ne $true) { throw 'V2 behavior request not enabled.' }
          $json = $req | ConvertTo-Json -Compress -Depth 20
          "A1_DUAL_LANE_V2_REQUEST_JSON=$json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install compile and test V2
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'DUAL_LANE_V2_INSTALL_FAILED' }
          py -3.11 -m py_compile src/a1clean/formula_research/durable_cache_catalog.py src/a1clean/formula_research/dual_lane_behavior_v2.py
          if ($LASTEXITCODE -ne 0) { throw 'DUAL_LANE_V2_COMPILE_FAILED' }
          py -3.11 -m pytest -q tests/test_dual_lane_behavior_v2.py
          if ($LASTEXITCODE -ne 0) { throw 'DUAL_LANE_V2_TEST_FAILED' }

      - name: Run governed non OOS multi layer behavior mining
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = $env:A1_DUAL_LANE_V2_REQUEST_JSON | ConvertFrom-Json
          & py -3.11 -m a1clean.formula_research.dual_lane_behavior_v2 `
            --output 'dual-lane-behavior-v2-result.json' `
            --prior-days ([string][int]$req.prior_days) `
            --buy-fee-pct ([string][double]$req.execution.buy_fee_pct) `
            --sell-fee-pct ([string][double]$req.execution.sell_fee_pct)
          if ($LASTEXITCODE -ne 0) { throw "DUAL_LANE_V2_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Assert research guardrails
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $obj = Get-Content -LiteralPath 'dual-lane-behavior-v2-result.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($obj.schema -ne 'A1_DUAL_LANE_MULTI_LAYER_BEHAVIOR_MINER_V2') { throw 'V2_RESULT_SCHEMA_MISMATCH' }
          if ($obj.march_2025_reserved_oos_touched -ne $false) { throw 'RESERVED_OOS_TOUCHED' }
          if ($obj.important_semantics.future_data_used_for_state -ne $false) { throw 'FUTURE_STATE_LEAKAGE_FLAGGED' }
          if ($obj.important_semantics.price_behavior_and_formation_behavior_both_required -ne $true) { throw 'DUAL_LANE_REQUIRED_FLAG_MISSING' }
          if ($obj.important_semantics.missing_flow_not_zero -ne $true) { throw 'MISSING_FLOW_ZERO_GUARD_MISSING' }
          if ($obj.important_semantics.haka_haki_not_derived_from_trade_value_and_nbss_without_source_contract -ne $true) { throw 'UNPROVEN_HAKA_HAKI_GUARD_MISSING' }
          if ($obj.data_access -ne 'DURABLE_CACHE_ONLY_NO_RAW_REREAD') { throw 'RAW_REREAD_NOT_ALLOWED' }

      - name: Upload V2 behavior research artifact
        uses: actions/upload-artifact@v4
        with:
          name: dual-lane-behavior-v2-${{ github.run_id }}
          path: dual-lane-behavior-v2-result.json
          if-no-files-found: error
          retention-days: 30
