name: Windows Telegram MG OpenLow Signal V15

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - telegram-mg-openlow-signal-v15-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-windows-telegram-mg-openlow-signal-v15
  cancel-in-progress: true

jobs:
  replay:
    name: Replay causal OpenLow ladder signals in Telegram form
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 180
    steps:
      - name: Checkout exact research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'telegram-mg-openlow-signal-v15-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_TELEGRAM_MG_OPENLOW_SIGNAL_V15_REQUEST_V1') { throw 'Unsupported V15 request schema.' }
          if ($req.enabled -ne $true) { throw 'V15 request disabled.' }

      - name: Install and compile V15
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'V15_INSTALL_FAILED' }
          py -3.11 -m py_compile src/a1clean/formula_research/telegram_mg_openlow_signal_replay_v15.py
          if ($LASTEXITCODE -ne 0) { throw 'V15_COMPILE_FAILED' }

      - name: Run V15 from durable cache only
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & py -3.11 -m a1clean.formula_research.telegram_mg_openlow_signal_replay_v15 --output 'telegram-mg-openlow-signal-v15-result.json'
          if ($LASTEXITCODE -ne 0) { throw "V15_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Upload V15 artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mg-openlow-signal-v15-${{ github.run_id }}
          path: telegram-mg-openlow-signal-v15-result.json
          if-no-files-found: error
          retention-days: 30
