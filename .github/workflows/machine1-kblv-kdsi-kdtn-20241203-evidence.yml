name: Machine1 KBLV KDSI KDTN 2024-12-03 Governed Evidence Extract
on:
  push:
    branches: [machine1/evidence-kblv-kdsi-kdtn-20241203]
    paths: [.github/workflows/machine1-kblv-kdsi-kdtn-20241203-evidence.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\\TRADING SYSTEM\\02_CURRENT_HISTORICAL_RAW_DATA_UJI\\Raw Des 02-31-2024.csv'
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact governed microbatch
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'
          $raw=[System.IO.Path]::GetFullPath($env:RAW_FILE)
          $expectedSha='5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          if (-not (Test-Path -LiteralPath $raw -PathType Leaf)) { throw "RAW_MISSING $raw" }
          $gotSha=(Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($gotSha -ne $expectedSha) { throw "RAW_HASH_MISMATCH $gotSha" }
          $specs=@(
            [pscustomobject]@{Ticker='KBLV';First=928052;Last=928054;Count=3;FirstTime='09:55:00';LastTime='16:07:00';Line=136},
            [pscustomobject]@{Ticker='KDSI';First=927778;Last=927788;Count=11;FirstTime='09:06:00';LastTime='14:47:00';Line=137},
            [pscustomobject]@{Ticker='KDTN';First=928125;Last=928146;Count=22;FirstTime='09:02:00';LastTime='15:46:00';Line=138}
          )
          $header=$null
          $buffers=@{}
          foreach($s in $specs){$buffers[$s.Ticker]=New-Object 'System.Collections.Generic.List[string]'}
          $maxLast=($specs|Measure-Object Last -Maximum).Maximum
          $i=0
          foreach($line in [System.IO.File]::ReadLines($raw,[System.Text.Encoding]::UTF8)){
            if($i -eq 0){$header=$line}
            foreach($s in $specs){if($i -ge $s.First -and $i -le $s.Last){[void]$buffers[$s.Ticker].Add($line)}}
            if($i -ge $maxLast){break}
            $i++
          }
          $out=Join-Path $PWD 'machine1_microbatch_20241203_evidence'
          New-Item -ItemType Directory -Force -Path $out|Out-Null
          $utf8=New-Object System.Text.UTF8Encoding($false)
          foreach($s in $specs){
            $lines=$buffers[$s.Ticker]
            if($lines.Count -ne $s.Count){throw "$($s.Ticker)_COUNT got=$($lines.Count) expected=$($s.Count)"}
            $parsed=@((@($header)+@($lines))|ConvertFrom-Csv)
            $records=@()
            for($j=0;$j -lt $parsed.Count;$j++){
              $o=[ordered]@{source_row=$s.First+$j}
              foreach($p in $parsed[$j].PSObject.Properties.Name){$o[$p]=[string]$parsed[$j].$p}
              $records += [pscustomobject]$o
            }
            $ticks=@($records|%{$_.RAW_TICKER}|Sort-Object -Unique)
            if($ticks.Count -ne 1 -or $ticks[0] -ne $s.Ticker){throw "$($s.Ticker)_TICKER_MISMATCH"}
            $dts=@($records|%{[string]$_.RAW_DATETIME_ISO})
            if(@($dts|?{-not $_.StartsWith('2024-12-03')}).Count -gt 0){throw "$($s.Ticker)_DATE_MISMATCH"}
            function Clock([string]$dt){if($dt.Contains('T')){return $dt.Split('T',2)[1].Substring(0,8)};$p=$dt.Split(' ');return $p[$p.Length-1].Substring(0,8)}
            if((Clock $dts[0]) -ne $s.FirstTime -or (Clock $dts[-1]) -ne $s.LastTime){throw "$($s.Ticker)_TIME_MISMATCH"}
            $rp=Join-Path $out "$($s.Ticker)_20241203_ROWS.jsonl"
            $jsonl=@($records|%{$_|ConvertTo-Json -Compress -Depth 8})
            [System.IO.File]::WriteAllLines($rp,[string[]]$jsonl,$utf8)
            $proof=[ordered]@{ticker=$s.Ticker;trading_date='2024-12-03';source_sha256=$gotSha;semantic_bundle='Raw Des 02-31-2024__SEMANTIC_0007.jsonl';semantic_bundle_line_number=$s.Line;source_row_first=$s.First;source_row_last=$s.Last;data_rows=$s.Count;first_datetime=$dts[0];last_datetime=$dts[-1];rows_jsonl_sha256=(Get-FileHash $rp -Algorithm SHA256).Hash.ToLowerInvariant()}
            [System.IO.File]::WriteAllText((Join-Path $out "$($s.Ticker)_20241203_PROOF.json"),($proof|ConvertTo-Json -Depth 8),$utf8)
            Write-Host "$($s.Ticker)_EVIDENCE_OK rows=$($s.Count) source_rows=$($s.First)-$($s.Last) first=$($dts[0]) last=$($dts[-1])"
          }
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: machine1-kblv-kdsi-kdtn-20241203-evidence
          path: machine1_microbatch_20241203_evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Persist evidence rows
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force '.machine1_evidence'|Out-Null
          foreach($t in @('KBLV','KDSI','KDTN')){
            Copy-Item "machine1_microbatch_20241203_evidence/$($t)_20241203_ROWS.jsonl" ".machine1_evidence/$($t)_20241203_ROWS.jsonl" -Force
            Copy-Item "machine1_microbatch_20241203_evidence/$($t)_20241203_PROOF.json" ".machine1_evidence/$($t)_20241203_PROOF.json" -Force
          }
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.name 'a1-clean-machine1-bot'
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.email 'a1-clean-machine1-bot@users.noreply.github.com'
          git -c safe.directory="$env:GITHUB_WORKSPACE" add -f .machine1_evidence/KBLV_20241203_ROWS.jsonl .machine1_evidence/KDSI_20241203_ROWS.jsonl .machine1_evidence/KDTN_20241203_ROWS.jsonl
          git -c safe.directory="$env:GITHUB_WORKSPACE" add .machine1_evidence/KBLV_20241203_PROOF.json .machine1_evidence/KDSI_20241203_PROOF.json .machine1_evidence/KDTN_20241203_PROOF.json
          git -c safe.directory="$env:GITHUB_WORKSPACE" commit -m 'Persist KBLV KDSI KDTN governed evidence [skip ci]'
          git -c safe.directory="$env:GITHUB_WORKSPACE" push origin HEAD:machine1/evidence-kblv-kdsi-kdtn-20241203
