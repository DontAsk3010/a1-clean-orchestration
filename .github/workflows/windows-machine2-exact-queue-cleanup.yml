name: Machine2 Exact Queue Cleanup

on:
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/windows-machine2-exact-queue-cleanup.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale Machine2 CURRENT and PRESTART runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: fix/v32-dynamic-source-universe-v1
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          for wf in windows-m2-current-scientific-restart.yml windows-v32-dynamic-source-preflight.yml; do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/actions/workflows/${wf}/runs?branch=${BRANCH}&per_page=100" > runs.json
            jq -r '.workflow_runs[] | select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested") | .id' runs.json > run_ids.txt
            while IFS= read -r rid; do
              [ -n "${rid}" ] || continue
              code="$(curl -sS -o /tmp/cancel.out -w '%{http_code}' -X POST \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "${api}/actions/runs/${rid}/cancel")"
              echo "M2_QUEUE_CANCEL|workflow=${wf}|run_id=${rid}|http=${code}"
              if [ "${code}" != '202' ] && [ "${code}" != '409' ]; then
                cat /tmp/cancel.out || true
                exit 21
              fi
            done < run_ids.txt
          done
          echo 'M2_STALE_QUEUE_CLEANUP_PASS=true'
