name: Windows Drive Guardrail Preflight

on:
  workflow_dispatch:
    inputs:
      run_source_identity:
        description: 'After Drive guardrail PASS, hash and reconcile the full dynamically discovered canonical RAW universe against the local read-only RAW copy.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: a1-windows-drive-guardrail-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Drive access separation and optional source identity
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 120
    env:
      A1_RAW_DIR: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI'
    steps:
      - name: Checkout migration code
        uses: actions/checkout@v4

      - name: Verify separate external Drive credential bindings exist
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $bindings = @(
            @{ Name = 'A1_DRIVE_READER_CREDENTIALS'; Path = $env:A1_DRIVE_READER_CREDENTIALS },
            @{ Name = 'A1_DRIVE_WRITER_CREDENTIALS'; Path = $env:A1_DRIVE_WRITER_CREDENTIALS }
          )
          foreach ($binding in $bindings) {
            if ([string]::IsNullOrWhiteSpace($binding.Path)) {
              throw "$($binding.Name) is not configured for the runner process."
            }
            if (-not (Test-Path -LiteralPath $binding.Path -PathType Leaf)) {
              throw "$($binding.Name) points to a credential file that does not exist. Credential content/path is intentionally not printed."
            }
          }
          Write-Host 'Drive reader credential binding: PRESENT'
          Write-Host 'Drive writer credential binding: PRESENT'

      - name: Install migration package
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e .

      - name: Verify governed Drive permission separation
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m a1clean.cli drive-preflight

      - name: Reconcile complete canonical source universe against local read-only RAW copy
        if: ${{ inputs.run_source_identity }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m a1clean.cli source-preflight

      - name: Safety declaration
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Write-Host 'PREFLIGHT ONLY.'
          Write-Host 'RAW and governed CURRENT are opened only via the reader identity and are never written by this workflow.'
          Write-Host 'PARITY_STAGING is opened via the separate writer identity.'
          Write-Host 'Drive write probe is one tiny create/delete object in PARITY_STAGING only.'
          Write-Host 'No frozen V2 corpus processing and no canonical delta execution occur here.'
