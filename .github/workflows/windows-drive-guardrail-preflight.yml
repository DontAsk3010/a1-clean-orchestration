name: Windows Drive Guardrail Preflight

on:
  workflow_dispatch:
    inputs:
      run_source_identity:
        description: 'After Drive guardrail PASS, hash and reconcile the full dynamically discovered canonical RAW universe against the local read-only RAW copy.'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/windows-drive-guardrail-preflight.yml'

permissions:
  contents: read

concurrency:
  group: a1-windows-drive-guardrail-preflight
  cancel-in-progress: false

jobs:
  lane_a:
    name: Guardrail lane A
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 120
    outputs:
      target_pass: ${{ steps.mark.outputs.target_pass }}
      runner_seen: ${{ steps.route.outputs.runner_seen }}
    env:
      A1_RAW_DIR: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI'
    steps:
      - name: Checkout migration code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Route lane without probing Drive on non-target runner
        id: route
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne 'PORSCHE-DESIGN') { throw "A1_DRIVE_GUARDRAIL_WRONG_MACHINE:$env:COMPUTERNAME" }
          "runner_seen=$env:RUNNER_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:RUNNER_NAME -eq 'A1-WINDOWS-COMPUTE-02') {
            'is_target=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'A1_DRIVE_GUARDRAIL_MACHINE2_RUNNER_PASS'
          } else {
            'is_target=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "A1_DRIVE_GUARDRAIL_NON_TARGET_LANE_HOLD:$env:RUNNER_NAME"
            Start-Sleep -Seconds 45
          }

      - name: Verify separate external Drive credential bindings exist
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $bindings = @(
            @{ Name = 'A1_DRIVE_READER_CREDENTIALS'; Path = $env:A1_DRIVE_READER_CREDENTIALS },
            @{ Name = 'A1_DRIVE_WRITER_CREDENTIALS'; Path = $env:A1_DRIVE_WRITER_CREDENTIALS }
          )
          foreach ($binding in $bindings) {
            if ([string]::IsNullOrWhiteSpace($binding.Path)) { throw "$($binding.Name) is not configured for the runner process." }
            if (-not (Test-Path -LiteralPath $binding.Path -PathType Leaf)) { throw "$($binding.Name) points to a credential file that does not exist. Credential content/path is intentionally not printed." }
          }
          $readerHash = (Get-FileHash -LiteralPath $env:A1_DRIVE_READER_CREDENTIALS -Algorithm SHA256).Hash.ToLowerInvariant()
          $writerHash = (Get-FileHash -LiteralPath $env:A1_DRIVE_WRITER_CREDENTIALS -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($readerHash -eq $writerHash) { throw 'A1_DRIVE_GUARDRAIL_READER_WRITER_IDENTICAL_FILE_FORBIDDEN' }
          Write-Host 'Drive reader credential binding: PRESENT'
          Write-Host 'Drive writer credential binding: PRESENT'
          Write-Host 'Drive reader/writer exact file identity: DISTINCT'

      - name: Resolve existing Python 3.11+ without changing Windows policy
        id: python
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = New-Object System.Collections.Generic.List[string]
          foreach ($name in @('python','python3')) {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if ($cmd -and $cmd.Source) { [void]$candidates.Add([string]$cmd.Source) }
          }
          foreach ($root in @(
            'C:\Users\feri-admin\AppData\Local\Programs\Python',
            'C:\Program Files\Python',
            'C:\Python311','C:\Python312','C:\Python313','C:\Python314'
          )) {
            if (Test-Path -LiteralPath $root -PathType Container -ErrorAction SilentlyContinue) {
              Get-ChildItem -LiteralPath $root -Filter python.exe -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                [void]$candidates.Add($_.FullName)
              }
            } elseif (Test-Path -LiteralPath $root -PathType Leaf -ErrorAction SilentlyContinue) {
              [void]$candidates.Add($root)
            }
          }
          $usable = $null
          foreach ($candidate in @($candidates | Select-Object -Unique)) {
            try {
              $versionText = (& $candidate --version 2>&1 | Out-String).Trim()
              if ($versionText -match '^Python\s+(\d+)\.(\d+)') {
                $major = [int]$Matches[1]; $minor = [int]$Matches[2]
                if ($major -eq 3 -and $minor -ge 11) { $usable = $candidate; Write-Host "A1_DRIVE_GUARDRAIL_PYTHON=$versionText"; break }
              }
            } catch {}
          }
          if (-not $usable) { throw 'A1_DRIVE_GUARDRAIL_EXISTING_PYTHON_3_11_PLUS_NOT_FOUND' }
          "python_exe=$usable" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install migration package
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $python = '${{ steps.python.outputs.python_exe }}'
          & $python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { throw "A1_DRIVE_GUARDRAIL_PIP_INSTALL_FAIL:$LASTEXITCODE" }

      - name: Verify governed Drive permission separation
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $python = '${{ steps.python.outputs.python_exe }}'
          & $python -m a1clean.cli drive-preflight
          if ($LASTEXITCODE -ne 0) { throw "A1_DRIVE_GUARDRAIL_PREFLIGHT_FAIL:$LASTEXITCODE" }

      - name: Reconcile complete canonical source universe against local read-only RAW copy
        if: ${{ steps.route.outputs.is_target == 'true' && github.event_name == 'workflow_dispatch' && inputs.run_source_identity }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $python = '${{ steps.python.outputs.python_exe }}'
          & $python -m a1clean.cli source-preflight
          if ($LASTEXITCODE -ne 0) { throw "A1_DRIVE_SOURCE_PREFLIGHT_FAIL:$LASTEXITCODE" }

      - name: Safety declaration
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Write-Host 'PREFLIGHT ONLY.'
          Write-Host 'Runner proof target: A1-WINDOWS-COMPUTE-02 on PORSCHE-DESIGN.'
          Write-Host 'RAW and governed CURRENT are opened only via the reader identity and are never written by this workflow.'
          Write-Host 'PARITY_STAGING is opened via the separate writer identity.'
          Write-Host 'Drive write probe is one tiny create/delete object in PARITY_STAGING only.'
          Write-Host 'No frozen V2 corpus processing and no canonical delta execution occur here.'

      - name: Mark exact target guardrail PASS
        id: mark
        if: ${{ success() && steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          'target_pass=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'A1_DRIVE_GUARDRAIL_TARGET_LANE_PASS=true'

  lane_b:
    name: Guardrail lane B
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 120
    outputs:
      target_pass: ${{ steps.mark.outputs.target_pass }}
      runner_seen: ${{ steps.route.outputs.runner_seen }}
    env:
      A1_RAW_DIR: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI'
    steps:
      - name: Checkout migration code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Route lane without probing Drive on non-target runner
        id: route
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne 'PORSCHE-DESIGN') { throw "A1_DRIVE_GUARDRAIL_WRONG_MACHINE:$env:COMPUTERNAME" }
          "runner_seen=$env:RUNNER_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:RUNNER_NAME -eq 'A1-WINDOWS-COMPUTE-02') {
            'is_target=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'A1_DRIVE_GUARDRAIL_MACHINE2_RUNNER_PASS'
          } else {
            'is_target=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "A1_DRIVE_GUARDRAIL_NON_TARGET_LANE_HOLD:$env:RUNNER_NAME"
            Start-Sleep -Seconds 45
          }

      - name: Verify separate external Drive credential bindings exist
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $bindings = @(
            @{ Name = 'A1_DRIVE_READER_CREDENTIALS'; Path = $env:A1_DRIVE_READER_CREDENTIALS },
            @{ Name = 'A1_DRIVE_WRITER_CREDENTIALS'; Path = $env:A1_DRIVE_WRITER_CREDENTIALS }
          )
          foreach ($binding in $bindings) {
            if ([string]::IsNullOrWhiteSpace($binding.Path)) { throw "$($binding.Name) is not configured for the runner process." }
            if (-not (Test-Path -LiteralPath $binding.Path -PathType Leaf)) { throw "$($binding.Name) points to a credential file that does not exist. Credential content/path is intentionally not printed." }
          }
          $readerHash = (Get-FileHash -LiteralPath $env:A1_DRIVE_READER_CREDENTIALS -Algorithm SHA256).Hash.ToLowerInvariant()
          $writerHash = (Get-FileHash -LiteralPath $env:A1_DRIVE_WRITER_CREDENTIALS -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($readerHash -eq $writerHash) { throw 'A1_DRIVE_GUARDRAIL_READER_WRITER_IDENTICAL_FILE_FORBIDDEN' }
          Write-Host 'Drive reader credential binding: PRESENT'
          Write-Host 'Drive writer credential binding: PRESENT'
          Write-Host 'Drive reader/writer exact file identity: DISTINCT'

      - name: Resolve existing Python 3.11+ without changing Windows policy
        id: python
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = New-Object System.Collections.Generic.List[string]
          foreach ($name in @('python','python3')) {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if ($cmd -and $cmd.Source) { [void]$candidates.Add([string]$cmd.Source) }
          }
          foreach ($root in @(
            'C:\Users\feri-admin\AppData\Local\Programs\Python',
            'C:\Program Files\Python',
            'C:\Python311','C:\Python312','C:\Python313','C:\Python314'
          )) {
            if (Test-Path -LiteralPath $root -PathType Container -ErrorAction SilentlyContinue) {
              Get-ChildItem -LiteralPath $root -Filter python.exe -File -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
                [void]$candidates.Add($_.FullName)
              }
            } elseif (Test-Path -LiteralPath $root -PathType Leaf -ErrorAction SilentlyContinue) {
              [void]$candidates.Add($root)
            }
          }
          $usable = $null
          foreach ($candidate in @($candidates | Select-Object -Unique)) {
            try {
              $versionText = (& $candidate --version 2>&1 | Out-String).Trim()
              if ($versionText -match '^Python\s+(\d+)\.(\d+)') {
                $major = [int]$Matches[1]; $minor = [int]$Matches[2]
                if ($major -eq 3 -and $minor -ge 11) { $usable = $candidate; Write-Host "A1_DRIVE_GUARDRAIL_PYTHON=$versionText"; break }
              }
            } catch {}
          }
          if (-not $usable) { throw 'A1_DRIVE_GUARDRAIL_EXISTING_PYTHON_3_11_PLUS_NOT_FOUND' }
          "python_exe=$usable" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install migration package
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $python = '${{ steps.python.outputs.python_exe }}'
          & $python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { throw "A1_DRIVE_GUARDRAIL_PIP_INSTALL_FAIL:$LASTEXITCODE" }

      - name: Verify governed Drive permission separation
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $python = '${{ steps.python.outputs.python_exe }}'
          & $python -m a1clean.cli drive-preflight
          if ($LASTEXITCODE -ne 0) { throw "A1_DRIVE_GUARDRAIL_PREFLIGHT_FAIL:$LASTEXITCODE" }

      - name: Reconcile complete canonical source universe against local read-only RAW copy
        if: ${{ steps.route.outputs.is_target == 'true' && github.event_name == 'workflow_dispatch' && inputs.run_source_identity }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $python = '${{ steps.python.outputs.python_exe }}'
          & $python -m a1clean.cli source-preflight
          if ($LASTEXITCODE -ne 0) { throw "A1_DRIVE_SOURCE_PREFLIGHT_FAIL:$LASTEXITCODE" }

      - name: Safety declaration
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Write-Host 'PREFLIGHT ONLY.'
          Write-Host 'Runner proof target: A1-WINDOWS-COMPUTE-02 on PORSCHE-DESIGN.'
          Write-Host 'RAW and governed CURRENT are opened only via the reader identity and are never written by this workflow.'
          Write-Host 'PARITY_STAGING is opened via the separate writer identity.'
          Write-Host 'Drive write probe is one tiny create/delete object in PARITY_STAGING only.'
          Write-Host 'No frozen V2 corpus processing and no canonical delta execution occur here.'

      - name: Mark exact target guardrail PASS
        id: mark
        if: ${{ success() && steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          'target_pass=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'A1_DRIVE_GUARDRAIL_TARGET_LANE_PASS=true'

  assert_target_pass:
    name: Require one exact Machine2 Guardrail PASS
    if: ${{ always() }}
    needs: [lane_a, lane_b]
    runs-on: ubuntu-latest
    steps:
      - name: Assert at least one exact target lane passed
        shell: bash
        run: |
          echo "lane_a_runner=${{ needs.lane_a.outputs.runner_seen }}"
          echo "lane_b_runner=${{ needs.lane_b.outputs.runner_seen }}"
          if [[ "${{ needs.lane_a.outputs.target_pass }}" == "true" || "${{ needs.lane_b.outputs.target_pass }}" == "true" ]]; then
            echo 'A1_DRIVE_GUARDRAIL_EXACT_TARGET_PASS=true'
            exit 0
          fi
          echo 'A1_DRIVE_GUARDRAIL_EXACT_TARGET_PASS=false'
          exit 1
