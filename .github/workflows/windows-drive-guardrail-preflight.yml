name: Windows Drive Guardrail Preflight

on:
  workflow_dispatch:
    inputs:
      run_source_identity:
        description: 'Reserved for later source-identity preflight after Drive guardrail PASS.'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/windows-drive-guardrail-preflight.yml'
      - 'scripts/windows/Invoke-A1DriveGuardrailRest.ps1'

permissions:
  contents: read

concurrency:
  group: a1-windows-drive-guardrail-preflight
  cancel-in-progress: false

jobs:
  lane_a:
    name: Guardrail lane A
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 30
    outputs:
      target_pass: ${{ steps.mark.outputs.target_pass }}
      runner_seen: ${{ steps.route.outputs.runner_seen }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Route lane without Drive access on non-target runner
        id: route
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne 'PORSCHE-DESIGN') { throw "A1_DRIVE_GUARDRAIL_WRONG_MACHINE:$env:COMPUTERNAME" }
          "runner_seen=$env:RUNNER_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:RUNNER_NAME -eq 'A1-WINDOWS-COMPUTE-02') {
            'is_target=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'A1_DRIVE_GUARDRAIL_MACHINE2_RUNNER_PASS'
          } else {
            'is_target=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "A1_DRIVE_GUARDRAIL_NON_TARGET_LANE_HOLD:$env:RUNNER_NAME"
            Start-Sleep -Seconds 45
          }

      - name: Parse REST guardrail before execution
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts\windows\Invoke-A1DriveGuardrailRest.ps1'),[ref]$tokens,[ref]$errors)
          if (@($errors).Count -ne 0) { foreach ($e in @($errors)) { Write-Host $e.Message }; throw 'A1_DRIVE_GUARDRAIL_REST_PARSE_FAIL' }
          Write-Host 'A1_DRIVE_GUARDRAIL_REST_PARSE_PASS'

      - name: Execute recovery-aware Drive guardrail via REST
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\windows\Invoke-A1DriveGuardrailRest.ps1'
          if (-not $?) { throw 'A1_DRIVE_GUARDRAIL_REST_EXEC_FAIL' }
          Write-Host 'A1_DRIVE_GUARDRAIL_REST_EXECUTION_RETURNED_SUCCESSFULLY'

      - name: Mark exact target guardrail PASS
        id: mark
        if: ${{ success() && steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          'target_pass=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'A1_DRIVE_GUARDRAIL_TARGET_LANE_PASS=true'

  lane_b:
    name: Guardrail lane B
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 30
    outputs:
      target_pass: ${{ steps.mark.outputs.target_pass }}
      runner_seen: ${{ steps.route.outputs.runner_seen }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Route lane without Drive access on non-target runner
        id: route
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne 'PORSCHE-DESIGN') { throw "A1_DRIVE_GUARDRAIL_WRONG_MACHINE:$env:COMPUTERNAME" }
          "runner_seen=$env:RUNNER_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:RUNNER_NAME -eq 'A1-WINDOWS-COMPUTE-02') {
            'is_target=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'A1_DRIVE_GUARDRAIL_MACHINE2_RUNNER_PASS'
          } else {
            'is_target=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "A1_DRIVE_GUARDRAIL_NON_TARGET_LANE_HOLD:$env:RUNNER_NAME"
            Start-Sleep -Seconds 45
          }

      - name: Parse REST guardrail before execution
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts\windows\Invoke-A1DriveGuardrailRest.ps1'),[ref]$tokens,[ref]$errors)
          if (@($errors).Count -ne 0) { foreach ($e in @($errors)) { Write-Host $e.Message }; throw 'A1_DRIVE_GUARDRAIL_REST_PARSE_FAIL' }
          Write-Host 'A1_DRIVE_GUARDRAIL_REST_PARSE_PASS'

      - name: Execute recovery-aware Drive guardrail via REST
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\windows\Invoke-A1DriveGuardrailRest.ps1'
          if (-not $?) { throw 'A1_DRIVE_GUARDRAIL_REST_EXEC_FAIL' }
          Write-Host 'A1_DRIVE_GUARDRAIL_REST_EXECUTION_RETURNED_SUCCESSFULLY'

      - name: Mark exact target guardrail PASS
        id: mark
        if: ${{ success() && steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          'target_pass=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'A1_DRIVE_GUARDRAIL_TARGET_LANE_PASS=true'

  assert_target_pass:
    name: Require one exact Machine2 recovery guardrail PASS
    if: ${{ always() }}
    needs: [lane_a, lane_b]
    runs-on: ubuntu-latest
    steps:
      - name: Assert at least one exact target lane passed
        shell: bash
        run: |
          echo "lane_a_runner=${{ needs.lane_a.outputs.runner_seen }}"
          echo "lane_b_runner=${{ needs.lane_b.outputs.runner_seen }}"
          if [[ "${{ needs.lane_a.outputs.target_pass }}" == "true" || "${{ needs.lane_b.outputs.target_pass }}" == "true" ]]; then
            echo 'A1_DRIVE_GUARDRAIL_EXACT_TARGET_PASS=true'
            exit 0
          fi
          echo 'A1_DRIVE_GUARDRAIL_EXACT_TARGET_PASS=false'
          exit 1
