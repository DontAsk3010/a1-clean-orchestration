name: Machine1 Date03 Prefix Reaudit ADMF Evidence
on:
  push:
    branches: [machine1/evidence-kbatch-20241203]
    paths: [.github/workflows/machine1-date03-prefix-reaudit-admf-evidence.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\\TRADING SYSTEM\\02_CURRENT_HISTORICAL_RAW_DATA_UJI\\Raw Des 02-31-2024.csv'
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact ADMF Date03 source rows for prefix reaudit
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'
          $raw=[System.IO.Path]::GetFullPath($env:RAW_FILE)
          $expected='5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          $ticker='ADMF';$first=21301;$last=21322;$count=22
          if(-not(Test-Path -LiteralPath $raw -PathType Leaf)){throw 'RAW_MISSING'}
          $got=(Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant()
          if($got -ne $expected){throw "RAW_HASH_MISMATCH $got"}
          $header=$null;$lines=New-Object 'System.Collections.Generic.List[string]';$i=0
          foreach($line in [System.IO.File]::ReadLines($raw,[System.Text.Encoding]::UTF8)){
            if($i -eq 0){$header=$line}
            if($i -ge $first -and $i -le $last){[void]$lines.Add($line)}
            if($i -ge $last){break};$i++
          }
          if($lines.Count -ne $count){throw "COUNT got=$($lines.Count) expected=$count"}
          $parsed=@((@($header)+@($lines))|ConvertFrom-Csv)
          if($parsed.Count -ne $count){throw 'PARSE'}
          $records=@();for($n=0;$n -lt $parsed.Count;$n++){$o=[ordered]@{source_row=$first+$n};foreach($p in $parsed[$n].PSObject.Properties.Name){$o[$p]=[string]$parsed[$n].$p};$records+=[pscustomobject]$o}
          $ts=@($records|%{$_.RAW_TICKER}|Sort-Object -Unique);if($ts.Count-ne1-or$ts[0]-ne$ticker){throw 'TICKER'}
          $dts=@($records|%{[string]$_.RAW_DATETIME_ISO});if(@($dts|?{-not $_.StartsWith('2024-12-03')}).Count-gt0){throw 'DATE'}
          $out=Join-Path $PWD 'machine1_date03_prefix_reaudit_admf_evidence';New-Item -ItemType Directory -Force $out|Out-Null
          $enc=New-Object System.Text.UTF8Encoding($false)
          $rp=Join-Path $out 'ADMF_20241203_ROWS.jsonl';[System.IO.File]::WriteAllLines($rp,[string[]]@($records|%{$_|ConvertTo-Json -Compress -Depth 8}),$enc)
          $proof=[ordered]@{ticker=$ticker;trading_date='2024-12-03';source_sha256=$got;recovered_date_local_index=10;source_row_first=$first;source_row_last=$last;data_rows=$records.Count;first_datetime=$dts[0];last_datetime=$dts[-1];rows_jsonl_sha256=(Get-FileHash $rp -Algorithm SHA256).Hash.ToLowerInvariant();transport_role='PREFIX_REAUDIT_SOURCE_EVIDENCE_ONLY_NOT_SEMANTIC_COMPLETION'}
          [System.IO.File]::WriteAllText((Join-Path $out 'ADMF_20241203_PROOF.json'),($proof|ConvertTo-Json -Depth 10),$enc)
          Write-Host "ADMF_EVIDENCE_OK rows=$($records.Count) first=$($dts[0]) last=$($dts[-1])"
      - name: Upload governed ADMF reaudit evidence
        uses: actions/upload-artifact@v4
        with:
          name: machine1-date03-prefix-reaudit-admf-evidence
          path: machine1_date03_prefix_reaudit_admf_evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Persist transport evidence
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force '.machine1_evidence'|Out-Null
          Copy-Item 'machine1_date03_prefix_reaudit_admf_evidence/*' '.machine1_evidence/' -Force
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.name 'a1-clean-machine1-bot'
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.email 'a1-clean-machine1-bot@users.noreply.github.com'
          git -c safe.directory="$env:GITHUB_WORKSPACE" add -f '.machine1_evidence/ADMF_20241203_ROWS.jsonl' '.machine1_evidence/ADMF_20241203_PROOF.json'
          git -c safe.directory="$env:GITHUB_WORKSPACE" commit -m 'Persist governed ADMF Date03 prefix reaudit evidence [skip ci]'
          git -c safe.directory="$env:GITHUB_WORKSPACE" push origin HEAD:machine1/evidence-kbatch-20241203
