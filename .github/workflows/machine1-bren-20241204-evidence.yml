name: Machine1 BREN 2024-12-04 Governed Evidence Extract

on:
  push:
    branches:
      - machine1/evidence-bren-20241204
    paths:
      - .github/workflows/machine1-bren-20241204-evidence.yml

permissions:
  contents: write

jobs:
  extract-bren:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\\TRADING SYSTEM\\02_CURRENT_HISTORICAL_RAW_DATA_UJI\\Raw Des 02-31-2024.csv'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract exact governed BREN packet
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = [System.IO.Path]::GetFullPath($env:RAW_FILE)
          $tickerExpected = 'BREN'
          $tradingDate = '2024-12-04'
          $sourceFirst = 287932
          $sourceLast = 288266
          $expectedCount = 335
          $expectedFirstTime = '09:00:00'
          $expectedLastTime = '16:14:00'
          $semanticBundle = 'Raw Des 02-31-2024__SEMANTIC_0010.jsonl'
          $semanticBundleLine = 115
          $expectedMd5 = 'b8d42b35c90d2dff8b18ae4e1734523b'
          $expectedSha256 = '5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'

          if (-not (Test-Path -LiteralPath $raw -PathType Leaf)) { throw "RAW_MISSING: $raw" }

          # Governance-preserving extraction optimization:
          # one physical RAW pass computes MD5 + SHA256 together;
          # a second .NET streaming pass captures only the exact governed line range.
          $md5 = [System.Security.Cryptography.MD5]::Create()
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $fs = [System.IO.File]::OpenRead($raw)
          try {
            $buffer = New-Object byte[] (4MB)
            while (($read = $fs.Read($buffer, 0, $buffer.Length)) -gt 0) {
              [void]$md5.TransformBlock($buffer, 0, $read, $buffer, 0)
              [void]$sha.TransformBlock($buffer, 0, $read, $buffer, 0)
            }
            [void]$md5.TransformFinalBlock([byte[]]::new(0), 0, 0)
            [void]$sha.TransformFinalBlock([byte[]]::new(0), 0, 0)
            $gotMd5 = ([System.BitConverter]::ToString($md5.Hash)).Replace('-', '').ToLowerInvariant()
            $gotSha256 = ([System.BitConverter]::ToString($sha.Hash)).Replace('-', '').ToLowerInvariant()
          }
          finally {
            $fs.Dispose()
            $md5.Dispose()
            $sha.Dispose()
          }
          if ($gotMd5 -ne $expectedMd5 -or $gotSha256 -ne $expectedSha256) {
            throw "RAW_HASH_MISMATCH md5=$gotMd5 sha256=$gotSha256"
          }

          $header = $null
          $dataLines = New-Object 'System.Collections.Generic.List[string]'
          $lineIndex = 0
          foreach ($line in [System.IO.File]::ReadLines($raw, [System.Text.Encoding]::UTF8)) {
            if ($lineIndex -eq 0) { $header = $line }
            if ($lineIndex -ge $sourceFirst -and $lineIndex -le $sourceLast) { [void]$dataLines.Add($line) }
            if ($lineIndex -ge $sourceLast) { break }
            $lineIndex++
          }
          if ($null -eq $header) { throw 'RAW_HEADER_MISSING' }
          if ($dataLines.Count -ne $expectedCount) { throw "ROW_COUNT_MISMATCH got=$($dataLines.Count) expected=$expectedCount" }

          $parsed = @((@($header) + @($dataLines)) | ConvertFrom-Csv)
          if ($parsed.Count -ne $expectedCount) { throw "CSV_PARSE_COUNT_MISMATCH got=$($parsed.Count) expected=$expectedCount" }

          $records = @()
          for ($i=0; $i -lt $parsed.Count; $i++) {
            $sourceRow = $sourceFirst + $i
            $ordered = [ordered]@{ source_row = $sourceRow }
            foreach ($p in $parsed[$i].PSObject.Properties.Name) { $ordered[$p] = [string]$parsed[$i].$p }
            $records += [pscustomobject]$ordered
          }

          $sourceSeq = @($records | ForEach-Object { [int]$_.source_row })
          for ($i=0; $i -lt $expectedCount; $i++) {
            if ($sourceSeq[$i] -ne ($sourceFirst + $i)) { throw 'SOURCE_ROW_SEQUENCE_MISMATCH' }
          }
          $tickers = @($records | ForEach-Object { $_.RAW_TICKER } | Sort-Object -Unique)
          if ($tickers.Count -ne 1 -or $tickers[0] -ne $tickerExpected) { throw "TICKER_MISMATCH got=$($tickers -join ',')" }
          $dts = @($records | ForEach-Object { [string]$_.RAW_DATETIME_ISO })
          if (@($dts | Where-Object { -not $_.StartsWith($tradingDate) }).Count -gt 0) { throw 'DATE_MISMATCH' }

          function Get-Clock([string]$dt) {
            if ($dt.Contains('T')) { return $dt.Split('T',2)[1].Substring(0,8) }
            $parts = $dt.Split(' ')
            return $parts[$parts.Length-1].Substring(0,8)
          }
          $ft = Get-Clock $dts[0]
          $lt = Get-Clock $dts[$dts.Count-1]
          if ($ft -ne $expectedFirstTime -or $lt -ne $expectedLastTime) { throw "TIME_RANGE_MISMATCH got=$ft-$lt" }

          $out = Join-Path $PWD 'machine1_bren_20241204_evidence'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $pp = Join-Path $out 'BREN_20241204_PACKET.json'
          $rp = Join-Path $out 'BREN_20241204_ROWS.jsonl'
          $proofPath = Join-Path $out 'EVIDENCE_PROOF.json'
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)

          $headerFields = @($parsed[0].PSObject.Properties.Name)
          $packet = [ordered]@{
            source_name = [System.IO.Path]::GetFileName($raw)
            source_md5 = $gotMd5
            source_sha256 = $gotSha256
            generation_id = 'BEHAVIOR_UNIFORM_COLAB_SEMANTIC_GEN_20260910_01'
            ticker = $tickerExpected
            trading_date = $tradingDate
            semantic_bundle = $semanticBundle
            semantic_bundle_line_number = $semanticBundleLine
            source_row_first = $sourceFirst
            source_row_last = $sourceLast
            physical_line_first = $sourceFirst + 1
            physical_line_last = $sourceLast + 1
            data_rows = $records.Count
            first_datetime = $dts[0]
            last_datetime = $dts[$dts.Count-1]
            header_fields = $headerFields
            rows = $records
          }
          [System.IO.File]::WriteAllText($pp, ($packet | ConvertTo-Json -Depth 20), $utf8NoBom)
          $jsonl = @($records | ForEach-Object { $_ | ConvertTo-Json -Compress -Depth 8 })
          [System.IO.File]::WriteAllLines($rp, [string[]]$jsonl, $utf8NoBom)

          $packetSha = (Get-FileHash -LiteralPath $pp -Algorithm SHA256).Hash.ToLowerInvariant()
          $rowsSha = (Get-FileHash -LiteralPath $rp -Algorithm SHA256).Hash.ToLowerInvariant()
          $proof = [ordered]@{
            ticker = $tickerExpected
            trading_date = $tradingDate
            source_md5 = $gotMd5
            source_sha256 = $gotSha256
            semantic_bundle = $semanticBundle
            semantic_bundle_line_number = $semanticBundleLine
            source_row_first = $sourceFirst
            source_row_last = $sourceLast
            data_rows = $records.Count
            first_datetime = $dts[0]
            last_datetime = $dts[$dts.Count-1]
            packet_sha256 = $packetSha
            rows_jsonl_sha256 = $rowsSha
          }
          [System.IO.File]::WriteAllText($proofPath, ($proof | ConvertTo-Json -Depth 10), $utf8NoBom)
          Write-Host "BREN_EVIDENCE_OK rows=$($records.Count) source_rows=$sourceFirst-$sourceLast first=$($dts[0]) last=$($dts[$dts.Count-1]) packet_sha256=$packetSha rows_sha256=$rowsSha"

      - name: Upload governed BREN evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: machine1-bren-20241204-evidence
          path: machine1_bren_20241204_evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Persist exact rows and evidence pointer
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $proof = Get-Content -Raw 'machine1_bren_20241204_evidence/EVIDENCE_PROOF.json' | ConvertFrom-Json
          New-Item -ItemType Directory -Force '.machine1_evidence' | Out-Null
          Copy-Item -LiteralPath 'machine1_bren_20241204_evidence/BREN_20241204_ROWS.jsonl' -Destination '.machine1_evidence/BREN_20241204_ROWS.jsonl' -Force
          Copy-Item -LiteralPath 'machine1_bren_20241204_evidence/EVIDENCE_PROOF.json' -Destination '.machine1_evidence/BREN_20241204_PROOF.json' -Force
          $pointer = [ordered]@{
            ticker = 'BREN'
            trading_date = '2024-12-04'
            branch = 'machine1/evidence-bren-20241204'
            workflow_commit = '${{ github.sha }}'
            github_run_id = [int64]'${{ github.run_id }}'
            github_artifact_id = [int64]'${{ steps.upload.outputs.artifact-id }}'
            github_artifact_url = '${{ steps.upload.outputs.artifact-url }}'
            github_artifact_digest = '${{ steps.upload.outputs.artifact-digest }}'
            packet_sha256 = $proof.packet_sha256
            rows_jsonl_sha256 = $proof.rows_jsonl_sha256
            source_sha256 = $proof.source_sha256
            source_row_first = $proof.source_row_first
            source_row_last = $proof.source_row_last
            data_rows = $proof.data_rows
            first_datetime = $proof.first_datetime
            last_datetime = $proof.last_datetime
          }
          $pointer | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 '.machine1_evidence/BREN_20241204_POINTER.json'
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.name 'a1-clean-machine1-bot'
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.email 'a1-clean-machine1-bot@users.noreply.github.com'
          git -c safe.directory="$env:GITHUB_WORKSPACE" add -f '.machine1_evidence/BREN_20241204_ROWS.jsonl'
          git -c safe.directory="$env:GITHUB_WORKSPACE" add '.machine1_evidence/BREN_20241204_PROOF.json' '.machine1_evidence/BREN_20241204_POINTER.json'
          git -c safe.directory="$env:GITHUB_WORKSPACE" commit -m 'Persist BREN governed evidence [skip ci]'
          git -c safe.directory="$env:GITHUB_WORKSPACE" push origin HEAD:machine1/evidence-bren-20241204
