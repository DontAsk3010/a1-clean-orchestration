name: Machine1 AUTO 2024-12-04 Governed Evidence Extract
on:
  push:
    branches: [machine1/evidence-auto-20241204]
    paths: [.github/workflows/machine1-auto-20241204-evidence.yml]
permissions:
  contents: read
jobs:
  extract-auto:
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI\Raw Des 02-31-2024.csv'
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact governed AUTO packet
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $raw=$env:RAW_FILE; $first=122399; $last=122670; $count=272
          $md5='b8d42b35c90d2dff8b18ae4e1734523b'; $sha='5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          if((Get-FileHash $raw -Algorithm MD5).Hash.ToLower() -ne $md5){throw 'MD5_MISMATCH'}
          if((Get-FileHash $raw -Algorithm SHA256).Hash.ToLower() -ne $sha){throw 'SHA256_MISMATCH'}
          Add-Type -AssemblyName Microsoft.VisualBasic
          $p=New-Object Microsoft.VisualBasic.FileIO.TextFieldParser($raw,[Text.Encoding]::UTF8,$true); $p.TextFieldType='Delimited'; $p.SetDelimiters(','); $p.HasFieldsEnclosedInQuotes=$true
          $h=@($p.ReadFields()); $h[0]=$h[0].TrimStart([char]0xFEFF); if($h.Count-ne 74){throw 'HEADER_COUNT'}
          $rows=New-Object System.Collections.Generic.List[object]; $n=0
          try{while(-not $p.EndOfData){$f=@($p.ReadFields());$n++;if($n-lt $first){continue};if($n-gt $last){break};if($f.Count-ne 74){throw 'ROW_FIELD_COUNT'};$o=[ordered]@{source_row=$n};for($i=0;$i-lt 74;$i++){$o[$h[$i]]=$f[$i]};$rows.Add([pscustomobject]$o)}}finally{$p.Close()}
          if($rows.Count-ne $count){throw 'ROW_COUNT'}
          if(@($rows|%{$_.RAW_TICKER}|sort -Unique) -ne 'AUTO'){throw 'TICKER'}
          $d=@($rows|%{$_.RAW_DATETIME_ISO}); if(@($d|?{-not $_.StartsWith('2024-12-04')}).Count){throw 'DATE'}
          if(-not $d[0].Contains('09:01:00') -or -not $d[-1].Contains('16:14:00')){throw 'TIME'}
          foreach($r in $rows){if(@($r.PSObject.Properties).Count-ne 75){throw 'RETAINED_FIELD_COUNT'}}
          $out='machine1_auto_20241204_evidence'; New-Item -Force -ItemType Directory $out|Out-Null; $u=New-Object Text.UTF8Encoding($false)
          $rp=Join-Path $out 'AUTO_20241204_ROWS.jsonl'; $w=New-Object IO.StreamWriter($rp,$false,$u);try{foreach($r in $rows){$w.WriteLine(($r|ConvertTo-Json -Compress -Depth 10))}}finally{$w.Close()}
          $rsha=(Get-FileHash $rp -Algorithm SHA256).Hash.ToLower(); $pkt=[ordered]@{source_name='Raw Des 02-31-2024.csv';source_md5=$md5;source_sha256=$sha;generation_id='BEHAVIOR_UNIFORM_COLAB_SEMANTIC_GEN_20260910_01';ticker='AUTO';trading_date='2024-12-04';semantic_bundle='Raw Des 02-31-2024__SEMANTIC_0010.jsonl';semantic_bundle_line_number=31;source_row_first=$first;source_row_last=$last;physical_line_first=122400;physical_line_last=122671;data_rows=$rows.Count;raw_fields_per_row=74;retained_fields_per_row=75;first_datetime=$d[0];last_datetime=$d[-1];header_fields=$h;rows_sha256=$rsha;rows=$rows}
          $pp=Join-Path $out 'AUTO_20241204_PACKET.json'; [IO.File]::WriteAllText($pp,($pkt|ConvertTo-Json -Depth 12),$u); $psha=(Get-FileHash $pp -Algorithm SHA256).Hash.ToLower()
          $proof=[ordered]@{ticker='AUTO';trading_date='2024-12-04';source_md5=$md5;source_sha256=$sha;semantic_bundle_line_number=31;source_row_first=$first;source_row_last=$last;data_rows=$rows.Count;raw_fields_per_row=74;retained_fields_per_row=75;first_datetime=$d[0];last_datetime=$d[-1];rows_sha256=$rsha;packet_sha256=$psha}
          [IO.File]::WriteAllText((Join-Path $out 'EVIDENCE_PROOF.json'),($proof|ConvertTo-Json),$u)
      - uses: actions/upload-artifact@v4
        with:
          name: machine1-auto-20241204-evidence
          path: machine1_auto_20241204_evidence/
          if-no-files-found: error
          retention-days: 7
