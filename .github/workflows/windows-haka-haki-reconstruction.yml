name: Windows Source Bound HAKA HAKI Reconstruction

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - haka-haki-reconstruction-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-windows-haka-haki-reconstruction
  cancel-in-progress: true

jobs:
  reconstruct:
    name: Reconstruct validated December HAKA HAKI evidence
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 720
    steps:
      - name: Checkout exact research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'haka-haki-reconstruction-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_HAKA_HAKI_RECONSTRUCTION_REQUEST_V1') { throw 'Unsupported HAKA HAKI reconstruction request schema.' }
          if ($req.enabled -ne $true) { throw 'HAKA HAKI reconstruction request not enabled.' }
          if ($req.source_name -ne 'Raw Des 02-31-2024.csv') { throw 'Unexpected source.' }
          if ($req.reserved_oos_must_remain_untouched -ne $true) { throw 'OOS guardrail missing.' }

      - name: Install compile and test reconstruction
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'INSTALL_FAILED' }
          py -3.11 -m py_compile src/a1clean/formula_research/haka_haki_reconstruction.py
          if ($LASTEXITCODE -ne 0) { throw 'COMPILE_FAILED' }
          py -3.11 -m pytest -q tests/test_haka_haki_reconstruction.py
          if ($LASTEXITCODE -ne 0) { throw 'TEST_FAILED' }

      - name: Reconstruct source bound HAKA HAKI
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m a1clean.formula_research.haka_haki_reconstruction --output 'haka-haki-reconstruction-result.json'
          if ($LASTEXITCODE -ne 0) { throw 'RECONSTRUCTION_FAILED' }

      - name: Assert reconstruction guardrails
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $obj = Get-Content -LiteralPath 'haka-haki-reconstruction-result.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($obj.source_contract.source_name -ne 'Raw Des 02-31-2024.csv') { throw 'SOURCE_CONTRACT_FAILED' }
          if ($obj.important_semantics.reserved_oos_touched -ne $false) { throw 'OOS_TOUCHED' }
          if ($obj.important_semantics.physical_zero_not_assumed_neutral -ne $true) { throw 'ZERO_GUARD_FAILED' }
          if ($obj.aggregate_identity.haka_plus_haki_equals_trade_value -ne $true) { throw 'SUM_IDENTITY_FAILED' }
          if ($obj.aggregate_identity.haka_minus_haki_equals_nbss -ne $true) { throw 'DIFF_IDENTITY_FAILED' }

      - name: Upload reconstruction artifact
        uses: actions/upload-artifact@v4
        with:
          name: haka-haki-reconstruction-${{ github.run_id }}
          path: haka-haki-reconstruction-result.json
          if-no-files-found: error
          retention-days: 30
