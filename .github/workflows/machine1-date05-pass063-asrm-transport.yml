name: Machine1 Date05 PASS063 ASRM Exact Transport

on:
  push:
    paths:
      - '.github/workflows/machine1-date05-pass063-asrm-transport.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact governed Date05 PASS063 ASRM rows
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI\Raw Des 02-31-2024.csv'
          $expectedSize = 453806812
          $expectedSha = '5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          if (!(Test-Path $raw)) { throw "Canonical raw missing: $raw" }
          $fi = Get-Item $raw
          if ($fi.Length -ne $expectedSize) { throw "Raw size mismatch: $($fi.Length)" }
          $sha = (Get-FileHash -Algorithm SHA256 $raw).Hash.ToLower()
          if ($sha -ne $expectedSha) { throw "Raw SHA mismatch: $sha" }
          $start = 113845
          $expectedCount = 15
          $ticker = 'ASRM'
          $date = '2024-12-05'
          $outdir = Join-Path $env:RUNNER_TEMP 'pass063_asrm_transport'
          New-Item -ItemType Directory -Force -Path $outdir | Out-Null
          $csvOut = Join-Path $outdir 'ASRM_20241205_RAW_EXACT.csv'
          $jsonlOut = Join-Path $outdir 'ASRM_20241205_ROWS.jsonl'
          $proofOut = Join-Path $outdir 'PASS063_ASRM_TRANSPORT_PROOF.json'
          $header = Get-Content -Path $raw -TotalCount 1
          if (($header -split ',').Count -ne 74) { throw 'Canonical header field count mismatch' }
          $lines = Get-Content -Path $raw | Select-Object -Skip $start -First $expectedCount
          if ($lines.Count -ne $expectedCount) { throw "Extracted count mismatch: $($lines.Count)" }
          Set-Content -Path $csvOut -Value @($header) -Encoding UTF8
          Add-Content -Path $csvOut -Value $lines -Encoding UTF8
          $rows = Import-Csv -Path $csvOut
          if ($rows.Count -ne $expectedCount) { throw "Parsed row count mismatch: $($rows.Count)" }
          foreach ($r in $rows) {
            if ($r.Ticker -ne $ticker) { throw "Ticker mismatch: $($r.Ticker)" }
            if ($r.Date -ne $date) { throw "Date mismatch: $($r.Date)" }
            if (($r.PSObject.Properties.Name).Count -ne 74) { throw 'Field count mismatch' }
          }
          $firstDT = "$($rows[0].Date) $($rows[0].Time)"
          $lastDT = "$($rows[-1].Date) $($rows[-1].Time)"
          if ($firstDT -ne '2024-12-05 09:00:00') { throw "First timestamp mismatch: $firstDT" }
          if ($lastDT -ne '2024-12-05 15:30:00') { throw "Last timestamp mismatch: $lastDT" }
          if (Test-Path $jsonlOut) { Remove-Item $jsonlOut -Force }
          foreach ($r in $rows) { ($r | ConvertTo-Json -Compress -Depth 5) | Add-Content -Path $jsonlOut -Encoding UTF8 }
          $csvSha = (Get-FileHash -Algorithm SHA256 $csvOut).Hash.ToLower()
          $jsonSha = (Get-FileHash -Algorithm SHA256 $jsonlOut).Hash.ToLower()
          [ordered]@{
            pass_object='PASS063_DATE05'; ticker=$ticker; date=$date; manifest_line=140;
            source_rows='113845-113859'; physical_lines='113846-113860'; actual_rows=$rows.Count;
            fields_per_row=74; first_supported=$firstDT; last_supported=$lastDT;
            canonical_source=$raw; canonical_size=$fi.Length; canonical_sha256=$sha;
            raw_exact_csv_sha256=$csvSha; rows_jsonl_sha256=$jsonSha;
            transport_integrity='PASS'; semantic_read_performed=$false
          } | ConvertTo-Json -Depth 5 | Set-Content -Path $proofOut -Encoding UTF8
      - name: Upload governed ASRM exact transport artifact
        uses: actions/upload-artifact@v4
        with:
          name: machine1-date05-pass063-asrm-exact-transport
          path: ${{ runner.temp }}\pass063_asrm_transport\*
          retention-days: 7
