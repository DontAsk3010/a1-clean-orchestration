name: Windows V3.2 Session Phase Probe

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - 'v32-session-phase-probe-requests/current.json'

permissions:
  contents: read

concurrency:
  group: a1-windows-v32-session-phase-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe full semantic packet session fields
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 120
    env:
      A1_RAW_DIR: 'D:\\TRADING SYSTEM\\02_CURRENT_HISTORICAL_RAW_DATA_UJI'
    steps:
      - name: Checkout exact probe revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Install compile
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'v32-session-phase-probe-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_V32_SESSION_PHASE_PROBE_REQUEST_V1') { throw 'V32_PHASE_PROBE_REQUEST_SCHEMA_MISMATCH' }
          if ($req.enabled -ne $true) { throw 'V32_PHASE_PROBE_DISABLED' }
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'V32_PHASE_PROBE_INSTALL_FAILED' }
          py -3.11 -m py_compile src/a1clean/formula_research/v32_session_phase_probe.py
          if ($LASTEXITCODE -ne 0) { throw 'V32_PHASE_PROBE_COMPILE_FAILED' }

      - name: Verify Drive credential
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:A1_DRIVE_READER_CREDENTIALS)) { throw 'A1_DRIVE_READER_CREDENTIALS_NOT_CONFIGURED' }
          if (-not (Test-Path -LiteralPath $env:A1_DRIVE_READER_CREDENTIALS -PathType Leaf)) { throw 'A1_DRIVE_READER_CREDENTIALS_FILE_MISSING' }

      - name: Probe AALI full packet
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'v32-session-phase-probe' | Out-Null
          py -3.11 -m a1clean.formula_research.v32_session_phase_probe --output 'v32-session-phase-probe\aali-dec2.json'
          if ($LASTEXITCODE -ne 0) { throw 'V32_PHASE_PROBE_FAILED' }
          $m = Get-Content -LiteralPath 'v32-session-phase-probe\aali-dec2.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($m.status -ne 'PASS') { throw 'V32_PHASE_PROBE_NOT_PASS' }
          if ([int64]$m.packet_row_count -ne 104) { throw 'V32_PHASE_PROBE_PACKET_COUNT_MISMATCH' }
          if ([int64]$m.regular_session_bar_count -ne 102) { throw 'V32_PHASE_PROBE_REGULAR_COUNT_MISMATCH' }
          if ([int64]$m.nonregular_observation_count -ne 2) { throw 'V32_PHASE_PROBE_NONREGULAR_COUNT_MISMATCH' }

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: v32-session-phase-probe-${{ github.run_id }}
          path: v32-session-phase-probe
          if-no-files-found: error
          retention-days: 30
