name: Windows Source-Scoped Parity

on:
  workflow_dispatch:
    inputs:
      source_name:
        description: 'Exact canonical RAW filename for the one-source technical parity gate. This does not define or limit the dynamic source universe.'
        required: true
        default: 'Raw Maret 03-31-2025.csv'
        type: string

permissions:
  contents: read

concurrency:
  group: a1-windows-source-scoped-parity
  cancel-in-progress: false

jobs:
  source-parity:
    name: Frozen V2 one-source parity against governed Drive baseline
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 120
    env:
      A1_RAW_DIR: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI'
    steps:
      - name: Checkout migration code
        uses: actions/checkout@v4

      - name: Verify separate external Drive credential bindings exist
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $bindings = @(
            @{ Name = 'A1_DRIVE_READER_CREDENTIALS'; Path = $env:A1_DRIVE_READER_CREDENTIALS },
            @{ Name = 'A1_DRIVE_WRITER_CREDENTIALS'; Path = $env:A1_DRIVE_WRITER_CREDENTIALS }
          )
          foreach ($binding in $bindings) {
            if ([string]::IsNullOrWhiteSpace($binding.Path)) {
              throw "$($binding.Name) is not configured for the runner process."
            }
            if (-not (Test-Path -LiteralPath $binding.Path -PathType Leaf)) {
              throw "$($binding.Name) points to a credential file that does not exist. Credential content/path is intentionally not printed."
            }
          }
          Write-Host 'Drive reader credential binding: PRESENT'
          Write-Host 'Drive writer credential binding: PRESENT'

      - name: Install migration package
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e .

      - name: Re-verify governed Drive access separation
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m a1clean.cli drive-preflight

      - name: Reconcile complete dynamic canonical source universe
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m a1clean.cli source-preflight

      - name: Run one-source frozen V2 parity technical gate
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m a1clean.cli source-parity --source-name "${{ inputs.source_name }}"

      - name: Safety declaration
        if: always()
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Write-Host 'SOURCE-SCOPED TECHNICAL PARITY GATE ONLY.'
          Write-Host 'The canonical Drive source universe remains dynamic; this selected source is not a universe limit or sampling evidence.'
          Write-Host 'Canonical RAW and governed CURRENT are never written by this workflow.'
          Write-Host 'Only reconciliation evidence/manifests are persisted under PARITY_STAGING for this technical gate.'
          Write-Host 'Local candidate/scratch is ephemeral and is removed by the source-parity executor.'
          Write-Host 'A source-scoped PASS does not authorize full-corpus PASS, PR merge, canonical delta automation, formula work, or Telegram analytical logic.'
