name: CI
on:
  push:
    branches: [main, "migration/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip
      - run: pip install -e .[test]
      - run: python -m compileall -q src tests
      - run: pytest -q
