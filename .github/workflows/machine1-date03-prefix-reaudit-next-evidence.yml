name: Machine1 Date03 Sequential Prefix Reaudit Evidence
on:
  push:
    branches: [machine1/evidence-kbatch-20241203]
    paths: [.github/workflows/machine1-date03-prefix-reaudit-next-evidence.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\\TRADING SYSTEM\\02_CURRENT_HISTORICAL_RAW_DATA_UJI\\Raw Des 02-31-2024.csv'
      TARGET_TICKER: 'BBCA'
      TARGET_INDEX: '90'
      ROW_FIRST: '157676'
      ROW_LAST: '158011'
      ROW_COUNT: '336'
      CHUNK_SIZE: '40'
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact governed ticker-day rows
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'
          $raw=[System.IO.Path]::GetFullPath($env:RAW_FILE)
          $expected='5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          $ticker=$env:TARGET_TICKER; $first=[int]$env:ROW_FIRST; $last=[int]$env:ROW_LAST; $count=[int]$env:ROW_COUNT; $idx=[int]$env:TARGET_INDEX
          if(-not(Test-Path -LiteralPath $raw -PathType Leaf)){throw 'RAW_MISSING'}
          $got=(Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant(); if($got-ne$expected){throw "RAW_HASH_MISMATCH $got"}
          $header=$null; $lines=New-Object 'System.Collections.Generic.List[string]'; $i=0
          foreach($line in [System.IO.File]::ReadLines($raw,[System.Text.Encoding]::UTF8)){
            if($i-eq0){$header=$line}
            if($i-ge$first -and $i-le$last){[void]$lines.Add($line)}
            if($i-ge$last){break}; $i++
          }
          if($lines.Count-ne$count){throw "COUNT got=$($lines.Count) expected=$count"}
          $parsed=@((@($header)+@($lines))|ConvertFrom-Csv); if($parsed.Count-ne$count){throw 'PARSE_COUNT'}
          $records=@(); for($n=0;$n-lt$parsed.Count;$n++){ $o=[ordered]@{source_row=$first+$n}; foreach($p in $parsed[$n].PSObject.Properties.Name){$o[$p]=[string]$parsed[$n].$p}; $records+=[pscustomobject]$o }
          $ts=@($records|ForEach-Object{$_.RAW_TICKER}|Sort-Object -Unique); if($ts.Count-ne1 -or $ts[0]-ne$ticker){throw 'TICKER_MISMATCH'}
          $dts=@($records|ForEach-Object{[string]$_.RAW_DATETIME_ISO}); if(@($dts|Where-Object{-not $_.StartsWith('2024-12-03')}).Count-gt0){throw 'DATE_MISMATCH'}
          $out=Join-Path $PWD 'machine1_date03_prefix_reaudit_next'; New-Item -ItemType Directory -Force $out|Out-Null
          $enc=New-Object System.Text.UTF8Encoding($false)
          $chunkSize=[int]$env:CHUNK_SIZE
          $chunkProofs=@()
          $mergedLines=New-Object 'System.Collections.Generic.List[string]'
          $chunkIndex=0
          for($start=0;$start-lt$records.Count;$start+=$chunkSize){
            $chunkIndex++
            $take=[Math]::Min($chunkSize,$records.Count-$start)
            $chunkRecords=@($records|Select-Object -Skip $start -First $take)
            $chunkLines=@($chunkRecords|ForEach-Object{$_|ConvertTo-Json -Compress -Depth 12})
            foreach($j in $chunkLines){[void]$mergedLines.Add($j)}
            $chunkPath=Join-Path $out ("{0}_20241203_CHUNK_{1:D3}_ROWS.jsonl" -f $ticker,$chunkIndex)
            [System.IO.File]::WriteAllLines($chunkPath,[string[]]$chunkLines,$enc)
            $chunkProof=[ordered]@{
              ticker=$ticker; trading_date='2024-12-03'; chunk_index=$chunkIndex; expected_rows=$take; actual_rows=$chunkRecords.Count;
              source_row_first=[int]$chunkRecords[0].source_row; source_row_last=[int]$chunkRecords[-1].source_row;
              first_datetime=[string]$chunkRecords[0].RAW_DATETIME_ISO; last_datetime=[string]$chunkRecords[-1].RAW_DATETIME_ISO;
              chunk_sha256=(Get-FileHash -LiteralPath $chunkPath -Algorithm SHA256).Hash.ToLowerInvariant();
              semantic_status='TRANSPORT_ONLY_NOT_SEMANTIC_COMPLETE'
            }
            $chunkProofPath=Join-Path $out ("{0}_20241203_CHUNK_{1:D3}_PROOF.json" -f $ticker,$chunkIndex)
            [System.IO.File]::WriteAllText($chunkProofPath,($chunkProof|ConvertTo-Json -Depth 10),$enc)
            $chunkProofs+=([pscustomobject]$chunkProof)
          }
          if($mergedLines.Count-ne$count){throw "MERGE_COUNT_FAIL got=$($mergedLines.Count) expected=$count"}
          $rp=Join-Path $out ($ticker+'_20241203_ROWS.jsonl')
          [System.IO.File]::WriteAllLines($rp,[string[]]$mergedLines,$enc)
          $merged=@([System.IO.File]::ReadLines($rp,[System.Text.Encoding]::UTF8)|ForEach-Object{$_|ConvertFrom-Json})
          if($merged.Count-ne$count){throw "MERGED_READBACK_COUNT_FAIL got=$($merged.Count) expected=$count"}
          $mr=@($merged|ForEach-Object{[int]$_.source_row})
          if(@($mr|Sort-Object -Unique).Count-ne$count){throw 'MERGED_DUPLICATE_OR_MISSING_ROWS'}
          if($mr[0]-ne$first -or $mr[-1]-ne$last){throw 'MERGED_BOUNDARY_FAIL'}
          for($n=1;$n-lt$mr.Count;$n++){if($mr[$n]-ne($mr[$n-1]+1)){throw "MERGED_CONTINUITY_FAIL prev=$($mr[$n-1]) curr=$($mr[$n])"}}
          $sumChunkRows=($chunkProofs|Measure-Object -Property actual_rows -Sum).Sum
          if($sumChunkRows-ne$count){throw "CHUNK_SUM_FAIL got=$sumChunkRows expected=$count"}
          $proof=[ordered]@{
            audit_type='OWNER_CORRECTED_FULL_PREFIX_REAUDIT'; transport_mode='DETERMINISTIC_CONTIGUOUS_CHUNKED_LOSSLESS';
            ticker=$ticker; trading_date='2024-12-03'; recovered_date_local_index=$idx; source_name='Raw Des 02-31-2024.csv'; source_sha256=$got;
            source_row_first=$first; source_row_last=$last; data_rows=$records.Count; first_datetime=$dts[0]; last_datetime=$dts[-1];
            chunk_size=$chunkSize; total_chunks=$chunkProofs.Count; sum_chunk_rows=$sumChunkRows; chunk_proofs=$chunkProofs;
            merged_unique_rows=@($mr|Sort-Object -Unique).Count; duplicate_rows=0; missing_rows=0; reordered_rows=0;
            rows_jsonl_sha256=(Get-FileHash $rp -Algorithm SHA256).Hash.ToLowerInvariant(); lossless_merge_validation='PASS';
            semantic_status='TRANSPORT_ONLY_NOT_SEMANTIC_COMPLETE'; formula_stage='CLOSED'; date_advance='PROHIBITED'
          }
          [System.IO.File]::WriteAllText((Join-Path $out ($ticker+'_20241203_PROOF.json')),($proof|ConvertTo-Json -Depth 20),$enc)
          Write-Host "PREFIX_REAUDIT_EVIDENCE_OK ticker=$ticker idx=$idx rows=$($records.Count) chunks=$($chunkProofs.Count) merge=PASS first=$($dts[0]) last=$($dts[-1])"
      - name: Upload governed prefix reaudit evidence
        uses: actions/upload-artifact@v4
        with:
          name: machine1-date03-prefix-reaudit-next-evidence
          path: machine1_date03_prefix_reaudit_next/
          if-no-files-found: error
          retention-days: 7
      - name: Persist transport evidence
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'; $ticker=$env:TARGET_TICKER
          New-Item -ItemType Directory -Force '.machine1_prefix_reaudit/date03'|Out-Null
          Copy-Item 'machine1_date03_prefix_reaudit_next/*' '.machine1_prefix_reaudit/date03/' -Force
          git -c safe.directory="$env:GITHUB_WORKSPACE" config user.name 'a1-clean-machine1-bot'; git -c safe.directory="$env:GITHUB_WORKSPACE" config user.email 'a1-clean-machine1-bot@users.noreply.github.com'
          git -c safe.directory="$env:GITHUB_WORKSPACE" add -f ".machine1_prefix_reaudit/date03/${ticker}_20241203_*"
          git -c safe.directory="$env:GITHUB_WORKSPACE" commit -m "Persist governed $ticker Date03 prefix reaudit evidence [skip ci]"; git -c safe.directory="$env:GITHUB_WORKSPACE" push origin HEAD:machine1/evidence-kbatch-20241203
