name: Windows Machine2 Runner Admin Capability Probe

on:
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/windows-machine2-runner-admin-capability-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe exact runner label read capability without mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUNNER_ID: '32'
        run: |
          set -euo pipefail
          url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runners/${TARGET_RUNNER_ID}/labels"
          code="$(curl -sS -o runner-labels.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${url}")"
          echo "M2_RUNNER_LABEL_ADMIN_READ_HTTP=${code}"
          if [ "${code}" = '200' ]; then
            python - <<'PY'
          import json
          d=json.load(open('runner-labels.json',encoding='utf-8'))
          names=sorted(str(x.get('name')) for x in d.get('labels',[]) if x.get('name'))
          print('M2_RUNNER_LABELS=' + ','.join(names))
          print('M2_RUNNER_LABEL_ADMIN_READ_PASS=true')
          PY
          else
            echo 'M2_RUNNER_LABEL_ADMIN_READ_PASS=false'
            echo 'M2_RUNNER_LABEL_ADMIN_MUTATION_NOT_ATTEMPTED=true'
          fi
