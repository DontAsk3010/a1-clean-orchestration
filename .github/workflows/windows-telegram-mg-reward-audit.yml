name: Windows Telegram MG Reward Audit

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - telegram-mg-reward-audit-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-windows-telegram-mg-reward-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Telegram MG reward audit
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 720
    steps:
      - name: Checkout exact formula research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate reward audit request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'telegram-mg-reward-audit-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_TELEGRAM_MG_REWARD_AUDIT_REQUEST_V1') { throw 'Unsupported reward audit request schema.' }
          if ($req.enabled -ne $true) { throw 'Reward audit request not enabled.' }
          if ($req.authorization_phrase -ne 'AUTHORIZE_TELEGRAM_MG_REWARD_AUDIT') { throw 'Exact reward audit authorization phrase required.' }
          if ([string]::IsNullOrWhiteSpace($req.source_name)) { throw 'source_name required.' }
          if ([string]::IsNullOrWhiteSpace($req.trading_date)) { throw 'trading_date required.' }
          if ([string]::IsNullOrWhiteSpace($req.variant)) { throw 'variant required.' }
          if ($req.drive_output_folder_id -ne '1uQKSZD8KbOZ2j3moyZiH1EuJPlEhEAuC') { throw 'Unexpected Formula Research audit/output folder.' }
          $json = $req | ConvertTo-Json -Compress -Depth 20
          "A1_MG_REWARD_AUDIT_REQUEST_JSON=$json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Drive credential bindings
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:A1_DRIVE_READER_CREDENTIALS, $env:A1_DRIVE_WRITER_CREDENTIALS)) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Drive credential binding missing.' }
          }

      - name: Install and test exact MG reward code
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'MG_REWARD_INSTALL_FAILED' }
          py -3.11 -m compileall -q src tests
          if ($LASTEXITCODE -ne 0) { throw 'MG_REWARD_COMPILE_FAILED' }
          py -3.11 -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'MG_REWARD_TESTS_FAILED' }

      - name: Evaluate all Telegram appearances and first appearances
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = $env:A1_MG_REWARD_AUDIT_REQUEST_JSON | ConvertFrom-Json
          py -3.11 -m a1clean.formula_research.telegram_mg_reward_audit `
            --source-name $req.source_name `
            --trading-date $req.trading_date `
            --variant $req.variant `
            --request-id $req.request_id `
            --software-revision '${{ github.sha }}' `
            --drive-output-folder-id $req.drive_output_folder_id `
            --output 'telegram-mg-reward-audit.json' `
            --effort-lookback ([int]$req.params.effort_lookback) `
            --progress-lookback ([int]$req.params.progress_lookback) `
            --high-lookback ([int]$req.params.high_lookback) `
            --recovery-lookback ([int]$req.params.recovery_lookback) `
            --low-stabilization-bars ([int]$req.params.low_stabilization_bars) `
            --early-checkpoint-bar ([int]$req.params.early_checkpoint_bar) `
            --late-lift-min-bar ([int]$req.params.late_lift_min_bar)
          if ($LASTEXITCODE -ne 0) { throw "MG_REWARD_AUDIT_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Upload reward audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mg-reward-audit-${{ github.run_id }}
          path: telegram-mg-reward-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Research safety declaration
        if: always()
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          "### Telegram MG reward audit" >> $env:GITHUB_STEP_SUMMARY
          "- Future bars are evaluation-only and never modify the candidate state." >> $env:GITHUB_STEP_SUMMARY
          "- Outcome starts from the next regular bar after each Telegram snapshot; same-bar high is not counted." >> $env:GITHUB_STEP_SUMMARY
          "- Both all 5-minute appearances and first appearance per ticker are reported to prevent repeat-count inflation." >> $env:GITHUB_STEP_SUMMARY
