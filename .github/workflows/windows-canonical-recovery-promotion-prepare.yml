        run: |
          $ErrorActionPreference = 'Stop'
          & '.\scripts\windows\Ensure-A1PortablePython311.ps1'
          $py = 'C:\Users\feri-admin\.a1clean\runtime\python-3.11.9-embed-amd64\python.exe'
          $pip = 'C:\Users\feri-admin\.a1clean\runtime\python-3.11.9-embed-amd64\pip.pyz'
          $site = 'C:\Users\feri-admin\.a1clean\runtime\python-3.11.9-embed-amd64\Lib\site-packages'
          if (-not (Test-Path -LiteralPath $py -PathType Leaf)) { throw 'RECOVERY_PROMOTION_PREPARE_PYTHON_MISSING' }
          if (-not (Test-Path -LiteralPath $pip -PathType Leaf)) { throw 'RECOVERY_PROMOTION_PREPARE_PIP_MISSING' }
          & $py $pip install --disable-pip-version-check --upgrade --no-deps --target $site .
          if ($LASTEXITCODE -ne 0) { throw 'RECOVERY_PROMOTION_PREPARE_PROJECT_INSTALL_FAIL' }
          "A1_PREPARE_PY=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'RECOVERY_PROMOTION_PREPARE_RUNTIME_PASS'

      - name: Compile and validate request locks
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PREPARE_PY -m py_compile 'src\a1clean\canonical_recovery_promotion_prepare.py'
          if ($LASTEXITCODE -ne 0) { throw 'RECOVERY_PROMOTION_PREPARE_COMPILE_FAIL' }
          $r = Get-Content -LiteralPath 'canonical-current-recovery-requests\promotion-prepare-current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($r.mode -ne 'PREPARE_ONLY_NO_CANONICAL_WRITE') { throw 'RECOVERY_PROMOTION_PREPARE_MODE_FAIL' }
          if ($r.canonical_promotion_allowed -ne $false -or $r.canonical_current_recovery_commit_authorized -ne $false -or $r.raw_write_allowed -ne $false -or $r.heavy_behavior_research_allowed -ne $false) { throw 'RECOVERY_PROMOTION_PREPARE_REQUEST_MUTATION_FLAG_FAIL' }
