          if ($LASTEXITCODE -ne 0) { throw 'RECOVERY_PROMOTION_PREPARE_EXEC_FAIL' }
          $p = Get-Content -LiteralPath $out -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($p.pass -ne $true -or $p.status -ne 'PASS_PREPARED_PROOF_ONLY_CANONICAL_WRITE_STILL_UNAUTHORIZED') { throw 'RECOVERY_PROMOTION_PREPARE_RESULT_NOT_PASS' }
