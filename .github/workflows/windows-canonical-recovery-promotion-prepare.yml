          'target_pass=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'RECOVERY_PROMOTION_PREPARE_TARGET_PASS=true'

  assert_target_pass:
    name: Require one exact Machine2 promotion PREPARE PASS
    if: ${{ always() }}
    needs: [lane_a, lane_b]
    runs-on: ubuntu-latest
    steps:
      - name: Assert at least one exact target lane passed
        shell: bash
        run: |
          echo "lane_a_runner=${{ needs.lane_a.outputs.runner_seen }}"
          echo "lane_b_runner=${{ needs.lane_b.outputs.runner_seen }}"
          if [[ "${{ needs.lane_a.outputs.target_pass }}" == "true" || "${{ needs.lane_b.outputs.target_pass }}" == "true" ]]; then
            echo 'RECOVERY_PROMOTION_PREPARE_EXACT_TARGET_PASS=true'
            exit 0
          fi
          echo 'RECOVERY_PROMOTION_PREPARE_EXACT_TARGET_PASS=false'
          exit 1
