name: Windows V3.2 Machine 2 Behavior Grouping Atlas V2

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - 'v32-behavior-grouping-requests/current.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1-windows-v32-machine2-behavior-grouping-atlas
  cancel-in-progress: true

jobs:
  grouping:
    name: Authority-bound temporal/blindspot behavior grouping
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 4320
    env:
      PSExecutionPolicyPreference: Bypass

    steps:
      - name: Checkout exact trigger revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 64

      - name: Provision portable Python 3.11
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $pyRoot = Join-Path $env:RUNNER_TEMP 'a1-python-3.11.9'
          $zip = Join-Path $env:RUNNER_TEMP 'python-3.11.9-embed-amd64.zip'
          $getPip = Join-Path $env:RUNNER_TEMP 'get-pip.py'
          if (-not (Test-Path -LiteralPath (Join-Path $pyRoot 'python.exe') -PathType Leaf)) {
            Remove-Item -LiteralPath $pyRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $pyRoot | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $pyRoot -Force
            $pth = Join-Path $pyRoot 'python311._pth'
            (Get-Content -LiteralPath $pth -Raw).Replace('#import site','import site') | Set-Content -LiteralPath $pth -Encoding ascii
            Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
            & (Join-Path $pyRoot 'python.exe') $getPip --no-warn-script-location
            if ($LASTEXITCODE -ne 0) { throw 'M2_GROUP_V2_PORTABLE_PIP_BOOTSTRAP_FAILED' }
          }
          $py = Join-Path $pyRoot 'python.exe'
          & $py --version
          if ($LASTEXITCODE -ne 0) { throw 'M2_GROUP_V2_PORTABLE_PYTHON_UNAVAILABLE' }
          "A1_PYTHON_EXE=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $pyRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: PRESTART completeness and latest-authority sync gate
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'v32-behavior-grouping-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $lock = Get-Content -LiteralPath 'governance/a1-clean-active-authority-lock.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($lock.schema -ne 'A1_CLEAN_ACTIVE_AUTHORITY_LOCK_V1' -or $lock.status -ne 'ACTIVE') { throw 'PRESTART_ACTIVE_AUTHORITY_LOCK_FAIL' }
          if ($lock.prestart_completeness_gate_required -ne $true) { throw 'PRESTART_GATE_NOT_ACTIVE' }
          if ($req.schema -ne 'A1_V32_BEHAVIOR_GROUPING_REQUEST_V2' -or $req.enabled -ne $true -or $req.machine -ne 'MACHINE_2') { throw 'M2_GROUP_V2_REQUEST_IDENTITY_FAIL' }
          if ($req.prestart_completeness_gate_required -ne $true) { throw 'M2_GROUP_V2_PRESTART_FLAG_REQUIRED' }
          if ($req.formula_stage -ne 'CLOSED' -or $lock.formula_stage -ne 'CLOSED') { throw 'M2_GROUP_V2_FORMULA_STAGE_MUST_BE_CLOSED' }
          if ($req.axis_version -ne 'M2_MULTI_AXIS_EXACT_SIGNATURE_TEMPORAL_BLINDSPOT_V2') { throw 'M2_GROUP_V2_AXIS_VERSION_FAIL' }
          if ($req.consume_only_durable_semantic_pass -ne $true -or $req.auto_absorb_new_durable_pass_sources -ne $true) { throw 'M2_GROUP_V2_DURABLE_PASS_POLICY_FAIL' }
          if ($req.existing_signature_maps_to_existing_group -ne $true -or $req.new_signature_creates_new_group -ne $true) { throw 'M2_GROUP_V2_SIGNATURE_POLICY_FAIL' }
          if ($req.consumed_source_digest_drift_policy -ne 'HARD_HOLD_NO_SILENT_REMAP') { throw 'M2_GROUP_V2_DRIFT_POLICY_FAIL' }
          if ($req.provisional_behavior_atlas -ne $true) { throw 'M2_GROUP_V2_PROVISIONAL_ATLAS_REQUIRED' }
          foreach ($pair in @(
            @('formula_research_handbook_document_id','formula_research_handbook_revision_id','formula_research'),
            @('behavior_handbook_document_id','behavior_handbook_revision_id','behavior_reading'),
            @('github_automation_handbook_document_id','github_automation_handbook_revision_id','github_automation'),
            @('transition_bridge_document_id','transition_bridge_revision_id','stable_transition_bridge')
          )) {
            $node = $lock.documents.($pair[2])
            if ([string]$req.($pair[0]) -ne [string]$node.document_id) { throw "PRESTART_AUTHORITY_DOCUMENT_ID_DRIFT:$($pair[2])" }
            if ([string]$req.($pair[1]) -ne [string]$node.revision_id) { throw "PRESTART_AUTHORITY_REVISION_DRIFT:$($pair[2])" }
          }
          if ($req.temporal_behavior_sequence_required -ne $true -or $req.permanent_blindspot_register_required -ne $true -or $req.future_hpx_evidence_lane_gate_required -ne $true) { throw 'M2_GROUP_V2_OWNER_LOCKS_INCOMPLETE' }
          if ($req.no_silent_unmapped_source_supported_axis -ne $true) { throw 'M2_GROUP_V2_NO_SILENT_GAP_REQUIRED' }
          if ($req.manual_labels_used_as_hidden_targets -ne $false -or $req.arbitrary_thresholds_added -ne $false -or $req.missing_as_zero -ne $false -or $req.sampling_or_winner_only -ne $false) { throw 'M2_GROUP_V2_PROHIBITION_FAIL' }
          if ($req.machine1_semantic_reader_remains_independent -ne $true -or $req.full_machine1_semantic_parity_claimed -ne $false) { throw 'M2_GROUP_V2_MACHINE_BOUNDARY_FAIL' }
          if ([int]$req.bootstrap_source_count -ne 8 -or $req.bootstrap_first_source -ne 'Raw Des 02-31-2024.csv' -or $req.bootstrap_last_source -ne 'Raw Juli 01-31-2025.csv') { throw 'M2_GROUP_V2_BOOTSTRAP_SCOPE_FAIL' }
          $revision = [string]$req.semantic_software_revision
          if ($revision -ne 'f22dc09395a7967215f93fc832d0fe81ee77d3aa') { throw 'M2_GROUP_V2_SEMANTIC_REVISION_BINDING_FAIL' }
          $semanticRoot = Join-Path 'C:\Users\feri-admin\.a1clean\v32_full_observation_behavior\schema-v3' $revision
          $outputRoot = Join-Path 'C:\Users\feri-admin\.a1clean\v32_behavior_grouping_atlas\schema-v2' $revision
          if (-not (Test-Path -LiteralPath $semanticRoot -PathType Container)) { throw 'M2_GROUP_V2_SEMANTIC_ROOT_MISSING' }
          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null
          "A1_M2_GROUP_SEMANTIC_REVISION=$revision" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_M2_GROUP_SEMANTIC_ROOT=$semanticRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_M2_GROUP_OUTPUT_ROOT=$outputRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'PRESTART_COMPLETENESS_PASS|scope=MACHINE_2_GROUPING_V2'

      - name: Compile and test exact current-stage contract before durable data read
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'M2_GROUP_V2_INSTALL_FAILED' }
          & $env:A1_PYTHON_EXE -m py_compile src/a1clean/formula_research/v32_behavior_grouping_atlas.py src/a1clean/formula_research/v32_behavior_grouping_atlas_v2.py
          if ($LASTEXITCODE -ne 0) { throw 'M2_GROUP_V2_COMPILE_FAILED' }
          & $env:A1_PYTHON_EXE -m pytest -q tests/test_v32_behavior_grouping_atlas.py tests/test_v32_behavior_grouping_atlas_v2.py tests/test_v32_observation_envelope.py
          if ($LASTEXITCODE -ne 0) { throw 'M2_GROUP_V2_TEST_FAILED' }
          & $env:A1_PYTHON_EXE -c "import json; from a1clean.formula_research.v32_behavior_grouping_atlas_v2 import REQUIRED_CURRENT_STAGE_AXES,AXIS_VERSION; r=json.load(open('v32-behavior-grouping-requests/current.json',encoding='utf-8')); assert r['axis_version']==AXIS_VERSION; assert tuple(r['required_current_stage_axes'])==REQUIRED_CURRENT_STAGE_AXES; print('M2_GROUP_V2_AXIS_CONTRACT_PASS=' + str(len(REQUIRED_CURRENT_STAGE_AXES)))"
          if ($LASTEXITCODE -ne 0) { throw 'M2_GROUP_V2_AXIS_CONTRACT_FAIL' }

      - name: Bootstrap fresh provisional atlas from first 8 durable PASS sources
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.v32_behavior_grouping_atlas_v2 --semantic-root $env:A1_M2_GROUP_SEMANTIC_ROOT --output-root $env:A1_M2_GROUP_OUTPUT_ROOT --software-revision $env:A1_M2_GROUP_SEMANTIC_REVISION --bootstrap-source-count 8
          if ($LASTEXITCODE -ne 0) { throw "M2_GROUP_V2_BOOTSTRAP_RUNTIME_FAILED:$LASTEXITCODE" }
          $m = Get-Content -LiteralPath (Join-Path $env:A1_M2_GROUP_OUTPUT_ROOT 'manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($m.schema -ne 'A1_V32_BEHAVIOR_GROUPING_ATLAS_V2' -or $m.axis_version -ne 'M2_MULTI_AXIS_EXACT_SIGNATURE_TEMPORAL_BLINDSPOT_V2') { throw 'M2_GROUP_V2_MANIFEST_IDENTITY_FAIL' }
          if ([int]$m.source_count_consumed -lt 8 -or $m.required_current_stage_axes_present -ne $true) { throw 'M2_GROUP_V2_BOOTSTRAP_COMPLETENESS_FAIL' }
          if ($m.coverage_contract_status -ne 'PASS_CURRENT_STAGE_WITH_EXPLICIT_DEFERRED_GATES' -or $m.formula_stage -ne 'CLOSED') { throw 'M2_GROUP_V2_COVERAGE_OR_FORMULA_GATE_FAIL' }

      - name: Prepare and upload bootstrap summary
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'm2-behavior-grouping-v2-bootstrap-summary' | Out-Null
          Copy-Item 'v32-behavior-grouping-requests\current.json' 'm2-behavior-grouping-v2-bootstrap-summary\request.json' -Force
          foreach ($f in @('manifest.json','axis-summary.json','source-consumption-registry.json','current-checkpoint.json')) { Copy-Item (Join-Path $env:A1_M2_GROUP_OUTPUT_ROOT $f) (Join-Path 'm2-behavior-grouping-v2-bootstrap-summary' $f) -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: m2-behavior-grouping-v2-bootstrap-${{ github.run_id }}
          path: m2-behavior-grouping-v2-bootstrap-summary
          if-no-files-found: error
          retention-days: 90

      - name: Watch and auto-absorb later durable PASS sources into same atlas
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.v32_behavior_grouping_atlas_v2 --semantic-root $env:A1_M2_GROUP_SEMANTIC_ROOT --output-root $env:A1_M2_GROUP_OUTPUT_ROOT --software-revision $env:A1_M2_GROUP_SEMANTIC_REVISION --bootstrap-source-count 8 --watch --poll-seconds 300
          if ($LASTEXITCODE -ne 0) { throw "M2_GROUP_V2_WATCH_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Final 18-source grouping reconciliation
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content -LiteralPath (Join-Path $env:A1_M2_GROUP_OUTPUT_ROOT 'manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([int]$m.source_count_consumed -ne 18 -or $m.required_current_stage_axes_present -ne $true -or $m.formula_stage -ne 'CLOSED') { throw 'M2_GROUP_V2_FINAL_RECONCILIATION_FAIL' }
          Add-Content $env:GITHUB_STEP_SUMMARY '### Machine 2 V2 atlas reconciliation'
          Add-Content $env:GITHUB_STEP_SUMMARY "- Durable sources consumed: $($m.source_count_consumed)/18"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Coverage contract: $($m.coverage_contract_status)"
          Add-Content $env:GITHUB_STEP_SUMMARY '- Formula stage remains CLOSED'
