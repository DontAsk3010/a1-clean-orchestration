name: Windows V3.2 Machine 2 Behavior Grouping Atlas

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - 'v32-behavior-grouping-requests/current.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1-windows-v32-machine2-behavior-grouping-atlas
  cancel-in-progress: false

jobs:
  grouping:
    name: Group durable PASS Machine 2 behavior sources
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 4320
    steps:
      - name: Checkout exact trigger revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Provision portable Python 3.11
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $pyRoot = Join-Path $env:RUNNER_TEMP 'a1-python-3.11.9'
          $zip = Join-Path $env:RUNNER_TEMP 'python-3.11.9-embed-amd64.zip'
          $getPip = Join-Path $env:RUNNER_TEMP 'get-pip.py'
          if (-not (Test-Path -LiteralPath (Join-Path $pyRoot 'python.exe') -PathType Leaf)) {
            Remove-Item -LiteralPath $pyRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $pyRoot | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $pyRoot -Force
            $pth = Join-Path $pyRoot 'python311._pth'
            (Get-Content -LiteralPath $pth -Raw).Replace('#import site','import site') | Set-Content -LiteralPath $pth -Encoding ascii
            Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
            & (Join-Path $pyRoot 'python.exe') $getPip --no-warn-script-location
            if ($LASTEXITCODE -ne 0) { throw 'M2_GROUP_PORTABLE_PIP_BOOTSTRAP_FAILED' }
          }
          $py = Join-Path $pyRoot 'python.exe'
          & $py --version
          if ($LASTEXITCODE -ne 0) { throw 'M2_GROUP_PORTABLE_PYTHON_UNAVAILABLE' }
          "A1_PYTHON_EXE=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $pyRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate governed grouping request and bind roots
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'v32-behavior-grouping-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_V32_BEHAVIOR_GROUPING_REQUEST_V1') { throw 'M2_GROUP_REQUEST_SCHEMA_MISMATCH' }
          if ($req.enabled -ne $true) { throw 'M2_GROUP_REQUEST_DISABLED' }
          if ($req.machine -ne 'MACHINE_2') { throw 'M2_GROUP_MACHINE_SCOPE_FAIL' }
          if ([int]$req.bootstrap_source_count -ne 8) { throw 'M2_GROUP_BOOTSTRAP_COUNT_FAIL' }
          if ($req.bootstrap_first_source -ne 'Raw Des 02-31-2024.csv') { throw 'M2_GROUP_BOOTSTRAP_FIRST_FAIL' }
          if ($req.bootstrap_last_source -ne 'Raw Juli 01-31-2025.csv') { throw 'M2_GROUP_BOOTSTRAP_LAST_FAIL' }
          if ($req.consume_only_durable_semantic_pass -ne $true) { throw 'M2_GROUP_DURABLE_PASS_GATE_REQUIRED' }
          if ($req.auto_absorb_new_durable_pass_sources -ne $true) { throw 'M2_GROUP_AUTO_ABSORB_REQUIRED' }
          if ($req.existing_signature_maps_to_existing_group -ne $true) { throw 'M2_GROUP_EXISTING_MATCH_REQUIRED' }
          if ($req.new_signature_creates_new_group -ne $true) { throw 'M2_GROUP_NEW_SIGNATURE_REQUIRED' }
          if ($req.consumed_source_digest_drift_policy -ne 'HARD_HOLD_NO_SILENT_REMAP') { throw 'M2_GROUP_DRIFT_POLICY_FAIL' }
          if ($req.provisional_behavior_atlas -ne $true) { throw 'M2_GROUP_PROVISIONAL_ATLAS_REQUIRED' }
          if ($req.formula_stage -ne 'CLOSED') { throw 'M2_GROUP_FORMULA_STAGE_MUST_BE_CLOSED' }
          if ($req.manual_labels_used_as_hidden_targets -ne $false) { throw 'M2_GROUP_MANUAL_HIDDEN_TARGET_FORBIDDEN' }
          if ($req.arbitrary_thresholds_added -ne $false) { throw 'M2_GROUP_ARBITRARY_THRESHOLD_FORBIDDEN' }
          if ($req.missing_as_zero -ne $false) { throw 'M2_GROUP_MISSING_AS_ZERO_FORBIDDEN' }
          if ($req.machine1_semantic_reader_remains_independent -ne $true) { throw 'M2_GROUP_MACHINE1_INDEPENDENCE_REQUIRED' }
          if ($req.full_machine1_semantic_parity_claimed -ne $false) { throw 'M2_GROUP_FALSE_PARITY_CLAIM' }
          $revision = [string]$req.semantic_software_revision
          if ($revision -ne 'f22dc09395a7967215f93fc832d0fe81ee77d3aa') { throw 'M2_GROUP_SEMANTIC_REVISION_BINDING_FAIL' }
          $semanticRoot = Join-Path 'C:\Users\feri-admin\.a1clean\v32_full_observation_behavior\schema-v3' $revision
          $outputRoot = Join-Path 'C:\Users\feri-admin\.a1clean\v32_behavior_grouping_atlas\schema-v1' $revision
          if (-not (Test-Path -LiteralPath $semanticRoot -PathType Container)) { throw 'M2_GROUP_SEMANTIC_ROOT_MISSING' }
          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null
          "A1_M2_GROUP_SEMANTIC_REVISION=$revision" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_M2_GROUP_SEMANTIC_ROOT=$semanticRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_M2_GROUP_OUTPUT_ROOT=$outputRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install compile and test grouping implementation
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'M2_GROUP_INSTALL_FAILED' }
          & $env:A1_PYTHON_EXE -m py_compile src/a1clean/formula_research/v32_behavior_grouping_atlas.py
          if ($LASTEXITCODE -ne 0) { throw 'M2_GROUP_COMPILE_FAILED' }
          & $env:A1_PYTHON_EXE -m pytest -q tests/test_v32_behavior_grouping_atlas.py tests/test_v32_observation_envelope.py
          if ($LASTEXITCODE -ne 0) { throw 'M2_GROUP_TEST_FAILED' }

      - name: Bootstrap provisional atlas from Dec 2024 through Jul 2025 durable PASS only
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.v32_behavior_grouping_atlas `
            --semantic-root $env:A1_M2_GROUP_SEMANTIC_ROOT `
            --output-root $env:A1_M2_GROUP_OUTPUT_ROOT `
            --software-revision $env:A1_M2_GROUP_SEMANTIC_REVISION `
            --bootstrap-source-count 8
          if ($LASTEXITCODE -ne 0) { throw "M2_GROUP_BOOTSTRAP_RUNTIME_FAILED:$LASTEXITCODE" }
          $m = Get-Content -LiteralPath (Join-Path $env:A1_M2_GROUP_OUTPUT_ROOT 'manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($m.schema -ne 'A1_V32_BEHAVIOR_GROUPING_ATLAS_V1') { throw 'M2_GROUP_MANIFEST_SCHEMA_FAIL' }
          if ($m.status -ne 'PROVISIONAL_BEHAVIOR_ATLAS') { throw 'M2_GROUP_STATUS_FAIL' }
          if ([int]$m.source_count_consumed -lt 8) { throw "M2_GROUP_BOOTSTRAP_NOT_COMPLETE:$($m.source_count_consumed)" }
          if (@($m.consumed_sources)[0] -ne 'Raw Des 02-31-2024.csv') { throw 'M2_GROUP_CONSUMED_FIRST_FAIL' }
          if (@($m.consumed_sources)[7] -ne 'Raw Juli 01-31-2025.csv') { throw 'M2_GROUP_CONSUMED_EIGHTH_FAIL' }
          if ($m.formula_stage -ne 'CLOSED') { throw 'M2_GROUP_FORMULA_GATE_FAIL' }
          if ($m.machine1_labels_used_as_hidden_targets -ne $false) { throw 'M2_GROUP_HIDDEN_TARGET_FAIL' }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### Machine 2 provisional behavior atlas bootstrap'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Durable sources consumed: $($m.source_count_consumed)/18"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Latest consumed source: $($m.latest_consumed_source)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Ticker-day memberships: $($m.ticker_day_memberships)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Journey memberships: $($m.journey_memberships)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "- Near-twin divergence formation groups: $($m.near_twin_divergence_formation_group_count)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '- Formula stage: CLOSED'

      - name: Prepare bootstrap summary artifact
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'm2-behavior-grouping-bootstrap-summary' | Out-Null
          Copy-Item -LiteralPath 'v32-behavior-grouping-requests\current.json' -Destination 'm2-behavior-grouping-bootstrap-summary\request.json' -Force
          Copy-Item -LiteralPath (Join-Path $env:A1_M2_GROUP_OUTPUT_ROOT 'manifest.json') -Destination 'm2-behavior-grouping-bootstrap-summary\manifest.json' -Force
          Copy-Item -LiteralPath (Join-Path $env:A1_M2_GROUP_OUTPUT_ROOT 'axis-summary.json') -Destination 'm2-behavior-grouping-bootstrap-summary\axis-summary.json' -Force
          Copy-Item -LiteralPath (Join-Path $env:A1_M2_GROUP_OUTPUT_ROOT 'source-consumption-registry.json') -Destination 'm2-behavior-grouping-bootstrap-summary\source-consumption-registry.json' -Force
          Copy-Item -LiteralPath (Join-Path $env:A1_M2_GROUP_OUTPUT_ROOT 'current-checkpoint.json') -Destination 'm2-behavior-grouping-bootstrap-summary\current-checkpoint.json' -Force

      - name: Upload bootstrap summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: m2-behavior-grouping-bootstrap-${{ github.run_id }}
          path: m2-behavior-grouping-bootstrap-summary
          if-no-files-found: error
          retention-days: 90

      - name: Watch and auto-absorb later durable PASS sources
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.v32_behavior_grouping_atlas `
            --semantic-root $env:A1_M2_GROUP_SEMANTIC_ROOT `
            --output-root $env:A1_M2_GROUP_OUTPUT_ROOT `
            --software-revision $env:A1_M2_GROUP_SEMANTIC_REVISION `
            --bootstrap-source-count 8 `
            --watch `
            --poll-seconds 300
          if ($LASTEXITCODE -ne 0) { throw "M2_GROUP_WATCH_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Assert full 18-source grouping consumption when watcher completes
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Get-Content -LiteralPath (Join-Path $env:A1_M2_GROUP_OUTPUT_ROOT 'manifest.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ([int]$m.source_count_consumed -ne 18) { throw "M2_GROUP_FULL_SOURCE_COUNT_FAIL:$($m.source_count_consumed)" }
          if ($m.status -ne 'PROVISIONAL_BEHAVIOR_ATLAS') { throw 'M2_GROUP_FINAL_STATUS_FAIL' }
          if ($m.formula_stage -ne 'CLOSED') { throw 'M2_GROUP_FINAL_FORMULA_GATE_FAIL' }
