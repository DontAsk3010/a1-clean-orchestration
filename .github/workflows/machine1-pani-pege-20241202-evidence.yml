name: Machine1 PANI-PEGE 20241202 Evidence Extract
on:
  push:
    branches: [machine1/evidence-pani-pege-20241202]
    paths:
      - '.github/workflows/machine1-pani-pege-20241202-evidence.yml'
      - 'scripts/extract-machine1-pani-pege-20241202.ps1'
permissions:
  contents: read
jobs:
  extract-governed-pani-pege:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: machine1/evidence-pani-pege-20241202
      - name: Extract exact governed packets
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          try { & './scripts/extract-machine1-pani-pege-20241202.ps1' }
          catch { ($_ | Format-List * -Force | Out-String) | Set-Content -LiteralPath 'extraction_error.txt' -Encoding UTF8; throw }
      - name: Upload governed evidence or diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine1-pani-pege-20241202-evidence
          path: |
            machine1_pani_pege_20241202_evidence/
            extraction_error.txt
          if-no-files-found: error
          retention-days: 7
