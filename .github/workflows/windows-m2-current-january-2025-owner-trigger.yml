name: Windows Machine2 CURRENT January 2025 Owner Trigger

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  actions: write

concurrency:
  group: a1-machine2-current-scientific-restart
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  restart:
    if: ${{ github.event.issue.title == 'A1-M2-OWNER-RUN-2025-01-8de318-R2' }}
    name: Machine2 CURRENT restart candidate ${{ matrix.lane }}
    strategy:
      fail-fast: false
      # CURRENT durable state is single-writer. Transient Drive failures are
      # retried/reconciled inside Machine2CurrentStore; a second heavy lane would
      # compete for the same exact-head generation checkpoint.
      matrix:
        lane: [A]
    runs-on: [self-hosted, windows, x64, a1-machine2-exact]
    timeout-minutes: 720
    env:
      PSExecutionPolicyPreference: Bypass
      A1_DRIVE_HTTP_TIMEOUT_SECONDS: "360"
      A1_REQUESTED_PERIOD_MONTH: "2025-01"
      A1_REQUESTED_TRADING_DATE: ""
      A1_TARGET_SOFTWARE_REVISION: "8de31863832658cad3f5cd3055540115b931aac7"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8de31863832658cad3f5cd3055540115b931aac7
          fetch-depth: 32

      - name: Route exact Machine2 runner
        id: route
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne 'PORSCHE-DESIGN') { throw "M2_CURRENT_WRONG_MACHINE:$env:COMPUTERNAME" }
          "runner_seen=$env:RUNNER_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:RUNNER_NAME -eq 'A1-WINDOWS-COMPUTE-02') {
            'is_target=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host 'M2_CURRENT_EXACT_RUNNER_PASS'
          } else {
            'is_target=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "M2_CURRENT_NON_TARGET_LANE_HOLD:$env:RUNNER_NAME"
            Start-Sleep -Seconds 120
          }

      - name: Hold heavy execution until request explicitly opens CURRENT restart
        id: gate
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Get-Content -LiteralPath 'v32-full-observation-behavior-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $open = ($r.enabled -eq $true -and $r.restart_authorized -eq $true)
          "open=$($open.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if (-not $open) {
            Write-Host 'M2_CURRENT_HEAVY_HOLD_REQUEST_DISABLED'
          } else {
            Write-Host 'M2_CURRENT_HEAVY_REQUEST_OPEN'
          }

      - name: Provision portable Python 3.11
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $pyRoot = Join-Path $env:RUNNER_TEMP 'a1-python-3.11.9'
          $zip = Join-Path $env:RUNNER_TEMP 'python-3.11.9-embed-amd64.zip'
          $getPip = Join-Path $env:RUNNER_TEMP 'get-pip.py'
          if (-not (Test-Path -LiteralPath (Join-Path $pyRoot 'python.exe') -PathType Leaf)) {
            Remove-Item -LiteralPath $pyRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $pyRoot | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $pyRoot -Force
            $pth = Join-Path $pyRoot 'python311._pth'
            (Get-Content -LiteralPath $pth -Raw).Replace('#import site','import site') | Set-Content -LiteralPath $pth -Encoding ascii
            Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
            & (Join-Path $pyRoot 'python.exe') $getPip --no-warn-script-location
            if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_PIP_BOOTSTRAP_FAILED' }
          }
          $py = Join-Path $pyRoot 'python.exe'
          & $py --version
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_PYTHON_UNAVAILABLE' }
          "A1_PYTHON_EXE=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install and run CURRENT restart contract tests
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_INSTALL_FAILED' }
          & $env:A1_PYTHON_EXE -m pytest -q `
            tests/test_authority_bootstrap.py `
            tests/test_source_universe_manifest.py `
            tests/test_source_universe_semantic_date_reconcile.py `
            tests/test_v32_dynamic_prestart.py `
            tests/test_v32_current_scientific_restart.py `
            tests/test_machine2_current_store_generation.py
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_CONTRACT_TEST_FAILED' }

      - name: Bind existing CURRENT execution generation after contract tests
        if: ${{ steps.route.outputs.is_target == 'true' && steps.gate.outputs.open == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          "A1_M2_EXECUTION_GENERATION_ID=8de31863832658cad3f5cd3055540115b931aac7" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'M2_CURRENT_EXISTING_EXECUTION_GENERATION_BOUND=8de31863832658cad3f5cd3055540115b931aac7'

      - name: Validate CURRENT atomic restart execution contract
        if: ${{ steps.route.outputs.is_target == 'true' && steps.gate.outputs.open == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          import json
          from a1clean.formula_research.m2_current_execution_contract import (
              assert_safe_atomic_units_per_shard,
              validate_request_for_current_atomic_restart,
          )
          with open('v32-full-observation-behavior-requests/current.json', encoding='utf-8') as fh:
              request = json.load(fh)
          validate_request_for_current_atomic_restart(request)
          assert_safe_atomic_units_per_shard(20)
          print('M2_CURRENT_ATOMIC_EXECUTION_CONTRACT_PASS')
          '@
          $script | & $env:A1_PYTHON_EXE -
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_ATOMIC_EXECUTION_CONTRACT_HOLD' }

      - name: Fresh-read complete authority and discover live source universe
        if: ${{ steps.route.outputs.is_target == 'true' && steps.gate.outputs.open == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:A1_DRIVE_READER_CREDENTIALS)) { throw 'M2_CURRENT_READER_CREDENTIALS_NOT_CONFIGURED' }
          if ([string]::IsNullOrWhiteSpace($env:A1_DRIVE_WRITER_CREDENTIALS)) { throw 'M2_CURRENT_WRITER_CREDENTIALS_NOT_CONFIGURED' }
          if (-not (Test-Path -LiteralPath $env:A1_DRIVE_READER_CREDENTIALS -PathType Leaf)) { throw 'M2_CURRENT_READER_CREDENTIALS_FILE_MISSING' }
          if (-not (Test-Path -LiteralPath $env:A1_DRIVE_WRITER_CREDENTIALS -PathType Leaf)) { throw 'M2_CURRENT_WRITER_CREDENTIALS_FILE_MISSING' }
          $manifest = Join-Path $env:RUNNER_TEMP 'm2-current-source-universe.json'
          $proof = Join-Path $env:RUNNER_TEMP 'm2-current-authority-sync.json'
          $stamp = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.source_universe_drive_preflight `
            --authority-lock governance/a1-clean-active-authority-lock.json `
            --authority-bootstrap governance/a1-clean-authority-bootstrap-current.json `
            --authority-sync-proof $proof `
            --output $manifest `
            --discovery-time-utc $stamp
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_AUTHORITY_OR_SOURCE_UNIVERSE_HOLD' }
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.source_universe_semantic_date_reconcile `
            --manifest $manifest `
            --output $manifest
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_SEMANTIC_DATE_ENVELOPE_RECONCILIATION_HOLD' }
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.v32_dynamic_prestart `
            --request v32-full-observation-behavior-requests/current.json `
            --authority-lock governance/a1-clean-active-authority-lock.json `
            --source-universe-manifest $manifest `
            --require-enabled
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_PRESTART_HOLD' }
          "A1_M2_SOURCE_UNIVERSE_MANIFEST=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_M2_AUTHORITY_SYNC_PROOF=$proof" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve exact governed target trading date inside monthly batch
        if: ${{ steps.route.outputs.is_target == 'true' && steps.gate.outputs.open == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          import json, os
          from a1clean.google_drive import build_drive_api
          from a1clean.pattern_discovery.source_reader import GovernedSourceReader

          p = os.environ['A1_M2_SOURCE_UNIVERSE_MANIFEST']
          requested_period = str(os.environ.get('A1_REQUESTED_PERIOD_MONTH') or '').strip()
          requested_date = str(os.environ.get('A1_REQUESTED_TRADING_DATE') or '').strip()
          m = json.load(open(p, encoding='utf-8'))
          if m.get('status') != 'PASS' or not m.get('sources'):
              raise SystemExit('M2_CURRENT_SOURCE_UNIVERSE_NOT_PASS')
          reconciliation = m.get('semantic_date_envelope_reconciliation') or {}
          if reconciliation.get('status') != 'PASS':
              raise SystemExit('M2_CURRENT_SEMANTIC_DATE_RECONCILIATION_NOT_PASS')

          api = build_drive_api(read_write=False)

          # Build exact governed date index from semantic manifests; no calendar guessing.
          governed = []
          for record in m['sources']:
              source = str(record['source_name'])
              reader = GovernedSourceReader(api, source_name=source)
              for row in reader.semantic_manifest_rows:
                  governed.append((str(row.trading_date), source, row))
          governed.sort(key=lambda item: (item[0], item[1], int(item[2].manifest_index)))

          if not governed:
              raise SystemExit('M2_CURRENT_GOVERNED_DATE_UNIVERSE_EMPTY')

          if requested_date:
              period = requested_period or requested_date[:7]
              if requested_date[:7] != period:
                  raise SystemExit(f'M2_CURRENT_TARGET_DATE_OUTSIDE_PERIOD:{period}:{requested_date}')
              matches = [item for item in governed if item[0] == requested_date]
              if not matches:
                  raise SystemExit(f'M2_CURRENT_TARGET_DATE_EMPTY:{requested_date}')
              day, source, first = matches[0]
          elif requested_period:
              matches = [item for item in governed if item[0].startswith(requested_period + '-')]
              if not matches:
                  raise SystemExit(f'M2_CURRENT_MONTHLY_PERIOD_EMPTY:{requested_period}')
              day, source, first = matches[0]
              period = requested_period
          else:
              day, source, first = governed[0]
              period = day[:7]

          print(source)
          print(day)
          print(period)
          print(first.ticker)
          print(first.source_row_first)
          print(first.source_row_last)
          print(first.first_clock_time)
          print(first.last_clock_time)
          '@
          $lines = $script | & $env:A1_PYTHON_EXE -
          if ($LASTEXITCODE -ne 0 -or $lines.Count -lt 8) { throw 'M2_CURRENT_TARGET_UNIT_RESOLUTION_FAILED' }
          "A1_M2_TARGET_SOURCE=$($lines[0])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_M2_TARGET_DATE=$($lines[1])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_M2_PERIOD_MONTH=$($lines[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_M2_TARGET_TICKER=$($lines[3])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "M2_CURRENT_MONTHLY_TARGET|period=$($lines[2])|source=$($lines[0])|date=$($lines[1])|ticker=$($lines[3])|rows=$($lines[4])-$($lines[5])|time=$($lines[6])-$($lines[7])"

      - name: Execute exact CURRENT calendar month sequentially with progressive checkpointing
        if: ${{ steps.route.outputs.is_target == 'true' && steps.gate.outputs.open == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GITHUB_REF_NAME = 'fix/v32-dynamic-source-universe-v1'
          $env:GITHUB_WORKFLOW = 'Windows Machine2 CURRENT Scientific Restart'
          $env:GITHUB_WORKFLOW_REF = 'DontAsk3010/a1-clean-orchestration/.github/workflows/windows-m2-current-scientific-restart.yml@refs/heads/fix/v32-dynamic-source-universe-v1'
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.v32_current_scientific_restart `
            --request v32-full-observation-behavior-requests/current.json `
            --source-universe-manifest $env:A1_M2_SOURCE_UNIVERSE_MANIFEST `
            --trading-date $env:A1_M2_TARGET_DATE `
            --units-per-shard 20 `
            --period-month $env:A1_M2_PERIOD_MONTH `
            --run-month-to-boundary `
            --software-revision $env:A1_TARGET_SOFTWARE_REVISION
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_MONTH_EXECUTION_HOLD' }

      - name: Exact CURRENT checkpoint readback
        if: ${{ steps.route.outputs.is_target == 'true' && steps.gate.outputs.open == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          import os
          from a1clean.google_drive import build_drive_api
          from a1clean.formula_research.machine2_current_store import Machine2CurrentStore
          from a1clean.formula_research.m2_current_execution_contract import (
              validate_checkpoint_exact_resume,
              validate_output_shard_checkpoint_coverage,
          )
          from a1clean.formula_research.v32_current_scientific_restart import CHECKPOINT_NAME, LINEAGE
          s = Machine2CurrentStore(build_drive_api(read_write=True))
          cp = s.read_json_optional(s.checkpoint_folder_id, CHECKPOINT_NAME)
          if not cp:
              raise SystemExit('M2_CURRENT_CHECKPOINT_MISSING')
          assert cp['lineage'] == LINEAGE
          assert cp['status'] == 'DATE_CLOSED'
          assert str(cp['current_date']).startswith(os.environ['A1_M2_PERIOD_MONTH'] + '-')
          assert cp['last_closed_date'] == cp['current_date']
          assert list(cp.get('closed_dates') or [])[-1] == cp['current_date']
          assert cp['old_pass_completion_inherited'] is False
          assert cp['old_scientific_checkpoint_read_for_completion'] is False
          assert cp['completed_units_in_current_date'] > 0
          assert cp['completed_source_rows_in_current_date'] > 0
          assert cp['next_exact_resume_point'] is None
          assert cp.get('date_close')
          validate_checkpoint_exact_resume(cp)
          validate_output_shard_checkpoint_coverage(cp, max_units_per_shard=20)
          print('M2_CURRENT_MONTH_FINAL_DATE_CLOSE_READBACK_PASS')
          print(cp['current_date'])
          print(cp['completed_units_in_current_date'])
          print(cp['completed_source_rows_in_current_date'])
          '@
          $script | & $env:A1_PYTHON_EXE -
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_CHECKPOINT_READBACK_HOLD' }

      - name: Resolve exact next governed date after DATE_CLOSED
        id: next_date
        if: ${{ steps.route.outputs.is_target == 'true' && steps.gate.outputs.open == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $script = @'
          import json, os
          from a1clean.google_drive import build_drive_api
          from a1clean.formula_research.machine2_current_store import Machine2CurrentStore
          from a1clean.formula_research.v32_current_scientific_restart import (
              CHECKPOINT_NAME,
              next_governed_date_after,
          )

          request = json.load(open('v32-full-observation-behavior-requests/current.json', encoding='utf-8'))
          if request.get('monthly_batch_authorized') is not True:
              raise SystemExit('M2_CURRENT_MONTHLY_BATCH_AUTHORITY_MISSING')
          if request.get('monthly_batch_stop_at_period_boundary') is not True:
              raise SystemExit('M2_CURRENT_MONTH_BOUNDARY_STOP_CONTRACT_MISSING')
          period = str(os.environ['A1_M2_PERIOD_MONTH'])
          manifest = json.load(open(os.environ['A1_M2_SOURCE_UNIVERSE_MANIFEST'], encoding='utf-8'))
          store = Machine2CurrentStore(build_drive_api(read_write=True))
          cp = store.read_json_optional(store.checkpoint_folder_id, CHECKPOINT_NAME)
          if not cp or cp.get('status') != 'DATE_CLOSED':
              raise SystemExit('M2_CURRENT_NEXT_DATE_REQUIRES_DATE_CLOSED')
          if not str(cp.get('current_date') or '').startswith(period + '-'):
              raise SystemExit('M2_CURRENT_NEXT_DATE_PERIOD_READBACK_DRIFT')

          nxt = next_governed_date_after(
              manifest,
              build_drive_api(read_write=False),
              current_source=str(cp['current_source']),
              current_date=str(cp['current_date']),
          )
          if nxt is None:
              print('NEXT_DATE=')
              print('NEXT_SOURCE=')
              print('NEXT_PERIOD=')
              print('M2_CURRENT_ALL_GOVERNED_DATES_CLOSED=true')
          else:
              source, day = nxt
              if day[:7] == period:
                  raise SystemExit(
                      'M2_CURRENT_MONTH_WORKER_RETURNED_BEFORE_PERIOD_BOUNDARY:'
                      + source + '|' + day
                  )
              else:
                  print('NEXT_DATE=')
                  print('NEXT_SOURCE=')
                  print('NEXT_PERIOD=' + day[:7])
                  print('M2_CURRENT_MONTH_CLOSED=' + period)
                  print('M2_CURRENT_NEXT_PERIOD_WAITING_EXPLICIT_DISPATCH=' + day[:7])
          '@
          $lines = $script | & $env:A1_PYTHON_EXE -
          if ($LASTEXITCODE -ne 0) { throw 'M2_CURRENT_NEXT_DATE_RESOLUTION_HOLD' }
          $next = ($lines | Where-Object { $_ -like 'NEXT_DATE=*' } | Select-Object -Last 1) -replace '^NEXT_DATE=',''
          $source = ($lines | Where-Object { $_ -like 'NEXT_SOURCE=*' } | Select-Object -Last 1) -replace '^NEXT_SOURCE=',''
          $nextPeriod = ($lines | Where-Object { $_ -like 'NEXT_PERIOD=*' } | Select-Object -Last 1) -replace '^NEXT_PERIOD=',''
          "next_date=$next" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "next_source=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "next_period=$nextPeriod" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ([string]::IsNullOrWhiteSpace($next)) {
            Write-Host "M2_CURRENT_MONTHLY_BATCH_STOP|period=$env:A1_M2_PERIOD_MONTH|next_period=$nextPeriod"
          } else {
            Write-Host "M2_CURRENT_MONTHLY_CONTINUATION_READY|period=$env:A1_M2_PERIOD_MONTH|source=$source|date=$next"
          }
