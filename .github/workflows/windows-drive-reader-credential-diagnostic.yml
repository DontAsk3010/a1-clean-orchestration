name: Windows Machine2 Reader Credential Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/windows-drive-reader-credential-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: a1-windows-machine2-reader-credential-diagnostic
  cancel-in-progress: false

jobs:
  lane_a:
    name: Reader diagnostic lane A
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 20
    outputs:
      target_pass: ${{ steps.diag.outputs.target_pass }}
      valid_count: ${{ steps.diag.outputs.valid_count }}
      current_valid: ${{ steps.diag.outputs.current_valid }}
      runner_seen: ${{ steps.route.outputs.runner_seen }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Route exact Machine2 runner
        id: route
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne 'PORSCHE-DESIGN') { throw "A1_READER_DIAG_WRONG_MACHINE:$env:COMPUTERNAME" }
          "runner_seen=$env:RUNNER_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:RUNNER_NAME -eq 'A1-WINDOWS-COMPUTE-02') {
            'is_target=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            'is_target=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Start-Sleep -Seconds 45
          }
      - name: Diagnose existing read-only credential candidates without mutation
        id: diag
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $ExpectedPrincipal = 'fjulie8satu@gmail.com'
          $ReadOnlyScope = 'https://www.googleapis.com/auth/drive.readonly'
          $FullDriveScope = 'https://www.googleapis.com/auth/drive'
          $RawId = '1gTyt7CzqlubcdZGjWV_lM9Iw8Zg4ib3e'
          $RawName = '02_CURRENT_HISTORICAL_RAW_DATA_UJI'
          function UrlEncode([string]$Value) { [Uri]::EscapeDataString($Value) }
          function Sha([string]$Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }

          $currentPath = [string]$env:A1_DRIVE_READER_CREDENTIALS
          $currentHash = $null
          if (-not [string]::IsNullOrWhiteSpace($currentPath) -and (Test-Path -LiteralPath $currentPath -PathType Leaf)) { $currentHash = Sha $currentPath }

          $roots = @(
            'C:\Users\feri-admin\a1-drive-auth',
            'C:\Users\feri-admin\.a1clean',
            'C:\Users\feri-admin\Documents',
            'C:\Users\feri-admin\Desktop',
            'C:\Users\feri-admin\Downloads'
          ) | Where-Object { Test-Path -LiteralPath $_ -PathType Container }
          $files = New-Object System.Collections.Generic.List[string]
          if ($currentPath -and (Test-Path -LiteralPath $currentPath -PathType Leaf)) { $files.Add([IO.Path]::GetFullPath($currentPath)) }
          foreach ($root in $roots) {
            Get-ChildItem -LiteralPath $root -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in @('.json','.bak') -or $_.Name -match 'credential|reader|oauth|token' } |
              ForEach-Object { $files.Add($_.FullName) }
          }
          $unique = @($files | Sort-Object -Unique)
          $seenHash = @{}
          $valid = New-Object System.Collections.Generic.List[object]
          $index = 0
          foreach ($path in $unique) {
            try {
              $hash = Sha $path
              if ($seenHash.ContainsKey($hash)) { continue }
              $seenHash[$hash] = $true
              $c = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json -ErrorAction Stop
              if ([string]$c.type -ne 'authorized_user') { continue }
              foreach ($field in @('client_id','client_secret','refresh_token')) {
                if (-not ($c.PSObject.Properties.Name -contains $field) -or [string]::IsNullOrWhiteSpace([string]$c.$field)) { throw 'shape' }
              }
              $tokenUri = if (($c.PSObject.Properties.Name -contains 'token_uri') -and -not [string]::IsNullOrWhiteSpace([string]$c.token_uri)) { [string]$c.token_uri } else { 'https://oauth2.googleapis.com/token' }
              if ($tokenUri -notmatch '^https://oauth2\.googleapis\.com/token$|^https://accounts\.google\.com/o/oauth2/token$') { continue }
              $token = Invoke-RestMethod -Method Post -Uri $tokenUri -ContentType 'application/x-www-form-urlencoded' -Body @{
                client_id=[string]$c.client_id; client_secret=[string]$c.client_secret; refresh_token=[string]$c.refresh_token; grant_type='refresh_token'
              } -ErrorAction Stop
              $access = [string]$token.access_token
              if ([string]::IsNullOrWhiteSpace($access)) { continue }
              $info = Invoke-RestMethod -Method Get -Uri ('https://oauth2.googleapis.com/tokeninfo?access_token=' + (UrlEncode $access)) -ErrorAction Stop
              $scopes = @(([string]$info.scope) -split '\s+' | Where-Object { $_ })
              if ($scopes -notcontains $ReadOnlyScope -or $scopes -contains $FullDriveScope) { continue }
              $headers = @{ Authorization = 'Bearer ' + $access }
              $about = Invoke-RestMethod -Method Get -Uri 'https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)' -Headers $headers -ErrorAction Stop
              if (([string]$about.user.emailAddress).ToLowerInvariant() -ne $ExpectedPrincipal) { continue }
              $raw = Invoke-RestMethod -Method Get -Uri ('https://www.googleapis.com/drive/v3/files/' + $RawId + '?fields=' + (UrlEncode 'id,name,mimeType') + '&supportsAllDrives=true') -Headers $headers -ErrorAction Stop
              if ([string]$raw.id -ne $RawId -or [string]$raw.name -ne $RawName) { continue }
              $index++
              $sameCurrent = ($currentHash -and $hash -eq $currentHash)
              $valid.Add([pscustomobject]@{ Path=$path; Hash=$hash; SameCurrent=$sameCurrent })
              Write-Host ("VALID_READER_CANDIDATE|index={0}|sha256_16={1}|same_as_current={2}|path_disclosed=false" -f $index,$hash.Substring(0,16),$sameCurrent)
            } catch {
              # Invalid/expired/noncredential candidates are intentionally silent; no secret/path disclosure.
            }
          }
          $currentValid = @($valid | Where-Object { $_.SameCurrent }).Count -eq 1
          "valid_count=$($valid.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "current_valid=$($currentValid.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          'target_pass=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "A1_READER_DIAGNOSTIC=PASS"
          Write-Host "VALID_READONLY_CANDIDATE_COUNT=$($valid.Count)"
          Write-Host "CURRENT_READER_VALID=$currentValid"
          Write-Host 'DRIVE_WRITE_PERFORMED=false'
          Write-Host 'CREDENTIAL_FILE_MUTATION=false'
          Write-Host 'SECRETS_DISCLOSED=false'

  lane_b:
    name: Reader diagnostic lane B
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 20
    outputs:
      target_pass: ${{ steps.diag.outputs.target_pass }}
      valid_count: ${{ steps.diag.outputs.valid_count }}
      current_valid: ${{ steps.diag.outputs.current_valid }}
      runner_seen: ${{ steps.route.outputs.runner_seen }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Route exact Machine2 runner
        id: route
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne 'PORSCHE-DESIGN') { throw "A1_READER_DIAG_WRONG_MACHINE:$env:COMPUTERNAME" }
          "runner_seen=$env:RUNNER_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($env:RUNNER_NAME -eq 'A1-WINDOWS-COMPUTE-02') {
            'is_target=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            'is_target=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Start-Sleep -Seconds 45
          }
      - name: Diagnose existing read-only credential candidates without mutation
        id: diag
        if: ${{ steps.route.outputs.is_target == 'true' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $ExpectedPrincipal = 'fjulie8satu@gmail.com'
          $ReadOnlyScope = 'https://www.googleapis.com/auth/drive.readonly'
          $FullDriveScope = 'https://www.googleapis.com/auth/drive'
          $RawId = '1gTyt7CzqlubcdZGjWV_lM9Iw8Zg4ib3e'
          $RawName = '02_CURRENT_HISTORICAL_RAW_DATA_UJI'
          function UrlEncode([string]$Value) { [Uri]::EscapeDataString($Value) }
          function Sha([string]$Path) { (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant() }
          $currentPath = [string]$env:A1_DRIVE_READER_CREDENTIALS
          $currentHash = $null
          if (-not [string]::IsNullOrWhiteSpace($currentPath) -and (Test-Path -LiteralPath $currentPath -PathType Leaf)) { $currentHash = Sha $currentPath }
          $roots = @('C:\Users\feri-admin\a1-drive-auth','C:\Users\feri-admin\.a1clean','C:\Users\feri-admin\Documents','C:\Users\feri-admin\Desktop','C:\Users\feri-admin\Downloads') | Where-Object { Test-Path -LiteralPath $_ -PathType Container }
          $files = New-Object System.Collections.Generic.List[string]
          if ($currentPath -and (Test-Path -LiteralPath $currentPath -PathType Leaf)) { $files.Add([IO.Path]::GetFullPath($currentPath)) }
          foreach ($root in $roots) {
            Get-ChildItem -LiteralPath $root -File -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in @('.json','.bak') -or $_.Name -match 'credential|reader|oauth|token' } | ForEach-Object { $files.Add($_.FullName) }
          }
          $unique = @($files | Sort-Object -Unique); $seenHash=@{}; $valid=New-Object System.Collections.Generic.List[object]; $index=0
          foreach ($path in $unique) {
            try {
              $hash=Sha $path; if ($seenHash.ContainsKey($hash)) { continue }; $seenHash[$hash]=$true
              $c=Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json -ErrorAction Stop
              if ([string]$c.type -ne 'authorized_user') { continue }
              foreach ($field in @('client_id','client_secret','refresh_token')) { if (-not ($c.PSObject.Properties.Name -contains $field) -or [string]::IsNullOrWhiteSpace([string]$c.$field)) { throw 'shape' } }
              $tokenUri=if (($c.PSObject.Properties.Name -contains 'token_uri') -and -not [string]::IsNullOrWhiteSpace([string]$c.token_uri)) { [string]$c.token_uri } else { 'https://oauth2.googleapis.com/token' }
              if ($tokenUri -notmatch '^https://oauth2\.googleapis\.com/token$|^https://accounts\.google\.com/o/oauth2/token$') { continue }
              $token=Invoke-RestMethod -Method Post -Uri $tokenUri -ContentType 'application/x-www-form-urlencoded' -Body @{client_id=[string]$c.client_id;client_secret=[string]$c.client_secret;refresh_token=[string]$c.refresh_token;grant_type='refresh_token'} -ErrorAction Stop
              $access=[string]$token.access_token; if ([string]::IsNullOrWhiteSpace($access)) { continue }
              $info=Invoke-RestMethod -Method Get -Uri ('https://oauth2.googleapis.com/tokeninfo?access_token='+(UrlEncode $access)) -ErrorAction Stop
              $scopes=@(([string]$info.scope)-split '\s+'|Where-Object{$_}); if ($scopes -notcontains $ReadOnlyScope -or $scopes -contains $FullDriveScope) { continue }
              $headers=@{Authorization='Bearer '+$access}; $about=Invoke-RestMethod -Method Get -Uri 'https://www.googleapis.com/drive/v3/about?fields=user(emailAddress)' -Headers $headers -ErrorAction Stop
              if (([string]$about.user.emailAddress).ToLowerInvariant() -ne $ExpectedPrincipal) { continue }
              $raw=Invoke-RestMethod -Method Get -Uri ('https://www.googleapis.com/drive/v3/files/'+$RawId+'?fields='+(UrlEncode 'id,name,mimeType')+'&supportsAllDrives=true') -Headers $headers -ErrorAction Stop
              if ([string]$raw.id -ne $RawId -or [string]$raw.name -ne $RawName) { continue }
              $index++; $sameCurrent=($currentHash -and $hash -eq $currentHash); $valid.Add([pscustomobject]@{Path=$path;Hash=$hash;SameCurrent=$sameCurrent})
              Write-Host ("VALID_READER_CANDIDATE|index={0}|sha256_16={1}|same_as_current={2}|path_disclosed=false" -f $index,$hash.Substring(0,16),$sameCurrent)
            } catch {}
          }
          $currentValid=@($valid|Where-Object{$_.SameCurrent}).Count -eq 1
          "valid_count=$($valid.Count)"|Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "current_valid=$($currentValid.ToString().ToLowerInvariant())"|Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          'target_pass=true'|Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "A1_READER_DIAGNOSTIC=PASS"; Write-Host "VALID_READONLY_CANDIDATE_COUNT=$($valid.Count)"; Write-Host "CURRENT_READER_VALID=$currentValid"; Write-Host 'DRIVE_WRITE_PERFORMED=false'; Write-Host 'CREDENTIAL_FILE_MUTATION=false'; Write-Host 'SECRETS_DISCLOSED=false'

  assert_target:
    name: Require exact Machine2 reader diagnostic
    if: ${{ always() }}
    needs: [lane_a, lane_b]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          echo "lane_a_runner=${{ needs.lane_a.outputs.runner_seen }}"
          echo "lane_b_runner=${{ needs.lane_b.outputs.runner_seen }}"
          if [[ "${{ needs.lane_a.outputs.target_pass }}" == "true" ]]; then
            echo "VALID_READONLY_CANDIDATE_COUNT=${{ needs.lane_a.outputs.valid_count }}"
            echo "CURRENT_READER_VALID=${{ needs.lane_a.outputs.current_valid }}"
            exit 0
          fi
          if [[ "${{ needs.lane_b.outputs.target_pass }}" == "true" ]]; then
            echo "VALID_READONLY_CANDIDATE_COUNT=${{ needs.lane_b.outputs.valid_count }}"
            echo "CURRENT_READER_VALID=${{ needs.lane_b.outputs.current_valid }}"
            exit 0
          fi
          echo 'A1_READER_DIAGNOSTIC_EXACT_TARGET_PASS=false'
          exit 1
