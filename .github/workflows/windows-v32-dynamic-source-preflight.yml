name: Windows V3.2 Dynamic Source Universe PRESTART

on:
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/windows-v32-dynamic-source-preflight.yml'
      - 'governance/a1-clean-active-authority-lock.json'
      - 'governance/a1-clean-authority-bootstrap-current.json'
      - 'v32-full-observation-behavior-requests/current.json'
      - 'v32-behavior-grouping-requests/current.json'
      - 'canonical-current-recovery-requests/current.json'
      - 'canonical-current-recovery-requests/recovery-prepare-blocker-current.json'
      - 'canonical-current-recovery-requests/writer-relocation-search-current.json'
      - 'src/a1clean/google_drive.py'
      - 'src/a1clean/authority_bootstrap.py'
      - 'src/a1clean/authority_bootstrap_drive_revision.py'
      - 'src/a1clean/formula_research/source_universe_manifest.py'
      - 'src/a1clean/formula_research/source_universe_drive_preflight.py'
      - 'src/a1clean/formula_research/v32_dynamic_prestart.py'
      - 'tests/test_authority_bootstrap.py'
      - 'tests/test_source_universe_manifest.py'
      - 'tests/test_v32_dynamic_prestart.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1-windows-v32-dynamic-source-prestart
  cancel-in-progress: true

jobs:
  prestart:
    name: Control-plane only dynamic source universe validation
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 30
    env:
      PSExecutionPolicyPreference: Bypass

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 32

      - name: Require exact Machine2 runner
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'A1-WINDOWS-COMPUTE-02') { throw "DYNAMIC_PRESTART_WRONG_RUNNER:$env:RUNNER_NAME" }
          if ($env:COMPUTERNAME -ne 'PORSCHE-DESIGN') { throw "DYNAMIC_PRESTART_WRONG_MACHINE:$env:COMPUTERNAME" }
          Write-Host 'DYNAMIC_PRESTART_MACHINE2_RUNNER_PASS'

      - name: Provision portable Python 3.11
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $pyRoot = Join-Path $env:RUNNER_TEMP 'a1-python-3.11.9'
          $zip = Join-Path $env:RUNNER_TEMP 'python-3.11.9-embed-amd64.zip'
          $getPip = Join-Path $env:RUNNER_TEMP 'get-pip.py'
          if (-not (Test-Path -LiteralPath (Join-Path $pyRoot 'python.exe') -PathType Leaf)) {
            Remove-Item -LiteralPath $pyRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $pyRoot | Out-Null
            Invoke-WebRequest -UseBasicParsing -Uri 'https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath $pyRoot -Force
            $pth = Join-Path $pyRoot 'python311._pth'
            (Get-Content -LiteralPath $pth -Raw).Replace('#import site','import site') | Set-Content -LiteralPath $pth -Encoding ascii
            Invoke-WebRequest -UseBasicParsing -Uri 'https://bootstrap.pypa.io/get-pip.py' -OutFile $getPip
            & (Join-Path $pyRoot 'python.exe') $getPip --no-warn-script-location
            if ($LASTEXITCODE -ne 0) { throw 'DYNAMIC_PRESTART_PIP_BOOTSTRAP_FAILED' }
          }
          $py = Join-Path $pyRoot 'python.exe'
          & $py --version
          if ($LASTEXITCODE -ne 0) { throw 'DYNAMIC_PRESTART_PYTHON_UNAVAILABLE' }
          "A1_PYTHON_EXE=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $pyRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install and run authority plus source-universe unit gates
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:A1_PYTHON_EXE -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'DYNAMIC_PRESTART_INSTALL_FAILED' }
          & $env:A1_PYTHON_EXE -m pytest -q `
            tests/test_authority_bootstrap.py `
            tests/test_source_universe_manifest.py `
            tests/test_v32_dynamic_prestart.py `
            tests/test_v32_behavior_grouping_dynamic.py `
            tests/test_v32_full_observation_semantic_dynamic.py
          if ($LASTEXITCODE -ne 0) { throw 'DYNAMIC_PRESTART_UNIT_GATE_FAILED' }

      - name: Full authority sync then discover governed source universe
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:A1_DRIVE_READER_CREDENTIALS)) { throw 'DYNAMIC_PRESTART_DRIVE_READER_CREDENTIALS_NOT_CONFIGURED' }
          if (-not (Test-Path -LiteralPath $env:A1_DRIVE_READER_CREDENTIALS -PathType Leaf)) { throw 'DYNAMIC_PRESTART_DRIVE_READER_CREDENTIALS_FILE_MISSING' }
          $manifest = Join-Path $env:RUNNER_TEMP 'source-universe-manifest.json'
          $proof = Join-Path $env:RUNNER_TEMP 'AUTHORITY_SYNC_PROOF.json'
          $stamp = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
          & $env:A1_PYTHON_EXE -m a1clean.formula_research.source_universe_drive_preflight `
            --authority-lock governance/a1-clean-active-authority-lock.json `
            --authority-bootstrap governance/a1-clean-authority-bootstrap-current.json `
            --authority-sync-proof $proof `
            --output $manifest `
            --discovery-time-utc $stamp
          if ($LASTEXITCODE -ne 0) { throw "DYNAMIC_PRESTART_AUTHORITY_OR_SOURCE_UNIVERSE_HOLD:$LASTEXITCODE" }
          $a = Get-Content -LiteralPath $proof -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($a.status -ne 'PASS' -or $a.full_authority_read_complete -ne $true) { throw 'DYNAMIC_PRESTART_AUTHORITY_SYNC_NOT_PASS' }
          if ($a.revision_namespace -ne 'GOOGLE_DRIVE_CURRENT_REVISION_ID' -or $a.legacy_docs_revision_tokens_used_for_drive_comparison -ne $false) { throw 'DYNAMIC_PRESTART_AUTHORITY_REVISION_NAMESPACE_FAIL' }
          $u = Get-Content -LiteralPath $manifest -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($u.status -ne 'PASS') { throw 'DYNAMIC_PRESTART_SOURCE_UNIVERSE_NOT_PASS' }
          if ($u.dynamic_source_universe_required -ne $true -or $u.fixed_source_count_as_invariant_forbidden -ne $true) { throw 'DYNAMIC_PRESTART_SOURCE_UNIVERSE_GOVERNANCE_FAIL' }
          if ([int]$u.source_count -lt 1 -or $u.sources.Count -ne [int]$u.source_count) { throw 'DYNAMIC_PRESTART_SOURCE_UNIVERSE_CARDINALITY_FAIL' }
          if ($u.authority_sync.status -ne 'PASS' -or $u.authority_sync.full_authority_read_complete -ne $true) { throw 'DYNAMIC_PRESTART_SOURCE_MANIFEST_AUTHORITY_BINDING_FAIL' }
          "A1_AUTHORITY_SYNC_PROOF=$proof" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_AUTHORITY_CORPUS_DIGEST=$($a.authority_corpus_sha256)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_SOURCE_UNIVERSE_MANIFEST=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_SOURCE_UNIVERSE_COUNT=$($u.source_count)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "A1_SOURCE_UNIVERSE_DIGEST=$($u.manifest_digest)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "AUTHORITY_SYNC_PASS|docs=$($a.authority_document_count)|states=$($a.repo_state_file_count)|digest=$($a.authority_corpus_sha256)"
          Write-Host "DYNAMIC_SOURCE_UNIVERSE_PASS|sources=$($u.source_count)|digest=$($u.manifest_digest)"

      - name: Validate both HOLD requests against current authority and dynamic universe
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($request in @('v32-full-observation-behavior-requests/current.json','v32-behavior-grouping-requests/current.json')) {
            & $env:A1_PYTHON_EXE -m a1clean.formula_research.v32_dynamic_prestart `
              --request $request `
              --authority-lock governance/a1-clean-active-authority-lock.json `
              --source-universe-manifest $env:A1_SOURCE_UNIVERSE_MANIFEST
            if ($LASTEXITCODE -ne 0) { throw "DYNAMIC_PRESTART_REQUEST_VALIDATION_FAIL:$request:$LASTEXITCODE" }
          }
          $full = Get-Content -LiteralPath 'v32-full-observation-behavior-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $group = Get-Content -LiteralPath 'v32-behavior-grouping-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($full.enabled -ne $false -or $group.enabled -ne $false) { throw 'DYNAMIC_PRESTART_EXPECTED_HOLD_REQUESTS' }
          Write-Host 'DYNAMIC_PRESTART_CONTROL_PLANE_PASS|heavy_execution=HOLD'

      - name: Publish compact PRESTART evidence
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'dynamic-source-prestart-evidence' | Out-Null
          Copy-Item -LiteralPath $env:A1_AUTHORITY_SYNC_PROOF -Destination 'dynamic-source-prestart-evidence\AUTHORITY_SYNC_PROOF.json' -Force
          Copy-Item -LiteralPath $env:A1_SOURCE_UNIVERSE_MANIFEST -Destination 'dynamic-source-prestart-evidence\source-universe-manifest.json' -Force
          Copy-Item -LiteralPath 'governance\a1-clean-authority-bootstrap-current.json' -Destination 'dynamic-source-prestart-evidence\authority-bootstrap-contract.json' -Force
          Copy-Item -LiteralPath 'governance\a1-clean-active-authority-lock.json' -Destination 'dynamic-source-prestart-evidence\authority-lock.json' -Force
          Copy-Item -LiteralPath 'v32-full-observation-behavior-requests\current.json' -Destination 'dynamic-source-prestart-evidence\full-observation-request.json' -Force
          Copy-Item -LiteralPath 'v32-behavior-grouping-requests\current.json' -Destination 'dynamic-source-prestart-evidence\grouping-request.json' -Force
          Add-Content $env:GITHUB_STEP_SUMMARY '### Dynamic source universe PRESTART'
          Add-Content $env:GITHUB_STEP_SUMMARY "- Exact runner: $env:RUNNER_NAME / $env:COMPUTERNAME"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Full authority docs read: PASS ($((Get-Content $env:A1_AUTHORITY_SYNC_PROOF -Raw | ConvertFrom-Json).authority_document_count))"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Authority corpus digest: $env:A1_AUTHORITY_CORPUS_DIGEST"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Governed source count: $env:A1_SOURCE_UNIVERSE_COUNT"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Manifest digest: $env:A1_SOURCE_UNIVERSE_DIGEST"
          Add-Content $env:GITHUB_STEP_SUMMARY '- Heavy execution remains HOLD because both requests are disabled.'

      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-source-prestart-${{ github.run_id }}
          path: dynamic-source-prestart-evidence
          if-no-files-found: error
          retention-days: 90
