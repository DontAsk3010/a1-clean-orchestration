name: Windows Telegram MG Behavior Topology V2

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - telegram-mg-behavior-topology-v2-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-windows-telegram-mg-behavior-topology-v2
  cancel-in-progress: false

jobs:
  study:
    name: Compare distinct MG behavior topologies across development months
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 720
    steps:
      - name: Checkout exact research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate topology V2 request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.ref_name }}' -ne 'formula/current-clean-research-v1') { throw 'Topology V2 is branch-restricted.' }
          $req = Get-Content -LiteralPath 'telegram-mg-behavior-topology-v2-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_TELEGRAM_MG_BEHAVIOR_TOPOLOGY_V2_REQUEST_V1') { throw 'Unsupported topology V2 request schema.' }
          if ($req.enabled -ne $true) { throw 'Topology V2 request not enabled.' }
          if ($req.authorization_phrase -ne 'AUTHORIZE_TELEGRAM_MG_BEHAVIOR_TOPOLOGY_V2') { throw 'Exact topology V2 authorization phrase required.' }
          if ($req.drive_output_folder_id -ne '1uQKSZD8KbOZ2j3moyZiH1EuJPlEhEAuC') { throw 'Unexpected Formula Research output folder.' }
          if ($req.source_names.Count -lt 3) { throw 'Cross-period topology development requires at least three chronological source periods.' }
          if ($req.source_names -contains 'Raw Maret 03-31-2025.csv') { throw 'March OOS must remain untouched.' }
          $json = $req | ConvertTo-Json -Compress -Depth 20
          "A1_MG_TOPOLOGY_V2_REQUEST_JSON=$json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Drive credential bindings
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:A1_DRIVE_READER_CREDENTIALS, $env:A1_DRIVE_WRITER_CREDENTIALS)) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Drive credential binding missing.' }
          }

      - name: Install compile and test exact research code
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'MG_TOPOLOGY_V2_INSTALL_FAILED' }
          py -3.11 -m compileall -q src tests
          if ($LASTEXITCODE -ne 0) { throw 'MG_TOPOLOGY_V2_COMPILE_FAILED' }
          py -3.11 -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'MG_TOPOLOGY_V2_TESTS_FAILED' }

      - name: Run topology V2 study
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = $env:A1_MG_TOPOLOGY_V2_REQUEST_JSON | ConvertFrom-Json
          $argsList = @(
            '-3.11', '-m', 'a1clean.formula_research.telegram_mg_behavior_topology_v2',
            '--request-id', [string]$req.request_id,
            '--software-revision', '${{ github.sha }}',
            '--drive-output-folder-id', [string]$req.drive_output_folder_id,
            '--output', 'telegram-mg-behavior-topology-v2-result.json',
            '--capital-per-entry', [string][double]$req.execution.capital_per_entry,
            '--buy-fee-pct', [string][double]$req.execution.buy_fee_pct,
            '--sell-fee-pct', [string][double]$req.execution.sell_fee_pct,
            '--min-training-examples', [string][int]$req.execution.min_training_examples,
            '--tp1-quantile', [string][double]$req.execution.tp1_quantile,
            '--tp2-quantile', [string][double]$req.execution.tp2_quantile,
            '--prior-window', [string][int]$req.prior_window,
            '--effort-lookback', [string][int]$req.params.effort_lookback,
            '--progress-lookback', [string][int]$req.params.progress_lookback,
            '--high-lookback', [string][int]$req.params.high_lookback,
            '--recovery-lookback', [string][int]$req.params.recovery_lookback,
            '--low-stabilization-bars', [string][int]$req.params.low_stabilization_bars,
            '--early-checkpoint-bar', [string][int]$req.params.early_checkpoint_bar,
            '--late-lift-min-bar', [string][int]$req.params.late_lift_min_bar
          )
          foreach ($source in $req.source_names) { $argsList += @('--source-name', [string]$source) }
          & py @argsList
          if ($LASTEXITCODE -ne 0) { throw "MG_TOPOLOGY_V2_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Upload topology V2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mg-behavior-topology-v2-${{ github.run_id }}
          path: telegram-mg-behavior-topology-v2-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Research safety declaration
        if: always()
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          "### Telegram MG Behavior Topology V2" >> $env:GITHUB_STEP_SUMMARY
          "- Compares distinct component topologies, not threshold-only variants." >> $env:GITHUB_STEP_SUMMARY
          "- Uses Dec-2024, Jan-2025, Feb-2025 development periods; March OOS is blocked." >> $env:GITHUB_STEP_SUMMARY
          "- Signal is not entry: execution begins on the next eligible bar using a conservative causal step proxy." >> $env:GITHUB_STEP_SUMMARY
          "- Profit-room calibration uses only prior completed market dates for that topology." >> $env:GITHUB_STEP_SUMMARY
          "- H+1 is excluded; failures and weak topologies remain preserved." >> $env:GITHUB_STEP_SUMMARY
