name: Machine2 Exact Routing Bootstrap

on:
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/windows-machine2-exact-routing-bootstrap.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: a1-machine2-exact-routing-bootstrap
  cancel-in-progress: false

jobs:
  prove_exact_route:
    name: Prove exact Machine2 route
    runs-on: [self-hosted, windows, x64, a1-machine2-exact]
    timeout-minutes: 10
    outputs:
      runner_seen: ${{ steps.proof.outputs.runner_seen }}
      computer_seen: ${{ steps.proof.outputs.computer_seen }}
      service_name: ${{ steps.proof.outputs.service_name }}
      service_state: ${{ steps.proof.outputs.service_state }}
      target_pass: ${{ steps.proof.outputs.target_pass }}
    steps:
      - name: Exact runner identity and listener proof
        id: proof
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'A1-WINDOWS-COMPUTE-02') {
            throw "M2_EXACT_ROUTE_WRONG_RUNNER:$env:RUNNER_NAME"
          }
          if ($env:COMPUTERNAME -ne 'PORSCHE-DESIGN') {
            throw "M2_EXACT_ROUTE_WRONG_MACHINE:$env:COMPUTERNAME"
          }
          $targets = @(Get-CimInstance Win32_Service | Where-Object {
            ([string]$_.PathName -match 'actions-runner-a1-02')
          })
          if ($targets.Count -ne 1) {
            throw "M2_EXACT_ROUTE_LISTENER_CARDINALITY:$($targets.Count)"
          }
          $svc = $targets[0]
          if ([string]$svc.State -ne 'Running') {
            throw "M2_EXACT_ROUTE_LISTENER_NOT_RUNNING:$($svc.State)"
          }
          "runner_seen=$env:RUNNER_NAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "computer_seen=$env:COMPUTERNAME" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "service_name=$($svc.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "service_state=$($svc.State)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "target_pass=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host 'M2_EXACT_ROUTING_PROOF_PASS=true'

  promote_and_chain:
    name: Promote routing proof, PRESTART, then CURRENT
    needs: prove_exact_route
    if: ${{ needs.prove_exact_route.outputs.target_pass == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BRANCH: fix/v32-dynamic-source-universe-v1
      PRESTART_WORKFLOW: windows-v32-dynamic-source-preflight.yml
      CURRENT_WORKFLOW: windows-m2-current-scientific-restart.yml
      GH_TOKEN: ${{ github.token }}
      ROUTE_RUNNER: ${{ needs.prove_exact_route.outputs.runner_seen }}
      ROUTE_COMPUTER: ${{ needs.prove_exact_route.outputs.computer_seen }}
      ROUTE_SERVICE: ${{ needs.prove_exact_route.outputs.service_name }}
      ROUTE_SERVICE_STATE: ${{ needs.prove_exact_route.outputs.service_state }}
    steps:
      - name: Checkout CURRENT branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Refresh exact CURRENT branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${BRANCH}"
          git checkout "${BRANCH}"
          git reset --hard "origin/${BRANCH}"

      - name: Persist exact routing proof and owner-authorized CURRENT request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          proof_path = Path('governance/machine2-exact-routing-proof-current.json')
          request_path = Path('v32-full-observation-behavior-requests/current.json')

          proof = {
              "schema": "A1_MACHINE2_EXACT_ROUTING_PROOF_V1",
              "status": "PASS",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "branch": os.environ["BRANCH"],
              "bootstrap_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "bootstrap_trigger_head_sha": os.environ["GITHUB_SHA"],
              "target_runner_name": "A1-WINDOWS-COMPUTE-02",
              "observed_runner_name": os.environ["ROUTE_RUNNER"],
              "observed_computer_name": os.environ["ROUTE_COMPUTER"],
              "observed_listener_service_name": os.environ["ROUTE_SERVICE"],
              "observed_listener_service_state": os.environ["ROUTE_SERVICE_STATE"],
              "selector": "self-hosted,windows,x64,a1-machine2-exact",
              "runner_identity_exact": os.environ["ROUTE_RUNNER"] == "A1-WINDOWS-COMPUTE-02",
              "computer_identity_exact": os.environ["ROUTE_COMPUTER"] == "PORSCHE-DESIGN",
              "listener_running": os.environ["ROUTE_SERVICE_STATE"] == "Running",
              "shared_parity_selector_used": False,
              "generated_utc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          if not (proof["runner_identity_exact"] and proof["computer_identity_exact"] and proof["listener_running"]):
              raise SystemExit("M2_EXACT_ROUTING_PROOF_IDENTITY_FAIL")

          proof_bytes = (json.dumps(proof, indent=2, sort_keys=True) + "\n").encode("utf-8")
          proof_path.write_bytes(proof_bytes)
          proof_sha = hashlib.sha256(proof_bytes).hexdigest()

          request = json.loads(request_path.read_text(encoding="utf-8"))
          if request.get("schema") != "A1_V32_FULL_OBSERVATION_BEHAVIOR_REQUEST_V3":
              raise SystemExit("M2_CURRENT_REQUEST_SCHEMA_DRIFT")
          if request.get("deterministic_exact_runner_name") != "A1-WINDOWS-COMPUTE-02":
              raise SystemExit("M2_CURRENT_EXACT_RUNNER_NAME_DRIFT")
          if request.get("grouping_stage") != "CLOSED_UNTIL_SEPARATELY_ADMITTED_AFTER_REQUIRED_EVIDENCE_DEPTH":
              raise SystemExit("M2_CURRENT_GROUPING_GATE_DRIFT")
          if request.get("formula_stage") != "CLOSED":
              raise SystemExit("M2_CURRENT_FORMULA_GATE_DRIFT")

          request["enabled"] = True
          request["status"] = "OWNER_AUTHORIZED_CURRENT_FULL_SCIENTIFIC_RESTART_FROM_BEGINNING"
          request["reason"] = (
              "Owner-authorized CURRENT Machine2 full scientific restart from the beginning. "
              "Exact runner routing is proven for A1-WINDOWS-COMPUTE-02 through the unique "
              "a1-machine2-exact selector. Fresh PRESTART, dynamic-source discovery, checkpoint "
              "runtime validation, exact Drive write/readback, chronological full-depth reading, "
              "and all existing Master Handbook gates remain mandatory. No prior scientific "
              "completion is inherited."
          )
          request["hold_reason"] = None
          request["restart_authorized"] = True
          request["restart_gate"] = "FRESH_PRESTART_REQUIRED_AFTER_ROUTING_PROOF"
          request["deterministic_exact_runner_routing_proven"] = True
          request["deterministic_exact_runner_selector"] = "self-hosted,windows,x64,a1-machine2-exact"
          request["deterministic_exact_runner_routing_proof_sha256"] = proof_sha
          request["checkpoint_runtime_validation_proven"] = False
          request["no_pass_claim"] = True

          request_path.write_text(json.dumps(request, indent=2) + "\n", encoding="utf-8")
          print("M2_EXACT_ROUTING_PROOF_SHA256=" + proof_sha)
          print("M2_CURRENT_REQUEST_OPEN_FOR_PRESTART=true")
          PY

          git rm '.github/workflows/windows-machine2-exact-routing-bootstrap.yml'
          git add governance/machine2-exact-routing-proof-current.json v32-full-observation-behavior-requests/current.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Machine2: prove exact route and authorize fresh CURRENT PRESTART'

          pushed=false
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              pushed=true
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              break
            fi
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
          done
          if [ "${pushed}" != 'true' ]; then
            echo 'M2_ROUTING_PROOF_PROMOTION_PUSH_FAIL=true'
            exit 41
          fi

          echo "promoted_head=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          echo 'M2_ROUTING_PROOF_PROMOTION_PASS=true'

      - name: Dispatch and require fresh PRESTART PASS
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          code="$(curl -sS -o /tmp/prestart-dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d "{\"ref\":\"${BRANCH}\"}" \
            "${api}/actions/workflows/${PRESTART_WORKFLOW}/dispatches")"
          echo "M2_PRESTART_DISPATCH_HTTP=${code}"
          if [ "${code}" != '204' ]; then
            cat /tmp/prestart-dispatch.out || true
            exit 42
          fi

          prestart_id=''
          for _ in $(seq 1 60); do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/actions/workflows/${PRESTART_WORKFLOW}/runs?branch=${BRANCH}&event=workflow_dispatch&per_page=20" > /tmp/prestart-runs.json
            prestart_id="$(jq -r --arg stamp "${stamp}" '.workflow_runs | map(select(.created_at >= $stamp)) | sort_by(.created_at) | reverse | .[0].id // empty' /tmp/prestart-runs.json)"
            if [ -n "${prestart_id}" ]; then break; fi
            sleep 5
          done
          if [ -z "${prestart_id}" ]; then
            echo 'M2_PRESTART_RUN_NOT_FOUND=true'
            exit 43
          fi
          echo "M2_PRESTART_RUN_ID=${prestart_id}"

          for _ in $(seq 1 240); do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/actions/runs/${prestart_id}" > /tmp/prestart-run.json
            status="$(jq -r '.status' /tmp/prestart-run.json)"
            conclusion="$(jq -r '.conclusion // ""' /tmp/prestart-run.json)"
            echo "M2_PRESTART_STATE|run_id=${prestart_id}|status=${status}|conclusion=${conclusion}"
            if [ "${status}" = 'completed' ]; then
              if [ "${conclusion}" != 'success' ]; then
                exit 44
              fi
              echo 'M2_FRESH_PRESTART_PASS=true'
              break
            fi
            sleep 15
          done
          status="$(jq -r '.status' /tmp/prestart-run.json)"
          conclusion="$(jq -r '.conclusion // ""' /tmp/prestart-run.json)"
          if [ "${status}" != 'completed' ] || [ "${conclusion}" != 'success' ]; then
            echo 'M2_PRESTART_TIMEOUT_OR_NONPASS=true'
            exit 45
          fi

      - name: Dispatch CURRENT scientific restart and verify exact start
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          stamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          code="$(curl -sS -o /tmp/current-dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            -d "{\"ref\":\"${BRANCH}\"}" \
            "${api}/actions/workflows/${CURRENT_WORKFLOW}/dispatches")"
          echo "M2_CURRENT_DISPATCH_HTTP=${code}"
          if [ "${code}" != '204' ]; then
            cat /tmp/current-dispatch.out || true
            exit 46
          fi

          current_id=''
          for _ in $(seq 1 60); do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/actions/workflows/${CURRENT_WORKFLOW}/runs?branch=${BRANCH}&event=workflow_dispatch&per_page=20" > /tmp/current-runs.json
            current_id="$(jq -r --arg stamp "${stamp}" '.workflow_runs | map(select(.created_at >= $stamp)) | sort_by(.created_at) | reverse | .[0].id // empty' /tmp/current-runs.json)"
            if [ -n "${current_id}" ]; then break; fi
            sleep 5
          done
          if [ -z "${current_id}" ]; then
            echo 'M2_CURRENT_RUN_NOT_FOUND=true'
            exit 47
          fi
          echo "M2_CURRENT_RUN_ID=${current_id}"

          exact_started=false
          for _ in $(seq 1 60); do
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/actions/runs/${current_id}/jobs?per_page=20" > /tmp/current-jobs.json
            if jq -e '.jobs[] | select(.runner_name=="A1-WINDOWS-COMPUTE-02" and (.status=="in_progress" or .status=="completed"))' /tmp/current-jobs.json >/dev/null; then
              exact_started=true
              break
            fi
            sleep 5
          done
          if [ "${exact_started}" != 'true' ]; then
            echo 'M2_CURRENT_EXACT_START_NOT_PROVEN=true'
            exit 48
          fi
          echo 'M2_CURRENT_DISPATCH_AND_EXACT_START_PASS=true'
