name: Claude MG Open=Low Strength V1

on:
  push:
    branches:
      - research/claude-mg-discovery
    paths:
      - claude-mg-openlow-strength-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-claude-mg-openlow-strength
  cancel-in-progress: true

jobs:
  analyse:
    name: Open=Low scout plus ignition, rung targets, 10% strength study
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 720
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'claude-mg-openlow-strength-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_CLAUDE_MG_OPENLOW_STRENGTH_REQUEST_V1') { throw 'Unsupported request schema.' }
          if ($req.enabled -ne $true) { throw 'Request disabled.' }
          if ($req.authorization_phrase -ne 'AUTHORIZE_CLAUDE_MG_OPENLOW_STRENGTH_V1') { throw 'Authorization phrase required.' }
          if ($req.source_name -match '(?i)mar(et)?') { throw 'Refusing source name that may be the reserved March 2025 OOS month.' }

      - name: Verify Drive bindings
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:A1_DRIVE_READER_CREDENTIALS)) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Drive credential binding missing.' }
          }

      - name: Install compile test
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'INSTALL_FAILED' }
          py -3.11 -m compileall -q src tests
          if ($LASTEXITCODE -ne 0) { throw 'COMPILE_FAILED' }
          py -3.11 -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'TESTS_FAILED' }

      - name: Run Open=Low strength analysis
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'claude-mg-openlow-strength-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          & py -3.11 -m a1clean.formula_research.claude_mg_openlow_strength_v1 `
            --source-name $req.source_name `
            --min-chg-pct $req.min_chg_pct `
            --rungs $req.rungs `
            --strength-target-pct $req.strength_target_pct `
            --output 'claude-mg-openlow-strength-result.json' `
            --report-output 'claude-mg-openlow-strength-report.txt' `
            --strength-report-output 'claude-mg-openlow-strength-10pct.txt'
          if ($LASTEXITCODE -ne 0) { throw "CLAUDE_MG_OPENLOW_STRENGTH_RUN_FAILED:$LASTEXITCODE" }

      - name: Print reports to log
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Get-Content -LiteralPath 'claude-mg-openlow-strength-result.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host '===== TOTALS ====='
          $r.totals | ConvertTo-Json -Depth 6 | Write-Host
          Write-Host '===== STRENGTH CONTRAST (signal-time features only) ====='
          $r.strength_contrast | ConvertTo-Json -Depth 6 | Write-Host
          Write-Host '===== FULL REPLAY REPORT ====='
          Get-Content -LiteralPath 'claude-mg-openlow-strength-report.txt' -Encoding UTF8 | Write-Host
          Write-Host '===== STRONG >=10% ONLY ====='
          Get-Content -LiteralPath 'claude-mg-openlow-strength-10pct.txt' -Encoding UTF8 | Write-Host
          Write-Host '===== END ====='

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: claude-mg-openlow-strength-${{ github.run_id }}
          path: |
            claude-mg-openlow-strength-result.json
            claude-mg-openlow-strength-report.txt
            claude-mg-openlow-strength-10pct.txt
          if-no-files-found: error
          retention-days: 30
