name: Windows V3.2 Progress Probe

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - '.github/workflows/windows-v32-progress-probe.yml'
      - 'v32-progress-probe-request.txt'

permissions:
  contents: read

jobs:
  probe:
    name: Read-only V3.2 local progress probe
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 10
    steps:
      - name: Inspect V3.2 source checkpoints
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\Users\feri-admin\.a1clean\v32_full_observation_behavior\schema-v3\f22dc09395a7967215f93fc832d0fe81ee77d3aa'
          if (-not (Test-Path -LiteralPath $root -PathType Container)) { throw 'V32_PROGRESS_ROOT_MISSING' }

          $sources = @(
            'Raw Des 02-31-2024.csv',
            'Raw Jan 01-31-2025.csv',
            'Raw Feb 03-28-2025.csv',
            'Raw Maret 03-31-2025.csv',
            'Raw April 01-30-2025.csv',
            'Raw Mei 01-30-2025.csv',
            'Raw Juni 02-30-2025.csv',
            'Raw Juli 01-31-2025.csv',
            'Raw Agust 01-29-2025.csv',
            'Raw Sep 01-30-2025.csv',
            'Raw Oct 01-31-2025.csv',
            'Raw Nov 03-29-2025.csv',
            'Raw Des 01-31-2025.csv',
            'Raw Jan 01-30-2026.csv',
            'Raw Feb 02-27-2026.csv',
            'Raw Mar 02-31-2026.csv',
            'Raw Apr 01-30-2026.csv',
            'Raw Mei 01-29-2026.csv'
          )

          function Get-Slug([string]$s) {
            $sha = [System.Security.Cryptography.SHA256]::Create()
            try {
              $bytes = [System.Text.Encoding]::UTF8.GetBytes($s)
              $hash = $sha.ComputeHash($bytes)
              return (($hash | ForEach-Object { $_.ToString('x2') }) -join '').Substring(0,16)
            } finally {
              $sha.Dispose()
            }
          }

          $passCount = 0
          $current = $null
          for ($i = 0; $i -lt $sources.Count; $i++) {
            $source = $sources[$i]
            $slug = Get-Slug $source
            $dir = Join-Path $root $slug
            $cp = Join-Path $dir 'checkpoint.json'
            if (Test-Path -LiteralPath $cp -PathType Leaf) {
              $j = Get-Content -LiteralPath $cp -Raw -Encoding UTF8 | ConvertFrom-Json
              $state = [string]$j.status
              if ($state -eq 'PASS') { $passCount++ }
              Write-Output ("V32_SOURCE_PROGRESS|order={0}|source={1}|state={2}|checkpoint={3}" -f ($i+1),$source,$state,$true)
            } elseif (Test-Path -LiteralPath $dir -PathType Container) {
              $files = @(Get-ChildItem -LiteralPath $dir -File -ErrorAction SilentlyContinue)
              $latest = if ($files.Count -gt 0) { ($files | Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 1).LastWriteTimeUtc.ToString('o') } else { 'NO_FILE_YET' }
              Write-Output ("V32_SOURCE_PROGRESS|order={0}|source={1}|state=IN_PROGRESS_NO_PASS_CHECKPOINT|files={2}|latest_write_utc={3}" -f ($i+1),$source,$files.Count,$latest)
              if ($null -eq $current) { $current = $source }
            } else {
              Write-Output ("V32_SOURCE_PROGRESS|order={0}|source={1}|state=NOT_STARTED" -f ($i+1),$source)
            }
          }

          Write-Output ("V32_PROGRESS_SUMMARY|pass_sources={0}|total_sources={1}|current_source={2}" -f $passCount,$sources.Count,($(if ($null -eq $current) { 'NONE_DETECTED' } else { $current })))
