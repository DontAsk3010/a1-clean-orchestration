name: Windows Telegram MG Structural Discovery V3 Fast

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - telegram-mg-structural-discovery-v3-fast-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-windows-telegram-mg-structural-discovery-v3
  cancel-in-progress: true

jobs:
  study:
    name: Compare MG structures with cached exact context
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 720
    steps:
      - name: Checkout exact research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate fast V3 request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'telegram-mg-structural-discovery-v3-fast-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_TELEGRAM_MG_STRUCTURAL_DISCOVERY_V3_REQUEST_V1') { throw 'Unsupported structural V3 request schema.' }
          if ($req.enabled -ne $true) { throw 'Structural V3 request not enabled.' }
          if ($req.authorization_phrase -ne 'AUTHORIZE_TELEGRAM_MG_STRUCTURAL_DISCOVERY_V3') { throw 'Exact authorization phrase required.' }
          if ($req.drive_output_folder_id -ne '1uQKSZD8KbOZ2j3moyZiH1EuJPlEhEAuC') { throw 'Unexpected Formula Research output folder.' }
          if ($req.source_names.Count -lt 3) { throw 'At least three chronological source periods required.' }
          if ($req.source_names -contains 'Raw Maret 03-31-2025.csv') { throw 'March OOS must remain untouched.' }
          $json = $req | ConvertTo-Json -Compress -Depth 20
          "A1_MG_STRUCTURAL_V3_FAST_REQUEST_JSON=$json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Drive credential bindings
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:A1_DRIVE_READER_CREDENTIALS, $env:A1_DRIVE_WRITER_CREDENTIALS)) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Drive credential binding missing.' }
          }

      - name: Install compile and test exact research code
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'MG_STRUCTURAL_V3_INSTALL_FAILED' }
          py -3.11 -m compileall -q src tests
          if ($LASTEXITCODE -ne 0) { throw 'MG_STRUCTURAL_V3_COMPILE_FAILED' }
          py -3.11 -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'MG_STRUCTURAL_V3_TESTS_FAILED' }

      - name: Run cached structural V3 study
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = $env:A1_MG_STRUCTURAL_V3_FAST_REQUEST_JSON | ConvertFrom-Json
          $argsList = @(
            '-3.11', '-m', 'a1clean.formula_research.telegram_mg_structural_discovery_v3_fast',
            '--request-id', [string]$req.request_id,
            '--software-revision', '${{ github.sha }}',
            '--drive-output-folder-id', [string]$req.drive_output_folder_id,
            '--output', 'telegram-mg-structural-discovery-v3-result.json',
            '--prior-window', [string][int]$req.prior_window,
            '--buy-fee-pct', [string][double]$req.execution.buy_fee_pct,
            '--sell-fee-pct', [string][double]$req.execution.sell_fee_pct,
            '--effort-lookback', [string][int]$req.params.effort_lookback,
            '--progress-lookback', [string][int]$req.params.progress_lookback,
            '--high-lookback', [string][int]$req.params.high_lookback,
            '--recovery-lookback', [string][int]$req.params.recovery_lookback,
            '--low-stabilization-bars', [string][int]$req.params.low_stabilization_bars,
            '--early-checkpoint-bar', [string][int]$req.params.early_checkpoint_bar,
            '--late-lift-min-bar', [string][int]$req.params.late_lift_min_bar
          )
          foreach ($source in $req.source_names) { $argsList += @('--source-name', [string]$source) }
          & py @argsList
          if ($LASTEXITCODE -ne 0) { throw "MG_STRUCTURAL_V3_FAST_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Upload structural V3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mg-structural-discovery-v3-fast-${{ github.run_id }}
          path: telegram-mg-structural-discovery-v3-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Research declaration
        if: always()
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          "### Telegram MG Structural Discovery V3 Fast" >> $env:GITHUB_STEP_SUMMARY
          "- Cached comparable-session context must match reference context exactly; tests enforce parity." >> $env:GITHUB_STEP_SUMMARY
          "- First causal appearance only per ticker/day/formula." >> $env:GITHUB_STEP_SUMMARY
          "- March 2025 remains untouched OOS; H+1 excluded." >> $env:GITHUB_STEP_SUMMARY
