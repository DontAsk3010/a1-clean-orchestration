name: Machine1 Date05 Resolve Exact PASS041 Locator

on:
  workflow_dispatch:
  push:
    branches: [machine1/date05-audit-pass029-alka-evidence]
    paths: [.github/workflows/machine1-date05-pass041-locator.yml]

permissions:
  contents: read

jobs:
  locate:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI\Raw Des 02-31-2024.csv'
    steps:
      - uses: actions/checkout@v4
      - name: Resolve next exact Date05 source block after PASS040 ANTM
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference='Stop'
          $raw=[System.IO.Path]::GetFullPath($env:RAW_FILE)
          [int64]$priorEnd=79351
          [int64]$start=$priorEnd+1
          [int64]$expectedSize=453806812
          $expectedSha='5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          $expectedDate='2024-12-05'
          if(-not (Test-Path -LiteralPath $raw -PathType Leaf)){throw "RAW_MISSING $raw"}
          $fi=Get-Item -LiteralPath $raw
          if($fi.Length -ne $expectedSize){throw "RAW_SIZE_MISMATCH got=$($fi.Length) expected=$expectedSize"}
          $sha=(Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne $expectedSha){throw "RAW_SHA256_MISMATCH got=$sha expected=$expectedSha"}
          $header=$null
          $block=New-Object 'System.Collections.Generic.List[string]'
          [int64]$idx=0
          $targetTicker=$null
          foreach($line in [System.IO.File]::ReadLines($raw,[System.Text.Encoding]::UTF8)){
            if($idx -eq 0){$header=$line; $idx++; continue}
            if($idx -lt $start){$idx++; continue}
            $obj=@($header,$line) | ConvertFrom-Csv
            $row=$obj[0]
            if([string]$row.RAW_DATETIME_ISO -notlike "$expectedDate*"){throw "NEXT_ROW_DATE_MISMATCH row=$idx got=$($row.RAW_DATETIME_ISO)"}
            if([string]::IsNullOrWhiteSpace($targetTicker)){$targetTicker=[string]$row.RAW_TICKER}
            if([string]$row.RAW_TICKER -ne $targetTicker){break}
            [void]$block.Add($line)
            $idx++
          }
          if($null -eq $header){throw 'HEADER_MISSING'}
          if([string]::IsNullOrWhiteSpace($targetTicker)){throw 'NEXT_TICKER_NOT_FOUND'}
          if($block.Count -lt 1){throw 'NEXT_BLOCK_EMPTY'}
          $parsed=@((@($header)+@($block)) | ConvertFrom-Csv)
          [int64]$end=$start+$parsed.Count-1
          $dates=@($parsed|ForEach-Object{[string]$_.RAW_DATETIME_ISO})
          $tickers=@($parsed|ForEach-Object{[string]$_.RAW_TICKER}|Sort-Object -Unique)
          if($tickers.Count -ne 1 -or $tickers[0] -ne $targetTicker){throw 'TICKER_BLOCK_CONTAMINATION'}
          if(@($dates|Where-Object{-not $_.StartsWith($expectedDate)}).Count -gt 0){throw 'DATE_BLOCK_CONTAMINATION'}
          for($i=1;$i -lt $dates.Count;$i++){
            $prev=[datetime]::ParseExact($dates[$i-1],'yyyy-MM-dd HH:mm:ss',[Globalization.CultureInfo]::InvariantCulture)
            $cur=[datetime]::ParseExact($dates[$i],'yyyy-MM-dd HH:mm:ss',[Globalization.CultureInfo]::InvariantCulture)
            if($cur -lt $prev){throw "CHRONOLOGY_FAIL index=$i prev=$($dates[$i-1]) current=$($dates[$i])"}
          }
          $out=Join-Path $PWD '.machine1_transport/date05_pass041_locator'
          if(Test-Path -LiteralPath $out){Remove-Item -Recurse -Force -LiteralPath $out}
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $proof=[ordered]@{
            machine='MACHINE_1';worker='DATE05';next_pass='PASS041';prior_pass='PASS040';prior_ticker='ANTM';assigned_date=$expectedDate;
            source_name='Raw Des 02-31-2024.csv';source_sha256=$sha;source_size=$fi.Length;
            manifest_line=118;ticker=$targetTicker;source_row_first=$start;source_row_last=$end;physical_line_first=($start+1);physical_line_last=($end+1);actual_rows=$parsed.Count;
            first_datetime=$dates[0];last_datetime=$dates[$dates.Count-1];chronology_verified=$true;
            locator_only=$true;semantic_read_performed=$false;checkpoint_mutated=$false;next_ticker_semantic_opened=$false;integrity='PASS'
          }
          $utf8=New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $out 'PASS041_LOCATOR_PROOF.json'),($proof|ConvertTo-Json -Depth 8),$utf8)
          Write-Host "PASS041_LOCATOR_READY ticker=$targetTicker rows=$($parsed.Count) source_rows=$start-$end first=$($dates[0]) last=$($dates[$dates.Count-1]) source_sha=$sha"
      - name: Upload PASS041 locator proof
        uses: actions/upload-artifact@v4
        with:
          name: machine1-date05-pass041-locator-proof
          path: .machine1_transport/date05_pass041_locator/
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
