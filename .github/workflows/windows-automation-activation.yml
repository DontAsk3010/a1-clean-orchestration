name: Windows Governed Automation Activation

on:
  workflow_dispatch:
    inputs:
      activation_mode:
        description: 'VERIFY performs post-commit readback only; ACTIVATE_CANONICAL_IF_CHANGED authorizes one governed production cycle.'
        required: true
        default: VERIFY
        type: choice
        options:
          - VERIFY
          - ACTIVATE_CANONICAL_IF_CHANGED
      authorization_phrase:
        description: 'Required only for ACTIVATE_CANONICAL_IF_CHANGED.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: a1-windows-governed-automation-activation
  cancel-in-progress: false

jobs:
  activate:
    name: Post-commit readback and governed automation activation
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 240
    env:
      A1_RAW_DIR: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI'
    steps:
      - name: Require migration parity branch
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.ref_name }}' -ne 'migration/parity-v2') {
            throw 'This workflow must be dispatched on migration/parity-v2.'
          }

      - name: Checkout permanent production-machine code
        uses: actions/checkout@v4

      - name: Verify separate external Drive credential bindings exist
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $bindings = @(
            @{ Name = 'A1_DRIVE_READER_CREDENTIALS'; Path = $env:A1_DRIVE_READER_CREDENTIALS },
            @{ Name = 'A1_DRIVE_WRITER_CREDENTIALS'; Path = $env:A1_DRIVE_WRITER_CREDENTIALS }
          )
          foreach ($binding in $bindings) {
            if ([string]::IsNullOrWhiteSpace($binding.Path)) {
              throw "$($binding.Name) is not configured for the runner process."
            }
            if (-not (Test-Path -LiteralPath $binding.Path -PathType Leaf)) {
              throw "$($binding.Name) points to a credential file that does not exist. Credential content/path is intentionally not printed."
            }
          }

      - name: Install governed machine package
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e .

      - name: Re-verify governed Drive separation
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m a1clean.cli drive-preflight

      - name: Require exact activation authorization when canonical activation is requested
        if: ${{ inputs.activation_mode == 'ACTIVATE_CANONICAL_IF_CHANGED' }}
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.authorization_phrase }}' -ne 'AUTHORIZE_GOVERNED_AUTOMATION_ACTIVATION') {
            throw 'ACTIVATE_CANONICAL_IF_CHANGED requires the exact governed automation activation authorization phrase.'
          }

      - name: Run post-commit readback and governed activation cycle
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        env:
          A1_AUTOMATION_ACTIVATION_AUTHORIZATION: ${{ inputs.authorization_phrase }}
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m a1clean.automation_activation --mode '${{ inputs.activation_mode }}'

      - name: Safety declaration
        if: always()
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Write-Host 'THIS IS THE SAME PERMANENT A1 CLEAN PRODUCTION MACHINE, NOT A THROWAWAY TESTER.'
          Write-Host 'The gate proves canonical baseline consumption and one governed activation cycle.'
          Write-Host 'Canonical RAW is never written.'
          Write-Host 'Source processing remains delta-only and dynamically discovered.'
          Write-Host 'Semantic research state remains independent from data-plane state and is not a live-trading dependency.'
          Write-Host 'This workflow does not enable unattended scheduling, formula/model/signal logic, Telegram analytical logic, news AI, participant analytics, or live deployment.'
