name: Windows Telegram MG Multi Hypothesis V8

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - telegram-mg-multihypothesis-v8-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-windows-telegram-mg-multihypothesis-v8
  cancel-in-progress: true

jobs:
  study:
    name: Mine MG precursor ignition formulas across governed corpus
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 720
    steps:
      - name: Checkout exact research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'telegram-mg-multihypothesis-v8-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_TELEGRAM_MG_MULTI_HYPOTHESIS_V8_REQUEST_V1') { throw 'Unsupported V8 request schema.' }
          if ($req.enabled -ne $true) { throw 'V8 request not enabled.' }
          $json = $req | ConvertTo-Json -Compress -Depth 20
          "A1_MG_V8_REQUEST_JSON=$json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Drive credential bindings
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @($env:A1_DRIVE_READER_CREDENTIALS, $env:A1_DRIVE_WRITER_CREDENTIALS)) {
            if ([string]::IsNullOrWhiteSpace($path) -or -not (Test-Path -LiteralPath $path -PathType Leaf)) { throw 'Drive credential binding missing.' }
          }

      - name: Install compile test
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'MG_V8_INSTALL_FAILED' }
          py -3.11 -m py_compile src/a1clean/formula_research/telegram_mg_multihypothesis_v8.py src/a1clean/formula_research/telegram_mg_multihypothesis_v8b.py
          if ($LASTEXITCODE -ne 0) { throw 'MG_V8_COMPILE_FAILED' }
          py -3.11 -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'MG_V8_TESTS_FAILED' }

      - name: Run V8 multihypothesis discovery
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = $env:A1_MG_V8_REQUEST_JSON | ConvertFrom-Json
          & py -3.11 -m a1clean.formula_research.telegram_mg_multihypothesis_v8b `
            --output 'telegram-mg-multihypothesis-v8-result.json' `
            --prior-days ([string][int]$req.prior_days) `
            --buy-fee-pct ([string][double]$req.execution.buy_fee_pct) `
            --sell-fee-pct ([string][double]$req.execution.sell_fee_pct) `
            --min-support ([string][int]$req.min_support) `
            --min-unique-days ([string][int]$req.min_unique_days) `
            --top-each ([string][int]$req.top_each) `
            --top-formulas ([string][int]$req.top_formulas)
          if ($LASTEXITCODE -ne 0) { throw "MG_V8_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Upload V8 artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mg-multihypothesis-v8-${{ github.run_id }}
          path: telegram-mg-multihypothesis-v8-result.json
          if-no-files-found: error
          retention-days: 30
