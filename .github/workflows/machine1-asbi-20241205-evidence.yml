name: Machine1 ASBI 2024-12-05 Governed Evidence Extract
on:
  push:
    branches: [machine1/evidence-asbi-20241205]
    paths: [.github/workflows/machine1-asbi-20241205-evidence.yml]
permissions:
  contents: read
jobs:
  extract-asbi:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\\TRADING SYSTEM\\02_CURRENT_HISTORICAL_RAW_DATA_UJI\\Raw Des 02-31-2024.csv'
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact governed ASBI packet
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import csv, hashlib, json, os, pathlib
          raw=pathlib.Path(os.environ['RAW_FILE'])
          ticker_expected='ASBI'; trading_date='2024-12-05'; source_first=95781; source_last=95783; expected_count=3
          expected_first_time='09:24:00'; expected_last_time='16:02:00'
          semantic_bundle='Raw Des 02-31-2024__SEMANTIC_0014.jsonl'; semantic_bundle_line=130
          expected_md5='b8d42b35c90d2dff8b18ae4e1734523b'; expected_sha256='5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          if not raw.is_file(): raise SystemExit(f'RAW_MISSING: {raw}')
          md5=hashlib.md5(); sha256=hashlib.sha256()
          with raw.open('rb') as f:
              for chunk in iter(lambda:f.read(8*1024*1024),b''): md5.update(chunk); sha256.update(chunk)
          got_md5,got_sha256=md5.hexdigest(),sha256.hexdigest()
          if got_md5!=expected_md5 or got_sha256!=expected_sha256: raise SystemExit(f'RAW_HASH_MISMATCH md5={got_md5} sha256={got_sha256}')
          rows=[]
          with raw.open('r',encoding='utf-8-sig',newline='') as f:
              reader=csv.DictReader(f)
              for source_row,row in enumerate(reader,start=1):
                  if source_row<source_first: continue
                  if source_row>source_last: break
                  rows.append({'source_row':source_row,**row})
          if len(rows)!=expected_count: raise SystemExit(f'ROW_COUNT_MISMATCH got={len(rows)} expected={expected_count}')
          if [r['source_row'] for r in rows]!=list(range(source_first,source_last+1)): raise SystemExit('SOURCE_ROW_SEQUENCE_MISMATCH')
          if {r.get('RAW_TICKER','') for r in rows}!={ticker_expected}: raise SystemExit('TICKER_MISMATCH')
          dts=[r.get('RAW_DATETIME_ISO','') for r in rows]
          if any(not dt.startswith(trading_date) for dt in dts): raise SystemExit('DATE_MISMATCH')
          ft=dts[0].split(' ')[-1][:8]; lt=dts[-1].split(' ')[-1][:8]
          if ft!=expected_first_time or lt!=expected_last_time: raise SystemExit(f'TIME_RANGE_MISMATCH got={ft}-{lt}')
          out=pathlib.Path('machine1_asbi_20241205_evidence'); out.mkdir(exist_ok=True)
          packet={'source_name':raw.name,'source_md5':got_md5,'source_sha256':got_sha256,'generation_id':'BEHAVIOR_UNIFORM_COLAB_SEMANTIC_GEN_20260910_01','ticker':ticker_expected,'trading_date':trading_date,'semantic_bundle':semantic_bundle,'semantic_bundle_line_number':semantic_bundle_line,'source_row_first':source_first,'source_row_last':source_last,'physical_line_first':source_first+1,'physical_line_last':source_last+1,'data_rows':len(rows),'first_datetime':dts[0],'last_datetime':dts[-1],'rows':rows}
          pp=out/'ASBI_20241205_PACKET.json'; rp=out/'ASBI_20241205_ROWS.jsonl'
          pp.write_text(json.dumps(packet,ensure_ascii=False,indent=2),encoding='utf-8')
          with rp.open('w',encoding='utf-8',newline='\n') as w:
              for row in rows: w.write(json.dumps(row,ensure_ascii=False,separators=(',',':'))+'\n')
          ph=hashlib.sha256(pp.read_bytes()).hexdigest(); rh=hashlib.sha256(rp.read_bytes()).hexdigest()
          (out/'EVIDENCE_PROOF.json').write_text(json.dumps({'ticker':ticker_expected,'trading_date':trading_date,'source_md5':got_md5,'source_sha256':got_sha256,'semantic_bundle':semantic_bundle,'semantic_bundle_line_number':semantic_bundle_line,'source_row_first':source_first,'source_row_last':source_last,'data_rows':len(rows),'first_datetime':dts[0],'last_datetime':dts[-1],'packet_sha256':ph,'rows_jsonl_sha256':rh},ensure_ascii=False,indent=2),encoding='utf-8')
          print(f'ASBI_EVIDENCE_OK rows={len(rows)} source_rows={source_first}-{source_last} first={dts[0]} last={dts[-1]} packet_sha256={ph} rows_sha256={rh}')
          '@ | Set-Content -LiteralPath extract_asbi_20241205.py -Encoding UTF8
          py -3.11 extract_asbi_20241205.py
      - uses: actions/upload-artifact@v4
        with:
          name: machine1-asbi-20241205-evidence
          path: machine1_asbi_20241205_evidence/
          if-no-files-found: error
          retention-days: 7
