name: Windows Machine2 Registration Token Capability Probe

on:
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/windows-machine2-registration-token-capability-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe repository runner registration-token endpoint without disclosure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$(mktemp)"
          trap 'rm -f "$out"' EXIT
          code="$(curl -sS -o "$out" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runners/registration-token")"
          echo "M2_RUNNER_REGISTRATION_TOKEN_HTTP=${code}"
          if [ "${code}" != '201' ]; then
            echo 'M2_RUNNER_REGISTRATION_TOKEN_CAPABILITY_PASS=false'
            exit 19
          fi
          python - "$out" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert isinstance(d.get('token'),str) and len(d['token'])>10
          assert d.get('expires_at')
          print('M2_RUNNER_REGISTRATION_TOKEN_RESPONSE_SHAPE_PASS=true')
          PY
          echo 'M2_RUNNER_REGISTRATION_TOKEN_CAPABILITY_PASS=true'
