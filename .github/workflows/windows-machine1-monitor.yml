name: Windows Machine 1 Live Monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-machine1-monitor.yml'
      - 'src/a1clean/machine1_monitor.py'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1-machine1-live-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Read-only Machine 1 multi-worker observability
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 10
    steps:
      - name: Checkout governed orchestration
        uses: actions/checkout@v4

      - name: Allow setup scripts for this job only
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          "PSExecutionPolicyPreference=Bypass" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'PowerShell Process-scope execution policy for subsequent job processes: Bypass'

      - name: Provide Python 3.11 runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify read-only Drive credential binding
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:A1_DRIVE_READER_CREDENTIALS)) {
            throw 'A1_DRIVE_READER_CREDENTIALS is not configured for the runner process.'
          }
          if (-not (Test-Path -LiteralPath $env:A1_DRIVE_READER_CREDENTIALS -PathType Leaf)) {
            throw 'A1_DRIVE_READER_CREDENTIALS points to a missing credential file.'
          }

      - name: Install monitor package
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install -e .

      - name: Build Machine 1 monitor snapshot
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'a1-machine1-monitor'
          python -m a1clean.machine1_monitor --output-dir $out
          Get-Content -LiteralPath (Join-Path $out 'machine1-monitor-latest.md') -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "A1_MACHINE1_MONITOR_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload monitor snapshot
        uses: actions/upload-artifact@v4
        with:
          name: machine1-live-monitor
          path: ${{ env.A1_MACHINE1_MONITOR_OUT }}
          retention-days: 7
          if-no-files-found: error

      - name: Safety declaration
        if: always()
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          Write-Host 'READ-ONLY OBSERVABILITY ONLY.'
          Write-Host 'No RAW write, no semantic CURRENT write, no dispatch-registry write, no methodology/formula/signal change.'
