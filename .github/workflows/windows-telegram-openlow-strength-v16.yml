name: Windows Telegram OpenLow Strength V16

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - telegram-openlow-strength-v16-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-windows-telegram-openlow-strength-v16
  cancel-in-progress: true

jobs:
  study:
    name: Discover strong OpenLow structures and Telegram persistence
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 180
    steps:
      - name: Checkout exact research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'telegram-openlow-strength-v16-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_TELEGRAM_OPENLOW_STRENGTH_V16_REQUEST_V1') { throw 'Unsupported V16 request schema.' }
          if ($req.enabled -ne $true) { throw 'V16 request disabled.' }

      - name: Install and compile V16
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'V16_INSTALL_FAILED' }
          py -3.11 -m py_compile src/a1clean/formula_research/telegram_openlow_strength_discovery_v16.py
          if ($LASTEXITCODE -ne 0) { throw 'V16_COMPILE_FAILED' }

      - name: Run V16 from durable cache only
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & py -3.11 -m a1clean.formula_research.telegram_openlow_strength_discovery_v16 --output 'telegram-openlow-strength-v16-result.json'
          if ($LASTEXITCODE -ne 0) { throw "V16_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Upload V16 artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-openlow-strength-v16-${{ github.run_id }}
          path: telegram-openlow-strength-v16-result.json
          if-no-files-found: error
          retention-days: 30
