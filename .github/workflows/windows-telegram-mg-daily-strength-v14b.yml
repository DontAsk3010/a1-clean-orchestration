name: Windows Telegram MG Daily Strength V14B

on:
  push:
    branches:
      - formula/current-clean-research-v1
    paths:
      - telegram-mg-daily-strength-v14b-requests/current.json

permissions:
  contents: read

concurrency:
  group: a1-windows-telegram-mg-daily-strength-v14b
  cancel-in-progress: true

jobs:
  study:
    name: Analyze strong10 cohort and every-day OpenLow scan
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 180
    steps:
      - name: Checkout exact research revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate request
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $req = Get-Content -LiteralPath 'telegram-mg-daily-strength-v14b-requests/current.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($req.schema -ne 'A1_TELEGRAM_MG_DAILY_STRENGTH_V14B_REQUEST_V1') { throw 'Unsupported V14B request schema.' }
          if ($req.enabled -ne $true) { throw 'V14B request disabled.' }

      - name: Install and compile V14B
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.11 -m pip install -e '.[test]'
          if ($LASTEXITCODE -ne 0) { throw 'V14B_INSTALL_FAILED' }
          py -3.11 -m py_compile src/a1clean/formula_research/telegram_mg_daily_strength_v14.py src/a1clean/formula_research/telegram_mg_daily_strength_v14b.py
          if ($LASTEXITCODE -ne 0) { throw 'V14B_COMPILE_FAILED' }

      - name: Run V14B from durable cache only
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          & py -3.11 -m a1clean.formula_research.telegram_mg_daily_strength_v14b --output 'telegram-mg-daily-strength-v14b-result.json'
          if ($LASTEXITCODE -ne 0) { throw "V14B_RUNTIME_FAILED:$LASTEXITCODE" }

      - name: Upload V14B artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-mg-daily-strength-v14b-${{ github.run_id }}
          path: telegram-mg-daily-strength-v14b-result.json
          if-no-files-found: error
          retention-days: 30
