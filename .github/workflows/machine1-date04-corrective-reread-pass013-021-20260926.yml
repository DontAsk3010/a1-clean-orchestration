name: Machine1 Date04 Corrective Reread PASS013-021 20260926

on:
  push:
    branches:
      - machine1/corrective-date04-pass013-021-20260926
    paths:
      - .github/workflows/machine1-date04-corrective-reread-pass013-021-20260926.yml

permissions:
  contents: read

jobs:
  extract-corrective-scope:
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\TRADING SYSTEM\02_CURRENT_HISTORICAL_RAW_DATA_UJI\Raw Des 02-31-2024.csv'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract exact governed corrective packets
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = $env:RAW_FILE
          $tradingDate = '2024-12-04'
          $expectedMd5 = 'b8d42b35c90d2dff8b18ae4e1734523b'
          $expectedSha256 = '5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          $targets = @(
            [pscustomobject]@{pass='PASS013_DATE04';ticker='ADRO';first=32928;last=33263;count=336;bundleLine=201;firstTime='08:59:00';lastTime='16:14:00'},
            [pscustomobject]@{pass='PASS017_DATE04';ticker='AGRO';first=42876;last=43074;count=199;bundleLine=205;firstTime='09:00:00';lastTime='16:14:00'},
            [pscustomobject]@{pass='PASS018_DATE04';ticker='AGRS';first=41022;last=41116;count=95;bundleLine=206;firstTime='09:00:00';lastTime='16:10:00'},
            [pscustomobject]@{pass='PASS019_DATE04';ticker='AHAP';first=46223;last=46340;count=118;bundleLine=207;firstTime='09:00:00';lastTime='16:13:00'},
            [pscustomobject]@{pass='PASS020_DATE04';ticker='AIMS';first=48083;last=48155;count=73;bundleLine=208;firstTime=$null;lastTime=$null},
            [pscustomobject]@{pass='PASS021_DATE04';ticker='AISA';first=49522;last=49607;count=86;bundleLine=209;firstTime='09:00:00';lastTime='16:05:00'}
          )
          if (-not (Test-Path -LiteralPath $raw -PathType Leaf)) { throw "RAW_MISSING: $raw" }
          $gotMd5 = (Get-FileHash -LiteralPath $raw -Algorithm MD5).Hash.ToLowerInvariant()
          $gotSha256 = (Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($gotMd5 -ne $expectedMd5 -or $gotSha256 -ne $expectedSha256) { throw "RAW_HASH_MISMATCH md5=$gotMd5 sha256=$gotSha256" }

          $minRow = ($targets | Measure-Object first -Minimum).Minimum
          $maxRow = ($targets | Measure-Object last -Maximum).Maximum
          $byRow = @{}
          $sr = [IO.StreamReader]::new($raw, [Text.Encoding]::UTF8, $true, 1048576)
          try {
            $headerLine = $sr.ReadLine()
            if ($null -eq $headerLine) { throw 'RAW_EMPTY' }
            $headerObj = @($headerLine, $headerLine) | ConvertFrom-Csv | Select-Object -First 1
            $headerFields = @($headerObj.PSObject.Properties.Name)
            $sourceRow = 0
            while (($line = $sr.ReadLine()) -ne $null) {
              $sourceRow++
              if ($sourceRow -lt $minRow) { continue }
              if ($sourceRow -gt $maxRow) { break }
              $needed = $false
              foreach ($t in $targets) { if ($sourceRow -ge $t.first -and $sourceRow -le $t.last) { $needed = $true; break } }
              if (-not $needed) { continue }
              $obj = @($headerLine, $line) | ConvertFrom-Csv | Select-Object -First 1
              $ordered = [ordered]@{source_row=$sourceRow}
              foreach ($p in $obj.PSObject.Properties) { $ordered[$p.Name] = $p.Value }
              $byRow[$sourceRow] = [pscustomobject]$ordered
            }
          } finally { $sr.Dispose() }

          $out = Join-Path $PWD 'machine1_date04_corrective_reread_pass013_021_20260926'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $proofs = @()
          foreach ($t in $targets) {
            $rows = @()
            foreach ($i in $t.first..$t.last) { if ($byRow.ContainsKey($i)) { $rows += $byRow[$i] } }
            if ($rows.Count -ne $t.count) { throw "$($t.ticker)_ROW_COUNT_MISMATCH got=$($rows.Count) expected=$($t.count)" }
            $seq = @($rows | ForEach-Object {[int]$_.source_row})
            for ($j=0; $j -lt $seq.Count; $j++) { if ($seq[$j] -ne ($t.first+$j)) { throw "$($t.ticker)_SOURCE_ROW_SEQUENCE_MISMATCH" } }
            $tickerVals = @($rows | ForEach-Object {$_.RAW_TICKER} | Sort-Object -Unique)
            if ($tickerVals.Count -ne 1 -or $tickerVals[0] -ne $t.ticker) { throw "$($t.ticker)_TICKER_MISMATCH got=$($tickerVals -join ',')" }
            $dts = @($rows | ForEach-Object {$_.RAW_DATETIME_ISO})
            if (@($dts | Where-Object { -not $_.StartsWith($tradingDate) }).Count -gt 0) { throw "$($t.ticker)_DATE_MISMATCH" }
            $firstTime = ([regex]::Match($dts[0], '\d{2}:\d{2}:\d{2}')).Value
            $lastTime = ([regex]::Match($dts[-1], '\d{2}:\d{2}:\d{2}')).Value
            if ($t.firstTime -and $firstTime -ne $t.firstTime) { throw "$($t.ticker)_FIRST_TIME_MISMATCH got=$firstTime expected=$($t.firstTime)" }
            if ($t.lastTime -and $lastTime -ne $t.lastTime) { throw "$($t.ticker)_LAST_TIME_MISMATCH got=$lastTime expected=$($t.lastTime)" }

            $rowsPath = Join-Path $out "$($t.ticker)_20241204_ROWS.jsonl"
            $sw = [IO.StreamWriter]::new($rowsPath, $false, $utf8NoBom)
            try { foreach ($r in $rows) { $sw.WriteLine(($r | ConvertTo-Json -Compress -Depth 8)) } } finally { $sw.Dispose() }
            $rowsSha = (Get-FileHash -LiteralPath $rowsPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $proof = [ordered]@{
              pass=$t.pass; ticker=$t.ticker; trading_date=$tradingDate; source_md5=$gotMd5; source_sha256=$gotSha256;
              semantic_bundle='Raw Des 02-31-2024__SEMANTIC_0009.jsonl'; semantic_bundle_line_number=$t.bundleLine;
              source_row_first=$t.first; source_row_last=$t.last; physical_line_first=($t.first+1); physical_line_last=($t.last+1);
              data_rows=$rows.Count; first_datetime=$dts[0]; last_datetime=$dts[-1]; first_clock_time=$firstTime; last_clock_time=$lastTime;
              header_field_count=$headerFields.Count; header_fields=$headerFields; rows_jsonl_sha256=$rowsSha;
              purpose='CURRENT_AUTHORITY_CORRECTIVE_NARROW_SEMANTIC_REREAD_ONLY'; no_new_ticker_opened=$true
            }
            [IO.File]::WriteAllText((Join-Path $out "$($t.ticker)_20241204_PROOF.json"), ($proof | ConvertTo-Json -Depth 12), $utf8NoBom)
            $proofs += [pscustomobject]$proof
            Write-Host "$($t.ticker)_EVIDENCE_OK rows=$($rows.Count) source_rows=$($t.first)-$($t.last) first=$firstTime last=$lastTime sha=$rowsSha"
          }
          $totalRows = [int](($proofs | Measure-Object data_rows -Sum).Sum)
          if ($totalRows -ne 907) { throw "TOTAL_ROW_MISMATCH got=$totalRows expected=907" }
          $manifest = [ordered]@{schema='A1_CLEAN_M1_DATE04_CORRECTIVE_REREAD_PACKET_V1';trading_date=$tradingDate;source_md5=$gotMd5;source_sha256=$gotSha256;target_count=$proofs.Count;total_rows=$totalRows;expected_total_rows=907;ordinary_next_ticker_opened=$false;targets=$proofs}
          [IO.File]::WriteAllText((Join-Path $out 'CORRECTIVE_SCOPE_MANIFEST.json'), ($manifest | ConvertTo-Json -Depth 16), $utf8NoBom)

      - name: Upload governed corrective evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: machine1-date04-corrective-reread-pass013-021-20260926
          path: machine1_date04_corrective_reread_pass013_021_20260926/
          if-no-files-found: warn
          retention-days: 7
