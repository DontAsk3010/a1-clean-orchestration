name: Machine1 NINE-OILS 20241202 Evidence Extract
on:
  push:
    branches: [machine1/evidence-nine-oils-20241202]
    paths: [.github/workflows/machine1-nine-oils-20241202-evidence.yml]
permissions:
  contents: read
jobs:
  extract-governed-nine-oils:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: machine1/evidence-nine-oils-20241202
      - name: Extract exact governed packets
        shell: powershell
        run: ./scripts/extract-machine1-nine-oils-20241202.ps1
      - name: Upload governed evidence
        uses: actions/upload-artifact@v4
        with:
          name: machine1-nine-oils-20241202-evidence
          path: machine1_nine_oils_20241202_evidence/
          if-no-files-found: error
          retention-days: 7
