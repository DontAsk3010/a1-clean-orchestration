name: One-shot Machine2 Authority Binding Renewal

on:
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/windows-machine2-authority-renewal.yml'

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Renew exact CURRENT Drive revision bindings only
        shell: python
        run: |
          import json
          from pathlib import Path

          lock_path = Path('governance/a1-clean-active-authority-lock.json')
          full_path = Path('v32-full-observation-behavior-requests/current.json')
          group_path = Path('v32-behavior-grouping-requests/current.json')

          common = {
            'ANLCKQlAoJ0PIKZyCNZQpeCwLNO7WfYDkoQWXugnGSba6ZjNaxZz2BBy0mE1OSsis-NrkPx3nOgN2G1Eal228WwZuX_oU8N8s-ve2r_AZ1Q': 'ANLCKQlY5oe9LEhk8yvbFDJRAMcppectuDN3zekMTXMa7YN4lx3SfjRYXKQsXCHE3ykla0sSQgWZNYJwMj2B8fR_yb6kgbUCGN0tce2GUDk',
            'ANLCKQm-UGAm1dhcZp4OERIPV_XVLeCsIOzY_8IuI6H0ctVRrQEBMmT2fNcNBYdkJ-QbBd9loaAZiO_SNGj-nvna3nV-YQrfAQH413va2CI': 'ANLCKQkw7t-1CMeBTOjeOgVz3exdEe-cVTxy13frw2YrIoJqr81BfO0zAIjocwACdHdNd96o8UmqfCHej4_kGcJqkwpixAcuDAg61krjD8s',
            'ANLCKQmyOdn_BDJq_XfE-j5LT4cvDuzOkKNdwqsg2I4qcLglUZrc0kKod6UANIRvzSNzTAe2b10bFHig6OIvaeyYq4CGvjSBoQZyKtp6l7M': 'ANLCKQmWt2C2wMkx9IYp8BhmD_ZdqE0QoVVBMPX28Dy84ALdpUtVhd4mXAIeYvQkt3ZcU3zfqzoNiEjABbmBco839XaUlOQ3l88_M16f3k8',
            'ANLCKQkwi8Q7gs5uljKueYN-PvveITcmA3aD0Z5JvzCDUO5MaXdw34TiFlsHrbSN3SEOVk9SfD0ueorkWD1Zr_cLH-33xh05lcQIvY7XJ80': 'ANLCKQmv9otR53_S4CtwfYoTCmIbzaElpoXtzuTE1XsvWgZ4Q2SN_gZLFSlNmhTe_BJSydYl85h5HyXlk4EDTN5EYBIl2SM5yqV6ixebZTs',
            'ANLCKQn8vXfz7jwWrNB-XdDgarocrJ9if-uvwLE9LBPg_osxddImwIdNZNcP-4MydtSbOLpKZizl8PW3HZWBKj6I1WyRX40Rskr3JOiAq68': 'ANLCKQnee0qX4AmnA3WD_aRSztYKYKRNo0RDRBo_OKDscGt_W0J0Pzxn2qveYBoXJU1Nmpp6kJFvwkhDTDR-FcqAf8bukEFhfLFWE54kVyc',
            'ANLCKQkVCxt7Rs_qqR5sjAInIm2IKj7OPfSqmFiUAfbDsM692_FUJZxkvJIu__bdl0WsbKZEjWhAVUCGwgVPfWG6-47QQ3AqJfSL9Sb-vTs': 'ANLCKQksGC7XYhHHUXNU8vrBzlfNxArJQDuxw29O_sBTDED_Q-xrB-rNRB5FrZhaddXxwon71LvRaMKz3a8n9Q9NM5TDXxK4S4WwpvPuHgw',
            'ANLCKQliruPEFTdVeUVQzOPR-aDdLF4YamO3PZJ_SA_YoqrO6kkP60xeMwD0m80d7Ai9K4waHdYu45KP3zuU8HPqPDybzF0fXNU62_Uf7O4': 'ANLCKQl-eztWxUEOr_tgJD4QWqQyNeLUAXo1lZe5lkS-z3CSKj55SB9V8DK7D0bf39_zDUM2gddoXxWgBhFevwdsMWRcBx0FUKjeir0UH54',
          }
          lock_only = {
            'ANLCKQmMGhCohy5v-xwr46_LZgniKuKN5F08rlsCSoJHA4ZbO2Cs5E4xBuuh0iKrhN2OB3SMUIo52gphuUJfHDC4cMZOjt0gjwgzzVHjIkY': 'ANLCKQmDXXL_cQVNOwmKlEl1u1Vb1wbPaJaWpWZwGrVTqRnmNFFSm1Pr411yuoa4wfe4QeGk_7FsW94_sB5U6YMpidoLzB7sGfQTYdpoGZY',
            'ANLCKQlnvxiCpJkLug10lu9HkkaElTJgvQ9H1GtLAvmY2g2Y8v9iP4WHFXRXbpH2WB-JKaqKgTe_kuPT_5Dz16A2-6N1W1oTXD5O0oyMX-U': 'ANLCKQnBbmHXeS63-OfEOZsgX2IiVSsZepi4pVmf52PVQHLP4q4U8EBtn98VpyUG0A4y-efFwUKp09wgISI5tC0UaUfWGv52S-ErdD5GuGE',
            'ANLCKQlwo6HpVJ8B4ioeUB-RbZt_g7tUS-D4jzPAKLY3m9P-LMm6Z_PNmVT-pSFunwGavlngKPnbahMkFQNX-oO_NeOZlrsTNBQPWoDPZgM': 'ANLCKQnfYmqphxL3xhxiFM_fTCAQsCQixEL3trK0ZE4akyjYfl9keal5NF4i0FRpwesl3-NFHXUrQ9QO2KDZzZGRFZRITmUMqIqDCKY6hjo',
          }

          def replace_exact(path, replacements):
            text = path.read_text(encoding='utf-8')
            for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                raise SystemExit(f'{path}: expected exactly one old revision occurrence, got {count}: {old}')
              text = text.replace(old, new)
            path.write_text(text, encoding='utf-8')

          replace_exact(lock_path, common | lock_only)
          replace_exact(full_path, common)
          replace_exact(group_path, common)

          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          full = json.loads(full_path.read_text(encoding='utf-8'))
          group = json.loads(group_path.read_text(encoding='utf-8'))
          if lock.get('status') != 'ACTIVE' or lock.get('formula_stage') != 'CLOSED':
            raise SystemExit('authority lock invariant changed unexpectedly')
          if full.get('enabled') is not False or group.get('enabled') is not False:
            raise SystemExit('heavy request must remain disabled')
          if lock['documents']['stable_transition_bridge']['revision_id'] != 'ANLCKQmdZdmavuZScHdrcvsgOfHDfr9Sk1xGOiuaS2dRB9mJBIyGVtn7bzAQPZQoT30cEQP3RWilonRdYjXrsvYGxEZ5eioROqefs3uDeuw':
            raise SystemExit('stable bridge binding changed unexpectedly')
          print('M2_AUTHORITY_BINDING_RENEWAL_VALIDATED=true')
          print('M2_HEAVY_REQUESTS_REMAIN_DISABLED=true')
      - name: Commit exactly the renewed control bindings and self-retire
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'a1-clean-machine2-control'
          git config user.email 'a1-clean-machine2-control@users.noreply.github.com'
          git rm .github/workflows/windows-machine2-authority-renewal.yml
          git add governance/a1-clean-active-authority-lock.json \
                  v32-full-observation-behavior-requests/current.json \
                  v32-behavior-grouping-requests/current.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'control: renew Machine2 CURRENT authority bindings'
          git push origin HEAD:fix/v32-dynamic-source-universe-v1
