name: One-shot Machine2 Authority Binding Renewal

on:
  push:
    branches:
      - fix/v32-dynamic-source-universe-v1
    paths:
      - '.github/workflows/windows-machine2-authority-renewal.yml'

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Renew CURRENT authority bindings structurally
        shell: python
        run: |
          import json
          from pathlib import Path

          lock_path = Path('governance/a1-clean-active-authority-lock.json')
          full_path = Path('v32-full-observation-behavior-requests/current.json')
          group_path = Path('v32-behavior-grouping-requests/current.json')

          current = {
            'master_handbook': 'ANLCKQlY5oe9LEhk8yvbFDJRAMcppectuDN3zekMTXMa7YN4lx3SfjRYXKQsXCHE3ykla0sSQgWZNYJwMj2B8fR_yb6kgbUCGN0tce2GUDk',
            'sub_master_index': 'ANLCKQmDXXL_cQVNOwmKlEl1u1Vb1wbPaJaWpWZwGrVTqRnmNFFSm1Pr411yuoa4wfe4QeGk_7FsW94_sB5U6YMpidoLzB7sGfQTYdpoGZY',
            'source_capture': 'ANLCKQkw7t-1CMeBTOjeOgVz3exdEe-cVTxy13frw2YrIoJqr81BfO0zAIjocwACdHdNd96o8UmqfCHej4_kGcJqkwpixAcuDAg61krjD8s',
            'formula_research': 'ANLCKQmWt2C2wMkx9IYp8BhmD_ZdqE0QoVVBMPX28Dy84ALdpUtVhd4mXAIeYvQkt3ZcU3zfqzoNiEjABbmBco839XaUlOQ3l88_M16f3k8',
            'behavior_reading': 'ANLCKQmv9otR53_S4CtwfYoTCmIbzaElpoXtzuTE1XsvWgZ4Q2SN_gZLFSlNmhTe_BJSydYl85h5HyXlk4EDTN5EYBIl2SM5yqV6ixebZTs',
            'github_automation': 'ANLCKQnee0qX4AmnA3WD_aRSztYKYKRNo0RDRBo_OKDscGt_W0J0Pzxn2qveYBoXJU1Nmpp6kJFvwkhDTDR-FcqAf8bukEFhfLFWE54kVyc',
            'stable_transition_bridge': 'ANLCKQmdZdmavuZScHdrcvsgOfHDfr9Sk1xGOiuaS2dRB9mJBIyGVtn7bzAQPZQoT30cEQP3RWilonRdYjXrsvYGxEZ5eioROqefs3uDeuw',
            'machine1_dispatch_registry': 'ANLCKQksGC7XYhHHUXNU8vrBzlfNxArJQDuxw29O_sBTDED_Q-xrB-rNRB5FrZhaddXxwon71LvRaMKz3a8n9Q9NM5TDXxK4S4WwpvPuHgw',
            'current_execution': 'ANLCKQl-eztWxUEOr_tgJD4QWqQyNeLUAXo1lZe5lkS-z3CSKj55SB9V8DK7D0bf39_zDUM2gddoXxWgBhFevwdsMWRcBx0FUKjeir0UH54',
            'storage_handbook': 'ANLCKQnBbmHXeS63-OfEOZsgX2IiVSsZepi4pVmf52PVQHLP4q4U8EBtn98VpyUG0A4y-efFwUKp09wgISI5tC0UaUfWGv52S-ErdD5GuGE',
            'storage_manifest': 'ANLCKQnfYmqphxL3xhxiFM_fTCAQsCQixEL3trK0ZE4akyjYfl9keal5NF4i0FRpwesl3-NFHXUrQ9QO2KDZzZGRFZRITmUMqIqDCKY6hjo',
          }

          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          full = json.loads(full_path.read_text(encoding='utf-8'))
          group = json.loads(group_path.read_text(encoding='utf-8'))

          if lock.get('status') != 'ACTIVE' or lock.get('formula_stage') != 'CLOSED':
            raise SystemExit('authority lock invariant changed unexpectedly')
          if full.get('enabled') is not False or group.get('enabled') is not False:
            raise SystemExit('heavy requests must remain disabled')

          for key, revision in current.items():
            if key not in lock.get('documents', {}):
              raise SystemExit(f'missing authority node in lock: {key}')
            lock['documents'][key]['revision_id'] = revision

          request_bindings = {
            'master_handbook_revision_id': current['master_handbook'],
            'source_capture_handbook_revision_id': current['source_capture'],
            'formula_research_handbook_revision_id': current['formula_research'],
            'behavior_handbook_revision_id': current['behavior_reading'],
            'github_automation_handbook_revision_id': current['github_automation'],
            'transition_bridge_revision_id': current['stable_transition_bridge'],
            'machine1_dispatch_registry_revision_id': current['machine1_dispatch_registry'],
            'current_execution_revision_id': current['current_execution'],
          }
          for req in (full, group):
            for field, revision in request_bindings.items():
              if field not in req:
                raise SystemExit(f'missing request binding: {field}')
              req[field] = revision

          lock_path.write_text(json.dumps(lock, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          full_path.write_text(json.dumps(full, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          group_path.write_text(json.dumps(group, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Exact post-write invariants before commit.
          lock2 = json.loads(lock_path.read_text(encoding='utf-8'))
          full2 = json.loads(full_path.read_text(encoding='utf-8'))
          group2 = json.loads(group_path.read_text(encoding='utf-8'))
          for key, revision in current.items():
            if lock2['documents'][key]['revision_id'] != revision:
              raise SystemExit(f'lock renewal readback mismatch: {key}')
          for req in (full2, group2):
            if req.get('enabled') is not False or req.get('formula_stage') != 'CLOSED':
              raise SystemExit('heavy/formula invariant changed')
            for field, revision in request_bindings.items():
              if req[field] != revision:
                raise SystemExit(f'request renewal readback mismatch: {field}')

          print('M2_AUTHORITY_BINDING_RENEWAL_VALIDATED=true')
          print('M2_HEAVY_REQUESTS_REMAIN_DISABLED=true')

      - name: Commit renewed control bindings and self-retire
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'a1-clean-machine2-control'
          git config user.email 'a1-clean-machine2-control@users.noreply.github.com'
          git rm .github/workflows/windows-machine2-authority-renewal.yml
          git add governance/a1-clean-active-authority-lock.json \
                  v32-full-observation-behavior-requests/current.json \
                  v32-behavior-grouping-requests/current.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'control: renew Machine2 CURRENT authority bindings'
          git push origin HEAD:fix/v32-dynamic-source-universe-v1
