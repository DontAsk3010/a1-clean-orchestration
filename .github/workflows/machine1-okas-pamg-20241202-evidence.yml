name: Machine1 OKAS-PAMG 20241202 Evidence Extract
on:
  push:
    branches: [machine1/evidence-okas-pamg-20241202]
    paths: [.github/workflows/machine1-okas-pamg-20241202-evidence.yml]
permissions:
  contents: read
jobs:
  extract-governed-okas-pamg:
    runs-on: [self-hosted, windows, x64, a1-clean-machine1]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: machine1/evidence-okas-pamg-20241202
      - name: Extract exact governed packets
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/extract-machine1-okas-pamg-20241202.ps1
      - name: Upload governed evidence
        uses: actions/upload-artifact@v4
        with:
          name: machine1-okas-pamg-20241202-evidence
          path: machine1_okas_pamg_20241202_evidence/
          if-no-files-found: error
          retention-days: 7
