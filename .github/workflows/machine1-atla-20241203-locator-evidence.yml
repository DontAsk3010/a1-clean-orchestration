name: Machine1 ATLA 2024-12-03 Locator And Source Evidence

on:
  push:
    branches:
      - machine1/evidence-atla-20241203
    paths:
      - .github/workflows/machine1-atla-20241203-locator-evidence.yml

permissions:
  contents: read

jobs:
  locate-and-extract-atla-date03:
    runs-on: [self-hosted, windows, x64, a1-clean-parity]
    timeout-minutes: 30
    env:
      RAW_FILE: 'D:\\TRADING SYSTEM\\02_CURRENT_HISTORICAL_RAW_DATA_UJI\\Raw Des 02-31-2024.csv'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Locate and extract exact governed ATLA Date03 source packet
        shell: 'powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"'
        run: |
          $ErrorActionPreference = 'Stop'
          $raw = $env:RAW_FILE
          $tickerExpected = 'ATLA'
          $tradingDate = '2024-12-03'
          $expectedMd5 = 'b8d42b35c90d2dff8b18ae4e1734523b'
          $expectedSha256 = '5bddb43f243e3cbb76504ecc38d8b0981e38866b7a4ea3b4557dcbbf3024712c'
          if (-not (Test-Path -LiteralPath $raw -PathType Leaf)) { throw "RAW_MISSING: $raw" }
          $gotMd5=(Get-FileHash -LiteralPath $raw -Algorithm MD5).Hash.ToLowerInvariant()
          $gotSha256=(Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($gotMd5 -ne $expectedMd5 -or $gotSha256 -ne $expectedSha256) { throw "RAW_HASH_MISMATCH md5=$gotMd5 sha256=$gotSha256" }
          Add-Type -AssemblyName Microsoft.VisualBasic
          $parser=New-Object Microsoft.VisualBasic.FileIO.TextFieldParser($raw, [System.Text.Encoding]::UTF8, $true)
          $parser.TextFieldType=[Microsoft.VisualBasic.FileIO.FieldType]::Delimited
          $parser.SetDelimiters(',')
          $parser.HasFieldsEnclosedInQuotes=$true
          $rows=New-Object System.Collections.Generic.List[object]
          $sourceRow=0
          try {
            $headers=@($parser.ReadFields())
            $headers[0]=$headers[0].TrimStart([char]0xFEFF)
            if ($headers.Count -ne 74) { throw "RAW_HEADER_FIELD_COUNT_MISMATCH got=$($headers.Count) expected=74" }
            $tickerIdx=[Array]::IndexOf($headers,'RAW_TICKER')
            $dtIdx=[Array]::IndexOf($headers,'RAW_DATETIME_ISO')
            if($tickerIdx -lt 0 -or $dtIdx -lt 0){ throw 'REQUIRED_HEADER_NOT_FOUND' }
            while (-not $parser.EndOfData) {
              $fields=@($parser.ReadFields())
              $sourceRow++
              if ($fields.Count -ne 74) { throw "RAW_ROW_FIELD_COUNT_MISMATCH source_row=$sourceRow got=$($fields.Count) expected=74" }
              if ($fields[$tickerIdx] -ne $tickerExpected) { continue }
              if (-not $fields[$dtIdx].StartsWith($tradingDate)) { continue }
              $ordered=[ordered]@{ source_row=$sourceRow }
              for($i=0;$i -lt $headers.Count;$i++){ $ordered[$headers[$i]]=$fields[$i] }
              $rows.Add([pscustomobject]$ordered)
            }
          } finally { $parser.Close() }
          if ($rows.Count -lt 1) { throw "NO_MATCHING_ROWS ticker=$tickerExpected date=$tradingDate" }
          $sourceRows=@($rows|ForEach-Object{[int]$_.source_row})
          for($i=1;$i -lt $sourceRows.Count;$i++){ if($sourceRows[$i] -le $sourceRows[$i-1]){ throw 'SOURCE_ROW_NOT_STRICTLY_INCREASING' } }
          $dts=@($rows|ForEach-Object{$_.RAW_DATETIME_ISO})
          $out=Join-Path $PWD 'machine1_atla_20241203_evidence'
          New-Item -ItemType Directory -Force -Path $out|Out-Null
          $utf8=New-Object System.Text.UTF8Encoding($false)
          $rowsPath=Join-Path $out 'ATLA_20241203_ROWS.jsonl'
          $w=New-Object System.IO.StreamWriter($rowsPath,$false,$utf8)
          try { foreach($row in $rows){ $w.WriteLine(($row|ConvertTo-Json -Compress -Depth 10)) } } finally { $w.Close() }
          $rowsSha=(Get-FileHash $rowsPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $packet=[ordered]@{
            schema='A1_CLEAN_MACHINE1_OWNER_FULL_REREAD_SOURCE_PACKET_V1'
            transport_only=$true
            semantic_read_performed=$false
            locator_mode='FRESH_FULL_SOURCE_SCAN_TICKER_AND_DATE'
            source_name=[IO.Path]::GetFileName($raw)
            source_md5=$gotMd5
            source_sha256=$gotSha256
            generation_id='BEHAVIOR_UNIFORM_COLAB_SEMANTIC_GEN_20260910_01'
            ticker=$tickerExpected
            trading_date=$tradingDate
            semantic_bundle_locator_expected='Raw Des 02-31-2024__SEMANTIC_0005.jsonl'
            semantic_bundle_line_expected_from_current_serial=183
            source_row_first=$sourceRows[0]
            source_row_last=$sourceRows[-1]
            source_rows_contiguous=(($sourceRows[-1]-$sourceRows[0]+1) -eq $rows.Count)
            data_rows=$rows.Count
            raw_fields_per_row=74
            retained_fields_per_row=75
            first_datetime=$dts[0]
            last_datetime=$dts[-1]
            header_fields=$headers
            rows_sha256=$rowsSha
            rows=$rows
          }
          $packetPath=Join-Path $out 'ATLA_20241203_PACKET.json'
          [IO.File]::WriteAllText($packetPath,($packet|ConvertTo-Json -Depth 12),$utf8)
          $packetSha=(Get-FileHash $packetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $proof=[ordered]@{
            schema='A1_CLEAN_MACHINE1_OWNER_FULL_REREAD_SOURCE_PROOF_V1'
            transport_only=$true
            semantic_read_performed=$false
            locator_mode='FRESH_FULL_SOURCE_SCAN_TICKER_AND_DATE'
            ticker=$tickerExpected
            trading_date=$tradingDate
            source_md5=$gotMd5
            source_sha256=$gotSha256
            semantic_bundle_locator_expected='Raw Des 02-31-2024__SEMANTIC_0005.jsonl'
            semantic_bundle_line_expected_from_current_serial=183
            source_row_first=$sourceRows[0]
            source_row_last=$sourceRows[-1]
            source_rows_contiguous=(($sourceRows[-1]-$sourceRows[0]+1) -eq $rows.Count)
            data_rows=$rows.Count
            raw_fields_per_row=74
            retained_fields_per_row=75
            first_datetime=$dts[0]
            last_datetime=$dts[-1]
            rows_jsonl_sha256=$rowsSha
            packet_sha256=$packetSha
            checkpoint_mutated=$false
            drive_mutated=$false
            next_ticker_opened=$false
          }
          [IO.File]::WriteAllText((Join-Path $out 'EVIDENCE_PROOF.json'),($proof|ConvertTo-Json -Depth 10),$utf8)
          Write-Host "ATLA_DATE03_LOCATOR_EVIDENCE_OK rows=$($rows.Count) source_rows=$($sourceRows[0])-$($sourceRows[-1]) contiguous=$((($sourceRows[-1]-$sourceRows[0]+1) -eq $rows.Count)) first=$($dts[0]) last=$($dts[-1]) rows_sha256=$rowsSha packet_sha256=$packetSha"
      - name: Upload governed ATLA Date03 locator evidence
        uses: actions/upload-artifact@v4
        with:
          name: machine1-atla-20241203-owner-reread-evidence
          path: machine1_atla_20241203_evidence/
          if-no-files-found: error
          retention-days: 7
